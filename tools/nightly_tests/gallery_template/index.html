<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XMC Weekly Visual UI Gallery</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --border: #334155;
      --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .brand h1 { font-size: 18px; font-weight: 700; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    main { display: flex; flex: 1; overflow: hidden; }
    aside { width: 320px; background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .route-btn { background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px 12px; text-align: left; cursor: pointer; transition: 0.15s; }
    .route-btn.active, .route-btn:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }
    .viewer { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .toolbar { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.6); }
    .raw-link { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600; }
    .raw-link:hover { text-decoration: underline; }
    .canvas-wrap { flex: 1; overflow: auto; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
    .panel-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; max-width: 1280px; width: 100%; }
    .panel-card img { width: 100%; height: auto; border-radius: 4px; display: block; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>📸 XMC Weekly Visual UI Gallery</h1>
      <div class="meta" id="meta-info">Loading manifest...</div>
    </div>
  </header>
  <main>
    <aside id="route-list"></aside>
    <section class="viewer">
      <div class="toolbar">
        <div id="active-route-title">Select a page to inspect</div>
        <a id="open-raw-link" class="raw-link" href="#" target="_blank" rel="noopener noreferrer">Open Full Resolution PNG ↗</a>
      </div>
      <div class="canvas-wrap" id="canvas"></div>
    </section>
  </main>
  <script id="embedded-manifest" type="application/json">__MANIFEST_JSON__</script>
  <script>
    let manifest = JSON.parse(document.getElementById('embedded-manifest').textContent);
    let currentCapture = null;
    function renderSidebar() {
      document.getElementById('meta-info').textContent = `XID: ${manifest.xid} | Commit: ${manifest.commit_sha} | UI: ${manifest.ui_base_url} | Generated: ${manifest.generated_at}`;
      const list = document.getElementById('route-list');
      list.replaceChildren();
      (manifest.captures || []).forEach((cap, idx) => {
        const btn = document.createElement('button');
        btn.className = 'route-btn' + (currentCapture && currentCapture.id === cap.id ? ' active' : '');
        const wrap = document.createElement('div');
        const strong = document.createElement('strong');
        strong.textContent = cap.title;
        const br = document.createElement('br');
        const small = document.createElement('small');
        small.style.color = '#94a3b8';
        small.textContent = cap.route;
        wrap.append(strong, br, small);
        btn.appendChild(wrap);
        btn.onclick = () => { currentCapture = cap; renderSidebar(); renderCanvas(); };
        list.appendChild(btn);
        if (idx === 0 && !currentCapture) currentCapture = cap;
      });
      renderCanvas();
    }
    function renderCanvas() {
      const canvas = document.getElementById('canvas');
      if (!currentCapture) return;
      const imgSrc = `screenshots/${currentCapture.filename}`;
      document.getElementById('active-route-title').textContent = `${currentCapture.title} (${currentCapture.route})`;
      document.getElementById('open-raw-link').href = imgSrc;
      const card = document.createElement('div');
      card.className = 'panel-card';
      const img = document.createElement('img');
      img.src = imgSrc;
      img.alt = currentCapture.title;
      card.appendChild(img);
      canvas.replaceChildren(card);
    }
    fetch('./manifest.json').then(r => r.ok ? r.json() : manifest).then(d => { manifest = d; renderSidebar(); }).catch(() => renderSidebar());
  </script>
</body>
</html>

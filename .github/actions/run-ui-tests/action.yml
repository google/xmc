name: 'Run Angular UI Unit Tests'
description: 'Resolves test scope and executes Angular UI unit and screenshot tests (requires actions/checkout with fetch-depth: 0)'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '22'
  working-directory:
    description: 'Working directory for UI project'
    required: false
    default: 'cmd/ui'

runs:
  using: 'composite'
  steps:
    - name: 'Resolve UI Test Scope'
      id: 'scope'
      shell: bash
      # Base/head/ref/event/output are derived from GITHUB_* env and GITHUB_EVENT_PATH.
      run: python3 tools/benchmark/resolve_test_scope.py --no-rdeps

    - name: 'Set up Node.js'
      if: steps.scope.outputs.run_ui == 'true'
      uses: 'actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a' # v4.2.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: 'cmd/ui/package-lock.json'

    - name: 'Install Node.js dependencies'
      if: steps.scope.outputs.run_ui == 'true'
      shell: bash
      run: npm ci --prefer-offline --no-audit
      working-directory: ${{ inputs.working-directory }}

    - name: 'Run Angular UI Unit Tests'
      if: steps.scope.outputs.run_ui == 'true'
      shell: bash
      run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
      working-directory: ${{ inputs.working-directory }}

    # The ubuntu-latest runner image pre-bakes Chrome/Chromium system libraries
    # (Karma runs ChromeHeadless above, and e2e-tests.yml runs Playwright without apt),
    # so --with-deps is omitted: its unbounded `apt-get update` against
    # archive.ubuntu.com can hang until the job timeout. Missing host libraries
    # still fail fast at browser launch. `timeout` bounds the CDN download
    # because composite action steps do not support `timeout-minutes`.
    - name: 'Install Playwright Browsers'
      if: steps.scope.outputs.run_ui == 'true'
      shell: bash
      env:
        PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: 'ubuntu24.04-x64'
      run: timeout --kill-after=30 300 npx playwright install chromium
      working-directory: ${{ inputs.working-directory }}

    - name: 'Build Angular Application'
      if: steps.scope.outputs.run_ui == 'true'
      shell: bash
      run: npm run build
      working-directory: ${{ inputs.working-directory }}

    - name: 'Run Playwright Visual Screenshot Tests'
      if: steps.scope.outputs.run_ui == 'true'
      shell: bash
      env:
        PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: 'ubuntu24.04-x64'
      run: npm run test:screenshot
      working-directory: ${{ inputs.working-directory }}

    - name: 'Log UI Test Skip Summary'
      if: steps.scope.outputs.run_ui != 'true'
      env:
        SKIP_REASON: ${{ steps.scope.outputs.reason }}
      shell: bash
      run: |
        echo "NOTICE: Angular UI unit tests skipped (${SKIP_REASON})."

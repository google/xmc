name: 'Run Angular UI Unit Tests'
description: 'Resolves test scope and executes Angular UI unit and screenshot tests'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '22'
  working-directory:
    description: 'Working directory for UI project'
    required: false
    default: 'cmd/ui'

runs:
  using: 'composite'
  steps:
    - name: 'Resolve UI Test Scope'
      id: 'scope'
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        PR_BASE_REF: ${{ github.base_ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        GITHUB_SHA: ${{ github.sha }}
        EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF: ${{ github.ref }}
      shell: bash
      run: |
        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main \
          ${PR_BASE_REF:+"+refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"} || true
        BASE_REF="${PR_BASE_SHA:-origin/main}"
        HEAD_REF="${PR_HEAD_SHA:-${GITHUB_SHA}}"
        python3 tools/benchmark/resolve_test_scope.py \
          --base "${BASE_REF}" \
          --base-branch "${PR_BASE_REF}" \
          --head "${HEAD_REF}" \
          --event "${EVENT_NAME}" \
          --ref "${GITHUB_REF}" \
          --no-rdeps \
          --github-output "${GITHUB_OUTPUT}"

    - name: 'Set up Node.js'
      if: steps.scope.outputs.run_ui == 'true'
      uses: 'actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a' # v4.2.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: 'cmd/ui/package-lock.json'

    - name: 'Install Node.js dependencies'
      if: steps.scope.outputs.run_ui == 'true'
      shell: bash
      run: npm ci --legacy-peer-deps --prefer-offline --no-audit
      working-directory: ${{ inputs.working-directory }}

    - name: 'Run Angular UI Unit Tests'
      if: steps.scope.outputs.run_ui == 'true'
      shell: bash
      run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
      working-directory: ${{ inputs.working-directory }}

    - name: 'Install Playwright Browsers'
      if: steps.scope.outputs.run_ui == 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
      working-directory: ${{ inputs.working-directory }}

    - name: 'Build Angular Application'
      if: steps.scope.outputs.run_ui == 'true'
      shell: bash
      run: npm run build
      working-directory: ${{ inputs.working-directory }}

    - name: 'Run Playwright Visual Screenshot Tests'
      if: steps.scope.outputs.run_ui == 'true'
      shell: bash
      run: npm run test:screenshot
      working-directory: ${{ inputs.working-directory }}

    - name: 'Log UI Test Skip Summary'
      if: steps.scope.outputs.run_ui != 'true'
      env:
        SKIP_REASON: ${{ steps.scope.outputs.reason }}
      shell: bash
      run: |
        echo "NOTICE: Angular UI unit tests skipped (${SKIP_REASON})."

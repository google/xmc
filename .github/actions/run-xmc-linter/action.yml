name: 'Run XMC Component Manifest Linter'
description: 'Validates XMC component manifest profiles and static compatibility rules using xmc-linter'

inputs:
  scan-roots:
    description: 'Space-separated directory roots to scan for component profiles'
    required: false
    default: 'deploy/profiles deploy/components examples/components/profiles'
  output-format:
    description: 'Output format (text or json)'
    required: false
    default: 'text'
  strict:
    description: 'Fail if no component profile directories are found'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: 'Check Changed Component & Linter Paths'
      id: 'changes'
      uses: 'dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36' # v3.0.2
      with:
        filters: |
          lint:
            - 'deploy/profiles/**'
            - 'deploy/components/**'
            - 'examples/components/**'
            - 'api/protos/components/**'
            - 'pkg/components/**'
            - 'cmd/xmc-linter/**'
            - 'tools/components/**'
            - '.github/actions/run-xmc-linter/**'
            - '.github/workflows/xmc-lint.yml'

    - name: 'Set up Bazel'
      if: steps.changes.outputs.lint == 'true'
      uses: 'bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2' # v3.0.0

    - name: 'Restore Bazel Repository Cache'
      if: steps.changes.outputs.lint == 'true'
      id: 'cache-bazel-repo-restore'
      uses: 'actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
      with:
        path: ~/.cache/bazel-repo
        key: bazel-repo-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod') }}
        restore-keys: |
          bazel-repo-${{ runner.os }}-

    - name: 'Build xmc-linter Binary'
      if: steps.changes.outputs.lint == 'true'
      shell: bash
      run: |
        echo "Building xmc-linter CLI binary..."
        bazel build \
          --config=ci \
          --repository_cache=~/.cache/bazel-repo \
          --experimental_repository_cache_hardlinks \
          //cmd/xmc-linter:xmc-linter
        LINTER_BIN=$(bazel cquery --config=ci --output=files //cmd/xmc-linter:xmc-linter 2>/dev/null | head -n1)
        if [ -z "${LINTER_BIN}" ] || [ ! -x "${LINTER_BIN}" ]; then
          LINTER_BIN="bazel-bin/cmd/xmc-linter/xmc-linter_/xmc-linter"
        fi
        if [ ! -x "${LINTER_BIN}" ]; then
          echo "Error: Built linter binary not found or not executable!" >&2
          exit 1
        fi
        echo "LINTER_BIN=${LINTER_BIN}" >> "${GITHUB_ENV}"

    - name: 'Save Bazel Repository Cache'
      uses: 'actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
      if: github.ref == 'refs/heads/main' && steps.changes.outputs.lint == 'true' && steps.cache-bazel-repo-restore.outputs.cache-hit != 'true'
      with:
        path: ~/.cache/bazel-repo
        key: bazel-repo-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod') }}

    - name: 'Run XMC Component Manifest Linter'
      if: steps.changes.outputs.lint == 'true'
      shell: bash
      env:
        SCAN_ROOTS: ${{ inputs.scan-roots }}
        OUTPUT_FORMAT: ${{ inputs.output-format }}
        STRICT_FLAG: ${{ inputs.strict }}
      run: |
        EXTRA_ARGS=()
        if [ "${STRICT_FLAG}" = "true" ]; then
          EXTRA_ARGS+=("--strict")
        fi
        python3 tools/components/run_linter.py \
          --linter-binary="${LINTER_BIN}" \
          --output="${OUTPUT_FORMAT}" \
          --scan-roots ${SCAN_ROOTS} \
          "${EXTRA_ARGS[@]}"

    - name: 'Log Linter Skip Summary'
      if: steps.changes.outputs.lint != 'true'
      shell: bash
      run: |
        echo "NOTICE: XMC Component manifest linter skipped (no relevant component files modified)."

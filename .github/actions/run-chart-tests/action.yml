name: 'Run Helm Chart Configuration Tests'
description: 'Resolves test scope and executes Helm chart configuration unit tests (requires actions/checkout with fetch-depth: 0)'

inputs:
  helm-version:
    description: 'Helm version to install'
    required: false
    default: 'v3.20.1'
  require-helm:
    description: 'Enforce Helm requirement in unit tests'
    required: false
    default: '1'

runs:
  using: 'composite'
  steps:
    # The chart suite renders templates with a host helm binary rather than building Bazel
    # targets, so the resolver scopes it by path (HELM_SUITE_* in resolve_test_scope.py).
    - name: 'Resolve Chart Test Scope'
      id: 'scope'
      shell: bash
      # Base/head/ref/event/output are derived from GITHUB_* env and GITHUB_EVENT_PATH.
      run: python3 tools/benchmark/resolve_test_scope.py --no-rdeps

    - name: 'Install Helm'
      if: steps.scope.outputs.run_helm == 'true'
      shell: bash
      env:
        HELM_VER: ${{ inputs.helm-version }}
      run: |
        if ! command -v helm &>/dev/null || [ "$(helm version --template '{{.Version}}' 2>/dev/null)" != "${HELM_VER}" ]; then
          mkdir -p "${RUNNER_TEMP}/helm"
          curl -sSfL --retry 3 "https://get.helm.sh/helm-${HELM_VER}-linux-amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/helm" --strip-components=1 linux-amd64/helm
          chmod +x "${RUNNER_TEMP}/helm/helm"
          echo "${RUNNER_TEMP}/helm" >> "${GITHUB_PATH}"
        fi

    - name: 'Run Helm Lint'
      if: steps.scope.outputs.run_helm == 'true'
      shell: bash
      run: |
        helm lint deploy/helm

    - name: 'Run Helm Chart Configuration Tests'
      if: steps.scope.outputs.run_helm == 'true'
      shell: bash
      env:
        XMC_REQUIRE_HELM: ${{ inputs.require-helm }}
      run: |
        helm version --short
        python3 -m unittest discover --start-directory test/helm --pattern '*_test.py' --verbose

    - name: 'Log Chart Test Skip Summary'
      if: steps.scope.outputs.run_helm != 'true'
      shell: bash
      run: |
        echo "NOTICE: Helm chart configuration tests skipped (no chart files modified)."

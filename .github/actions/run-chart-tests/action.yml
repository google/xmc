name: 'Run Helm Chart Configuration Tests'
description: 'Checks changed chart paths and executes Helm chart configuration unit tests'

inputs:
  helm-version:
    description: 'Helm version to install'
    required: false
    default: 'v3.20.1'
  require-helm:
    description: 'Enforce Helm requirement in unit tests'
    required: false
    default: '1'

runs:
  using: 'composite'
  steps:
    # The chart suite renders templates with a host helm binary rather than building Bazel
    # targets, so its scope is resolved by path rather than by the Bazel dependency graph.
    - name: 'Check Changed Chart Paths'
      id: 'changes'
      uses: 'dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36' # v3.0.2
      with:
        filters: |
          chart:
            - 'deploy/helm/**'
            # The suite also asserts the chart agrees with the deployment blueprint, so a
            # blueprint-only edit can break it just as a chart-only edit can.
            - 'deploy/ctk_v2/xmanager-cloud.yaml'
            - 'test/helm/**'
            - '.github/workflows/unit-tests.yml'
            - '.github/actions/run-chart-tests/**'

    - name: 'Install Helm'
      if: steps.changes.outputs.chart == 'true'
      shell: bash
      env:
        HELM_VER: ${{ inputs.helm-version }}
      run: |
        if ! command -v helm &>/dev/null || [ "$(helm version --template '{{.Version}}' 2>/dev/null)" != "${HELM_VER}" ]; then
          mkdir -p "${RUNNER_TEMP}/helm"
          curl -sSfL "https://get.helm.sh/helm-${HELM_VER}-linux-amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/helm" --strip-components=1 linux-amd64/helm
          chmod +x "${RUNNER_TEMP}/helm/helm"
          echo "${RUNNER_TEMP}/helm" >> "${GITHUB_PATH}"
        fi

    - name: 'Run Helm Chart Configuration Tests'
      if: steps.changes.outputs.chart == 'true'
      shell: bash
      env:
        XMC_REQUIRE_HELM: ${{ inputs.require-helm }}
      run: |
        helm version --short
        python3 -m unittest discover --start-directory test/helm --pattern '*_test.py' --verbose

    - name: 'Log Chart Test Skip Summary'
      if: steps.changes.outputs.chart != 'true'
      shell: bash
      run: |
        echo "NOTICE: Helm chart configuration tests skipped (no chart files modified)."

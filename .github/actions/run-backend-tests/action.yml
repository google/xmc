name: 'Run Go & Backend Unit Tests'
description: 'Runs the affected Go and backend Bazel unit tests through tools/run_affected_tests.py (requires actions/checkout with fetch-depth: 0)'

inputs:
  test-timeout-seconds:
    description: 'Test timeout in seconds'
    required: false
    default: '60'
  spanner-check-timeout:
    description: 'Timeout in seconds to wait for Spanner emulator readiness'
    required: false
    default: '15'
  spanner-emulator-host:
    description: 'Host and port for the Spanner emulator'
    required: false
    default: '127.0.0.1:9010'

runs:
  using: 'composite'
  steps:
    - name: 'Classify Backend Test Requirement'
      id: 'classify'
      shell: bash
      # Base/head/ref/event/output are derived from GITHUB_* env and GITHUB_EVENT_PATH.
      run: python3 tools/benchmark/resolve_test_scope.py --no-rdeps

    - name: 'Reclaim Unused Runner Disk Space'
      if: steps.classify.outputs.run_backend == 'true'
      shell: bash
      # Standard ubuntu-latest runners have ~18 GB free on / because Android SDK,
      # .NET, GHC, and Boost consume ~28 GB. Reclaim them before building all Go targets.
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
        df -h /

    - name: 'Set up Bazel'
      if: steps.classify.outputs.run_backend == 'true'
      uses: 'bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2' # v3.0.0

    - name: 'Restore Bazel Repository Cache'
      if: steps.classify.outputs.run_backend == 'true'
      id: 'cache-bazel-repo-restore'
      uses: 'actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
      with:
        path: ~/.cache/bazel-repo
        key: bazel-repo-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'go.mod', 'go.sum') }}
        restore-keys: |
          bazel-repo-${{ runner.os }}-

    - name: 'Restore Bazel Disk Cache'
      if: steps.classify.outputs.run_backend == 'true'
      id: 'cache-bazel-disk-restore'
      uses: 'actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
      with:
        path: ~/.cache/bazel-disk
        key: bazel-disk-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          bazel-disk-${{ runner.os }}-

    - name: 'Check Protobuf Breaking-Change Coverage'
      if: steps.classify.outputs.run_backend == 'true'
      shell: bash
      # Every .proto of an //api proto_library must be checked by //api:protos_breaking_test.
      run: |
        uncovered="$(bazel query --noimplicit_deps --repository_cache="${HOME}/.cache/bazel-repo" \
          'labels(srcs, kind(proto_library, //api/...)) except labels(srcs, deps(//api:protos_breaking_test, 1))')"
        if [[ -n "${uncovered}" ]]; then
          echo "::error::Add the proto_library of these files to _PROTOS in api/BUILD.bazel: ${uncovered//$'\n'/ }"
          exit 1
        fi

    - name: 'Run Backend Unit Tests'
      if: steps.classify.outputs.run_backend == 'true'
      env:
        # The tool needs only the standard library, so skip bootstrapping the tools venv.
        XMC_BYPASS_VENV: '1'
        SPANNER_EMULATOR_HOST: ${{ inputs.spanner-emulator-host }}
        SPANNER_TIMEOUT_INPUT: ${{ inputs.spanner-check-timeout }}
        TEST_TIMEOUT: ${{ inputs.test-timeout-seconds }}
      shell: bash
      # The same entrypoint as local runs resolves the rdeps scope of the event, waits for the
      # Spanner emulator, and runs the affected targets with the shared test flags. CI-only
      # flags are appended with --bazel-flag and win over the defaults.
      run: |
        python3 tools/run_affected_tests.py --ci \
          --repository-cache "${HOME}/.cache/bazel-repo" \
          --emulator-wait-seconds "${SPANNER_TIMEOUT_INPUT}" \
          --bazel-flag=--config=ci \
          --bazel-flag="--disk_cache=${HOME}/.cache/bazel-disk" \
          --bazel-flag=--experimental_repository_cache_hardlinks \
          --bazel-flag="--test_timeout=${TEST_TIMEOUT},300,300,300"

    - name: 'Enforce Backend Diff Coverage (diff-cover)'
      if: steps.classify.outputs.run_backend == 'true' && github.event_name == 'pull_request'
      env:
        SPANNER_EMULATOR_HOST: ${{ inputs.spanner-emulator-host }}
        TEST_TIMEOUT: ${{ inputs.test-timeout-seconds }}
      shell: bash
      run: |
        COMPARE_BRANCH="origin/${GITHUB_BASE_REF:-main}"
        mapfile -t CHANGED_CODE < <(git diff --name-only --diff-filter=ACMR "${COMPARE_BRANCH}...HEAD" -- '*.go' '*.py')
        if [[ "${#CHANGED_CODE[@]}" -eq 0 ]]; then
          echo "NOTICE: No modified .go or .py files in diff; skipping backend diff-cover."
          exit 0
        fi
        declare -A PKG_SET=()
        for f in "${CHANGED_CODE[@]}"; do
          [[ -e "${f}" ]] || continue
          dir="$(dirname "${f}")"
          while [[ "${dir}" != "." && ! -f "${dir}/BUILD.bazel" && ! -f "${dir}/BUILD" ]]; do
            dir="$(dirname "${dir}")"
          done
          if [[ "${dir}" == "." ]]; then
            if [[ -f "BUILD.bazel" || -f "BUILD" ]]; then
              PKG_SET["//:all"]=1
            fi
          else
            PKG_SET["//${dir}:all"]=1
          fi
        done
        if [[ "${#PKG_SET[@]}" -eq 0 ]]; then
          echo "NOTICE: No Bazel packages found for modified .go/.py files; skipping backend diff-cover."
          exit 0
        fi
        PKG_EXPR="$(IFS='+'; echo "${!PKG_SET[*]}")"
        mapfile -t COV_TARGETS < <(bazel query --noimplicit_deps \
          --repository_cache="${HOME}/.cache/bazel-repo" \
          "kind('.*_test rule', ${PKG_EXPR}) except attr(tags, '\\b(e2e|integration|manual)\\b', ${PKG_EXPR})")
        if [[ "${#COV_TARGETS[@]}" -eq 0 ]]; then
          echo "NOTICE: No unit test targets in modified packages (${PKG_EXPR}); skipping backend diff-cover."
          exit 0
        fi
        if ! command -v diff-cover &>/dev/null; then
          pip install --no-cache-dir --break-system-packages "diff-cover>=9.2.0"
        fi
        bazel coverage \
          --repository_cache="${HOME}/.cache/bazel-repo" \
          --config=ci \
          --disk_cache="${HOME}/.cache/bazel-disk" \
          --experimental_repository_cache_hardlinks \
          --test_output=errors \
          --test_tag_filters=-e2e,-integration,-manual \
          --test_timeout="${TEST_TIMEOUT},300,300,300" \
          -- "${COV_TARGETS[@]}"
        LCOV_REPORT="$(bazel info --repository_cache="${HOME}/.cache/bazel-repo" output_path)/_coverage/_coverage_report.dat"
        if [[ -s "${LCOV_REPORT}" ]]; then
          diff-cover "${LCOV_REPORT}" \
            --compare-branch="${COMPARE_BRANCH}" \
            --fail-under=80
        fi

    - name: 'Save Bazel Repository Cache'
      uses: 'actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
      # Save repository cache on main/merge_group or when no baseline cache exists yet.
      if: (github.ref == 'refs/heads/main' || github.event_name == 'merge_group' || steps.cache-bazel-repo-restore.outputs.cache-matched-key == '') && steps.classify.outputs.run_backend == 'true' && steps.cache-bazel-repo-restore.outputs.cache-hit != 'true'
      with:
        path: ~/.cache/bazel-repo
        key: bazel-repo-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'go.mod', 'go.sum') }}

    - name: 'Save Bazel Disk Cache'
      uses: 'actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
      if: (github.ref == 'refs/heads/main' || github.event_name == 'merge_group' || steps.cache-bazel-disk-restore.outputs.cache-matched-key == '') && steps.classify.outputs.run_backend == 'true' && steps.cache-bazel-disk-restore.outputs.cache-hit != 'true'
      with:
        path: ~/.cache/bazel-disk
        key: bazel-disk-${{ runner.os }}-${{ github.sha }}

    - name: 'Log Backend Test Skip Summary'
      if: steps.classify.outputs.run_backend != 'true'
      env:
        SKIP_REASON: ${{ steps.classify.outputs.reason }}
      shell: bash
      run: |
        echo "NOTICE: Backend Go unit tests skipped (${SKIP_REASON})."

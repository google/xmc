# Builds the xmanager-cloud sdist, then the wheel from the unpacked sdist, which
# exercises the proto staging and compile hooks outside the repository tree.
# Nothing is published.
name: 'xmanager-cloud Package'

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: 'Detect Package Changes'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false
          # paths-filter diffs merge groups via `git fetch origin <sha>`, which fails
          # without persisted credentials; full history avoids that fetch.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}

      # The api/protos directories must match PROTO_PACKAGES in
      # sdks/python/xmanager-cloud/build_staging.py.
      - name: 'Check Changed Paths'
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: 'dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36' # v3.0.2
        id: changes
        with:
          base: ${{ github.event.merge_group.base_sha }}
          filters: |
            package:
              - 'sdks/python/xmanager-cloud/**'
              - 'sdks/python/xdash/**'
              - 'api/protos/experiment/**'
              - 'api/protos/xid/**'
              - 'api/protos/dashboard/**'
              - '.github/workflows/xmanager-cloud-package.yml'

      - name: 'Decide Whether To Run'
        id: gate
        env:
          EVENT_NAME: '${{ github.event_name }}'
          PATHS_CHANGED: '${{ steps.changes.outputs.package }}'
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [ "${PATHS_CHANGED}" = "true" ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No xmanager-cloud inputs changed; skipping."
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: 'Build Wheel and Sdist'
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Set up Python 3.13'
        uses: 'actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38' # v5.4.0
        with:
          python-version: '3.13'

      - name: 'Build Distributions'
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir build==1.6.1
          python3 -m build --outdir dist sdks/python/xmanager-cloud

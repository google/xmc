name: 'XMC Post-Submit Master Pipeline'

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: post-submit-master-${{ github.ref }}
  # Do not cancel in-progress runs on main to preserve full commit test history
  cancel-in-progress: false

permissions: {}

jobs:
  run-backend-tests:
    name: 'Backend & Go Unit Tests'
    runs-on: 'arc-runner-set'
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    services:
      # zizmor: ignore[unpinned-images]
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:1.5.56
        ports:
          - 9010:9010
          - 9020:9020

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 'Run Backend Unit Tests'
        uses: './.github/actions/run-backend-tests'

  run-ui-tests:
    name: 'Angular UI Unit Tests'
    runs-on: 'arc-runner-set'
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 'Run Angular UI Unit Tests'
        uses: './.github/actions/run-ui-tests'

  run-chart-tests:
    name: 'Helm Chart Configuration Tests'
    runs-on: 'arc-runner-set'
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 'Run Helm Chart Configuration Tests'
        uses: './.github/actions/run-chart-tests'

  run-e2e-tests:
    name: 'KinD & Playwright Headless E2E'
    runs-on: 'arc-runner-set'
    environment: e2e-test
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Validate CI Secrets Configuration'
        env:
          GCP_E2E_PROJECT_ID: ${{ secrets.GCP_E2E_PROJECT_ID }}
          GCP_E2E_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_E2E_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_E2E_SERVICE_ACCOUNT: ${{ secrets.GCP_E2E_SERVICE_ACCOUNT }}
          GCP_E2E_SPANNER_INSTANCE: ${{ secrets.GCP_E2E_SPANNER_INSTANCE }}
        run: |
          if [ -z "${GCP_E2E_PROJECT_ID}" ] || [ -z "${GCP_E2E_WORKLOAD_IDENTITY_PROVIDER}" ] || [ -z "${GCP_E2E_SERVICE_ACCOUNT}" ] || [ -z "${GCP_E2E_SPANNER_INSTANCE}" ]; then
            echo "::error::Required GitHub Secrets are not configured."
            exit 1
          fi

      - name: 'Authenticate to Google Cloud via Workload Identity Federation'
        uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed' # v2.1.13
        with:
          project_id: '${{ secrets.GCP_E2E_PROJECT_ID }}'
          workload_identity_provider: '${{ secrets.GCP_E2E_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_E2E_SERVICE_ACCOUNT }}'

      - name: 'Configure Docker Auth for GCP Artifact Registry'
        run: |
          gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: 'Set up Cloud SDK'
        run: |
          if ! command -v gcloud &>/dev/null; then
            curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
            echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list
            sudo apt-get update && sudo apt-get install -y --no-install-recommends google-cloud-cli
          fi
          gcloud version | head -n 1

      - name: 'Run End-to-End Tests'
        env:
          GCP_E2E_PROJECT_ID: ${{ secrets.GCP_E2E_PROJECT_ID }}
          GCP_E2E_SPANNER_INSTANCE: ${{ secrets.GCP_E2E_SPANNER_INSTANCE }}
        run: |
          ./test/e2e/run_local_e2e.sh \
            --project-id "${GCP_E2E_PROJECT_ID}" \
            --spanner-instance "${GCP_E2E_SPANNER_INSTANCE}"

  report-results:
    name: 'Aggregate Results & Report Failure'
    runs-on: 'ubuntu-latest'
    needs: [run-backend-tests, run-ui-tests, run-chart-tests, run-e2e-tests]
    if: always() && !cancelled()

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: 'Evaluate Job Matrix and Comment on PR'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # v7.0.1
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const needsContext = JSON.parse(process.env.NEEDS_CONTEXT || '{}');
            const headSha = context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            core.info(`Evaluating post-submit job statuses for commit SHA: ${headSha}`);

            const jobResults = [
              { name: 'Backend & Go Unit Tests', result: needsContext['run-backend-tests']?.result },
              { name: 'Angular UI Unit Tests', result: needsContext['run-ui-tests']?.result },
              { name: 'Helm Chart Configuration Tests', result: needsContext['run-chart-tests']?.result },
              { name: 'KinD & Playwright Headless E2E', result: needsContext['run-e2e-tests']?.result },
            ];

            const failedJobs = jobResults.filter(
              j => j.result === 'failure' || j.result === 'timed_out' || j.result === 'cancelled'
            );

            if (failedJobs.length === 0) {
              core.info('All post-submit master pipeline jobs succeeded.');
              return;
            }

            core.warning(`Detected ${failedJobs.length} failing job(s) on main.`);

            // 1. Look up associated merged Pull Request
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: headSha,
            });

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const shortSha = headSha.substring(0, 7);
            const dedupMarker = `<!-- xmc-postsubmit-master-failure: ${headSha} -->`;

            if (prs.length === 0) {
              core.warning(`No PR associated with commit ${headSha} (direct push or manual trigger).`);
              return;
            }

            const pr = prs[0];
            core.info(`Found associated PR #${pr.number} (Author: @${pr.user.login})`);

            // 2. Check if comment already exists for this exact commit SHA
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });

            if (comments.some(c => c.body.includes(dedupMarker))) {
              core.info(`Failure comment already posted on PR #${pr.number} for commit ${headSha}. Skipping.`);
              return;
            }

            // 3. Build markdown comment table
            let commentBody = `${dedupMarker}\n`;
            commentBody += `### 🚨 Post-Submit Test Regression on \`main\`\n\n`;
            commentBody += `Hello @${pr.user.login}, one or more automated post-submit test suites failed after merging commit [\`${shortSha}\`](${context.serverUrl}/${owner}/${repo}/commit/${headSha}) into \`main\`.\n\n`;
            commentBody += `| Test Suite | Result |\n`;
            commentBody += `| :--- | :---: |\n`;

            for (const j of jobResults) {
              const icon = j.result === 'success' ? '✅' :
                           j.result === 'skipped' ? '⚪' : '❌';
              commentBody += `| **${j.name}** | ${icon} \`${j.result || 'unknown'}\` |\n`;
            }

            commentBody += `\n- **Full Workflow Logs**: [View CI Run Details](${runUrl})\n\n`;
            commentBody += `> **Action Required:** Please investigate the failures above and submit a fix or revert to restore \`main\` health.\n`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: commentBody,
            });

            core.info(`Successfully posted failure report comment to PR #${pr.number}`);

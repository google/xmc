name: 'XMC Headless E2E Tests'

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'deploy/**'
      - 'internal/**'
      - 'pkg/**'
      - 'test/e2e/**'
      - '.github/workflows/e2e-tests.yml'
      - 'go.mod'
      - 'go.sum'
      - 'WORKSPACE'
      - 'MODULE.bazel'
      - 'BUILD.bazel'
      - '.bazelrc'
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  run-e2e:
    name: 'KinD & Playwright Headless E2E'
    runs-on: 'arc-runner-set'
    timeout-minutes: 60

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Start Async Disk Space Cleanup'
        run: |
          echo "=== Starting background cleanup of unnecessary files ==="
          if [ -d /usr/local/lib/android ] || [ -d /usr/share/dotnet ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet &
            echo "CLEANUP_PID=$!" >> $GITHUB_ENV
          fi

      - name: 'Authenticate to Google Cloud via Workload Identity Federation'
        uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed' # v2.1.13
        with:
          workload_identity_provider: 'projects/815549340089/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'xmc-e2e-ci@xmc-test-project-3.iam.gserviceaccount.com'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f' # v2.2.1

      - name: 'Set up Bazel'
        uses: 'bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2' # v3.0.0

      - name: 'Restore Bazel Repository Cache'
        id: 'cache-bazel-repo-restore'
        uses: 'actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod') }}
          restore-keys: |
            bazel-repo-${{ runner.os }}-

      - name: 'Configure Bazel Cache Settings'
        env:
          REMOTE_UPLOAD: ${{ github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p ~/.cache/bazel-repo
          cat << EOF_BAZEL >> ~/.bazelrc
          common --config=ci
          common --remote_upload_local_results=${REMOTE_UPLOAD}
          common --repository_cache=${HOME}/.cache/bazel-repo
          common --experimental_repository_cache_hardlinks
          EOF_BAZEL

      - name: 'Set up Python'
        uses: 'actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38' # v5.4.0
        with:
          python-version: '3.13'

      - name: 'Install Kubectl, KinD, and Helm'
        run: |
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> $GITHUB_PATH

          echo "=== Installing Kubectl, KinD, and Helm in Parallel ==="
          (
            if ! command -v kubectl &>/dev/null; then
              curl -fsSL "https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl" -o "${HOME}/.local/bin/kubectl"
              chmod +x "${HOME}/.local/bin/kubectl"
            fi
          ) &
          PID_KUBECTL=$!

          (
            if ! command -v kind &>/dev/null; then
              curl -fsSL "https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64" -o "${HOME}/.local/bin/kind"
              chmod +x "${HOME}/.local/bin/kind"
            fi
          ) &
          PID_KIND=$!

          (
            if ! command -v helm &>/dev/null; then
              HELM_VERSION="v3.17.1"
              curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
              tar -zxvf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
              mv /tmp/linux-amd64/helm "${HOME}/.local/bin/helm"
              rm -rf /tmp/helm.tar.gz /tmp/linux-amd64
            fi
          ) &
          PID_HELM=$!

          wait "${PID_KUBECTL}" "${PID_KIND}" "${PID_HELM}"

          kubectl version --client
          kind --version
          helm version

      - name: 'Wait for Disk Space Cleanup'
        run: |
          if [ -n "${CLEANUP_PID:-}" ]; then
            echo "Waiting for background cleanup (PID ${CLEANUP_PID}) to complete..."
            wait "${CLEANUP_PID}" || true
          fi
          echo "=== Available Disk Space Before E2E Test Execution ==="
          df -h /

      - name: 'Run E2E Test Suite'
        env:
          GCP_PROJECT_ID: 'xmc-test-project-3'
          SPANNER_INSTANCE: 'xmc-e2e'
          XMC_SCREENSHOTS_DIR: '${{ github.workspace }}/e2e-screenshots'
        run: |
          mkdir -p "${XMC_SCREENSHOTS_DIR}"
          python3 test/e2e/runner.py --screenshots-dir "${XMC_SCREENSHOTS_DIR}"

      - name: 'Save Bazel Repository Cache'
        uses: 'actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
        # Only save repository cache on main branch pushes when external dependencies change.
        if: github.ref == 'refs/heads/main' && steps.cache-bazel-repo-restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod') }}

      - name: 'Upload E2E Screenshots & Diagnostic Logs'
        if: always()
        uses: 'actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1' # v4.6.1
        with:
          name: 'e2e-artifacts'
          path: '${{ github.workspace }}/e2e-screenshots/'
          if-no-files-found: ignore
          retention-days: 14

name: 'Nightly test suite'

on:
  schedule:
    # Trigger nightly test suite at 2:00 AM UTC every day (1 hour after 1:00 AM nightly deployment)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      verify_workload:
        description: 'Verify workload completion and assert statuses via SDK'
        type: boolean
        default: true
        required: false
      report_failure:
        description: 'Report failures and alert repository OWNERS on GitHub Issues'
        type: boolean
        default: true
        required: false
      duration_seconds:
        description: 'Workload duration in seconds per WorkUnit'
        type: number
        default: 60
        required: false
      num_work_units:
        description: 'Number of WorkUnits to launch'
        type: number
        default: 3
        required: false
      queue_name:
        description: 'Target ClusterQueue name'
        type: string
        default: 'cpu-queue'
        required: false

permissions:
  contents: read

jobs:
  run-and-verify-demo-workload:
    name: 'Run & Verify Demo Workload'
    runs-on: 'arc-runner-set'
    environment: xmc-nightly
    timeout-minutes: 30
    outputs:
      experiment_xid: ${{ steps.launch-demo-workload.outputs.xid }}

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: '${{ secrets.GCP_PROJECT_ID }}'
      REGION: '${{ secrets.GCP_REGION }}'
      DOMAIN_NAME: '${{ secrets.GCP_DOMAIN_NAME }}'
      XMC_DOMAIN: 'xmc-nightly.${{ secrets.GCP_DOMAIN_NAME }}'
      XMANAGER_ENDPOINT: 'grpc.xmc-nightly.${{ secrets.GCP_DOMAIN_NAME }}:443'
      XMANAGER_UI_URL: 'https://xmc-nightly.${{ secrets.GCP_DOMAIN_NAME }}'
      IAP_CLIENT_ID: '${{ secrets.GCP_IAP_CLIENT_ID }}'
      XMC_CLIENT_SA: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
      QUEUE_NAME: ${{ inputs.queue_name || 'cpu-queue' }}
      NUM_WORK_UNITS: ${{ inputs.num_work_units || 3 }}
      DURATION_SECONDS: ${{ inputs.duration_seconds || 60 }}

    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Authenticate to Google Cloud via Workload Identity Federation'
        uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed' # v2.1.13
        with:
          project_id: '${{ secrets.GCP_PROJECT_ID }}'
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: 'Set up Python 3.13'
        uses: 'actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38' # v5.4.0
        with:
          python-version: '3.13'

      - name: 'Install XManager CLI and Dependencies'
        run: |
          python3 deploy/cli/install_xmanager.py --venv "${GITHUB_WORKSPACE}/.venv"
          "${GITHUB_WORKSPACE}/.venv/bin/pip" install -e sdks/python/xmc
          "${GITHUB_WORKSPACE}/.venv/bin/pip" install -r examples/simple_job/requirements.txt

      - name: 'Mint XMC Identity Token'
        env:
          DEFAULT_USER_EMAIL: "${{ secrets.XMC_USER_EMAIL || format('{0}@google.com', github.actor) }}"
        run: |
          TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="${XMC_CLIENT_SA}" --audiences="${IAP_CLIENT_ID}" --include-email)"
          echo "::add-mask::${TOKEN}"
          echo "XMC_AUTH_TOKEN=${TOKEN}" >> "${GITHUB_ENV}"
          echo "XMC_USER_EMAIL=${DEFAULT_USER_EMAIL}" >> "${GITHUB_ENV}"

      - name: 'Launch Demo Workload'
        id: launch-demo-workload
        env:
          ACTOR: '${{ github.actor }}'
          XMC_USER_EMAIL: '${{ github.actor }}@google.com'
        run: |
          set -euo pipefail
          if [ -n "${IAP_CLIENT_ID:-}" ]; then
            if [ -n "${XMC_CLIENT_SA:-}" ]; then
              XMC_AUTH_TOKEN=$(gcloud auth print-identity-token --audiences="${IAP_CLIENT_ID}" --impersonate-service-account="${XMC_CLIENT_SA}" --include-email)
            else
              XMC_AUTH_TOKEN=$(gcloud auth print-identity-token --audiences="${IAP_CLIENT_ID}" --include-email)
            fi
            export XMC_AUTH_TOKEN
          fi
          export XMC_USER_EMAIL="${ACTOR}@google.com"

          OUTPUT=$("${GITHUB_WORKSPACE}/.venv/bin/python3" examples/simple_job/launch.py \
            --queue="${QUEUE_NAME}" \
            --num_work_units="${NUM_WORK_UNITS}" \
            --duration="${DURATION_SECONDS}" \
            --gpus=0 \
            --author="${ACTOR}@google.com" | tee /dev/stderr)

          # Extract XID from output
          XID=$(echo "${OUTPUT}" | grep -oP 'Experiment XID:\s*\K\d+' || echo "${OUTPUT}" | grep -oP 'XID:\s*\K\d+' || true)
          if [ -z "${XID}" ]; then
            XID=$(echo "${OUTPUT}" | grep -oP 'experiments/\K\d+' | head -n 1 || true)
          fi

          if [ -z "${XID}" ]; then
            echo "::error::Failed to parse experiment XID from workload launch output."
            exit 1
          fi

          echo "xid=${XID}" >> "$GITHUB_OUTPUT"

      - name: 'Run Workload Assertions via XMC SDK'
        id: verify-workload
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_workload }}
        env:
          ACTOR: '${{ github.actor }}'
          XID: '${{ steps.launch-demo-workload.outputs.xid }}'
        run: |
          set -euo pipefail
          echo "================================================================="
          echo " Starting Workload Verification for Experiment XID: ${XID}"
          echo "================================================================="

          if [ -n "${IAP_CLIENT_ID:-}" ]; then
            if [ -n "${XMC_CLIENT_SA:-}" ]; then
              XMC_AUTH_TOKEN=$(gcloud auth print-identity-token --audiences="${IAP_CLIENT_ID}" --impersonate-service-account="${XMC_CLIENT_SA}" --include-email)
            else
              XMC_AUTH_TOKEN=$(gcloud auth print-identity-token --audiences="${IAP_CLIENT_ID}" --include-email)
            fi
            export XMC_AUTH_TOKEN
          fi
          export XMC_USER_EMAIL="${ACTOR}@google.com"
          export PYTHONPATH="${GITHUB_WORKSPACE}:${PYTHONPATH:-}"

          # Execute verification via Python module syntax (-m) using the virtual environment interpreter.
          # This sets sys.path[0] to the repository root (${GITHUB_WORKSPACE}), ensuring canonical
          # package imports (e.g. `from tools.nightly_tests.verification import verifier_cli`) resolve cleanly without sys.path hacks.
          "${GITHUB_WORKSPACE}/.venv/bin/python3" -m tools.nightly_tests.simple_job_verify \
            --xid="${XID}" \
            --expected_work_units="${NUM_WORK_UNITS}"

          echo "================================================================="
          echo " Workload Verification Completed Successfully!"
          echo "================================================================="

      - name: 'Execute Playwright UI Traversal Assertions against xmc-nightly UI'
        id: 'verify-ui-traversal'
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verify_workload }}
        env:
          XID: '${{ steps.launch-demo-workload.outputs.xid }}'
          UI_URL: '${{ env.XMANAGER_UI_URL }}'
          XMC_SCREENSHOTS_DIR: '/tmp/xmc_screenshots'
        run: |
          set -euo pipefail
          : "${IAP_CLIENT_ID:?GCP_IAP_CLIENT_ID secret is required for IAP-authenticated UI traversal}"
          : "${XMC_AUTH_TOKEN:?XMC_AUTH_TOKEN must be minted by the 'Mint XMC Identity Token' step}"
          export PYTHONPATH="${GITHUB_WORKSPACE}:${PYTHONPATH:-}"
          mkdir -p "${XMC_SCREENSHOTS_DIR}"
          "${GITHUB_WORKSPACE}/.venv/bin/pip" install "playwright==1.51.0"
          "${GITHUB_WORKSPACE}/.venv/bin/python3" -m playwright install chromium --with-deps
          "${GITHUB_WORKSPACE}/.venv/bin/python3" -m tools.nightly_tests.simple_job_ui_verify \
            --xid="${XID}" --ui_base_url="${UI_URL}" \
            --expected_work_units="${NUM_WORK_UNITS}"
          "${GITHUB_WORKSPACE}/.venv/bin/python3" -m tools.nightly_tests.resource_dashboard_ui_verify \
            --ui_base_url="${UI_URL}" \
            --expected_queue="${QUEUE_NAME}"

      - name: 'Upload UI Diagnostic Screenshots'
        if: failure() && steps.verify-ui-traversal.outcome == 'failure'
        uses: 'actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1' # v4.6.1
        with:
          name: 'ui-traversal-screenshots'
          path: '/tmp/xmc_screenshots/*.png'
          if-no-files-found: 'ignore'
          retention-days: 7

      - name: 'Publish Nightly Test Findings Summary'
        if: always()
        env:
          XID: '${{ steps.launch-demo-workload.outputs.xid }}'
          LAUNCH_OUTCOME: '${{ steps.launch-demo-workload.outcome }}'
          VERIFY_OUTCOME: '${{ steps.verify-workload.outcome }}'
          UI_VERIFY_OUTCOME: '${{ steps.verify-ui-traversal.outcome }}'
        run: |
          set -euo pipefail
          {
            echo "## 🌙 Nightly Test Suite Execution Summary"
            echo ""
            if [ "${LAUNCH_OUTCOME}" = "success" ] \
              && [ "${VERIFY_OUTCOME}" != "failure" ] \
              && [ "${UI_VERIFY_OUTCOME}" != "failure" ]; then
              echo "### ✅ Outcome: PASSED"
            else
              echo "### ❌ Outcome: FAILED"
            fi
            echo ""
            echo "| Metric / Step | Status / Value |"
            echo "| --- | --- |"
            echo "| **Experiment XID** | \`${XID:-N/A}\` |"
            echo "| **Launch Demo Workload** | \`${LAUNCH_OUTCOME}\` |"
            echo "| **SDK gRPC Verification** | \`${VERIFY_OUTCOME}\` |"
            echo "| **UI Browser Traversal** | \`${UI_VERIFY_OUTCOME}\` |"
            if [ -n "${XID:-}" ]; then
              echo "| **Web UI URL** | https://xmc-nightly.${DOMAIN_NAME}/experiments/${XID} |"
            fi
            echo ""
            echo "> Automated Nightly E2E Test Suite against \`xmc-nightly\` deployment."
          } >> "${GITHUB_STEP_SUMMARY}"

  report-nightly-failure:
    name: 'Report Failure & Alert OWNERS'
    runs-on: 'ubuntu-latest'
    needs: [run-and-verify-demo-workload]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.report_failure) && (needs.run-and-verify-demo-workload.result == 'failure' || needs.run-and-verify-demo-workload.result == 'cancelled')

    permissions:
      contents: read
      issues: write

    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Alert Repository OWNERS on GitHub Issue'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # v7.0.1
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
          XID: '${{ needs.run-and-verify-demo-workload.outputs.experiment_xid }}'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { run } = require('./.github/scripts/nightly-failure-alert.js');
            await run({ github, context, core });


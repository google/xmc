name: 'Terraform Formatting, Linting & Security'

on:
  pull_request:
    paths:
      - 'deploy/**/*.tf'
      - 'deploy/**/*.tfvars'
      - '.github/workflows/terraform-lint.yml'
  push:
    branches:
      - main
    paths:
      - 'deploy/**/*.tf'
      - 'deploy/**/*.tfvars'
      - '.github/workflows/terraform-lint.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  terraform-lint:
    name: 'Terraform Formatting, Linting & Security'
    runs-on: 'arc-runner-set'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Set up Terraform'
        uses: 'hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd' # v3.1.2
        with:
          terraform_version: '1.8.5'

      - name: 'Verify Terraform Formatting'
        run: 'terraform fmt -check -recursive deploy/'

      - name: 'Set up TFLint'
        uses: 'terraform-linters/setup-tflint@19a52fbac37dacb22a09518e4ef6ee234f2d4987' # v4.0.0
        with:
          tflint_version: 'v0.50.0'

      - name: 'Init TFLint'
        run: 'tflint --init'

      - name: 'Run TFLint'
        run: 'tflint --recursive'

      # zizmor: ignore[impostor-commit]
      - name: 'Run Trivy IaC Scanner (deploy/terraform)'
        uses: 'aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25' # v0.36.0
        with:
          scan-type: 'config'
          hide-progress: true
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          scan-ref: 'deploy/terraform'

      # zizmor: ignore[impostor-commit]
      - name: 'Run Trivy IaC Scanner (deploy/ctk_v2/modules)'
        uses: 'aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25' # v0.36.0
        with:
          scan-type: 'config'
          hide-progress: true
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          scan-ref: 'deploy/ctk_v2/modules'

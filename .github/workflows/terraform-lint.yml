name: 'Terraform Formatting, Linting & Security'

on:
  pull_request:
    paths:
      - 'deploy/**/*.tf'
      - 'deploy/**/*.tfvars'
      - '.github/workflows/terraform-lint.yml'
  push:
    branches:
      - main
    paths:
      - 'deploy/**/*.tf'
      - 'deploy/**/*.tfvars'
      - '.github/workflows/terraform-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-fmt:
    name: 'Terraform Format Check'
    runs-on: 'arc-runner-set'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Set up Terraform'
        uses: 'hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd' # v3.1.2
        with:
          terraform_version: '1.8.5'

      - name: 'Verify Terraform Formatting'
        run: 'terraform fmt -check -recursive deploy/'

  tflint:
    name: 'Terraform Linter (TFLint)'
    runs-on: 'arc-runner-set'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Set up TFLint'
        uses: 'terraform-linters/setup-tflint@19a52fbac37dacb22a09518e4ef6ee234f2d4987' # v4.0.0
        with:
          tflint_version: 'v0.50.0'

      - name: 'Init TFLint'
        run: 'tflint --init'

      - name: 'Run TFLint'
        run: 'tflint --recursive'

  trivy-iac:
    name: 'IaC Security Scan (Trivy)'
    runs-on: 'arc-runner-set'
    strategy:
      matrix:
        target: ['deploy/terraform', 'deploy/ctk_v2/modules']
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Run Trivy IaC Scanner'
        uses: 'aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8' # v0.36.0
        with:
          scan-type: 'config'
          hide-progress: true
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          scan-ref: '${{ matrix.target }}'

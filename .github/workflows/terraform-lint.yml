name: 'Terraform Formatting, Linting & Security'

on:
  pull_request:
    paths:
      - 'deploy/**/*.tf'
      - 'deploy/**/*.tfvars'
      - '.github/workflows/terraform-lint.yml'
  push:
    branches:
      - main
    paths:
      - 'deploy/**/*.tf'
      - 'deploy/**/*.tfvars'
      - '.github/workflows/terraform-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-fmt:
    name: 'Terraform Format Check'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262' # v4.2.2

      - name: 'Set up Terraform'
        uses: 'hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd' # v3.1.2
        with:
          terraform_version: '1.8.5'

      - name: 'Verify Terraform Formatting'
        run: 'terraform fmt -check -recursive deploy/'

  tflint:
    name: 'Terraform Linter (TFLint)'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262' # v4.2.2

      - name: 'Set up TFLint'
        uses: 'terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6' # v4.1.1
        with:
          tflint_version: 'v0.50.0'

      - name: 'Init TFLint'
        run: 'tflint --init'

      - name: 'Run TFLint'
        run: 'tflint --recursive'

  trivy-iac:
    name: 'IaC Security Scan (Trivy)'
    runs-on: 'ubuntu-24.04'
    strategy:
      matrix:
        target: ['deploy/terraform', 'deploy/ctk_v2/modules']
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262' # v4.2.2

      - name: 'Run Trivy IaC Scanner'
        uses: 'aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25' # v0.36.0
        with:
          scan-type: 'config'
          hide-progress: true
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          scan-ref: '${{ matrix.target }}'

name: 'Terraform Formatting, Linting & Security'

on:
  pull_request:
    paths:
      - 'deploy/**/*.tf'
      - 'deploy/**/*.tfvars'
      - '.github/workflows/terraform-lint.yml'
  push:
    branches:
      - main
    paths:
      - 'deploy/**/*.tf'
      - 'deploy/**/*.tfvars'
      - '.github/workflows/terraform-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-fmt:
    name: 'Terraform Format Check'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'

      - name: 'Set up Terraform'
        uses: 'hashicorp/setup-terraform@v3'
        with:
          terraform_version: '1.8.5'

      - name: 'Verify Terraform Formatting'
        run: 'terraform fmt -check -recursive deploy/'

  tflint:
    name: 'Terraform Linter (TFLint)'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'

      - name: 'Set up TFLint'
        uses: 'terraform-linters/setup-tflint@v4'
        with:
          tflint_version: 'v0.50.0'

      - name: 'Init TFLint'
        run: 'tflint --init'

      - name: 'Run TFLint'
        run: 'tflint --recursive'

  trivy-iac:
    name: 'IaC Security Scan (Trivy)'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'

      - name: 'Run Trivy IaC Scanner'
        uses: 'aquasec/trivy-action@master'
        with:
          scan-type: 'config'
          hide-progress: true
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          scan-ref: 'deploy/'

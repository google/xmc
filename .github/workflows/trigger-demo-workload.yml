name: 'Run Demo Workload (XMC Nightly)'

on:
  workflow_dispatch:
    inputs:
      queue:
        description: 'Target Queue name for workload (e.g. cpu-queue, gpu-queue)'
        type: string
        required: false
        default: 'cpu-queue'
      num_work_units:
        description: 'Number of WorkUnits to launch'
        type: number
        required: false
        default: 3
      duration_seconds:
        description: 'Duration in seconds for each WorkUnit'
        type: number
        required: false
        default: 60
  push:
    branches:
      - 'feat/nightly-demo-workload'

permissions:
  contents: read
  id-token: write

jobs:
  run-demo-workload:
    name: 'Launch Demo Workload'
    runs-on: 'arc-runner-set'
    environment: xmc-nightly
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: '${{ secrets.GCP_PROJECT_ID }}'
      GCP_PROJECT_ID: '${{ secrets.GCP_PROJECT_ID }}'
      REGION: '${{ secrets.GCP_REGION }}'
      GCP_REGION: '${{ secrets.GCP_REGION }}'
      DOMAIN_NAME: '${{ secrets.GCP_DOMAIN_NAME }}'
      GCP_DOMAIN_NAME: '${{ secrets.GCP_DOMAIN_NAME }}'
      XMC_DOMAIN: 'xmc-nightly.${{ secrets.GCP_DOMAIN_NAME }}'
      XMANAGER_ENDPOINT: 'grpc.xmc-nightly.${{ secrets.GCP_DOMAIN_NAME }}:443'
      XMANAGER_UI_URL: 'https://xmc-nightly.${{ secrets.GCP_DOMAIN_NAME }}'
      IAP_CLIENT_ID: '${{ secrets.GCP_IAP_CLIENT_ID }}'
      CLIENT_ID: '${{ secrets.GCP_IAP_CLIENT_ID }}'
      XMC_CLIENT_SA: '${{ secrets.GCP_SERVICE_ACCOUNT }}'



    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Authenticate to Google Cloud via Workload Identity Federation'
        uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed' # v2.1.13
        with:
          project_id: '${{ secrets.GCP_PROJECT_ID }}'
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: 'Set up Python 3.13'
        uses: 'actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38' # v5.4.0
        with:
          python-version: '3.13'

      - name: 'Install XManager CLI and Dependencies'
        run: |
          python3 deploy/cli/install_xmanager.py --venv "${GITHUB_WORKSPACE}/.venv"
          "${GITHUB_WORKSPACE}/.venv/bin/pip" install -e sdks/python/xmc

      - name: 'Launch 3-WorkUnit Demo Workload'
        env:
          QUEUE_NAME: '${{ inputs.queue || ''cpu-queue'' }}'
          NUM_WU: '${{ inputs.num_work_units || 3 }}'
          DURATION: '${{ inputs.duration_seconds || 60 }}'
          ACTOR: '${{ github.actor }}'
        run: |
          "${GITHUB_WORKSPACE}/.venv/bin/python3" examples/demo_2min_job/launch.py \
            --queue="${QUEUE_NAME}" \
            --num_work_units="${NUM_WU}" \
            --duration="${DURATION}" \
            --gpus=0 \
            --author="${ACTOR}@google.com"



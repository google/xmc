name: 'Run Demo Workload (XMC Nightly)'

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      GCP_PROJECT_ID:
        required: false
      GCP_REGION:
        required: false
      GCP_DOMAIN_NAME:
        required: false
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_SERVICE_ACCOUNT:
        required: false
      GCP_IAP_CLIENT_ID:
        required: false
    outputs:
      experiment_xid:
        description: 'Created Experiment XID'
        value: ${{ jobs.run-demo-workload.outputs.experiment_xid }}

permissions:
  contents: read

jobs:
  run-demo-workload:
    name: 'Launch Demo Workload'
    runs-on: 'arc-runner-set'
    environment: xmc-nightly
    timeout-minutes: 30
    outputs:
      experiment_xid: ${{ steps.launch-demo-workload.outputs.xid }}

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: '${{ secrets.GCP_PROJECT_ID }}'
      REGION: '${{ secrets.GCP_REGION }}'
      DOMAIN_NAME: '${{ secrets.GCP_DOMAIN_NAME }}'
      XMC_DOMAIN: 'xmc-nightly.${{ secrets.GCP_DOMAIN_NAME }}'
      XMANAGER_ENDPOINT: 'grpc.xmc-nightly.${{ secrets.GCP_DOMAIN_NAME }}:443'
      XMANAGER_UI_URL: 'https://xmc-nightly.${{ secrets.GCP_DOMAIN_NAME }}'
      IAP_CLIENT_ID: '${{ secrets.GCP_IAP_CLIENT_ID }}'
      XMC_CLIENT_SA: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
      QUEUE_NAME: 'cpu-queue'
      NUM_WORK_UNITS: 3
      DURATION_SECONDS: 60

    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Authenticate to Google Cloud via Workload Identity Federation'
        uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed' # v2.1.13
        with:
          project_id: '${{ secrets.GCP_PROJECT_ID }}'
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: 'Set up Python 3.13'
        uses: 'actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38' # v5.4.0
        with:
          python-version: '3.13'

      - name: 'Install XManager CLI and Dependencies'
        run: |
          python3 deploy/cli/install_xmanager.py --venv "${GITHUB_WORKSPACE}/.venv"
          "${GITHUB_WORKSPACE}/.venv/bin/pip" install -e sdks/python/xmc
          "${GITHUB_WORKSPACE}/.venv/bin/pip" install -r examples/simple_job/requirements.txt

      - name: 'Mint XMC Identity Token'
        run: |
          TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="${XMC_CLIENT_SA}" --audiences="${IAP_CLIENT_ID}" --include-email)"
          echo "::add-mask::${TOKEN}"
          echo "XMC_AUTH_TOKEN=${TOKEN}" >> "${GITHUB_ENV}"

      - name: 'Launch Demo Workload'
        id: launch-demo-workload
        env:
          ACTOR: '${{ github.actor }}'
          XMC_USER_EMAIL: '${{ github.actor }}@google.com'
        run: |
          set -euo pipefail
          if [ -n "${IAP_CLIENT_ID:-}" ]; then
            if [ -n "${XMC_CLIENT_SA:-}" ]; then
              XMC_AUTH_TOKEN=$(gcloud auth print-identity-token --audiences="${IAP_CLIENT_ID}" --impersonate-service-account="${XMC_CLIENT_SA}" --include-email)
            else
              XMC_AUTH_TOKEN=$(gcloud auth print-identity-token --audiences="${IAP_CLIENT_ID}" --include-email)
            fi
            export XMC_AUTH_TOKEN
          fi
          export XMC_USER_EMAIL="${ACTOR}@google.com"

          OUTPUT=$("${GITHUB_WORKSPACE}/.venv/bin/python3" examples/simple_job/launch.py \
            --queue="${QUEUE_NAME}" \
            --num_work_units="${NUM_WORK_UNITS}" \
            --duration="${DURATION_SECONDS}" \
            --gpus=0 \
            --author="${ACTOR}@google.com" | tee /dev/stderr)

          # Extract XID from output
          XID=$(echo "${OUTPUT}" | grep -oP 'Experiment XID:\s*\K\d+' || echo "${OUTPUT}" | grep -oP 'XID:\s*\K\d+' || true)
          if [ -z "${XID}" ]; then
            XID=$(echo "${OUTPUT}" | grep -oP 'experiments/\K\d+' | head -n 1 || true)
          fi

          if [ -z "${XID}" ]; then
            echo "::error::Failed to parse experiment XID from workload launch output."
            exit 1
          fi

          echo "xid=${XID}" >> "$GITHUB_OUTPUT"

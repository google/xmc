name: 'XMC Unit Tests'

on:
  pull_request:
  push:
    branches:
      - feature/unit_tests_action
      - test
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  run-tests:
    name: 'Run Unit Tests'
    runs-on: 'ubuntu-24.04'
    environment: janzak-dev-test

    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ vars.SERVICE_ACCOUNT }}

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Set up Go'
        uses: 'actions/setup-go@v5'
        with:
          go-version: '1.26.0'

      - name: 'Set up Bazel'
        uses: 'bazelbuild/setup-bazelisk@v3'

      - name: 'Restore Bazel Cache'
        id: 'cache-bazel-restore'
        uses: 'actions/cache/restore@v4'
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod', 'BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}'
          create_credentials_file: true

      - name: 'Run Unit Tests'
        run: |
          # TODO: increase this time limit or remove altogether once the spanner tests are not timing out
          # TODO: add the following tests back once they are green:
          # //cmd/actuator/k8s_client:k8s_client_test
          # //cmd/experiment_state_server:health_test
          # //cmd/experiment_state_server/server:server_test
          # //cmd/log_monitor:log_monitor_test
          # //cmd/reconciler/jobset:jobset_test
          # //cmd/reconciler/shared:shared_test
          # //cmd/xid_service:health_test
          # //cmd/xid_service/server:server_test
          # //internal/common:health_test
          # //internal/storage/spanner:spanner_test
          # //internal/storage/spanner/emulator:emulator_test
          # //internal/storage/spanner/migrations:migrations_test
          # //internal/storage/spanner/migrations/commands:commands_test
          # //internal/storage/spanner/migrations/driver:driver_test
          bazel test \
            --repository_cache=~/.cache/bazel-repo \
            --disk_cache=~/.cache/bazel-disk \
            --test_output=errors \
            --build_tests_only \
            --remote_build_event_upload=all \
            --bes_backend="grpcs://buildeventservice.googleapis.com" \
            --bes_results_url="https://source.cloud.google.com/results/invocations" \
            --bes_instance_name="${{ env.PROJECT_ID }}" \
            --google_auth_scopes="https://www.googleapis.com/auth/cloud-platform" \
            --bes_header="x-goog-user-project=${{ env.PROJECT_ID }}" \
            --bes_timeout=15s \
            --test_timeout=15,15,15,15 \
            --google_default_credentials \
            -- \
            //... \
            -//cmd/actuator/k8s_client:k8s_client_test \
            -//cmd/experiment_state_server:health_test \
            -//cmd/experiment_state_server/server:server_test \
            -//cmd/log_monitor:log_monitor_test \
            -//cmd/reconciler/jobset:jobset_test \
            -//cmd/reconciler/shared:shared_test \
            -//cmd/xid_service:health_test \
            -//cmd/xid_service/server:server_test \
            -//internal/common:health_test \
            -//internal/storage/spanner:spanner_test \
            -//internal/storage/spanner/emulator:emulator_test \
            -//internal/storage/spanner/migrations:migrations_test \
            -//internal/storage/spanner/migrations/commands:commands_test

      - name: 'Save Bazel Cache'
        uses: 'actions/cache/save@v4'
        if: always()
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod', 'BUILD.bazel') }}

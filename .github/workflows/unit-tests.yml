# TODO: Reduce duplication in parallel test jobs (e.g., by utilizing a reusable workflow or composite actions).
name: 'XMC Unit Tests'

on:
  pull_request:
  push:
    branches:
      - main
      - feature/unit_tests_action
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
# This job detects which files changed in the PR or push, and outputs flags for downstream jobs.
  detect-changes:
    name: 'Detect Changed Files'
    runs-on: 'ubuntu-24.04'
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      internal: ${{ steps.filter.outputs.internal }}
      tools: ${{ steps.filter.outputs.tools }}
      pkg: ${{ steps.filter.outputs.pkg }}
      api: ${{ steps.filter.outputs.api }}
      actuator: ${{ steps.filter.outputs.actuator }}
      experiment_state_server: ${{ steps.filter.outputs.experiment_state_server }}
      log_monitor: ${{ steps.filter.outputs.log_monitor }}
      reconciler: ${{ steps.filter.outputs.reconciler }}
      xid_service: ${{ steps.filter.outputs.xid_service }}
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'cmd/ui/**'
            actuator:
              - 'cmd/actuator/**'
            experiment_state_server:
              - 'cmd/experiment_state_server/**'
            log_monitor:
              - 'cmd/log_monitor/**'
            reconciler:
              - 'cmd/reconciler/**'
            xid_service:
              - 'cmd/xid_service/**'
            internal:
              - 'internal/**'
            tools:
              - 'tools/**'
            pkg:
              - 'pkg/**'
            api:
              - 'api/**'

# Test UI job: runs Node.js/Karma tests.
  # Triggered only when UI files change or API files change (affects overall schema/types).
  test-ui:
    name: 'Test UI'
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      needs.detect-changes.outputs.ui == 'true' ||
      needs.detect-changes.outputs.api == 'true'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 20
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'
      - name: 'Setup environment'
        uses: './.github/actions/setup-bazel-go'
        with:
          cache-key-prefix: 'bazel-ui'
      - name: 'Set up Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'cmd/ui/package-lock.json'
      - name: 'Install Node.js dependencies'
        run: npm ci --legacy-peer-deps
        working-directory: cmd/ui
      - name: 'Run UI Unit Tests'
        run: |
          bazel test \
            --repository_cache=~/.cache/bazel-repo \
            --disk_cache=~/.cache/bazel-disk \
            --test_output=errors \
            --build_tests_only \
            //cmd/ui/...

# Test Internal job: runs tests under internal/... (e.g. database client, helper libraries).
  # Depends on the Spanner Emulator service container.
  # Triggered when internal code changes, pkg changes, or api changes.
  test-internal:
    name: 'Test Internal'
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      needs.detect-changes.outputs.internal == 'true' ||
      needs.detect-changes.outputs.pkg == 'true' ||
      needs.detect-changes.outputs.api == 'true'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 30
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator
        ports:
          - 9010:9010
          - 9020:9020
    env:
      TEST_TIMEOUT_SECONDS: 60
      SPANNER_CHECK_TIMEOUT: 15
      SPANNER_EMULATOR_HOST: 127.0.0.1:9010
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'
      - name: 'Setup environment'
        uses: './.github/actions/setup-bazel-go'
        with:
          cache-key-prefix: 'bazel-internal'
      - name: 'Verify Spanner Emulator Endpoint'
        run: ./scripts/verify-spanner.sh
      - name: 'Run Internal Unit Tests'
        run: |
          bazel test \
            --repository_cache=~/.cache/bazel-repo \
            --disk_cache=~/.cache/bazel-disk \
            --test_output=errors \
            --build_tests_only \
            --test_timeout=${{ env.TEST_TIMEOUT_SECONDS }},300,300,300 \
            //internal/...

# Test Cmd Backend job: runs backend commands unit tests (actuator, reconciler, etc.).
  # Depends on Spanner Emulator since some backend commands use database functions.
  # Triggered if internal/pkg/api change (impacts all commands) or if a specific cmd directory changes.
  test-cmd-backend:
    name: 'Test Cmd Backend'
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      needs.detect-changes.outputs.internal == 'true' ||
      needs.detect-changes.outputs.pkg == 'true' ||
      needs.detect-changes.outputs.api == 'true' ||
      needs.detect-changes.outputs.actuator == 'true' ||
      needs.detect-changes.outputs.experiment_state_server == 'true' ||
      needs.detect-changes.outputs.log_monitor == 'true' ||
      needs.detect-changes.outputs.reconciler == 'true' ||
      needs.detect-changes.outputs.xid_service == 'true'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 35
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator
        ports:
          - 9010:9010
          - 9020:9020
    env:
      TEST_TIMEOUT_SECONDS: 60
      SPANNER_CHECK_TIMEOUT: 15
      SPANNER_EMULATOR_HOST: 127.0.0.1:9010
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'
      - name: 'Setup environment'
        uses: './.github/actions/setup-bazel-go'
        with:
          cache-key-prefix: 'bazel-cmd'
      - name: 'Verify Spanner Emulator Endpoint'
        run: ./scripts/verify-spanner.sh
      - name: 'Run Backend Cmd Unit Tests'
        run: |
          TARGETS=()
          # If a core backend component (internal/pkg/api) changed, or manual/merge runs, run ALL backend command tests.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "merge_group" || "${{ needs.detect-changes.outputs.api }}" == "true" || "${{ needs.detect-changes.outputs.internal }}" == "true" || "${{ needs.detect-changes.outputs.pkg }}" == "true" ]]; then
            TARGETS+=("//cmd/actuator/..." "//cmd/experiment_state_server/..." "//cmd/log_monitor/..." "//cmd/reconciler/..." "//cmd/xid_service/...")
          else
            # Otherwise, run tests only for the specific command folders that changed.
            if [[ "${{ needs.detect-changes.outputs.actuator }}" == "true" ]]; then TARGETS+=("//cmd/actuator/..."); fi
            if [[ "${{ needs.detect-changes.outputs.experiment_state_server }}" == "true" ]]; then TARGETS+=("//cmd/experiment_state_server/..."); fi
            if [[ "${{ needs.detect-changes.outputs.log_monitor }}" == "true" ]]; then TARGETS+=("//cmd/log_monitor/..."); fi
            if [[ "${{ needs.detect-changes.outputs.reconciler }}" == "true" ]]; then TARGETS+=("//cmd/reconciler/..."); fi
            if [[ "${{ needs.detect-changes.outputs.xid_service }}" == "true" ]]; then TARGETS+=("//cmd/xid_service/..."); fi
          fi
          
          if [ ${#TARGETS[@]} -eq 0 ]; then
            echo "No targets matched."
            exit 0
          fi
          
          bazel test \
            --repository_cache=~/.cache/bazel-repo \
            --disk_cache=~/.cache/bazel-disk \
            --test_output=errors \
            --build_tests_only \
            --test_timeout=${{ env.TEST_TIMEOUT_SECONDS }},300,300,300 \
            -- \
            "${TARGETS[@]}"

  test-pkg:
    name: 'Test Pkg'
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      needs.detect-changes.outputs.pkg == 'true' ||
      needs.detect-changes.outputs.api == 'true'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 15
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'
      - name: 'Setup environment'
        uses: './.github/actions/setup-bazel-go'
        with:
          cache-key-prefix: 'bazel-pkg'
      - name: 'Run Pkg Unit Tests'
        run: |
          bazel test \
            --repository_cache=~/.cache/bazel-repo \
            --disk_cache=~/.cache/bazel-disk \
            --test_output=errors \
            --build_tests_only \
            //pkg/...

  test-tools:
    name: 'Test Tools'
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      needs.detect-changes.outputs.tools == 'true' ||
      needs.detect-changes.outputs.api == 'true'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 15
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'
      - name: 'Setup environment'
        uses: './.github/actions/setup-bazel-go'
        with:
          cache-key-prefix: 'bazel-tools'
      - name: 'Run Tools Unit Tests'
        run: |
          bazel test \
            --repository_cache=~/.cache/bazel-repo \
            --disk_cache=~/.cache/bazel-disk \
            --test_output=errors \
            --build_tests_only \
            //tools/...

# Gating Job: This job acts as a final collector to satisfy required status checks.
  # Since branch protection requires "Run Unit Tests" check to pass, this job is named accordingly.
  # It will run always, but fails if any of the test jobs failed.
  run-tests:
    name: 'Run Unit Tests'
    needs: [detect-changes, test-ui, test-internal, test-cmd-backend, test-pkg, test-tools]
    if: always()
    runs-on: 'ubuntu-24.04'
    steps:
      - name: Check test results
        run: |
          RESULTS=(
            "${{ needs.detect-changes.result }}"
            "${{ needs.test-ui.result }}"
            "${{ needs.test-internal.result }}"
            "${{ needs.test-cmd-backend.result }}"
            "${{ needs.test-pkg.result }}"
            "${{ needs.test-tools.result }}"
          )
          
          for res in "${RESULTS[@]}"; do
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "CRITICAL: One or more test jobs failed or was cancelled."
              exit 1
            fi
          done
          
          echo "All active test jobs completed successfully."

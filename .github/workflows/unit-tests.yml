name: 'XMC Unit Tests'

on:
  pull_request:
  push:
    branches:
      - main
      - feature/unit_tests_action
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-scope:
    name: 'Resolve Test Scope & Targets'
    runs-on: 'arc-runner-set'
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      run_backend: ${{ steps.scope.outputs.run_backend }}
      run_ui: ${{ steps.scope.outputs.run_ui }}
      backend_mode: ${{ steps.scope.outputs.backend_mode }}
      bazel_targets: ${{ steps.scope.outputs.bazel_targets }}
      reason: ${{ steps.scope.outputs.reason }}

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 'Resolve Test Scope'
        id: 'scope'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          BASE_REF="${PR_BASE_SHA:-origin/main}"
          python3 tools/resolve_test_scope.py \
            --base "${BASE_REF}" \
            --head "${GITHUB_SHA}" \
            --event "${EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --github-output "${GITHUB_OUTPUT}"

  run-backend-tests:
    name: 'Run Go & Backend Unit Tests'
    needs: resolve-scope
    if: needs.resolve-scope.outputs.run_backend == 'true'
    runs-on: 'arc-runner-set'
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    # Use a service container for the Spanner Emulator
    services:
      # zizmor: ignore[unpinned-images]
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:1.5.56
        ports:
          - 9010:9010
          - 9020:9020

    env:
      # We're overriding the test timeout to catch failures with Spanner faster
      TEST_TIMEOUT_SECONDS: 60
      SPANNER_CHECK_TIMEOUT: 15
      SPANNER_EMULATOR_HOST: 127.0.0.1:9010

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Start Async Disk Space Cleanup'
        run: |
          echo "=== Starting background cleanup of Android SDK & .NET ==="
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet &
          echo "CLEANUP_PID=$!" >> $GITHUB_ENV

      - name: 'Set up Bazel'
        uses: 'bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2' # v3.0.0

      - name: 'Restore Bazel Repository Cache'
        id: 'cache-bazel-repo-restore'
        uses: 'actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod') }}
          restore-keys: |
            bazel-repo-${{ runner.os }}-

      - name: 'Verify Spanner Emulator Endpoint'
        run: |
          echo "Verifying Spanner Emulator at ${SPANNER_EMULATOR_HOST}..."
          HOST=$(echo "${SPANNER_EMULATOR_HOST}" | cut -d: -f1)
          PORT=$(echo "${SPANNER_EMULATOR_HOST}" | cut -d: -f2)
          
          # Try connecting to the port
          for i in $(seq 1 "${SPANNER_CHECK_TIMEOUT}"); do
            if nc -z "$HOST" "$PORT" >/dev/null 2>&1 || timeout 1s bash -c "cat < /dev/null > /dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "Successfully connected to Spanner Emulator at ${SPANNER_EMULATOR_HOST}."
              exit 0
            fi
            echo "Waiting for Spanner Emulator to start (attempt $i/${SPANNER_CHECK_TIMEOUT})..."
            sleep 1
          done
          
          echo "CRITICAL: Spanner Emulator at ${SPANNER_EMULATOR_HOST} did not start within ${SPANNER_CHECK_TIMEOUT} seconds."
          exit 1

      - name: 'Wait for Disk Space Cleanup'
        run: |
          if [ -n "${CLEANUP_PID:-}" ]; then
            echo "Waiting for background cleanup (PID ${CLEANUP_PID}) to complete..."
            wait "${CLEANUP_PID}" || true
          fi
          echo "=== Available Disk Space Before Bazel Build ==="
          df -h /

      - name: 'Run Backend Unit Tests'
        env:
          TARGETS: ${{ needs.resolve-scope.outputs.bazel_targets }}
          REMOTE_UPLOAD: ${{ github.ref == 'refs/heads/main' }}
        run: |
          RUN_TARGETS="${TARGETS:-//... -//cmd/ui/...}"
          echo "Executing Bazel tests for targets: ${RUN_TARGETS} (remote_upload: ${REMOTE_UPLOAD})"
          bazel test \
            --config=ci \
            --remote_upload_local_results="${REMOTE_UPLOAD}" \
            --repository_cache=~/.cache/bazel-repo \
            --experimental_repository_cache_hardlinks \
            --test_output=errors \
            --experimental_ui_max_stdouterr_bytes=2097152 \
            --build_tests_only \
            --test_timeout="${TEST_TIMEOUT_SECONDS}",300,300,300 \
            -- \
            ${RUN_TARGETS}

      - name: 'Save Bazel Repository Cache'
        uses: 'actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
        # Only save repository cache on main branch pushes when external dependencies change.
        if: github.ref == 'refs/heads/main' && steps.cache-bazel-repo-restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod') }}

  run-ui-tests:
    name: 'Run Angular UI Unit Tests'
    needs: resolve-scope
    if: needs.resolve-scope.outputs.run_ui == 'true'
    runs-on: 'arc-runner-set'
    timeout-minutes: 15

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af' # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'cmd/ui/package-lock.json'

      - name: 'Install Node.js dependencies'
        run: npm ci --legacy-peer-deps
        working-directory: cmd/ui

      - name: 'Run Angular UI Unit Tests'
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
        working-directory: cmd/ui

  run-tests:
    name: 'Run Unit Tests'
    needs: [resolve-scope, run-backend-tests, run-ui-tests]
    runs-on: 'arc-runner-set'
    if: always()
    steps:
      - name: 'Verify All Unit Tests Passed'
        env:
          RESOLVE_RESULT: ${{ needs.resolve-scope.result }}
          BACKEND_RESULT: ${{ needs.run-backend-tests.result }}
          UI_RESULT: ${{ needs.run-ui-tests.result }}
          REASON: ${{ needs.resolve-scope.outputs.reason }}
        run: |
          echo "=== Unit Test Resolution & Status Summary ==="
          echo "Scope Resolution Result: ${RESOLVE_RESULT}"
          echo "Scope Reason:            ${REASON}"
          echo "Backend Tests Result:    ${BACKEND_RESULT}"
          echo "UI Tests Result:         ${UI_RESULT}"

          if [ "${RESOLVE_RESULT}" != "success" ]; then
            echo "ERROR: Test scope resolution job failed."
            exit 1
          fi

          if [ "${BACKEND_RESULT}" == "failure" ] || [ "${BACKEND_RESULT}" == "cancelled" ]; then
            echo "ERROR: Backend unit tests job failed or was cancelled."
            exit 1
          fi

          if [ "${UI_RESULT}" == "failure" ] || [ "${UI_RESULT}" == "cancelled" ]; then
            echo "ERROR: UI unit tests job failed or was cancelled."
            exit 1
          fi

          if [ "${BACKEND_RESULT}" == "skipped" ] && [ "${UI_RESULT}" == "skipped" ]; then
            echo "NOTICE: No code-related changes were found in this PR; unit test execution was safely skipped."
          elif [ "${BACKEND_RESULT}" == "skipped" ]; then
            echo "NOTICE: No backend code changes found; backend Go unit tests safely skipped."
          elif [ "${UI_RESULT}" == "skipped" ]; then
            echo "NOTICE: No UI code changes found; Angular UI unit tests safely skipped."
          else
            echo "All required unit test suites passed successfully."
          fi

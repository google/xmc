name: 'XMC Unit Tests'

on:
  pull_request:
  push:
    branches:
      - main
      - feature/unit_tests_action
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-backend-tests:
    name: 'Run Go & Backend Unit Tests'
    runs-on: 'arc-runner-set'
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    # Use a service container for the Spanner Emulator
    services:
      # zizmor: ignore[unpinned-images]
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:1.5.56
        ports:
          - 9010:9010
          - 9020:9020

    env:
      # We're overriding the test timeout to catch failures with Spanner faster
      TEST_TIMEOUT_SECONDS: 60
      SPANNER_CHECK_TIMEOUT: 15
      SPANNER_EMULATOR_HOST: 127.0.0.1:9010

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Start Async Disk Space Cleanup'
        run: |
          echo "=== Starting background cleanup of Android SDK & .NET ==="
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet &
          echo "CLEANUP_PID=$!" >> $GITHUB_ENV

      - name: 'Set up Go'
        uses: 'actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34' # v5.3.0
        with:
          go-version: '1.26.0'

      - name: 'Set up Bazel'
        uses: 'bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2' # v3.0.0

      - name: 'Restore Bazel Repository Cache'
        id: 'cache-bazel-repo-restore'
        uses: 'actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod') }}
          restore-keys: |
            bazel-repo-${{ runner.os }}-

      - name: 'Restore Bazel Disk Cache'
        id: 'cache-bazel-disk-restore'
        uses: 'actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-

      - name: 'Verify Spanner Emulator Endpoint'
        run: |
          echo "Verifying Spanner Emulator at ${SPANNER_EMULATOR_HOST}..."
          HOST=$(echo "${SPANNER_EMULATOR_HOST}" | cut -d: -f1)
          PORT=$(echo "${SPANNER_EMULATOR_HOST}" | cut -d: -f2)
          
          # Try connecting to the port
          for i in $(seq 1 "${SPANNER_CHECK_TIMEOUT}"); do
            if nc -z "$HOST" "$PORT" >/dev/null 2>&1 || timeout 1s bash -c "cat < /dev/null > /dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "Successfully connected to Spanner Emulator at ${SPANNER_EMULATOR_HOST}."
              exit 0
            fi
            echo "Waiting for Spanner Emulator to start (attempt $i/${SPANNER_CHECK_TIMEOUT})..."
            sleep 1
          done
          
          echo "CRITICAL: Spanner Emulator at ${SPANNER_EMULATOR_HOST} did not start within ${SPANNER_CHECK_TIMEOUT} seconds."
          exit 1

      - name: 'Wait for Disk Space Cleanup'
        run: |
          if [ -n "${CLEANUP_PID:-}" ]; then
            echo "Waiting for background cleanup (PID ${CLEANUP_PID}) to complete..."
            wait "${CLEANUP_PID}" || true
          fi
          echo "=== Available Disk Space Before Bazel Build ==="
          df -h /

      - name: 'Run Backend Unit Tests'
        run: |
          bazel test \
            --repository_cache=~/.cache/bazel-repo \
            --disk_cache=~/.cache/bazel-disk \
            --experimental_repository_cache_hardlinks \
            --test_output=errors \
            --experimental_ui_max_stdouterr_bytes=2097152 \
            --build_tests_only \
            --test_timeout="${TEST_TIMEOUT_SECONDS}",300,300,300 \
            -- \
            //... \
            -//cmd/ui/...

      - name: 'Prune Bazel Cache & Build Tree'
        if: always()
        run: |
          echo "=== Pruning Bazel cache and build tree ==="
          if [ -d ~/.cache/bazel-disk ]; then
            # Size-based pruning: Keep disk cache under 1.5GB so tar/compression remains fast,
            # while avoiding mtime/atime traps that delete valid restored cache entries.
            MAX_SIZE_MB=1500
            CURRENT_SIZE_MB=$(du -sm ~/.cache/bazel-disk | cut -f1)
            if [ "${CURRENT_SIZE_MB}" -gt "${MAX_SIZE_MB}" ]; then
              if [ -d ~/.cache/bazel-disk/ac ]; then
                echo "Bazel disk cache (${CURRENT_SIZE_MB}MB) exceeds limit (${MAX_SIZE_MB}MB). Pruning oldest files in ac/..."
                find ~/.cache/bazel-disk/ac -type f -printf '%T@ %p\0' | sort -z -n | head -z -n 1000 | cut -z -d' ' -f2- | xargs -0 -r rm -f || true
              fi
              find ~/.cache/bazel-disk -mindepth 1 -type d -empty -delete || true
            fi
          fi
          if [ -d ~/.cache/bazel-repo ]; then
            # Size-based pruning: Keep repository cache under 1GB so tar/compression remains fast.
            MAX_REPO_SIZE_MB=1000
            CURRENT_REPO_SIZE_MB=$(du -sm ~/.cache/bazel-repo | cut -f1)
            if [ "${CURRENT_REPO_SIZE_MB}" -gt "${MAX_REPO_SIZE_MB}" ]; then
              echo "Bazel repository cache (${CURRENT_REPO_SIZE_MB}MB) exceeds limit (${MAX_REPO_SIZE_MB}MB). Pruning oldest files..."
              find ~/.cache/bazel-repo -type f -printf '%T@ %p\0' | sort -z -n | head -z -n 500 | cut -z -d' ' -f2- | xargs -0 -r rm -f || true
              find ~/.cache/bazel-repo -mindepth 1 -type d -empty -delete || true
            fi
          fi
          bazel clean || true
          df -h

      - name: 'Save Bazel Repository Cache'
        uses: 'actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
        # Only save repository cache on main branch pushes when external dependencies change.
        if: github.ref == 'refs/heads/main' && steps.cache-bazel-repo-restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod') }}

      - name: 'Save Bazel Disk Cache'
        uses: 'actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
        # Only save disk cache on main branch pushes to eliminate redundant
        # tar/compress/upload overhead on PR branches that saturates self-hosted runners.
        if: github.ref == 'refs/heads/main' && steps.cache-bazel-disk-restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-${{ github.sha }}

  run-ui-tests:
    name: 'Run Angular UI Unit Tests'
    runs-on: 'arc-runner-set'
    timeout-minutes: 15

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af' # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'cmd/ui/package-lock.json'

      - name: 'Install Node.js dependencies'
        run: npm ci --legacy-peer-deps
        working-directory: cmd/ui

      - name: 'Run Angular UI Unit Tests'
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
        working-directory: cmd/ui

  run-tests:
    name: 'Run Unit Tests'
    needs: [run-backend-tests, run-ui-tests]
    runs-on: 'arc-runner-set'
    if: always()
    steps:
      - name: 'Verify All Unit Tests Passed'
        env:
          BACKEND_RESULT: ${{ needs.run-backend-tests.result }}
          UI_RESULT: ${{ needs.run-ui-tests.result }}
        run: |
          if [ "${BACKEND_RESULT}" != "success" ] || [ "${UI_RESULT}" != "success" ]; then
            echo "ERROR: One or more unit test suites failed."
            echo "Backend tests result: ${BACKEND_RESULT}"
            echo "UI tests result: ${UI_RESULT}"
            exit 1
          fi
          echo "All unit test suites passed successfully."

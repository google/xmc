name: 'XMC Unit Tests'

on:
  pull_request:
  merge_group:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-v2-${{ github.event.pull_request.number || github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  run-backend-tests:
    name: 'Run Go & Backend Unit Tests'
    runs-on: 'arc-runner-set'
    timeout-minutes: 30

    permissions:
      contents: read

    # Use a service container for the Spanner Emulator
    services:
      # zizmor: ignore[unpinned-images]
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:1.5.56
        ports:
          - 9010:9010
          - 9020:9020

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 'Run Backend Unit Tests'
        uses: './.github/actions/run-backend-tests'

  run-ui-tests:
    name: 'Run Angular UI Unit Tests'
    runs-on: 'arc-runner-set'
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 'Run Angular UI Unit Tests'
        uses: './.github/actions/run-ui-tests'

  run-chart-tests:
    name: 'Run Helm Chart Configuration Tests'
    runs-on: 'arc-runner-set'
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 'Run Helm Chart Configuration Tests'
        uses: './.github/actions/run-chart-tests'

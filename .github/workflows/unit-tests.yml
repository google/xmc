name: 'XMC Unit Tests'

on:
  pull_request:
  push:
    branches:
      - main
      - feature/unit_tests_action
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  run-tests:
    name: 'Run Unit Tests'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 30

    # Use a service container for the Spanner Emulator
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator
        ports:
          - 9010:9010
          - 9020:9020

    env:
      # We're overriding the test timeout to catch failures with Spanner faster
      TEST_TIMEOUT_SECONDS: 60
      SPANNER_CHECK_TIMEOUT: 15
      SPANNER_EMULATOR_HOST: 127.0.0.1:9010

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Set up Go'
        uses: 'actions/setup-go@v5'
        with:
          go-version: '1.26.0'

      - name: 'Set up Bazel'
        uses: 'bazelbuild/setup-bazelisk@v3'

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'cmd/ui/package-lock.json'

      - name: 'Install Node.js dependencies'
        run: npm ci --legacy-peer-deps
        working-directory: cmd/ui

      - name: 'Restore Bazel Cache'
        id: 'cache-bazel-restore'
        uses: 'actions/cache/restore@v4'
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod', 'BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: 'Verify Spanner Emulator Endpoint'
        run: |
          echo "Verifying Spanner Emulator at ${{ env.SPANNER_EMULATOR_HOST }}..."
          HOST=$(echo "${{ env.SPANNER_EMULATOR_HOST }}" | cut -d: -f1)
          PORT=$(echo "${{ env.SPANNER_EMULATOR_HOST }}" | cut -d: -f2)
          
          # Try connecting to the port
          for i in {1..${{ env.SPANNER_CHECK_TIMEOUT }}}; do
            if nc -z "$HOST" "$PORT" >/dev/null 2>&1 || timeout 1s bash -c "cat < /dev/null > /dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "Successfully connected to Spanner Emulator at ${{ env.SPANNER_EMULATOR_HOST }}."
              exit 0
            fi
            echo "Waiting for Spanner Emulator to start (attempt $i/15)..."
            sleep 1
          done
          
          echo "CRITICAL: Spanner Emulator at ${{ env.SPANNER_EMULATOR_HOST }} did not start within ${{ env.SPANNER_CHECK_TIMEOUT }} seconds."
          exit 1

      - name: 'Run Unit Tests with Coverage'
        run: |
          bazel coverage \
            --repository_cache=~/.cache/bazel-repo \
            --disk_cache=~/.cache/bazel-disk \
            --test_output=errors \
            --build_tests_only \
            --test_timeout=${{ env.TEST_TIMEOUT_SECONDS }},300,300,300 \
            --combined_report=lcov \
            -- \
            //...

      - name: 'Enforce Coverage Thresholds'
        # Skip this step if the PR has the 'bypass:coverage' label
        if: ${{ success() && !contains(github.event.pull_request.labels.*.name, 'bypass:coverage') }}
        run: |
          echo "=== Checking Coverage Thresholds ==="
          
          # 1. Check Go Coverage
          GO_LCOV="bazel-out/_coverage/_coverage_report.dat"
          if [ -f "$GO_LCOV" ]; then
            echo "Go Coverage Report found."
            lines_hit=$(grep -E '^LH:' "$GO_LCOV" | awk -F: '{sum+=$2} END {print sum}')
            lines_found=$(grep -E '^LF:' "$GO_LCOV" | awk -F: '{sum+=$2} END {print sum}')
            if [ "$lines_found" -gt 0 ]; then
              go_cov=$(awk -v hit="$lines_hit" -v found="$lines_found" 'BEGIN {printf "%.2f", (hit/found)*100}')
              echo "Go Coverage: $go_cov%"
              is_below=$(awk -v cov="$go_cov" 'BEGIN {print (cov < 80.0) ? 1 : 0}')
              if [ "$is_below" -eq 1 ]; then
                echo "❌ ERROR: Go coverage ($go_cov%) is below the 80% threshold."
                exit 1
              fi
            else
              echo "⚠️ WARNING: No lines found in Go coverage report."
            fi
          else
            echo "⚠️ WARNING: Go coverage report not found at $GO_LCOV"
          fi
          
          # 2. Check UI (TypeScript) Coverage
          UI_LCOV="cmd/ui/coverage/xmc-ui/lcov.info"
          if [ -f "$UI_LCOV" ]; then
            echo "UI Coverage Report found."
            lines_hit=$(grep -E '^LH:' "$UI_LCOV" | awk -F: '{sum+=$2} END {print sum}')
            lines_found=$(grep -E '^LF:' "$UI_LCOV" | awk -F: '{sum+=$2} END {print sum}')
            if [ "$lines_found" -gt 0 ]; then
              ui_cov=$(awk -v hit="$lines_hit" -v found="$lines_found" 'BEGIN {printf "%.2f", (hit/found)*100}')
              echo "UI Coverage: $ui_cov%"
              is_below=$(awk -v cov="$ui_cov" 'BEGIN {print (cov < 80.0) ? 1 : 0}')
              if [ "$is_below" -eq 1 ]; then
                echo "❌ ERROR: UI coverage ($ui_cov%) is below the 80% threshold."
                exit 1
              fi
            else
              echo "⚠️ WARNING: No lines found in UI coverage report."
            fi
          else
            echo "⚠️ WARNING: UI coverage report not found at $UI_LCOV"
          fi
          
          echo "✅ All coverage thresholds passed!"

      - name: 'Save Bazel Cache'
        uses: 'actions/cache/save@v4'
        if: always()
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod', 'BUILD.bazel') }}

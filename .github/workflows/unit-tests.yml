name: 'XMC Unit Tests'

on:
  pull_request:
  push:
    branches:
      - feature/unit_tests_action
      - test
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  run-tests:
    name: 'Run Unit Tests'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 30
    environment: janzak-dev-test

    # Use a service container for the Spanner Emulator
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator
        ports:
          - 9010:9010
          - 9020:9020

    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ vars.SERVICE_ACCOUNT }}
      SPANNER_EMULATOR_HOST: localhost:9010
      # We're overriding the test timeout to catch failures with Spanner faster
      TEST_TIMEOUT_SECONDS: 60
      SPANNER_CHECK_TIMEOUT: 15

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Set up Go'
        uses: 'actions/setup-go@v5'
        with:
          go-version: '1.26.0'

      - name: 'Set up Bazel'
        uses: 'bazelbuild/setup-bazelisk@v3'

      - name: 'Restore Bazel Cache'
        id: 'cache-bazel-restore'
        uses: 'actions/cache/restore@v4'
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod', 'BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}'
          create_credentials_file: true

      - name: 'Verify Spanner Emulator Endpoint'
        run: |
          echo "Verifying Spanner Emulator at ${{ env.SPANNER_EMULATOR_HOST }}..."
          HOST=$(echo "${{ env.SPANNER_EMULATOR_HOST }}" | cut -d: -f1)
          PORT=$(echo "${{ env.SPANNER_EMULATOR_HOST }}" | cut -d: -f2)
          
          # Try connecting to the port
          for i in {1..${{ env.SPANNER_CHECK_TIMEOUT }}}; do
            if nc -z "$HOST" "$PORT" >/dev/null 2>&1 || timeout 1s bash -c "cat < /dev/null > /dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "Successfully connected to Spanner Emulator at ${{ env.SPANNER_EMULATOR_HOST }}."
              exit 0
            fi
            echo "Waiting for Spanner Emulator to start (attempt $i/15)..."
            sleep 1
          done
          
          echo "CRITICAL: Spanner Emulator at ${{ env.SPANNER_EMULATOR_HOST }} did not start within ${{ env.SPANNER_CHECK_TIMEOUT }} seconds."
          exit 1

      - name: 'Run Unit Tests'
        run: |
          # TODO: add the following tests back once they are green:
          # //cmd/experiment_state_server/server:server_test
          # //cmd/xid_service/server:server_test
          # //internal/storage/spanner:spanner_test
          # //internal/storage/spanner/migrations:migrations_test
          # //internal/storage/spanner/migrations/driver:driver_test

          bazel test \
            --repository_cache=~/.cache/bazel-repo \
            --disk_cache=~/.cache/bazel-disk \
            --test_output=errors \
            --build_tests_only \
            --remote_build_event_upload=all \
            --bes_backend="grpcs://buildeventservice.googleapis.com" \
            --bes_results_url="https://source.cloud.google.com/results/invocations" \
            --bes_instance_name="${{ env.PROJECT_ID }}" \
            --google_auth_scopes="https://www.googleapis.com/auth/cloud-platform" \
            --bes_header="x-goog-user-project=${{ env.PROJECT_ID }}" \
            --test_timeout=${{ env.TEST_TIMEOUT_SECONDS }},${{ env.TEST_TIMEOUT_SECONDS }},${{ env.TEST_TIMEOUT_SECONDS }},${{ env.TEST_TIMEOUT_SECONDS }} \
            --google_default_credentials \
            //... \
            -//cmd/experiment_state_server/server:server_test \
            -//cmd/xid_service/server:server_test \
            -//internal/storage/spanner:spanner_test \
            -//internal/storage/spanner/migrations:migrations_test \
            -//internal/storage/spanner/migrations/driver:driver_test

      - name: 'Save Bazel Cache'
        uses: 'actions/cache/save@v4'
        if: always()
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod', 'BUILD.bazel') }}

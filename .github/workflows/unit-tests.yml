name: 'XMC Unit Tests'

on:
  pull_request:
  push:
    branches:
      - main
      - feature/unit_tests_action
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  run-backend-tests:
    name: 'Run Go & Backend Unit Tests'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 30

    # Use a service container for the Spanner Emulator
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator
        ports:
          - 9010:9010
          - 9020:9020

    env:
      # We're overriding the test timeout to catch failures with Spanner faster
      TEST_TIMEOUT_SECONDS: 60
      SPANNER_CHECK_TIMEOUT: 15
      SPANNER_EMULATOR_HOST: 127.0.0.1:9010

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Set up Go'
        uses: 'actions/setup-go@v5'
        with:
          go-version: '1.26.0'

      - name: 'Set up Bazel'
        uses: 'bazelbuild/setup-bazelisk@v3'

      - name: 'Restore Bazel Cache'
        id: 'cache-bazel-restore'
        uses: 'actions/cache/restore@v4'
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod', 'BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: 'Verify Spanner Emulator Endpoint'
        run: |
          echo "Verifying Spanner Emulator at ${{ env.SPANNER_EMULATOR_HOST }}..."
          HOST=$(echo "${{ env.SPANNER_EMULATOR_HOST }}" | cut -d: -f1)
          PORT=$(echo "${{ env.SPANNER_EMULATOR_HOST }}" | cut -d: -f2)
          
          # Try connecting to the port
          for i in {1..${{ env.SPANNER_CHECK_TIMEOUT }}}; do
            if nc -z "$HOST" "$PORT" >/dev/null 2>&1 || timeout 1s bash -c "cat < /dev/null > /dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "Successfully connected to Spanner Emulator at ${{ env.SPANNER_EMULATOR_HOST }}."
              exit 0
            fi
            echo "Waiting for Spanner Emulator to start (attempt $i/15)..."
            sleep 1
          done
          
          echo "CRITICAL: Spanner Emulator at ${{ env.SPANNER_EMULATOR_HOST }} did not start within ${{ env.SPANNER_CHECK_TIMEOUT }} seconds."
          exit 1

      - name: 'Run Backend Unit Tests'
        run: |
          bazel test \
            --repository_cache=~/.cache/bazel-repo \
            --disk_cache=~/.cache/bazel-disk \
            --experimental_repository_cache_hardlinks \
            --test_output=errors \
            --build_tests_only \
            --test_timeout=${{ env.TEST_TIMEOUT_SECONDS }},300,300,300 \
            -- \
            //... \
            -//cmd/ui:ui_unit_tests

      - name: 'Prune Bazel Cache & Build Tree'
        if: always()
        run: |
          echo "=== Pruning Bazel cache and build tree ==="
          if [ -d ~/.cache/bazel-disk ]; then
            find ~/.cache/bazel-disk -type f -atime +3 -delete || true
            find ~/.cache/bazel-disk -type d -empty -delete || true
          fi
          bazel clean || true
          df -h

      - name: 'Save Bazel Cache'
        uses: 'actions/cache/save@v4'
        if: always()
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod', 'BUILD.bazel') }}

  run-ui-tests:
    name: 'Run Angular UI Unit Tests'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 15

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'cmd/ui/package-lock.json'

      - name: 'Install Node.js dependencies'
        run: npm ci --legacy-peer-deps
        working-directory: cmd/ui

      - name: 'Run Angular UI Unit Tests'
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
        working-directory: cmd/ui

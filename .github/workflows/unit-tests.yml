name: 'XMC Unit Tests'

on:
  pull_request:
  push:
    branches:
      - main
      - feature/unit_tests_action
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  run-backend-tests:
    name: 'Run Go & Backend Unit Tests'
    runs-on: 'arc-runner-set'
    timeout-minutes: 30

    # Use a service container for the Spanner Emulator
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator
        ports:
          - 9010:9010
          - 9020:9020

    env:
      # We're overriding the test timeout to catch failures with Spanner faster
      TEST_TIMEOUT_SECONDS: 60
      SPANNER_CHECK_TIMEOUT: 15
      SPANNER_EMULATOR_HOST: 127.0.0.1:9010

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Start Async Disk Space Cleanup'
        run: |
          echo "=== Starting background cleanup of Android SDK & .NET ==="
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet &
          echo "CLEANUP_PID=$!" >> $GITHUB_ENV

      - name: 'Set up Go'
        uses: 'actions/setup-go@v5'
        with:
          go-version: '1.26.0'

      - name: 'Set up Bazel'
        uses: 'bazelbuild/setup-bazelisk@v3'

      - name: 'Restore Bazel Cache'
        id: 'cache-bazel-restore'
        uses: 'actions/cache/restore@v4'
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod', 'BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: 'Verify Spanner Emulator Endpoint'
        run: |
          echo "Verifying Spanner Emulator at ${{ env.SPANNER_EMULATOR_HOST }}..."
          HOST=$(echo "${{ env.SPANNER_EMULATOR_HOST }}" | cut -d: -f1)
          PORT=$(echo "${{ env.SPANNER_EMULATOR_HOST }}" | cut -d: -f2)
          
          # Try connecting to the port
          for i in $(seq 1 ${{ env.SPANNER_CHECK_TIMEOUT }}); do
            if nc -z "$HOST" "$PORT" >/dev/null 2>&1 || timeout 1s bash -c "cat < /dev/null > /dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "Successfully connected to Spanner Emulator at ${{ env.SPANNER_EMULATOR_HOST }}."
              exit 0
            fi
            echo "Waiting for Spanner Emulator to start (attempt $i/${{ env.SPANNER_CHECK_TIMEOUT }})..."
            sleep 1
          done
          
          echo "CRITICAL: Spanner Emulator at ${{ env.SPANNER_EMULATOR_HOST }} did not start within ${{ env.SPANNER_CHECK_TIMEOUT }} seconds."
          exit 1

      - name: 'Wait for Disk Space Cleanup'
        run: |
          if [ -n "${CLEANUP_PID:-}" ]; then
            echo "Waiting for background cleanup (PID ${CLEANUP_PID}) to complete..."
            wait "${CLEANUP_PID}" || true
          fi
          echo "=== Available Disk Space Before Bazel Build ==="
          df -h /

      - name: 'Run Backend Unit Tests'
        run: |
          bazel test \
            --repository_cache=~/.cache/bazel-repo \
            --disk_cache=~/.cache/bazel-disk \
            --experimental_repository_cache_hardlinks \
            --test_output=errors \
            --experimental_ui_max_stdouterr_bytes=2097152 \
            --build_tests_only \
            --test_timeout=${{ env.TEST_TIMEOUT_SECONDS }},300,300,300 \
            -- \
            //... \
            -//cmd/ui/...

      - name: 'Prune Bazel Cache & Build Tree'
        if: always()
        run: |
          echo "=== Pruning Bazel cache and build tree ==="
          if [ -d ~/.cache/bazel-disk ]; then
            # Size-based pruning: Keep disk cache under 3GB so tar/compression remains fast,
            # while avoiding mtime/atime traps that delete valid restored cache entries.
            MAX_SIZE_MB=3000
            CURRENT_SIZE_MB=$(du -sm ~/.cache/bazel-disk | cut -f1)
            if [ "${CURRENT_SIZE_MB}" -gt "${MAX_SIZE_MB}" ]; then
              echo "Bazel disk cache (${CURRENT_SIZE_MB}MB) exceeds limit (${MAX_SIZE_MB}MB). Pruning oldest files..."
              find ~/.cache/bazel-disk -type f -printf '%T@ %p\n' | sort -n | head -n 1000 | cut -d' ' -f2- | xargs rm -f || true
              find ~/.cache/bazel-disk -type d -empty -delete || true
            fi
          fi
          bazel clean || true
          df -h

      - name: 'Save Bazel Cache'
        uses: 'actions/cache/save@v4'
        # Only save cache on main branch pushes when exact cache key was missed to eliminate redundant
        # tar/compress/upload overhead on PR branches that saturates self-hosted runners.
        if: github.ref == 'refs/heads/main' && steps.cache-bazel-restore.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'MODULE.bazel', 'go.mod', 'BUILD.bazel') }}

  run-ui-tests:
    name: 'Run Angular UI Unit Tests'
    runs-on: 'arc-runner-set'
    timeout-minutes: 15

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'cmd/ui/package-lock.json'

      - name: 'Install Node.js dependencies'
        run: npm ci --legacy-peer-deps
        working-directory: cmd/ui

      - name: 'Run Angular UI Unit Tests'
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
        working-directory: cmd/ui

  run-tests:
    name: 'Run Unit Tests'
    needs: [run-backend-tests, run-ui-tests]
    runs-on: 'arc-runner-set'
    if: always()
    steps:
      - name: 'Verify All Unit Tests Passed'
        run: |
          if [ "${{ needs.run-backend-tests.result }}" != "success" ] || [ "${{ needs.run-ui-tests.result }}" != "success" ]; then
            echo "ERROR: One or more unit test jobs failed."
            echo "Backend tests result: ${{ needs.run-backend-tests.result }}"
            echo "UI tests result: ${{ needs.run-ui-tests.result }}"
            exit 1
          fi
          echo "All unit test suites passed successfully."

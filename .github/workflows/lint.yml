name: 'Code Quality & Linting'

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-v2-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: 'Code Quality & Linting'
    runs-on: 'arc-runner-set'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 'Check Changed Paths'
        uses: 'dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36' # v3.0.2
        id: 'changes'
        with:
          filters: |
            terraform:
              - 'deploy/**/*.tf'
              - 'deploy/**/*.tfvars'
              - '.github/workflows/lint.yml'
            ui:
              - 'cmd/ui/**'
              - '.github/workflows/lint.yml'

      # 1. Python Linting (Ruff)
      - name: 'Install Ruff'
        run: |
          if ! command -v ruff &>/dev/null; then
            pip install --no-cache-dir ruff
          fi

      - name: 'Run Ruff Lint Check'
        run: ruff check .

      - name: 'Verify Code Formatting (Ruff)'
        run: ruff format --check .

      # 2. Go Linting & Formatting (gofmt, golangci-lint, buildifier, addlicense)
      - name: 'Set up Go'
        uses: 'actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34' # v5.3.0
        with:
          go-version: '1.26.0'
          cache: false

      - name: 'Verify Go Formatting (gofmt)'
        run: |
          UNFORMATTED=$(gofmt -s -l . 2>/dev/null | grep -v 'vendor/' || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted properly:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: 'Install & Run golangci-lint'
        run: |
          if ! command -v golangci-lint &>/dev/null; then
            GOPATH_BIN="$(go env GOPATH)/bin"
            echo "--> Installing golangci-lint (v1.64.6)..."
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.6
            "$GOPATH_BIN/golangci-lint" run --timeout=5m
          else
            golangci-lint run --timeout=5m
          fi

      - name: 'Install & Run Buildifier'
        run: |
          if ! command -v buildifier &>/dev/null; then
            GOPATH_BIN="$(go env GOPATH)/bin"
            echo "--> Downloading buildifier (v8.0.3)..."
            curl -sSfL https://github.com/bazelbuild/buildtools/releases/download/v8.0.3/buildifier-linux-amd64 -o "$GOPATH_BIN/buildifier"
            chmod +x "$GOPATH_BIN/buildifier"
            BUILDIFIER="$GOPATH_BIN/buildifier"
          else
            BUILDIFIER="buildifier"
          fi
          BAZEL_FILES=$(find . -type f \( -name "BUILD" -o -name "BUILD.bazel" -o -name "*.bzl" -o -name "WORKSPACE" -o -name "MODULE.bazel" \) -not -path "*/node_modules/*")
          if [ -n "$BAZEL_FILES" ]; then
            "$BUILDIFIER" -mode=check $BAZEL_FILES
          fi

      - name: 'Install & Run addlicense'
        run: |
          if ! command -v addlicense &>/dev/null; then
            GOPATH_BIN="$(go env GOPATH)/bin"
            echo "--> Downloading addlicense (v1.1.1)..."
            curl -sSfL https://github.com/google/addlicense/releases/download/v1.1.1/addlicense_1.1.1_Linux_x86_64.tar.gz | tar -xz -C "$GOPATH_BIN" addlicense
            chmod +x "$GOPATH_BIN/addlicense"
            ADDLICENSE="$GOPATH_BIN/addlicense"
          else
            ADDLICENSE="addlicense"
          fi
          "$ADDLICENSE" -check -c "Google LLC" -l apache \
            -ignore "third_party/**" \
            -ignore "**/third_party/**" \
            -ignore "**/node_modules/**" \
            -ignore "**/.angular/**" \
            -ignore "**.json" \
            -ignore "**.lock" \
            -ignore "pyproject.toml" \
            -ignore "package.json" \
            -ignore "go.mod" \
            -ignore "go.sum" \
            .

      # 3. UI Linting & Formatting (Prettier & ESLint)
      - name: 'Set up Node.js'
        if: steps.changes.outputs.ui == 'true'
        uses: 'actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af' # v4.1.0
        with:
          node-version: '22'

      - name: 'Install UI Dependencies'
        if: steps.changes.outputs.ui == 'true'
        run: npm ci --legacy-peer-deps
        working-directory: 'cmd/ui'

      - name: 'Run Prettier Check'
        if: steps.changes.outputs.ui == 'true'
        run: npm run format:check
        working-directory: 'cmd/ui'

      - name: 'Run ESLint'
        if: steps.changes.outputs.ui == 'true'
        run: npm run lint
        working-directory: 'cmd/ui'

      # 4. Terraform Formatting, Linting & Security (conditional on Terraform file changes)
      - name: 'Set up Terraform'
        if: steps.changes.outputs.terraform == 'true'
        uses: 'hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd' # v3.1.2
        with:
          terraform_version: '1.8.5'

      - name: 'Verify Terraform Formatting'
        if: steps.changes.outputs.terraform == 'true'
        run: 'terraform fmt -check -recursive deploy/'

      - name: 'Set up TFLint'
        if: steps.changes.outputs.terraform == 'true'
        run: |
          if ! command -v tflint &>/dev/null; then
            mkdir -p "${RUNNER_TEMP}/bin"
            curl -sSfL "https://github.com/terraform-linters/tflint/releases/download/v0.50.0/tflint_linux_amd64.zip" -o "${RUNNER_TEMP}/tflint.zip"
            unzip "${RUNNER_TEMP}/tflint.zip" -d "${RUNNER_TEMP}/bin"
            echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          fi

      - name: 'Init TFLint'
        if: steps.changes.outputs.terraform == 'true'
        run: 'tflint --init'

      - name: 'Run TFLint'
        if: steps.changes.outputs.terraform == 'true'
        run: 'tflint --recursive'

      # zizmor: ignore[impostor-commit]
      - name: 'Run Trivy IaC Scanner (deploy/ctk_v2/modules)'
        if: steps.changes.outputs.terraform == 'true'
        uses: 'aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25' # v0.36.0
        with:
          scan-type: 'config'
          hide-progress: true
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          scan-ref: 'deploy/ctk_v2/modules'

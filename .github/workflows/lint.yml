name: 'lint'

on:
  pull_request:
    types:
      - 'opened'
      - 'edited'
      - 'reopened'
      - 'synchronize'
      - 'ready_for_review'

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  go-lint:
    name: 'Go Lint'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'

      - name: 'Set up Go'
        uses: 'actions/setup-go@v5'
        with:
          go-version: '1.26.0'

      - name: 'Run golangci-lint'
        uses: 'golangci/golangci-lint-action@v6'
        with:
          version: 'latest'
          args: '--timeout=5m --out-format=github-actions'

  bazel-lint:
    name: 'Bazel Lint'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'

      - name: 'Set up Go for buildifier'
        uses: 'actions/setup-go@v5'
        with:
          go-version: '1.26.0'

      - name: 'Install buildifier & Run Check'
        run: |
          go install github.com/bazelbuild/buildtools/buildifier@latest
          ~/go/bin/buildifier -lint=warn -mode=check $(find . -type f \( -name "BUILD" -o -name "BUILD.bazel" -o -name "*.bzl" \))

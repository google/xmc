name: 'lint'

on:
  pull_request:
    types:
      - 'opened'
      - 'edited'
      - 'reopened'
      - 'synchronize'
      - 'ready_for_review'

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  go-lint:
    name: 'Go Lint'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'

      - name: 'Set up Go'
        uses: 'actions/setup-go@v5'
        with:
          go-version: '1.26.0'

      - name: 'Verify Canonical Formatting (gofmt)'
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Go code is not canonically formatted:"
            echo "$UNFORMATTED"
            echo "Please run 'gofmt -s -w .' locally before pushing."
            exit 1
          fi
          echo "✅ All Go files are canonically formatted!"

  bazel-lint:
    name: 'Bazel Lint'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'

      - name: 'Set up Go for buildifier'
        uses: 'actions/setup-go@v5'
        with:
          go-version: '1.26.0'

      - name: 'Install buildifier & Check Formatting'
        run: |
          go install github.com/bazelbuild/buildtools/buildifier@latest
          # Check canonical formatting (-mode=check) without failing on legacy macro warnings (-lint=off)
          ~/go/bin/buildifier -mode=check -lint=off -r .

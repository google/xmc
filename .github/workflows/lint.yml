name: 'Code Quality & Linting'

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-lint:
    name: 'PEP 8 Lint (Ruff)'
    runs-on: 'arc-runner-set'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@f4f845d82848f88190d180861e644d4367937d98' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Install Ruff'
        run: pip install --no-cache-dir ruff

      - name: 'Run Ruff Lint Check'
        run: ruff check .

      - name: 'Verify Code Formatting'
        run: ruff format --check .

  go-lint:
    name: 'Go Formatting (gofmt)'
    runs-on: 'arc-runner-set'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@f4f845d82848f88190d180861e644d4367937d98' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Set up Go'
        uses: 'actions/setup-go@f0447fa41893d56b0d9e2621bcfe830c23d061c0' # v5.3.0
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: 'Verify Go Formatting (gofmt)'
        run: |
          UNFORMATTED=$(gofmt -s -l . 2>/dev/null | grep -v 'vendor/' || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted properly:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: 'Cache golangci-lint binary'
        uses: 'actions/cache@576d296216a6d65451ec04265cc8f3434685ffcb' # v4.2.2
        with:
          path: |
            ~/.cache/golangci-lint
            ~/go/bin/golangci-lint
            ~/go/pkg/mod
          key: ${{ runner.os }}-golangci-lint-v1.64.6

      - name: 'Install & Run golangci-lint'
        run: |
          GOPATH_BIN="$(go env GOPATH)/bin"
          if [ ! -f "$GOPATH_BIN/golangci-lint" ]; then
            echo "--> Installing golangci-lint (v1.64.6)..."
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.6
          fi
          "$GOPATH_BIN/golangci-lint" run --timeout=5m

  bazel-lint:
    name: 'Bazel Linting (Buildifier)'
    runs-on: 'arc-runner-set'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@f4f845d82848f88190d180861e644d4367937d98' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Set up Go'
        uses: 'actions/setup-go@f0447fa41893d56b0d9e2621bcfe830c23d061c0' # v5.3.0
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: 'Install buildifier'
        run: go install github.com/bazelbuild/buildtools/buildifier@latest

      - name: 'Run Buildifier Check'
        run: |
          BAZEL_FILES=$(find . -type f \( -name "BUILD" -o -name "BUILD.bazel" -o -name "*.bzl" -o -name "WORKSPACE" -o -name "MODULE.bazel" \) -not -path "*/node_modules/*")
          if [ -n "$BAZEL_FILES" ]; then
            $(go env GOPATH)/bin/buildifier -mode=check $BAZEL_FILES
          fi

  ui-lint:
    name: 'UI Lint & Format (Prettier & ESLint)'
    runs-on: 'arc-runner-set'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@f4f845d82848f88190d180861e644d4367937d98' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@8f152de45cc393bb48ece5d22d3e42939be026dd' # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'cmd/ui/package-lock.json'

      - name: 'Install UI Dependencies'
        run: npm ci --legacy-peer-deps
        working-directory: 'cmd/ui'

      - name: 'Run Prettier Check'
        run: npm run format:check
        working-directory: 'cmd/ui'

      - name: 'Run ESLint'
        run: npm run lint
        working-directory: 'cmd/ui'

  license-check:
    name: 'License Headers (addlicense)'
    runs-on: 'arc-runner-set'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@f4f845d82848f88190d180861e644d4367937d98' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Set up Go'
        uses: 'actions/setup-go@v5'
        with:
          go-version: '1.26.0'

      - name: 'Install addlicense'
        run: go install github.com/google/addlicense@latest

      - name: 'Check License Headers'
        run: |
          $(go env GOPATH)/bin/addlicense -check -c "Google LLC" -l apache \
            -ignore "third_party/**" \
            -ignore "**/third_party/**" \
            -ignore "**/node_modules/**" \
            -ignore "**/.angular/**" \
            -ignore "**.json" \
            -ignore "**.lock" \
            -ignore "pyproject.toml" \
            -ignore "package.json" \
            -ignore "go.mod" \
            -ignore "go.sum" \
            .

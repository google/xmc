name: 'Code Quality & Linting'

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-lint:
    name: 'PEP 8 Lint (Ruff)'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'

      - name: 'Install Ruff'
        run: pip install --no-cache-dir ruff

      - name: 'Run Ruff Lint Check'
        run: ruff check .

      - name: 'Verify Code Formatting'
        run: ruff format --check .

  shell-lint:
    name: 'Shell Script Linting (ShellCheck)'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'

      - name: 'Install ShellCheck'
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi

      - name: 'Run ShellCheck'
        run: |
          SHELL_FILES=()
          while IFS= read -r -d '' file; do
            SHELL_FILES+=("$file")
          done < <(find . -type f \( -name "*.sh" -o -path "./.githooks/*" \) -not -path "*/node_modules/*" -not -path "*/.git/*" -print0 2>/dev/null)
          if [ ${#SHELL_FILES[@]} -gt 0 ]; then
            shellcheck "${SHELL_FILES[@]}"
          fi

  go-lint:
    name: 'Go Formatting (gofmt)'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'

      - name: 'Set up Go'
        uses: 'actions/setup-go@v5'
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: 'Verify Go Formatting (gofmt)'
        run: |
          UNFORMATTED=$(gofmt -s -l . 2>/dev/null | grep -v 'vendor/' || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted properly:"
            echo "$UNFORMATTED"
            exit 1
          fi

  bazel-lint:
    name: 'Bazel Linting (Buildifier)'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'

      - name: 'Set up Go'
        uses: 'actions/setup-go@v5'
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: 'Install buildifier'
        run: go install github.com/bazelbuild/buildtools/buildifier@latest

      - name: 'Run Buildifier Check'
        run: |
          BAZEL_FILES=()
          while IFS= read -r -d '' file; do
            BAZEL_FILES+=("$file")
          done < <(find . -type f \( -name "BUILD" -o -name "BUILD.bazel" -o -name "*.bzl" -o -name "WORKSPACE" -o -name "MODULE.bazel" \) -not -path "*/node_modules/*" -print0 2>/dev/null)
          if [ ${#BAZEL_FILES[@]} -gt 0 ]; then
            $(go env GOPATH)/bin/buildifier -mode=check "${BAZEL_FILES[@]}"
          fi

  ui-lint:
    name: 'UI Lint & Format (Prettier & ESLint)'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'cmd/ui/package-lock.json'

      - name: 'Install UI Dependencies'
        run: npm ci --legacy-peer-deps
        working-directory: 'cmd/ui'

      - name: 'Run Prettier Check'
        run: npm run format:check
        working-directory: 'cmd/ui'

      - name: 'Run ESLint'
        run: npm run lint
        working-directory: 'cmd/ui'

  license-check:
    name: 'License Headers (addlicense)'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'

      - name: 'Set up Go'
        uses: 'actions/setup-go@v5'
        with:
          go-version: '1.26.0'

      - name: 'Install addlicense'
        run: go install github.com/google/addlicense@latest

      - name: 'Check License Headers'
        run: |
          $(go env GOPATH)/bin/addlicense -check -c "Google LLC" -l apache \
            -ignore "third_party/**" \
            -ignore "**/third_party/**" \
            -ignore "**/node_modules/**" \
            -ignore "**/.angular/**" \
            -ignore "**.json" \
            -ignore "**.lock" \
            -ignore "**.toml" \
            -ignore "package.json" \
            -ignore "go.mod" \
            -ignore "go.sum" \
            .

  gitleaks-scan:
    name: 'Secret Scanning (Gitleaks)'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0

      - name: 'Run Gitleaks'
        uses: 'gitleaks/gitleaks-action@v2'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep-scan:
    name: 'Security Analysis (Semgrep)'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'
      - name: 'Run Semgrep'
        run: docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep:latest semgrep scan --config auto

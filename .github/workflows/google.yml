name: 'XMC GKE HelloWorld Deploy'

on:
  pull_request:
  push:
    branches:
      - test # Trigger on push to the 'test' branch
  workflow_dispatch:

jobs:
  deploy-helloworld:
    name: 'Build and Deploy HelloWorld'
    runs-on: 'ubuntu-24.04'
    environment: janzak-dev-test

    permissions:
      contents: 'read'
      id-token: 'write' # Required for WIF

    env:
      # TODO: split this into secrets and variables
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      GAR_LOCATION: ${{ vars.GAR_LOCATION }}
      GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
      GKE_LOCATION: ${{ vars.GKE_LOCATION }}
      DEPLOYMENT_NAME: ${{ vars.DEPLOYMENT_NAME }}
      REPOSITORY: ${{ vars.REPOSITORY }}
      IMAGE: ${{ vars.IMAGE }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ vars.SERVICE_ACCOUNT }}

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@71f986410dfbc4620f47732ae4b7720ebb07296b' # v2.1.8
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}' 

      - name: 'Docker Auth'
        uses: 'docker/login-action@9780b0c442fbbb118182fc601b37699ab51a89dd' # v3.3.0
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

      - name: 'Set up GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@d08c14912d6600c2a275e53e414c33ebae26d7c7' # v2.3.2
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          location: '${{ env.GKE_LOCATION }}'

      - name: 'Create Simple HelloWorld Dockerfile'
        run: |
          echo "FROM nginx:alpine" > Dockerfile
          echo "RUN echo '<h1>Hello World from XMC CI</h1>' > /usr/share/nginx/html/index.html" >> Dockerfile

      - name: 'Build and Push Docker container'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          DOCKER_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${COMMIT_SHA}"
          docker build -t "${DOCKER_IMAGE}" .
          docker push "${DOCKER_IMAGE}"

      - name: 'Deploy to GKE'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          DOCKER_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${COMMIT_SHA}"

          # Create a simple Deployment vice on the fly
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${DEPLOYMENT_NAME}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: helloworld
            template:
              metadata:
                labels:
                  app: helloworld
              spec:
                containers:
                - name: helloworld
                  image: $DOCKER_IMAGE
          EOF

          kubectl rollout status deployment/"${DEPLOYMENT_NAME}"
          kubectl get deployment "${DEPLOYMENT_NAME}"

name: 'XMC GKE HelloWorld Deploy'

on:
  pull_request:
  push:
    branches:
      - test # Trigger on push to the 'test' branch
  workflow_dispatch:

env:
  PROJECT_ID: 'xmc-test-project-2' 
  GAR_LOCATION: 'us-central1'
  GKE_CLUSTER: 'xmc-cluster-janzak'
  GKE_ZONE: 'us-central1'
  DEPLOYMENT_NAME: 'helloworld-test'
  REPOSITORY: 'samples'
  IMAGE: 'helloworld'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/70700744710/locations/global/workloadIdentityPools/github-pool/providers/github-provider'

jobs:
  deploy-helloworld:
    name: 'Build and Deploy HelloWorld'
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write' # Required for WIF

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: 'xmc-github-actions@${{ env.PROJECT_ID }}.iam.gserviceaccount.com' 

      - name: 'Docker Auth'
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

      - name: 'Set up GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v2'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          location: '${{ env.GKE_ZONE }}'

      - name: 'Create Simple HelloWorld Dockerfile'
        run: |
          echo "FROM nginx:alpine" > Dockerfile
          echo "RUN echo '<h1>Hello World from XMC CI</h1>' > /usr/share/nginx/html/index.html" >> Dockerfile

      - name: 'Build and Push Docker container'
        run: |
          DOCKER_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"
          docker build -t "${DOCKER_TAG}" .
          docker push "${DOCKER_TAG}"

      - name: 'Deploy to GKE'
        run: |
          DOCKER_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"

          # Create a simple Deployment and Service on the fly
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${{ env.DEPLOYMENT_NAME }}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: helloworld
            template:
              metadata:
                labels:
                  app: helloworld
              spec:
                containers:
                - name: helloworld
                  image: $DOCKER_TAG
                  ports:
                  - containerPort: 80
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${{ env.DEPLOYMENT_NAME }}-svc
          spec:
            type: LoadBalancer
            ports:
            - port: 80
              targetPort: 80
            selector:
              app: helloworld
          EOF

          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }}
          kubectl get service ${{ env.DEPLOYMENT_NAME }}-svc

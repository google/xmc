# Post-submit runs restore the Bazel disk cache, so unchanged tests report cached
# results instead of executing. This nightly run executes every unit test against
# main with --nocache_test_results (build outputs stay cached) so flaky or broken
# tests cannot hide behind a cached PASSED.
name: 'XMC Nightly Uncached Unit Tests'

on:
  schedule:
    # 2:00 AM UTC, between the nightly build (1:00) and the nightly examples E2E (4:00).
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-uncached-unit-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: 'Unit Tests (uncached)'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/unit-tests.yml
    with:
      cache-test-results: false

  report-nightly-failure:
    name: 'Report Failure & Alert OWNERS'
    runs-on: 'ubuntu-latest'
    needs: [unit-tests]
    if: always() && github.ref == 'refs/heads/main' && (needs.unit-tests.result == 'failure' || needs.unit-tests.result == 'cancelled')

    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Alert Repository OWNERS on GitHub Issue'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # v7.0.1
        env:
          ALERT_PROFILE: 'unit-tests'
          NEEDS_CONTEXT: ${{ toJson(needs) }}
          ABSENCE_LIST: ${{ vars.ABSENCE_LIST }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { run } = require('./.github/scripts/nightly-failure-alert.js');
            await run({ github, context, core });

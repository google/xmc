name: 'Go Vulnerability Check'

on:
  schedule:
    # Run daily at 06:00 UTC to catch newly disclosed Go stdlib and module CVEs.
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/govulncheck.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  govulncheck:
    name: 'govulncheck (MODULE.bazel Go SDK)'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Reclaim Unused Runner Disk Space'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: 'Set up Bazel'
        uses: 'bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2' # v3.0.0

      - name: 'Restore Bazel Repository Cache'
        uses: 'actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'go.mod', 'go.sum') }}
          restore-keys: |
            bazel-repo-${{ runner.os }}-

      - name: 'Configure Bazel Repository Cache'
        run: |
          mkdir -p "${HOME}/.cache/bazel-repo"
          echo "common --repository_cache=${HOME}/.cache/bazel-repo" >> ~/.bazelrc

      - name: 'Extract Bazel Go SDK version'
        id: 'go-version'
        run: |
          GO_VERSION=$(sed -n 's/^go_sdk\.download(version = "\([^"]*\)")$/\1/p' MODULE.bazel | head -n 1)
          if [ -z "${GO_VERSION}" ]; then
            echo "ERROR: Could not extract go_sdk.download version from MODULE.bazel" >&2
            exit 1
          fi
          echo "Detected Bazel Go SDK version: ${GO_VERSION}"
          echo "version=${GO_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: 'Set up Go'
        uses: 'actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34' # v5.3.0
        with:
          go-version: '${{ steps.go-version.outputs.version }}'
          cache: false

      - name: 'Install govulncheck'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: 'Build and scan production Go binaries'
        run: |
          TARGETS_OUT=$(bazel query 'kind("go_binary", //cmd/...) except attr(name, "_dev$", kind("go_binary", //cmd/...))')
          if [ -z "${TARGETS_OUT}" ]; then
            echo "ERROR: No production Go binary targets found under //cmd/..." >&2
            exit 1
          fi
          mapfile -t TARGETS <<< "${TARGETS_OUT}"
          printf 'Building targets:\n%s\n' "${TARGETS[@]}"
          bazel build "${TARGETS[@]}"

          failed=0
          for target in "${TARGETS[@]}"; do
            bin=$(bazel cquery --output=files "${target}")
            if [ -z "${bin}" ] || [ ! -f "${bin}" ]; then
              echo "ERROR: Missing built binary for ${target}: '${bin}'" >&2
              failed=1
              continue
            fi
            echo "=== Scanning ${target} (${bin}) ==="
            govulncheck -mode=binary "${bin}" || failed=1
          done
          exit "${failed}"

name: 'Auto Approve Absence Updates'

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'ABSENCE.md'

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-approve-absence:
    name: 'Auto Approve ABSENCE.md Updates by Code Owners'
    runs-on: 'arc-runner-set'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'

      - name: 'Validate PR changes and PR author'
        uses: 'actions/github-script@v7'
        with:
          script: |
            const { run } = require('./.github/scripts/auto-approve-absence.js');
            await run({ github, context, core });

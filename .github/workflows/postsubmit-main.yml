name: 'XMC Post-Submit Main Pipeline'

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: post-submit-main-${{ github.ref }}
  # Do not cancel in-progress runs on main to preserve full commit test history
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit-tests:
    name: 'Unit Tests'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/unit-tests.yml

  e2e-tests:
    name: 'KinD & Playwright Headless E2E'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-tests.yml
    secrets:
      GCP_E2E_PROJECT_ID: ${{ secrets.GCP_E2E_PROJECT_ID }}
      GCP_E2E_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_E2E_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_E2E_SERVICE_ACCOUNT: ${{ secrets.GCP_E2E_SERVICE_ACCOUNT }}
      GCP_E2E_SPANNER_INSTANCE: ${{ secrets.GCP_E2E_SPANNER_INSTANCE }}

  report-results:
    name: 'Aggregate Results & Report Failure'
    runs-on: 'ubuntu-latest'
    needs: [unit-tests, e2e-tests]
    if: always() && !cancelled()

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Evaluate Job Matrix and Comment on PR'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # v7.0.1
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { run } = require('./.github/scripts/postsubmit-main.js');
            await run({ github, context, core });


name: 'Block Feature Request Merges'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check-feature-request-author:
    name: 'Verify Merge Authorization'
    runs-on: 'arc-runner-set'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2

      - name: 'Check PR Author against FEATURE_REQUEST_AUTHORS'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # v7.0.1
        with:
          script: |
            const { run } = require('./.github/scripts/check-feature-request-author.js');
            await run({ github, context, core });

name: 'Nightly Examples E2E Test Suite'

on:
  schedule:
    # Trigger nightly examples e2e test suite at 4:00 AM UTC every day (after 1:00 AM deploy & 2:00 AM test suite)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      queue_name:
        description: 'Target Kueue ClusterQueue name (default: cpu-queue)'
        required: false
        default: 'cpu-queue'
        type: string
      timeout_minutes:
        description: 'Timeout in minutes per example workload (default: 30)'
        required: false
        default: 30
        type: number
      examples_filter:
        description: 'Comma-separated example IDs to run (leave empty to run all)'
        required: false
        default: ''
        type: string
      skip_verification:
        description: 'Only build/launch example workloads without running verification assertions'
        required: false
        type: boolean
        default: false
      xmanager_version:
        description: 'Optional xmanager PyPI version override (e.g. 0.8.5.post1; defaults to requirements.txt)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      queue_name:
        description: 'Target Kueue ClusterQueue name (default: cpu-queue)'
        required: false
        default: 'cpu-queue'
        type: string
      timeout_minutes:
        description: 'Timeout in minutes per example workload (default: 30)'
        required: false
        default: 30
        type: number
      examples_filter:
        description: 'Comma-separated example IDs to run (leave empty to run all)'
        required: false
        default: ''
        type: string
      skip_verification:
        description: 'Only build/launch example workloads without running verification assertions'
        required: false
        type: boolean
        default: false
      xmanager_version:
        description: 'Optional xmanager PyPI version override (e.g. 0.8.5.post1; defaults to requirements.txt)'
        required: false
        default: ''
        type: string
    outputs:
      launched_xids:
        description: 'A JSON string map of launched Example IDs to their XIDs / Dashboard IDs'
        value: ${{ jobs.aggregate-results.outputs.launched_xids }}

permissions:
  contents: read

jobs:
  # Fast, cluster-free import check of every example entrypoint. Runs in parallel with
  # (and does not gate) the image builds so import regressions surface within minutes
  # without suppressing the per-example workload signal.
  # NOTE: callers of this workflow via workflow_call must grant `pull-requests: read`,
  # which the nested examples-smoke.yml job requests (permissions cannot escalate).
  examples-import-check:
    name: 'Examples Import Check'
    uses: ./.github/workflows/examples-smoke.yml
    with:
      xmanager_version: ${{ inputs.xmanager_version || '' }}
      examples_filter: ${{ inputs.examples_filter || '' }}
    permissions:
      contents: read
      pull-requests: read

  build-example-images:
    name: 'Build Example Container Images'
    runs-on: 'ubuntu-latest'
    environment: xmc-nightly
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Authenticate to Google Cloud via Workload Identity Federation'
        uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed' # v2.1.13
        with:
          project_id: '${{ secrets.GCP_PROJECT_ID }}'
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: 'Configure Docker Auth for GCP Artifact Registry'
        run: |
          gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: 'Build and Push Example Container Images'
        env:
          PROJECT_ID: '${{ secrets.GCP_PROJECT_ID }}'
          FILTER: ${{ inputs.examples_filter || '' }}
        run: |
          set -euo pipefail
          build_and_push() {
            if [ -n "${FILTER}" ] && ! echo ",${FILTER}," | grep -qi ",$2,"; then
              echo "Skipping $1 image build ($2 not in filter: ${FILTER})"
              return 0
            fi
            local image="us-docker.pkg.dev/${PROJECT_ID}/xmc/$1:latest"
            echo "Building $1 container image..."
            docker build -t "${image}" -f "examples/$2/Dockerfile" "${3:-examples/$2}"
            docker push "${image}"
          }
          build_and_push clickhouse-metrics-job clickhouse_metrics_job .
          build_and_push init-container-job     init_container_job
          build_and_push sidecar-job            sidecar
          build_and_push multipod-counter       multipod_job
          build_and_push metrics-job            metrics_job            .
          build_and_push chart-artifact-job     chart_artifact_job     .
          build_and_push metrics-dashboard-job  metrics_dashboard_job  .
          build_and_push programmatic-xprof-job managed_xprof_artifact_job
          build_and_push per-job-node-selector  per_job_node_selector

  run-and-verify-examples:
    name: 'Run & Verify: ${{ matrix.example.name }}'
    needs: [build-example-images]
    runs-on: 'ubuntu-latest'
    environment: xmc-nightly
    timeout-minutes: ${{ fromJSON(format('{0}', inputs.timeout_minutes || 30)) }}

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        example:
          - id: 'simple_job'
            name: 'Simple Job (3 Multi-Unit Batch)'
            example_path: 'examples/simple_job'
            entrypoint: 'launch.py'
            args: '--queue=${QUEUE_NAME} --num_work_units=3 --duration=60 --gpus=0'
            verify_module: 'tools.nightly_tests.examples_verification.simple_job_test'
            expected_queue: "${{ inputs.queue_name || 'cpu-queue' }}"
            expected_work_units: '3'
            expected_duration_sec: '60'
          - id: 'init_container_job'
            name: 'Init Container Job'
            example_path: 'examples/init_container_job'
            entrypoint: 'launch.py'
            args: ''
            verify_module: 'tools.nightly_tests.examples_verification.init_container_job_test'
            expected_queue: "${{ inputs.queue_name || 'cpu-queue' }}"
          - id: 'sidecar'
            name: 'Sidecar Container Job'
            example_path: 'examples/sidecar'
            entrypoint: 'launch.py'
            args: ''
            verify_module: 'tools.nightly_tests.examples_verification.sidecar_test'
            expected_queue: "${{ inputs.queue_name || 'cpu-queue' }}"
          - id: 'multipod_job'
            name: 'Multi-Pod & Multi-Container Job'
            example_path: 'examples/multipod_job'
            entrypoint: 'launch.py'
            args: ''
            verify_module: 'tools.nightly_tests.examples_verification.multipod_job_test'
            expected_queue: "${{ inputs.queue_name || 'cpu-queue' }}"
          - id: 'metrics_job'
            name: 'Metrics Autologging Job'
            example_path: 'examples/metrics_job'
            entrypoint: 'launch.py'
            args: ''
            verify_module: 'tools.nightly_tests.examples_verification.metrics_job_test'
            expected_queue: "${{ inputs.queue_name || 'cpu-queue' }}"
            requires_clickhouse: true
          - id: 'managed_xprof_artifact_job'
            name: 'Managed XProf Artifact Job'
            example_path: 'examples/managed_xprof_artifact_job'
            entrypoint: 'launch.py'
            args: '--queue_name=${QUEUE_NAME} --total_steps=20'
            verify_module: 'tools.nightly_tests.examples_verification.managed_xprof_artifact_job_test'
            expected_queue: "${{ inputs.queue_name || 'cpu-queue' }}"
          - id: 'workunit_artifact_job'
            name: 'WorkUnit Artifact Lifecycle Job'
            example_path: 'examples/workunit_artifact_job'
            entrypoint: 'launch.py'
            args: '--queue=${QUEUE_NAME}'
            verify_module: 'tools.nightly_tests.examples_verification.workunit_artifact_job_test'
            expected_queue: "${{ inputs.queue_name || 'cpu-queue' }}"
          - id: 'chart_artifact_job'
            name: 'Chart Artifact Job'
            example_path: 'examples/chart_artifact_job'
            entrypoint: 'launch.py'
            args: ''
            verify_module: 'tools.nightly_tests.examples_verification.chart_artifact_job_test'
            expected_queue: "${{ inputs.queue_name || 'cpu-queue' }}"
            requires_clickhouse: true
          - id: 'clickhouse_metrics_job'
            name: 'ClickHouse Metrics Job'
            example_path: 'examples/clickhouse_metrics_job'
            entrypoint: 'launch.py'
            args: ''
            verify_module: 'tools.nightly_tests.examples_verification.clickhouse_metrics_job_test'
            expected_queue: "${{ inputs.queue_name || 'cpu-queue' }}"
            requires_clickhouse: true
          - id: 'metrics_dashboard_job'
            name: 'Metrics Dashboard Job'
            example_path: 'examples/metrics_dashboard_job'
            entrypoint: 'launch.py'
            args: ''
            verify_module: 'tools.nightly_tests.examples_verification.metrics_dashboard_job_test'
            expected_queue: "${{ inputs.queue_name || 'cpu-queue' }}"
            requires_clickhouse: true
            verify_ui: true
          - id: 'per_job_node_selector'
            name: 'Per-Job Node Selector Job'
            example_path: 'examples/per_job_node_selector'
            entrypoint: 'launch.py'
            args: ''
            verify_module: 'tools.nightly_tests.examples_verification.per_job_node_selector_test'
            expected_queue: "${{ inputs.queue_name || 'cpu-queue' }}"
          - id: 'pathways_job'
            name: 'Pathways JobSet Job'
            example_path: 'examples/pathways_job'
            entrypoint: 'launch.py'
            args: ''
            verify_module: 'tools.nightly_tests.examples_verification.pathways_job_test'
            expected_queue: "${{ inputs.queue_name || 'cpu-queue' }}"
          - id: 'xdash_dashboard'
            name: 'xDash Dashboard Builder'
            example_path: 'examples/xdash_dashboard'
            entrypoint: 'create_dashboard.py'
            args: '--endpoint="localhost:50051" --create-experiments'
            verify_module: 'tools.nightly_tests.examples_verification.xdash_dashboard_test'
            expected_queue: ''
            requires_clickhouse: true
          - id: 'resource_dashboard_ui'
            name: 'Resource Observability Dashboard (Playwright UI)'
            example_path: 'examples/simple_job'
            entrypoint: 'launch.py'
            args: '--queue=${QUEUE_NAME} --num_work_units=3 --duration=180 --gpus=0'
            verify_module: 'tools.nightly_tests.examples_verification.resource_observability_dashboard_ui_test'
            expected_queue: "${{ inputs.queue_name || 'cpu-queue' }}"
            expected_work_units: '3'
            expected_duration_sec: '180'
            verify_ui: true
          - id: 'admin_panel_ui'
            name: 'Admin Panel (Playwright UI)'
            example_path: ''
            entrypoint: ''
            args: ''
            verify_module: 'tools.nightly_tests.examples_verification.admin_panel_ui_test'
            expected_queue: ''
            verify_ui: true
          - id: 'multikueue_job'
            name: 'MultiKueue Delegated Job'
            example_path: 'examples/simple_job'
            entrypoint: 'launch.py'
            args: '--queue=multikueue-cpu-queue --num_work_units=3 --duration=60 --gpus=0'
            verify_module: 'tools.nightly_tests.examples_verification.multikueue_job_test'
            expected_queue: 'multikueue-cpu-queue'
            expected_work_units: '3'
            expected_duration_sec: '60'

    env:
      PROJECT_ID: '${{ secrets.GCP_PROJECT_ID }}'
      REGION: '${{ secrets.GCP_REGION }}'
      DOMAIN_NAME: '${{ secrets.GCP_DOMAIN_NAME }}'
      XMC_DOMAIN: 'xmc-nightly.${{ secrets.GCP_DOMAIN_NAME }}'
      XMANAGER_ENDPOINT: 'grpc.xmc-nightly.${{ secrets.GCP_DOMAIN_NAME }}:443'
      XMANAGER_UI_URL: 'https://xmc-nightly.${{ secrets.GCP_DOMAIN_NAME }}'
      IAP_CLIENT_ID: '${{ secrets.GCP_IAP_CLIENT_ID }}'
      XMC_CLIENT_SA: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
      QUEUE_NAME: ${{ inputs.queue_name || 'cpu-queue' }}
      EXAMPLES_FILTER: ${{ inputs.examples_filter || '' }}
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: 'ubuntu24.04-x64'

    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Check Filter'
        id: filter-check
        env:
          EXAMPLE_ID: '${{ matrix.example.id }}'
          FILTER: ${{ inputs.examples_filter || '' }}
        run: |
          if [ -n "${FILTER}" ]; then
            if echo ",${FILTER}," | grep -qi ",${EXAMPLE_ID},"; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping ${EXAMPLE_ID} (not in filter: ${FILTER})"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Authenticate to Google Cloud via Workload Identity Federation'
        if: steps.filter-check.outputs.should_run == 'true'
        uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed' # v2.1.13
        with:
          project_id: '${{ secrets.GCP_PROJECT_ID }}'
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: 'Get GKE Cluster Credentials'
        if: steps.filter-check.outputs.should_run == 'true'
        uses: 'google-github-actions/get-gke-credentials@64bc7249bbcf78056bb92f14d3cedc2da193946c' # v2.3.5
        with:
          cluster_name: 'xmc-xmc-nightly-xmc-nightly'
          location: '${{ secrets.GCP_REGION }}'

      - name: 'Set up Python 3.13'
        if: steps.filter-check.outputs.should_run == 'true'
        uses: 'actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38' # v5.4.0
        with:
          python-version: '3.13'

      - name: 'Install XManager CLI and Dependencies'
        if: steps.filter-check.outputs.should_run == 'true'
        env:
          EXAMPLE_PATH: '${{ matrix.example.example_path }}'
          VERIFY_UI: '${{ matrix.example.verify_ui }}'
          XMANAGER_VERSION: '${{ inputs.xmanager_version }}'
        run: |
          req_args=()
          if [ -n "${EXAMPLE_PATH:-}" ] && [ -f "${GITHUB_WORKSPACE}/${EXAMPLE_PATH}/requirements.txt" ]; then
            req_args=(--requirements "${GITHUB_WORKSPACE}/${EXAMPLE_PATH}/requirements.txt")
          fi
          python3 deploy/cli/install_xmanager.py --venv "${GITHUB_WORKSPACE}/.venv" "${req_args[@]}"
          "${GITHUB_WORKSPACE}/.venv/bin/pip" install -e sdks/python/xmc
          "${GITHUB_WORKSPACE}/.venv/bin/pip" install -e sdks/python/xdash
          if [ "${VERIFY_UI:-}" = "true" ]; then
            "${GITHUB_WORKSPACE}/.venv/bin/pip" install "playwright==1.61.0"
            # --with-deps is omitted: ubuntu-latest pre-bakes Chrome/Chromium system libraries and
            # its unbounded apt-get update can hang until the job timeout.
            timeout --kill-after=30 300 "${GITHUB_WORKSPACE}/.venv/bin/python3" -m playwright install chromium
          fi

      - name: 'Mint XMC Identity Token'
        if: steps.filter-check.outputs.should_run == 'true'
        run: |
          if [ -n "${IAP_CLIENT_ID:-}" ]; then
            if [ -n "${XMC_CLIENT_SA:-}" ]; then
              TOKEN="$(gcloud auth print-identity-token --impersonate-service-account="${XMC_CLIENT_SA}" --audiences="${IAP_CLIENT_ID}" --include-email)"
            else
              TOKEN="$(gcloud auth print-identity-token --audiences="${IAP_CLIENT_ID}" --include-email)"
            fi
            echo "::add-mask::${TOKEN}"
            echo "XMC_AUTH_TOKEN=${TOKEN}" >> "${GITHUB_ENV}"
          fi

      - name: 'Start Service Port-Forwards'
        if: steps.filter-check.outputs.should_run == 'true' && matrix.example.requires_clickhouse == true
        run: |
          set -euo pipefail
          # Bridge the external GitHub Actions runner to internal GKE ClusterIP services
          # (Dashboard Service gRPC on 50051 and ClickHouse HTTP on 8123) via health-checked
          # background port-forwards without exposing those services publicly.
          start_port_forward() {
            local name="$1" ns="$2" svc="$3" port="$4" log="/tmp/pf-$4.log"
            if ! python3 -c "import socket; socket.create_connection(('127.0.0.1', ${port}), timeout=1).close()" >/dev/null 2>&1; then
              echo "Starting ${name} port-forward on localhost:${port}..."
              RUNNER_TRACKING_ID="" setsid kubectl port-forward "svc/${svc}" "${port}:${port}" -n "${ns}" >"${log}" 2>&1 </dev/null &
              for _ in $(seq 1 15); do
                if python3 -c "import socket; socket.create_connection(('127.0.0.1', ${port}), timeout=1).close()" >/dev/null 2>&1; then
                  echo "${name} port-forward ready on localhost:${port}"
                  return 0
                fi
                sleep 1
              done
              echo "::error::${name} port-forward failed to become ready on localhost:${port}"
              cat "${log}" || true
              exit 1
            fi
          }
          start_port_forward "Dashboard Service gRPC" "xmc" "dashboard-service" 50051
          start_port_forward "ClickHouse HTTP" "xmc-metrics" "clickhouse" 8123

      - name: 'Launch Example Workload'
        id: launch-example
        if: steps.filter-check.outputs.should_run == 'true'
        env:
          ACTOR: '${{ github.actor }}'
          EXAMPLE_NAME: '${{ matrix.example.name }}'
          EXAMPLE_ID: '${{ matrix.example.id }}'
          EXAMPLE_PATH: '${{ matrix.example.example_path }}'
          ENTRYPOINT: '${{ matrix.example.entrypoint }}'
          RAW_ARGS: '${{ matrix.example.args }}'
        run: |
          set -euo pipefail
          if [ -z "${EXAMPLE_PATH:-}" ]; then
            echo "No example workload launch required for ${EXAMPLE_NAME} (${EXAMPLE_ID})."
            echo "xid=N/A" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${IAP_CLIENT_ID:-}" ]; then
            if [ -n "${XMC_CLIENT_SA:-}" ]; then
              XMC_AUTH_TOKEN=$(gcloud auth print-identity-token --audiences="${IAP_CLIENT_ID}" --impersonate-service-account="${XMC_CLIENT_SA}" --include-email)
            else
              XMC_AUTH_TOKEN=$(gcloud auth print-identity-token --audiences="${IAP_CLIENT_ID}" --include-email)
            fi
            export XMC_AUTH_TOKEN
          fi
          export XMC_USER_EMAIL="${ACTOR}@google.com"

          echo "================================================================="
          echo " Launching Example: ${EXAMPLE_NAME} (${EXAMPLE_ID})"
          echo " Target Queue    : ${QUEUE_NAME}"
          echo " Endpoint        : ${XMANAGER_ENDPOINT}"
          echo "================================================================="

          cd "${GITHUB_WORKSPACE}/${EXAMPLE_PATH}"
          export PYTHONPATH="${GITHUB_WORKSPACE}/${EXAMPLE_PATH}:${GITHUB_WORKSPACE}:${PYTHONPATH:-}"

          eval "EVAL_ARGS=(${RAW_ARGS})"

          OUTPUT=$("${GITHUB_WORKSPACE}/.venv/bin/python3" "${ENTRYPOINT}" "${EVAL_ARGS[@]}" | tee /dev/stderr)

          # Extract XID or Dashboard ID from output
          XID=$(echo "${OUTPUT}" | grep -oP 'Experiment XID:\s*\K\d+' || echo "${OUTPUT}" | grep -oP 'XID:\s*\K\d+' || true)
          if [ -z "${XID}" ]; then
            XID=$(echo "${OUTPUT}" | grep -oP 'experiments/\K\d+' | head -n 1 || true)
          fi
          if [ -z "${XID}" ]; then
            XID=$(echo "${OUTPUT}" | grep -oP 'dashboards/\K[A-Za-z0-9_-]+' | tail -n 1 || true)
          fi

          if [ -z "${XID}" ]; then
            echo "::error::Failed to parse experiment XID from launch output."
            exit 1
          fi

          echo "Extracted Identifier: ${XID}"
          echo "xid=${XID}" >> "$GITHUB_OUTPUT"

      - name: 'Run Workload Verification Assertions'
        id: verify-example
        if: steps.filter-check.outputs.should_run == 'true' && steps.launch-example.outcome == 'success' && !inputs.skip_verification
        env:
          ACTOR: '${{ github.actor }}'
          EXAMPLE_NAME: '${{ matrix.example.name }}'
          EXAMPLE_ID: '${{ matrix.example.id }}'
          VERIFY_MODULE: '${{ matrix.example.verify_module }}'
          EXPECTED_QUEUE: '${{ matrix.example.expected_queue }}'
          REQUIRES_CLICKHOUSE: '${{ matrix.example.requires_clickhouse }}'
          VERIFY_UI: '${{ matrix.example.verify_ui }}'
          EXPECTED_WORK_UNITS: '${{ matrix.example.expected_work_units }}'
          EXPECTED_DURATION_SEC: '${{ matrix.example.expected_duration_sec }}'
          XID: '${{ steps.launch-example.outputs.xid }}'
        run: |
          set -euo pipefail
          if [ -n "${IAP_CLIENT_ID:-}" ]; then
            if [ -n "${XMC_CLIENT_SA:-}" ]; then
              XMC_AUTH_TOKEN=$(gcloud auth print-identity-token --audiences="${IAP_CLIENT_ID}" --impersonate-service-account="${XMC_CLIENT_SA}" --include-email)
            else
              XMC_AUTH_TOKEN=$(gcloud auth print-identity-token --audiences="${IAP_CLIENT_ID}" --include-email)
            fi
            export XMC_AUTH_TOKEN
          fi
          export XMC_USER_EMAIL="${ACTOR}@google.com"

          EXTRA_VERIFY_ARGS=()
          if [ "${REQUIRES_CLICKHOUSE:-}" = "true" ]; then
            EXTRA_VERIFY_ARGS+=("--require_clickhouse_metrics=true")
          fi
          # These must equal --num_work_units/--duration in args; enforced by tools/nightly_tests/check_matrix_contract.py.
          if [ -n "${EXPECTED_WORK_UNITS:-}" ]; then
            EXTRA_VERIFY_ARGS+=("--expected_work_units=${EXPECTED_WORK_UNITS}")
          fi
          if [ -n "${EXPECTED_DURATION_SEC:-}" ]; then
            EXTRA_VERIFY_ARGS+=("--expected_duration_sec=${EXPECTED_DURATION_SEC}")
          fi
          if [ "${VERIFY_UI:-}" = "true" ]; then
            export XMC_SCREENSHOTS_DIR="/tmp/xmc_screenshots"
            mkdir -p "${XMC_SCREENSHOTS_DIR}"
            EXTRA_VERIFY_ARGS+=("--verify_ui=true" "--ui_base_url=${XMANAGER_UI_URL}")
          fi

          echo "================================================================="
          echo " Verifying Example: ${EXAMPLE_NAME} (${EXAMPLE_ID})"
          echo " Identifier       : ${XID}"
          echo " Verify Module    : ${VERIFY_MODULE}"
          echo "================================================================="

          # Execute verification via Python module syntax (-m) using the virtual environment interpreter.
          # This sets sys.path[0] to the repository root (${GITHUB_WORKSPACE}), ensuring canonical
          # package imports (e.g. `from tools.nightly_tests.verification import verifier_cli`) resolve cleanly without sys.path hacks.
          "${GITHUB_WORKSPACE}/.venv/bin/python3" -m "${VERIFY_MODULE}" \
            --xid="${XID}" \
            --endpoint="${XMANAGER_ENDPOINT}" \
            --expected_queue="${EXPECTED_QUEUE}" \
            "${EXTRA_VERIFY_ARGS[@]}"

          echo "================================================================="
          echo " Verification Passed for: ${EXAMPLE_NAME}"
          echo "================================================================="

      - name: 'Upload UI Diagnostic Screenshots'
        if: failure() && matrix.example.verify_ui == true
        uses: 'actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1' # v4.6.1
        with:
          name: ui-screenshots-${{ matrix.example.id }}
          path: /tmp/xmc_screenshots/*.png
          if-no-files-found: ignore

      - name: 'Publish Step Summary & Save Result'
        if: always()
        env:
          EXAMPLE_NAME: '${{ matrix.example.name }}'
          EXAMPLE_ID: '${{ matrix.example.id }}'
          LAUNCH_XID: '${{ steps.launch-example.outputs.xid }}'
          SHOULD_RUN: '${{ steps.filter-check.outputs.should_run }}'
          LAUNCH_OUTCOME: '${{ steps.launch-example.outcome }}'
          VERIFY_OUTCOME: '${{ steps.verify-example.outcome }}'
          SKIP_VERIFICATION: '${{ inputs.skip_verification }}'
        run: |
          pkill -f "kubectl port-forward" 2>/dev/null || true
          mkdir -p "${GITHUB_WORKSPACE}/results"
          STATUS="FAILED"
          LAUNCH_STATUS="${LAUNCH_OUTCOME}"
          XID="${LAUNCH_XID}"
          if [ "${SHOULD_RUN:-}" = "false" ]; then
            STATUS="SKIPPED"
            XID="skipped"
          elif [ "${SHOULD_RUN:-}" != "true" ] || [ "${LAUNCH_OUTCOME}" = "skipped" ]; then
            LAUNCH_STATUS="setup_failed"
          elif [ "${LAUNCH_OUTCOME}" = "success" ] && { [ "${VERIFY_OUTCOME}" = "success" ] || [ "${SKIP_VERIFICATION}" = "true" ]; }; then
            STATUS="PASSED"
          elif [ "${LAUNCH_OUTCOME}" = "success" ]; then
            STATUS="VERIFY_FAILED"
          fi
          echo "{\"id\": \"${EXAMPLE_ID}\", \"name\": \"${EXAMPLE_NAME}\", \"status\": \"${STATUS}\", \"launch_status\": \"${LAUNCH_STATUS}\", \"verify_status\": \"${VERIFY_OUTCOME}\", \"xid\": \"${XID}\"}" > "${GITHUB_WORKSPACE}/results/${EXAMPLE_ID}.json"

          {
            echo "### 🚀 Example: ${EXAMPLE_NAME} (\`${EXAMPLE_ID}\`)"
            echo ""
            echo "| Step / Property | Value / Status |"
            echo "| --- | --- |"
            echo "| **Overall Status** | \`${STATUS}\` |"
            echo "| **Launch Step** | \`${LAUNCH_STATUS}\` |"
            echo "| **Verify Step** | \`${VERIFY_OUTCOME}\` |"
            echo "| **Experiment / Dashboard ID** | \`${XID:-N/A}\` |"
            if [ -n "${XID:-}" ] && [ "${XID}" != "skipped" ] && [ "${XID}" != "N/A" ]; then
              echo "| **Web UI Link** | https://xmc-nightly.${DOMAIN_NAME}/experiments/${XID} |"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Upload Matrix Result Artifact'
        if: always()
        uses: 'actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1' # v4.6.1
        with:
          name: result-${{ matrix.example.id }}
          path: results/${{ matrix.example.id }}.json
          retention-days: 1

  aggregate-results:
    name: 'Aggregate Examples Results'
    needs: [run-and-verify-examples]
    if: always() && needs.run-and-verify-examples.result != 'skipped'
    runs-on: 'ubuntu-latest'
    outputs:
      launched_xids: ${{ steps.aggregate.outputs.launched_xids }}
    permissions:
      contents: read

    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Download Result Artifacts'
        uses: 'actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806' # v4.1.9
        with:
          path: results
          pattern: result-*
          merge-multiple: true

      - name: 'Aggregate Example Workload Results'
        id: aggregate
        if: always()
        env:
          MATRIX_RESULT: '${{ needs.run-and-verify-examples.result }}'
        run: node .github/scripts/aggregate-example-results.js

  # 3. Report Failure & Alert Repository OWNERS
  report-nightly-failure:
    name: '3. Report Failure & Alert OWNERS'
    runs-on: 'ubuntu-latest'
    needs: [examples-import-check, build-example-images, run-and-verify-examples, aggregate-results]
    if: always() && github.ref == 'refs/heads/main' && (needs.examples-import-check.result == 'failure' || needs.examples-import-check.result == 'cancelled' || needs.build-example-images.result == 'failure' || needs.build-example-images.result == 'cancelled' || needs.run-and-verify-examples.result == 'failure' || needs.run-and-verify-examples.result == 'cancelled' || needs.aggregate-results.result == 'failure' || needs.aggregate-results.result == 'cancelled')

    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Alert Repository OWNERS on GitHub Issue'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # v7.0.1
        env:
          NEEDS_CONTEXT: ${{ toJson(needs) }}
          XID: '${{ needs.aggregate-results.outputs.launched_xids }}'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { run } = require('./.github/scripts/nightly-failure-alert.js');
            await run({ github, context, core });


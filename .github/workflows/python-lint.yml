name: 'Python PEP 8 Lint'

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff-lint:
    name: 'PEP 8 Lint (Ruff)'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'

      - name: 'Run Ruff Linter & Formatter Check'
        uses: 'astral-sh/ruff-action@v3'
        with:
          args: 'check .'

      - name: 'Verify Code Formatting'
        uses: 'astral-sh/ruff-action@v3'
        with:
          args: 'format --check .'

name: 'XMC Nightly Orchestrator'

on:
  schedule:
    # Trigger nightly build at 1:00 AM UTC every day
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      custom_environment:
        description: 'Custom environment name override (leave empty for auto-generated timestamped name)'
        type: string
        required: false
        default: ''

concurrency:
  group: xmc-nightly-orchestration
  cancel-in-progress: false

jobs:
  prepare-environment:
    name: 'Generate Nightly Context'
    runs-on: 'arc-runner-set'
    environment: xmc-nightly
    outputs:
      environment_name: ${{ steps.gen-env.outputs.environment_name }}
    steps:
      - name: 'Compute Environment Name'
        id: gen-env
        run: |
          if [ -n "${{ inputs.custom_environment }}" ]; then
            ENV_NAME="${{ inputs.custom_environment }}"
          else
            TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
            ENV_NAME="xmc-nightly-${TIMESTAMP}"
          fi
          echo "environment_name=${ENV_NAME}" >> $GITHUB_OUTPUT
          echo "Selected Nightly Environment Name: ${ENV_NAME}"

  deploy-nightly:
    name: 'Trigger GKE Deployment'
    needs: prepare-environment
    uses: ./.github/workflows/deploy-gke.yml
    with:
      project_id: ${{ vars.GCP_PROJECT_ID }}
      region: ${{ vars.GCP_REGION || 'us-central1' }}
      environment: ${{ needs.prepare-environment.outputs.environment_name }}
      deployment_name: 'xmc-v2'
      domain_name: ${{ vars.GCP_DOMAIN_NAME }}
      dns_project_id: ${{ vars.GCP_DNS_PROJECT_ID }}
      dns_zone_name: ${{ vars.GCP_DNS_ZONE_NAME }}
      allowed_emails: ${{ vars.GCP_ALLOWED_EMAILS }}
      certs_email: ${{ vars.GCP_CERTS_EMAIL }}
      rod_deployment_enabled: true
      skip_verification: false
    secrets:
      workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      iap_client_id: ${{ secrets.GCP_IAP_CLIENT_ID }}
      iap_client_secret: ${{ secrets.GCP_IAP_CLIENT_SECRET }}
      jwt_secret: ${{ secrets.GCP_JWT_SECRET }}
      gts_key_id: ${{ secrets.GCP_GTS_KEY_ID }}
      gts_hmac_key: ${{ secrets.GCP_GTS_HMAC_KEY }}

name: 'XMC Nightly build'

on:
  schedule:
    # Trigger nightly build at 1:00 AM UTC every day
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      custom_environment:
        description: 'Custom environment name override (leave empty for auto-generated timestamped name)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: xmc-nightly-orchestration
  cancel-in-progress: false

jobs:
  prepare-environment:
    name: 'Generate Nightly Context'
    runs-on: 'arc-runner-set'
    permissions:
      contents: write
    outputs:
      environment_name: ${{ steps.gen-env.outputs.environment_name }}
      tag_name: ${{ steps.gen-tag.outputs.tag_name }}
    steps:
      - name: 'Compute Environment Name'
        id: gen-env
        env:
          CUSTOM_ENV: ${{ inputs.custom_environment }}
        run: |
          if [ -n "${CUSTOM_ENV}" ]; then
            ENV_NAME="${CUSTOM_ENV}"
          else
            ENV_NAME="xmc-nightly"
          fi
          echo "environment_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "Selected Nightly Environment Name: ${ENV_NAME}"

      - name: 'Compute Nightly Tag'
        id: gen-tag
        run: |
          DATE_STR=$(date -u +'%Y-%m-%d')
          TAG_NAME="nightly-${DATE_STR}.${{ github.run_number }}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Selected Nightly Tag Name: ${TAG_NAME}"

      - name: 'Tag Commit on Main'
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # v7.0.1
        env:
          TAG_NAME: ${{ steps.gen-tag.outputs.tag_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagName = process.env.TAG_NAME;
            const targetSha = context.sha;

            core.info(`Creating tag '${tagName}' for commit ${targetSha}...`);

            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`,
                sha: targetSha,
              });
              core.info(`Successfully created tag ${tagName}`);
            } catch (error) {
              if (error.status === 422) {
                // Tag already exists (e.g. re-run on the same day), update it to targetSha
                core.warning(`Tag ${tagName} already exists. Updating ref to ${targetSha}...`);
                await github.rest.git.updateRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${tagName}`,
                  sha: targetSha,
                  force: true,
                });
                core.info(`Successfully updated tag ${tagName} to ${targetSha}`);
              } else {
                throw error;
              }
            }

  deploy-nightly:
    name: 'Trigger GKE Deployment'
    needs: prepare-environment
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-gke.yml
    with:
      environment: ${{ needs.prepare-environment.outputs.environment_name }}
      image_tag: ${{ needs.prepare-environment.outputs.tag_name }}
      deployment_name: 'xmc-nightly'
      region: 'us-central1'
      health_service_deployment_enabled: true
      dashboard_service_deployment_enabled: true
      rod_deployment_enabled: true
      skip_verification: false
      enable_metrics: true
      enable_managed_mldiagnostics: true
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_DOMAIN_NAME: ${{ secrets.GCP_DOMAIN_NAME }}
      GCP_DNS_PROJECT_ID: ${{ secrets.GCP_DNS_PROJECT_ID }}
      GCP_DNS_ZONE_NAME: ${{ secrets.GCP_DNS_ZONE_NAME }}
      GCP_ALLOWED_EMAILS: ${{ secrets.GCP_ALLOWED_EMAILS }}
      GCP_CERTS_EMAIL: ${{ secrets.GCP_CERTS_EMAIL }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_IAP_CLIENT_ID: ${{ secrets.GCP_IAP_CLIENT_ID }}
      GCP_IAP_CLIENT_SECRET: ${{ secrets.GCP_IAP_CLIENT_SECRET }}
      GCP_JWT_SECRET: ${{ secrets.GCP_JWT_SECRET }}
      GCP_GTS_KEY_ID: ${{ secrets.GCP_GTS_KEY_ID }}
      GCP_GTS_HMAC_KEY: ${{ secrets.GCP_GTS_HMAC_KEY }}


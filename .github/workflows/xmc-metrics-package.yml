# Builds the xmc-metrics wheel and sdist (sdks/python/xmc) once, then installs each into
# clean virtualenvs across Python versions and the supported protobuf range, and runs
# test/packaging/xmc_metrics_install_test.py. Nothing is published.
name: 'xmc-metrics Package'

on:
  pull_request:
  merge_group:
  push:
    branches:
      - 'main'
    paths:
      - 'sdks/python/xmc/**'
      - 'api/protos/metrics/**'
      - 'test/packaging/xmc_metrics_install_test.py'
      - '.github/workflows/xmc-metrics-package.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # Always runs so the workflow reports a status on every PR and merge-queue entry
    # (usable as a required check); later steps and the install matrix are skipped when
    # no packaging-related paths changed.
    name: 'Build Wheel and Sdist'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: '${{ steps.gate.outputs.run }}'
    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false
          # paths-filter v3.0.2 has no native merge_group support and would otherwise
          # `git fetch` the base SHA without credentials; full history avoids that fetch.
          # Note: '0' and '1' are quoted because numeric 0 is falsy in expressions.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}

      - name: 'Check Changed Paths'
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: 'dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36' # v3.0.2
        id: changes
        with:
          base: ${{ github.event.merge_group.base_sha }}
          filters: |
            package:
              - 'sdks/python/xmc/**'
              - 'api/protos/metrics/**'
              - 'test/packaging/xmc_metrics_install_test.py'
              - '.github/workflows/xmc-metrics-package.yml'

      - name: 'Decide Whether To Run'
        id: gate
        env:
          EVENT_NAME: '${{ github.event_name }}'
          PATHS_CHANGED: '${{ steps.changes.outputs.package }}'
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != 'pull_request' ] && [ "${EVENT_NAME}" != 'merge_group' ]; then
            echo 'run=true' >> "${GITHUB_OUTPUT}"
          elif [ "${PATHS_CHANGED}" = 'true' ]; then
            echo 'run=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'No xmc-metrics packaging paths changed; skipping.'
            echo 'run=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: 'Set up Python 3.13'
        if: steps.gate.outputs.run == 'true'
        uses: 'actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38' # v5.4.0
        with:
          python-version: '3.13'

      - name: 'Build Distributions'
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 -m pip install 'build==1.6.1'
          python3 -m build sdks/python/xmc --outdir dist

      - name: 'Upload Distributions'
        if: steps.gate.outputs.run == 'true'
        uses: 'actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1' # v4.6.1
        with:
          name: 'xmc-metrics-dist'
          path: 'dist/'
          if-no-files-found: 'error'
          retention-days: 7

  install:
    name: 'Install ${{ matrix.dist }} (Python ${{ matrix.python }}, protobuf ${{ matrix.protobuf }})'
    needs: 'build'
    if: needs.build.outputs.run == 'true'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        protobuf: ['==5.29.6', '<7']
        dist: ['wheel', 'sdist']
        exclude:
          # grpcio-tools==1.70.0 (the [build-system] pin) has no cp314 wheel, so an sdist
          # build on 3.14 compiles grpcio-tools from source. The 3.14 wheel legs still run.
          - python: '3.14'
            dist: 'sdist'
    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: 'test/packaging'

      - name: 'Set up Python ${{ matrix.python }}'
        uses: 'actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38' # v5.4.0
        with:
          python-version: '${{ matrix.python }}'

      - name: 'Download Distributions'
        uses: 'actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806' # v4.1.9
        with:
          name: 'xmc-metrics-dist'
          path: '${{ runner.temp }}/dist'

      - name: 'Install Into a Clean Virtualenv'
        env:
          DIST_KIND: '${{ matrix.dist }}'
          DIST_DIR: '${{ runner.temp }}/dist'
          PROTOBUF_SPEC: 'protobuf${{ matrix.protobuf }}'
          VENV_DIR: '${{ runner.temp }}/venv'
        run: |
          set -euo pipefail
          python3 -m venv "${VENV_DIR}"
          if [ "${DIST_KIND}" = 'wheel' ]; then
            dist_args=("${DIST_DIR}"/*.whl)
          else
            # pip always builds a local sdist path from source in an isolated build env.
            # --no-binary xmc-metrics is a defensive guard against a resolved wheel; it is
            # scoped to this package because :all: would also source-build protobuf and
            # grpcio-tools.
            dist_args=(--no-binary xmc-metrics "${DIST_DIR}"/*.tar.gz)
          fi
          "${VENV_DIR}/bin/pip" install "${dist_args[@]}" "${PROTOBUF_SPEC}"
          "${VENV_DIR}/bin/pip" show protobuf xmc-metrics

      - name: 'Run Install Smoke Test'
        working-directory: '${{ runner.temp }}'
        env:
          SMOKE_TEST: '${{ github.workspace }}/test/packaging/xmc_metrics_install_test.py'
          VENV_DIR: '${{ runner.temp }}/venv'
        run: '"${VENV_DIR}/bin/python" "${SMOKE_TEST}" -v'

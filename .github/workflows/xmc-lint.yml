name: 'XMC Component Profiles Linting'

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-v2-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-components:
    name: 'Run Component Profiles Linter'
    runs-on: 'arc-runner-set'
    timeout-minutes: 15

    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 'Run XMC Component Manifest Linter'
        uses: './.github/actions/run-xmc-linter'

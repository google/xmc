# Builds the examples virtualenv exactly as the Nightly Examples E2E suite does
# (install_xmanager.py + example requirements) and import-checks every nightly
# example entrypoint. No cluster, credentials, or workload launches are involved.
name: 'Examples Import Check'

on:
  pull_request:
  merge_group:
  workflow_call:
  workflow_dispatch:

concurrency:
  # Literal prefix: under workflow_call, github.workflow resolves to the caller's name.
  group: examples-import-check-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  examples-import-check:
    # Always runs so the check reports a status when used as a required check;
    # individual steps are skipped when no relevant paths changed.
    name: 'Examples Import Check'
    runs-on: 'arc-runner-set'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4.2.2
        with:
          persist-credentials: false

      - name: 'Check Changed Paths'
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: 'dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36' # v3.0.2
        id: changes
        with:
          filters: |
            examples:
              - 'examples/**'
              - 'sdks/python/**'
              - 'deploy/cli/**'
              - 'api/protos/**'
              - 'tools/nightly_tests/examples_import_smoke.py'
              - '.github/workflows/examples-smoke.yml'
              - '.github/workflows/nightly-examples-e2e.yml'

      - name: 'Decide Whether To Run'
        id: gate
        env:
          EVENT_NAME: '${{ github.event_name }}'
          PATHS_CHANGED: '${{ steps.changes.outputs.examples }}'
        run: |
          if [ "${EVENT_NAME}" != "pull_request" ] && [ "${EVENT_NAME}" != "merge_group" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${PATHS_CHANGED}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No example-related paths changed; skipping import check."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Set up Python 3.13'
        if: steps.gate.outputs.run == 'true'
        uses: 'actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38' # v5.4.0
        with:
          python-version: '3.13'

      - name: 'Build Examples Virtualenv'
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          req_args=()
          for req in examples/*/requirements.txt; do
            req_args+=(--requirements "${req}")
          done
          python3 deploy/cli/install_xmanager.py --venv "${GITHUB_WORKSPACE}/.venv" "${req_args[@]}"

      - name: 'Import-Check Nightly Example Entrypoints'
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/.venv/bin/python3" tools/nightly_tests/examples_import_smoke.py \
            --venv-python "${GITHUB_WORKSPACE}/.venv/bin/python3"

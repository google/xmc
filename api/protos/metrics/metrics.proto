syntax = "proto3";

package cloud.xmanager.v1;

option go_package = "xmanager_cloud/api/protos/metrics;metrics";
option java_multiple_files = true;

// Metric represents a single numeric measurement logged in XMC.
message Metric {
  string xid = 1;
  int64 work_unit_id = 2;
  int64 execution_id = 3;
  int32 replica_id = 4;
  string metric_name = 5;
  double metric_value = 6;
  int64 step = 7;
  int64 timestamp = 8; // Timestamp in microseconds
}

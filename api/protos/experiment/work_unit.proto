syntax = "proto3";

package cloud.xmanager.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "third_party/xmanager_cloud/experiment_state_server/proto/priority.proto";
import "third_party/xmanager_cloud/experiment_state_server/proto/resources.proto";
import "third_party/xmanager_cloud/experiment_state_server/proto/url.proto";
import "third_party/xmanager_cloud/experiment_state_server/proto/work_unit_execution.proto";

option java_multiple_files = true;

message WorkUnit {
  option (google.api.resource) = {
    type: "cloud.xmanager.googleapis.com/WorkUnit"
    pattern: "experiments/{xid}/workUnits/{wid}"
    singular: "workUnit"
    plural: "workUnits"
  };

  enum WorkUnitType {
    WORK_UNIT_TYPE_UNSPECIFIED = 0;
    STANDARD = 1;
    AUXILIARY = 2;
  }

  // Resource name of the work unit.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The type of the work unit.
  WorkUnitType work_unit_type = 2 [(google.api.field_behavior) = IMMUTABLE];
  // Priority of the work unit. Higher values indicate higher priority.
  Priority priority = 3 [(google.api.field_behavior) = REQUIRED];
  // Time when the work unit was created.
  google.protobuf.Timestamp create_time = 4
      [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time when the work unit was last updated.
  google.protobuf.Timestamp update_time = 5
      [(google.api.field_behavior) = OUTPUT_ONLY];
  // URLs associated with the work unit.
  repeated Url urls = 6 [(google.api.field_behavior) = OPTIONAL];
  // The executable to run for the work unit. Cannot be changed after creation.
  Executable executable = 7 [(google.api.field_behavior) = IMMUTABLE];
  // Tags associated with the work unit.
  repeated string tags = 8 [(google.api.field_behavior) = OPTIONAL];
  // Notes associated with the work unit.
  string notes = 9 [(google.api.field_behavior) = OPTIONAL];
  // The current work unit execution.
  WorkUnitExecution current_work_unit_execution = 10
      [(google.api.field_behavior) = OUTPUT_ONLY];
}

message Executable {
  // The scheduling constraints for the executable.
  SchedulingConstraints scheduling_constraints = 1
      [(google.api.field_behavior) = REQUIRED];
  // The type of executable. This is a oneof to allow for different executable
  // types to be added in the future.
  oneof type {
    JobSetExecutable jobset = 2;
  }
}

// A JobSetExecutable is a collection of KubernetesJobs that are run together
// as a JobSet resource.
message JobSetExecutable {
  // Network configuration for the JobSet (`network`).
  message Network {
    // Whether to enable DNS hostnames for pods in the JobSet
    // (`network.enableDNSHostnames`).
    // When true, the JobSet controller provisions a Headless Service so pods
    // can discover and communicate with each other using deterministic FQDNs:
    // <jobset-name>-<replicated-job-name>-<job-index>-<pod-index>.<subdomain>
    optional bool enable_dns_hostnames = 1;

    // Custom subdomain name for the JobSet Headless Service
    // (`network.subdomain`).
    // If omitted and enable_dns_hostnames is true, defaults to the JobSet name.
    string subdomain = 2;

    // Whether to publish DNS records for pods before they become Ready
    // (`network.publishNotReadyAddresses`).
    // Critical for multi-pod/distributed rendezvous (PyTorch DDP, JAX, MPI)
    // so worker pods can resolve each other during container initialization.
    optional bool publish_not_ready_addresses = 3;
  }

  // The Jobs that make up the JobSet.
  repeated KubernetesJob jobs = 1;

  // Network configuration for the JobSet (DNS hostnames, unready address publishing).
  Network network = 2;
}

// A KubernetesJob is a single Kubernetes Job that is run as part of a
// JobSetExecutable.
message KubernetesJob {
  message DependencyOrder {
    // The name of the Kubernetes Job that this Job depends on. This must be the
    // name of a KubernetesJob in the same JobSetExecutable.
    string job_name = 1;
    // The state that the dependent job must be in for this job to be started.
    enum JobDependencyState {
      JOB_DEPENDENCY_STATE_UNSPECIFIED = 0;
      // The dependent job must be ready to start this job. This is useful for
      // server-client dependencies where the client job should not start until
      // the server job is ready.
      READY = 1;
      // The dependent job must be completed successfully for this job to be
      // started.
      COMPLETED = 2;
    }
    JobDependencyState job_dependency_state = 2;
  }

  // The name of the Kubernetes Job.
  string name = 1;

  // The spec of the Kubernetes Job.
  ExecutableSpec spec = 2;
  // The annotations to apply to the Kubernetes Job.
  map<string, string> annotations = 3;
  // The number of replicas to run for the Kubernetes Job.
  int32 replicas = 4;
  // The maximum number of times to retry the Kubernetes Job.
  int32 retry_limit = 5;
  // The active deadline of the Kubernetes Job. This is the maximum amount of
  // time the Kubernetes Job can run before it is killed. Note this is not a
  // deadline per execution, this is a deadline for the entire Kubernetes Job
  // to be active. If a pod fails and is restarted, the deadline is not reset.
  int64 active_deadline_seconds = 6;
  // The dependencies of the Kubernetes Job. This is used to specify the
  // ordering of jobs within the JobSet. If a job depends upon another job, it
  // must be specified after the dependent job in the list of jobs.
  DependencyOrder dependency_order = 7;
  // The Kubernetes Service Account (KSA) to run the Job as. If not set, the
  // namespace's default KSA is used.
  string service_account = 8;
  // Sidecar / auxiliary containers to run alongside the primary container in each Pod.
  repeated ExecutableSpec sidecars = 9;
  // Init containers to run before primary and sidecar containers start.
  repeated ExecutableSpec init_containers = 10;
  // Node selector labels to apply to all Pods in this Kubernetes Job.
  // This allows pinning specific jobs (e.g., head vs worker) to distinct node pools.
  map<string, string> node_selector = 11;

  // Custom volumes available to containers in the pod.
  repeated Volume volumes = 12;
}

// Represents a volume that can be mounted by containers in a KubernetesJob.
message Volume {
  // Volume name used for referencing in volume mounts.
  string name = 1;

  // The source of the volume.
  oneof source {
    PersistentVolumeClaimVolumeSource persistent_volume_claim = 2;
    GcsVolumeSource gcs = 3;
    HostPathVolumeSource host_path = 4;
    EmptyDirVolumeSource empty_dir = 5;
    SecretVolumeSource secret = 6;
    ConfigMapVolumeSource config_map = 7;
    NfsVolumeSource nfs = 8;
  }
}

// PersistentVolumeClaim volume source.
message PersistentVolumeClaimVolumeSource {
  // Name of the PersistentVolumeClaim in the same namespace as the pod.
  string claim_name = 1;
  // If true, the volume will be mounted as read-only.
  optional bool read_only = 2;
}

// GCS volume source backed by GKE GCS FUSE CSI driver (gcs.csi.storage.gke.io).
message GcsVolumeSource {
  // The GCS bucket name (e.g., "my-bucket" or "gs://my-bucket").
  string bucket = 1;
  // Optional mount options passed to the GCS FUSE CSI driver (e.g., "implicit-dirs", "only-dir=subpath").
  repeated string mount_options = 2;
  // If true, the bucket is mounted read-only.
  optional bool read_only = 3;
}

// HostPath volume source.
message HostPathVolumeSource {
  // Path of the directory or file on the host node.
  string path = 1;
  // Type for HostPath (e.g., "DirectoryOrCreate", "Directory", "File").
  string type = 2;
}

// EmptyDir volume source.
message EmptyDirVolumeSource {
  // Storage medium backing this directory ("" for disk, "Memory" for ram/tmpfs).
  string medium = 1;
  // Total size limit required for this EmptyDir volume in bytes.
  int64 size_limit_bytes = 2;
}

// Secret volume source.
message SecretVolumeSource {
  string secret_name = 1;
  optional int32 default_mode = 2; // Octal file permission mode (e.g., 0400 = 256)
  optional bool optional = 3;
}

// ConfigMap volume source.
message ConfigMapVolumeSource {
  string name = 1;
  optional int32 default_mode = 2;
  optional bool optional = 3;
}

// NFS volume source.
message NfsVolumeSource {
  string server = 1;
  string path = 2;
  optional bool read_only = 3;
}

// Selects a field of the Pod (matches YAML 'fieldRef').
message FieldRef {
  string field_path = 1; // e.g. "status.podIP" or "metadata.name"
  string api_version = 2; // optional
}

// Selects a key of a Secret (matches YAML 'secretKeyRef').
message SecretKeyRef {
  string name = 1;
  string key = 2;
  optional bool optional = 3;
}

// Represents the source of an environment variable's reference value.
message EnvVarSource {
  oneof reference {
    FieldRef field_ref = 1;
    SecretKeyRef secret_key_ref = 2;
    // Add here other env reference cases.
  }
}

// Represents a single environment variable definition.
message EnvVar {
  // The name of the environment variable (e.g., "POD_IP")
  string name = 1;

  // The source of the environment variable's value
  oneof source {
    // Hardcoded string value
    string value = 2;

    // Reference to a Pod field
    EnvVarSource value_from = 3;
  }
}

// Represents a volume mount inside a container.
message VolumeMount {
  // This must match the name of a Volume in the KubernetesJob, or one of the default
  // scratch volumes ("ram-scratch", "disk-scratch", "dev-shm-scratch").
  string name = 1;
  // Path inside the container where the volume should be mounted. Must be absolute and not contain ':'.
  string mount_path = 2;
  // Mounted read-only if true, read-write otherwise.
  optional bool read_only = 3;
  // Sub-path inside the volume from which the container's volume should be mounted. Defaults to "" (root).
  string sub_path = 4;
}

message ExecutableSpec {
  // The resources required to run the executable.
  ResourceSet resources = 1;
  // The docker image to use for the executable.
  string docker_image = 2;
  // The arguments to pass to the executable.
  // Deprecated: Use args_list instead, which supports ordered, verbatim, and positional arguments.
  map<string, string> args = 3 [deprecated = true];
  // The environment variables to set for the executable.
  // Deprecated: Use env instead, which supports structured environment variables.
  map<string, string> env_vars = 4 [deprecated = true];
  // The command to run in the container (overwrites ENTRYPOINT).
  repeated string command = 5;
  // The structured environment variables, supporting downward API.
  repeated EnvVar env = 6;
  // Optional name for the container. If unset, defaults to the job name for the primary container,
  // '<job_name>-sidecar-<index>' for sidecars, or '<job_name>-init-<index>' for init containers.
  string name = 7;
  // Ordered list of arguments passed verbatim to the container entrypoint/command without automatic flag prefixes.
  // Can be used for positional arguments, bare key=value pairs (MaxText/Abseil), or GNU --flag=value options.
  repeated string args_list = 8;
  // Volume mounts to mount volumes into this container.
  repeated VolumeMount volume_mounts = 9;
}

// SchedulingConstraints contains the scheduling constraints for the
// executable. For now, this is just a Kueue queue name, but we leave this
// extensible to other routing schemes in the future.
message SchedulingConstraints {
  // Queue to schedule the executable on.
  string queue_name = 1;
}

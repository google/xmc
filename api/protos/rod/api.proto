syntax = "proto3";

package cloud.xmanager.v1;

import "google/api/annotations.proto";

option go_package = "xmanager_cloud/api/protos/rod";

// ResourceObservabilityService provides Resource Observability Dashboard backend APIs.
service ResourceObservabilityService {
  // TODO: Implement the rest of methods

  // Get all queues that fit specific resource requirements.
  rpc GetFittingQueues(GetFittingQueuesRequest) returns (GetFittingQueuesResponse) {
    option (google.api.http) = {
      get: "/v1/clusterqueues"
    };
  }

  // Get all running and pending jobs for a specific cluster queue.
  rpc GetRunningAndPendingJobs(GetRunningAndPendingJobsRequest) returns (GetRunningAndPendingJobsResponse) {
    option (google.api.http) = {
      get: "/v1/clusterqueues/{queue_name}/jobs"
    };
  }
}


// Resource represents requested or available compute resources.
message Resource {
  // Type of resource, e.g., "cpu", "memory", "nvidia.com/gpu", "google.com/tpu".
  string resource_type = 1;
  double count = 2;
}

// QueueResourceCapacity represents resource capacities for a queue.
message QueueResourceCapacity {
  string resource_type = 1;
  double total_capacity = 2;
  double free_capacity = 3;
  double free_capacity_with_borrowing = 4;
}

// QueueOverview provides an overview of the queue and its resources.
message QueueOverview {
  string queue_name = 1;
  repeated QueueResourceCapacity queue_capacity = 3;
}

// GetFittingQueuesRequest represents parameters for filtering matching ClusterQueues.
message GetFittingQueuesRequest {
  repeated Resource requirements = 1;
}

// GetFittingQueuesResponse contains the list of matching ClusterQueues.
message GetFittingQueuesResponse {
  repeated QueueOverview queues = 1;
}

// GetRunningAndPendingJobsRequest represents query parameters for fetching active jobs of a queue.
message GetRunningAndPendingJobsRequest {
  string queue_name = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// JobInfo represents details of a running or pending job.
message JobInfo {
  string position = 1;
  string xid = 2;
  string work_unit_id = 3;
  string job_name = 4;
  string user = 5;
  string resources = 6;
  string priority = 7;
  string status = 8;
  string time_in_queue = 9;
  string queue_name = 10;
  string creation_time = 11;
}

// GetRunningAndPendingJobsResponse represents the paginated list of running and pending jobs.
message GetRunningAndPendingJobsResponse {
  string queue_name = 1;
  repeated JobInfo jobs = 2;
  string next_page_token = 3;
}


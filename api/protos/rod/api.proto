syntax = "proto3";

package cloud.xmanager.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "xmanager_cloud/experiment_state_server/proto/status.proto";

option go_package = "xmanager_cloud/api/protos/rod";

// ResourceObservabilityService provides Resource Observability Dashboard backend APIs.
service ResourceObservabilityService {
  // TODO: Implement the rest of methods

  // List all cluster queues.
  rpc ListClusterQueues(ListClusterQueuesRequest) returns (ListClusterQueuesResponse) {
    option (google.api.http) = {
      get: "/v1/clusterqueues"
    };
  }

  // Get all running and pending jobs for a specific cluster queue.
  rpc GetRunningAndPendingJobs(GetRunningAndPendingJobsRequest) returns (GetRunningAndPendingJobsResponse) {
    option (google.api.http) = {
      get: "/v1/clusterqueues/{queue_name}/jobs"
    };
  }

  // Get the target submission queue for a specific cluster queue.
  rpc GetSubmitQueue(GetSubmitQueueRequest) returns (GetSubmitQueueResponse) {
    option (google.api.http) = {
      get: "/v1/clusterqueues/{queue_name}/submitqueue"
    };
  }

  // Get historical queue velocity and turnover metrics for multiple cluster queues.
  rpc BatchGetQueueSecondaryData(BatchGetQueueSecondaryDataRequest) returns (BatchGetQueueSecondaryDataResponse) {
    option (google.api.http) = {
      post: "/v1/clusterqueues:batchGetSecondaryData"
      body: "*"
    };
  }
}

// RangePreset specifies predefined time windows for historical telemetry calculations.
enum RangePreset {
  RANGE_PRESET_UNSPECIFIED = 0;
  RANGE_PRESET_LAST_HOUR = 1;
  RANGE_PRESET_LAST_DAY = 2;
  RANGE_PRESET_LAST_WEEK = 3;
}

// Resource represents requested or available compute resources.
message Resource {
  // Type of resource, e.g., "cpu", "memory", "nvidia.com/gpu", "google.com/tpu".
  string resource_type = 1;
  double count = 2;
}

// ResourceVelocity represents velocity rate for a specific resource type.
message ResourceVelocity {
  string resource_type = 1;
  double velocity = 2;
}

// QueueResourceCapacity represents resource capacities for a queue.
message QueueResourceCapacity {
  string resource_type = 1;
  double total_capacity = 2;
  double free_capacity = 3;
  double free_capacity_with_borrowing = 4;
}

// QueueOverview provides an overview of the queue and its resources.
message QueueOverview {
  string queue_name = 1;
  repeated QueueResourceCapacity queue_capacity = 2;
}

// ListClusterQueuesRequest represents parameters for retrieving ClusterQueues.
message ListClusterQueuesRequest {}

// QueuePredictability contains predictability metrics for a queue over a time range.
message QueuePredictability {
  Resource pending_resource_requests = 1;
  ResourceVelocity resource_velocity = 2;
  int64 pending_jobs = 3;
  double job_velocity = 4;
  RangePreset velocity_range = 5;
}

// ClusterQueueSecondaryMetrics represents secondary predictability data for a cluster queue.
message ClusterQueueSecondaryMetrics {
  repeated QueuePredictability queue_predictability = 1;
}

// ListClusterQueuesResponse contains the list of ClusterQueues.
message ListClusterQueuesResponse {
  repeated QueueOverview queues = 1;
}

// GetRunningAndPendingJobsRequest represents query parameters for fetching active jobs of a queue.
message GetRunningAndPendingJobsRequest {
  string queue_name = 1;
  int32 page_size = 2;
  string page_token = 3;
  string order_by = 4;
}

// DashboardJob represents a pending or running job in a cluster queue.
message DashboardJob {
  int64 xid = 1;
  int64 work_unit_id = 2;
  string user = 3;
  int64 priority = 4;
  WorkUnitStatus.WorkUnitState status = 5;
  int64 time_in_queue_seconds = 6;
  repeated Resource requested_resources = 7;
  int64 position_in_queue = 8;
  google.protobuf.Timestamp create_time = 9;
  repeated string tags = 10;
  string experiment_title = 11;
}

// GetRunningAndPendingJobsResponse represents the paginated list of running and pending jobs.
message GetRunningAndPendingJobsResponse {
  repeated DashboardJob jobs = 1;
  string next_page_token = 2;
  int64 total_queue_size = 3;
}

// GetSubmitQueueRequest represents query parameters for fetching the target submission queue.
message GetSubmitQueueRequest {
  string queue_name = 1;
}

// GetSubmitQueueResponse contains the target submit queue name.
message GetSubmitQueueResponse {
  string submit_queue = 1;
}

// BatchGetQueueSecondaryDataRequest represents parameters for requesting secondary queue metrics.
message BatchGetQueueSecondaryDataRequest {
  repeated string queue_names = 1;
  RangePreset range = 2;
}

// BatchGetQueueSecondaryDataResponse contains secondary metrics mapped by queue name.
message BatchGetQueueSecondaryDataResponse {
  map<string, ClusterQueueSecondaryMetrics> queue_predictability = 1;
}


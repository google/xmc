edition = "2023";

package cloud.xmanager.v1;

option go_package = "xmanager_cloud/api/protos/task_queue";

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "xmanager_cloud/experiment_state_server/proto/status.proto";

// ArtifactLifecycleEvent is emitted by the Reconciler to Redis when a WorkUnitExecution
// state transition matches the xmc.google.com/notify-when annotation.
message ArtifactLifecycleEvent {
  int64 experiment_id = 1 [(google.api.field_behavior) = REQUIRED];
  int64 work_unit_id = 2 [(google.api.field_behavior) = REQUIRED];
  int64 work_unit_execution_id = 3 [(google.api.field_behavior) = REQUIRED];
  WorkUnitStatus.WorkUnitState old_state = 4 [(google.api.field_behavior) = OPTIONAL];
  WorkUnitStatus.WorkUnitState new_state = 5 [(google.api.field_behavior) = REQUIRED];

  // Extensible runtime payload carrying JobSet context without coupling Spanner schema to specific artifacts.
  oneof payload {
    JobSetRuntimeContext job_set_runtime_context = 6;
  }
}

// JobSetRuntimeContext carries Kubernetes JobSet runtime metadata for lifecycle rules.
message JobSetRuntimeContext {
  google.protobuf.Timestamp creation_time = 1 [(google.api.field_behavior) = OPTIONAL];
  map<string, string> environment_variables = 2 [(google.api.field_behavior) = OPTIONAL];
  map<string, string> labels = 3 [(google.api.field_behavior) = OPTIONAL];
  map<string, string> annotations = 4 [(google.api.field_behavior) = OPTIONAL];
  string cluster = 5 [(google.api.field_behavior) = OPTIONAL];
  string namespace = 6 [(google.api.field_behavior) = OPTIONAL];
  string job_set_name = 7 [(google.api.field_behavior) = OPTIONAL];
}

syntax = "proto3";

package cloud.xmanager.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "xmanager_cloud/api/protos/health";

// HealthService provides APIs for querying the health and configuration of the service.
service HealthService {
  // Gets the health status of the service.
  rpc GetHealthStatus(GetHealthStatusRequest) returns (HealthStatusResponse) {
    option (google.api.http) = {
      get: "/v1/health/status"
    };
  }

  // Gets the configuration of the service.
  rpc ListConfigEntries(ListConfigEntriesRequest) returns (ListConfigEntriesResponse) {
    option (google.api.http) = {
      get: "/v1/health/configs"
    };
  }

  // Gets the user's privilege info.
  rpc GetUserInfo(GetUserInfoRequest) returns (UserInfoResponse) {
    option (google.api.http) = {
      get: "/v1/health/userinfo"
    };
  }

  // Pauses Actuator scheduling operations.
  rpc PauseScheduling(PauseSchedulingRequest) returns (PauseSchedulingResponse) {
    option (google.api.http) = {
      post: "/v1/health/scheduling:pause"
      body: "*"
    };
  }

  // Resumes Actuator scheduling operations.
  rpc ResumeScheduling(ResumeSchedulingRequest) returns (ResumeSchedulingResponse) {
    option (google.api.http) = {
      post: "/v1/health/scheduling:resume"
      body: "*"
    };
  }
}

message GetHealthStatusRequest {
  bool force_refresh = 1;
}

enum ComponentType {
  COMPONENT_TYPE_UNSPECIFIED = 0;
  COMPONENT_TYPE_CORE_SERVICE = 1;
  COMPONENT_TYPE_EXTERNAL_DEPENDENCY = 2;
  COMPONENT_TYPE_CUSTOM_COMPONENT = 3;
}

enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_HEALTHY = 1;
  HEALTH_STATE_UNHEALTHY = 2;
}

message SystemInfo {
  string app_version = 1;
  string ess_db_schema_version = 2;
  string xid_db_schema_version = 3;
  string observability_url = 4;
  bool is_scheduling_paused = 5;
  string build_version = 6;
}

message ComponentHealth {
  string name = 1;
  ComponentType type = 2;
  HealthState health_state = 3;
  string error_message = 4;
}

message HealthStatusResponse {
  SystemInfo system_info = 1;
  HealthState health_state = 2;
  repeated ComponentHealth components = 3;
  google.protobuf.Timestamp health_check_time = 4;
}

message ListConfigEntriesRequest {}

message ConfigInfo {
  string key = 1;
  string value = 2;
}

message ConfigGroup {
  string display_name = 1;
  repeated ConfigInfo configs = 2;
}

message ListConfigEntriesResponse {
  repeated ConfigGroup config_groups = 1;
}

message GetUserInfoRequest {}

enum Privilege {
  PRIVILEGE_UNSPECIFIED = 0;
  PRIVILEGE_ACCESS_ADMIN_PANEL = 1;
}

message UserInfoResponse {
  string user_email = 1;
  repeated Privilege privileges = 2;
}

message PauseSchedulingRequest {}

message PauseSchedulingResponse {}

message ResumeSchedulingRequest {}

message ResumeSchedulingResponse {}


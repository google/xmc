vars:
  # Deployment name override to avoid name conflicts
  deployment_name: my-xmc-ctk

  # The Google Cloud Project ID to deploy into
  project_id: YOUR_PROJECT_ID

  # The Google Cloud Region to deploy into
  region: us-central1

  # Suffix for your resources (e.g., dev, staging, prod)
  environment: dev

  # The DNS Domain Name for XMC (e.g., xmc.example.com)
  # MUST be a real domain for Managed SSL Certs to provision!
  domain_name: YOUR_DOMAIN_NAME

  # The OAuth 2.0 Web Client ID for application authentication
  iap_client_id: "YOUR_OAUTH_CLIENT_ID"

  # The OAuth 2.0 Client Secret for application authentication
  iap_client_secret: "YOUR_OAUTH_CLIENT_SECRET"

  # Secret key used by the backend to sign session JWTs (choose a secure random string)
  jwt_secret: "YOUR_JWT_SECRET"

  # Comma-separated list of user emails authorized to log in.
  # Required when authorized_iam_role is not provided.
  allowed_emails: "user1@example.com,user2@example.com"

  # GCP IAM role granted to GKE workload identities.
  # Required when allowed_emails is not provided.
  authorized_iam_role: "roles/viewer"

  # GCP IAM role required for administrative access (Health Service, Admin Panel).
  # Defaults to roles/owner if not provided.
  admin_iam_role: "roles/owner"

  # Owner email registered with Google Trust Services (GTS)
  certs_email: "YOUR_EMAIL@example.com"

  # GTS External Account Binding key ID for certificate issuance
  gts_key_id: "YOUR_GTS_KEY_ID"

  # GTS External Account Binding HMAC secret for certificate issuance
  gts_hmac_key: "YOUR_GTS_HMAC_KEY"

  # Target Kubernetes namespace for XMC services
  namespace: xmc

  # Name of the GKE cluster the tooling talks to. Leave empty and it is derived as
  # xmc-<deployment_name>-<environment>, which is what the blueprint names the cluster it
  # creates. Set it when deploying onto a cluster that already exists and is named something
  # else, or get-credentials and the Gateway API check look up a cluster that is not there.
  gke_cluster_name: ""

  # Toggles public endpoints access on GKE Control Plane
  gcp_public_cidrs_access_enabled: false

  # If true, deletion protection will be enabled on supported resources (databases, Cloud Run)
  deletion_protection: false

  # Enable Metrics Pipeline (Ingestion Gateway & ROD Data Provider)
  enable_metrics: false

  # ClickHouse connection backing dashboard chart data. Applied only when enable_metrics is
  # true. ClickHouse is Bring-Your-Own infrastructure; see deploy/addons/metrics/clickhouse.
  clickhouse_host: "clickhouse.xmc-metrics.svc.cluster.local"
  clickhouse_port: "9000"
  clickhouse_database: "default"
  clickhouse_user: "default"
  clickhouse_password: ""

  # Enable Foundational Component Controllers
  enable_components: false

  # The physical address range allowed to call the GKE control plane
  authorized_cidr: 0.0.0.0/0

  # Redis Configuration
  use_redis_queue: true
  deploy_redis: true
  redis_region: us-central1

  # Bring-your-own Redis. Leave external_redis_host empty to use the Memorystore instance
  # deploy_redis provisions. Set it to point the application at your own instance instead --
  # necessary when the cluster runs on a network the provisioned instance cannot be reached from,
  # because a Memorystore instance only accepts traffic from its single authorized network and
  # Private Service Access peering is not transitive. Set deploy_redis: false alongside it to
  # avoid paying for an instance nothing connects to.
  external_redis_host: ""
  external_redis_port: "6379"
  external_redis_auth_string: ""

  # Validity duration of task signature tokens
  task_signature_ttl_seconds: 86400

  # Enable status message history database persistence
  status_message_history_enabled: true

  # Target Google Artifact Registry and tag for all XMC microservices.
  # Optional: You can override individual service images if needed (e.g. actuator_image: "custom-path:tag")
  image_registry: "us-docker.pkg.dev/YOUR_PROJECT_ID/xmc"
  image_tag: "latest"

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazel-remote-cache-pvc
  namespace: arc-runners
  labels:
    app: bazel-remote-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: premium-rwo
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazel-remote-cache
  namespace: arc-runners
  labels:
    app: bazel-remote-cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bazel-remote-cache
  template:
    metadata:
      labels:
        app: bazel-remote-cache
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-permissions
          image: busybox:latest
          command: ["sh", "-c", "chown -R 1000:1000 /data && chmod 775 /data"]
          volumeMounts:
            - name: cache-storage
              mountPath: /data
      containers:
        - name: bazel-remote-cache
          image: buchgr/bazel-remote-cache:latest
          imagePullPolicy: IfNotPresent
          args:
            - --dir=/data
            - --max_size=90
            - --http_address=0.0.0.0:8080
            - --grpc_address=0.0.0.0:9092
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9092
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /status
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: cache-storage
              mountPath: /data
      volumes:
        - name: cache-storage
          persistentVolumeClaim:
            claimName: bazel-remote-cache-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bazel-remote-cache
  namespace: arc-runners
  labels:
    app: bazel-remote-cache
spec:
  type: ClusterIP
  selector:
    app: bazel-remote-cache
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 9092
      targetPort: 9092

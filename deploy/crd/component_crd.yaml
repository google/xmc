apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: components.xmc.dev
  labels:
    app.kubernetes.io/name: xmc
    app.kubernetes.io/part-of: xmanager-cloud
spec:
  group: xmc.dev
  names:
    kind: Component
    listKind: ComponentList
    plural: components
    singular: component
    shortNames:
      - xcomp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .status.state
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Class
          type: string
          jsonPath: .spec.componentClass
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: "!has(self.spec.deletionPolicy) || self.spec.deletionPolicy in ['Orphan', 'Delete']"
              message: "deletionPolicy must be either 'Orphan' or 'Delete'."
            - rule: "!has(self.spec.lifecycleControl) || !has(self.spec.lifecycleControl.drainTimeoutSeconds) || self.spec.lifecycleControl.drainTimeoutSeconds >= 0"
              message: "lifecycleControl.drainTimeoutSeconds must be greater than or equal to zero."
            - rule: "!has(self.spec.componentType) || self.spec.componentType != 'COMPONENT_TYPE_CUSTOM_3P_WRAPPER' || has(self.spec.wrapperRef)"
              message: "wrapperRef must be specified when componentType is COMPONENT_TYPE_CUSTOM_3P_WRAPPER."
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                  description: "Toggles active scheduling and operational presence."
                componentType:
                  type: string
                  enum:
                    - COMPONENT_TYPE_UNSPECIFIED
                    - COMPONENT_TYPE_CUSTOM_1P_COMPONENT
                    - COMPONENT_TYPE_CUSTOM_3P_WRAPPER
                  default: COMPONENT_TYPE_CUSTOM_1P_COMPONENT
                componentClass:
                  type: string
                  description: "Logical functional classification (e.g. analytical-db, event-stream, metrics-ingestion)."
                deletionProtection:
                  type: boolean
                  default: true
                deletionPolicy:
                  type: string
                  enum:
                    - Orphan
                    - Delete
                  default: Delete
                lifecycleControl:
                  type: object
                  properties:
                    cascade:
                      type: boolean
                      default: false
                    drainTimeoutSeconds:
                      type: integer
                      minimum: 0
                      default: 300
                    forceUpgrade:
                      type: boolean
                      default: false
                parameters:
                  type: object
                  additionalProperties:
                    type: string
                wrapperRef:
                  type: object
                  properties:
                    group:
                      type: string
                    version:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    observedGenerationPath:
                      type: string
                    readyConditionPath:
                      type: string
                    expectedReadyValue:
                      type: string
                    endpointJsonPath:
                      type: string
                    connectionSecretJsonPath:
                      type: string
                dependencies:
                  type: array
                  items:
                    type: string
                chartVersion:
                  type: string
                imageTag:
                  type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                state:
                  type: string
                access:
                  type: object
                  properties:
                    envVars:
                      type: object
                      additionalProperties:
                        type: string
                    secretEnvVars:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          secretName:
                            type: string
                          secretKey:
                            type: string
                    secretVolumeMounts:
                      type: array
                      items:
                        type: object
                        properties:
                          secretName:
                            type: string
                          mountPath:
                            type: string
                          items:
                            type: object
                            additionalProperties:
                              type: string
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string

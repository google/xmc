vars:
  # The Google Cloud Project ID (Required).
  # Used for Cloud Spanner database access and GCP resource identification.
  project_id: YOUR_PROJECT_ID

  # Development environment name suffix (default: dev).
  environment: dev

  # Local KinD Kubernetes cluster name (default: xmc-dev).
  cluster_name: xmc-dev

  # Cloud Spanner instance ID (default: xmc-{environment}).
  # spanner_instance: xmc-dev

  # Cloud Spanner database for Experiment State Server (default: dev-{environment}-local-ess).
  # ess_database: dev-dev-local-ess

  # Cloud Spanner database for XID Service (default: dev-{environment}-local-xid).
  # xid_database: dev-dev-local-xid

  # Whether to automatically apply database schema migrations on startup (default: true).
  auto_migrate: true

  # Feature flag: Enable metrics Configuration (ClickHouse chart data wiring).
  enable_metrics: false

  # Feature flag: Enable ROD data provider service (rod_data_provider).
  rod_deployment_enabled: false

  # Feature flag: Enable Health Service backing the Admin Panel (health_service).
  health_service_deployment_enabled: false

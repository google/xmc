# Whether the MLflow 3P Wrapper Component is enabled in the cluster catalog.
# Disabled by default; enable explicitly in your profile values overlay when an MLflow server is provisioned.
enabled: false

# Release maturity tier declared by the catalog ("EXPERIMENTAL", "PREVIEW", or "STABLE").
stability: EXPERIMENTAL

# Target Kubernetes namespace where the Component CR resides.
# Defaults to .Release.Namespace when non-default, or "xmc".
namespace: ""

# Admission guard preventing accidental deletion of the active Component CR when enabled.
deletionProtection: true

# Action taken on underlying resources when the Component CR is deleted ("Delete" or "Orphan").
deletionPolicy: Delete

# Connection, authentication, and health parameters projected into the Component CR
# for XMC services and training pods.
parameters:
  # MLflow tracking server URI used by XMC services and training pods.
  trackingUri: "http://mlflow-service.xmc.svc.cluster.local:5000"
  # Browser-facing MLflow UI base URL. Defaults to trackingUri when empty.
  uiBaseUrl: ""
  # Kubernetes Secret name holding MLflow credentials. Empty means an unauthenticated server.
  secretName: ""
  # Key within secretName containing a bearer token (mapped to MLFLOW_TRACKING_TOKEN).
  secretTokenKey: ""
  # Key within secretName containing a basic-auth username (mapped to MLFLOW_TRACKING_USERNAME).
  secretUsernameKey: ""
  # Key within secretName containing a basic-auth password (mapped to MLFLOW_TRACKING_PASSWORD).
  secretPasswordKey: ""
  # HTTP health check endpoint probed by xmc-bridge without credentials. Defaults to <trackingUri>/health.
  healthCheckEndpoint: ""

# Optional list of upstream XMC Component names that must be Ready before MLflow is reconciled.
dependencies: []

apiVersion: xmc.dev/v1alpha1
kind: Component
metadata:
  name: "mlflow"
  namespace: {{ .Values.namespace | default (ternary .Release.Namespace "xmc" (and (ne .Release.Namespace "") (ne .Release.Namespace "default"))) | quote }}
  labels:
    xmc.dev/profile: "stable-2026b"
    app.kubernetes.io/name: "mlflow"
    app.kubernetes.io/managed-by: {{ .Release.Service | default "Helm" | quote }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  enabled: {{ default false .Values.enabled }}
  componentType: COMPONENT_TYPE_CUSTOM_3P_WRAPPER
  componentClass: "experiment-tracker"
  version: {{ .Chart.Version | default "0.1.0" | quote }}
  chartVersion: {{ .Chart.Version | default "0.1.0" | quote }}
  stability: {{ .Values.stability | default "EXPERIMENTAL" | quote }}
  {{- if hasKey .Values "acknowledgeExperimental" }}
  acknowledgeExperimental: {{ .Values.acknowledgeExperimental }}
  {{- end }}
  deletionProtection: {{ if hasKey .Values "deletionProtection" }}{{ .Values.deletionProtection }}{{ else }}true{{ end }}
  deletionPolicy: {{ .Values.deletionPolicy | default "Delete" | quote }}
  {{- $params := .Values.parameters | default dict }}
  {{- $trackingUri := $params.trackingUri | default "http://mlflow-service.xmc.svc.cluster.local:5000" }}
  {{- $uiBaseUrl := $params.uiBaseUrl | default $trackingUri }}
  {{- $healthCheckEndpoint := $params.healthCheckEndpoint | default (printf "%s/health" (trimSuffix "/" $trackingUri)) }}
  parameters:
    trackingUri: {{ $trackingUri | quote }}
    uiBaseUrl: {{ $uiBaseUrl | quote }}
    {{- with $params.secretName }}
    secretName: {{ . | quote }}
    {{- end }}
    {{- with $params.secretTokenKey }}
    secretTokenKey: {{ . | quote }}
    {{- end }}
    {{- with $params.secretUsernameKey }}
    secretUsernameKey: {{ . | quote }}
    {{- end }}
    {{- with $params.secretPasswordKey }}
    secretPasswordKey: {{ . | quote }}
    {{- end }}
    healthCheckEndpoint: {{ $healthCheckEndpoint | quote }}
  {{- if .Values.dependencies }}
  dependencies: {{ .Values.dependencies | toYaml | nindent 4 }}
  {{- end }}

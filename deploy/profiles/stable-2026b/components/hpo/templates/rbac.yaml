{{- $ns := include "hpo.namespace" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: xmc-study-controller-components-reader
  namespace: {{ $ns | quote }}
  labels:
    {{- include "hpo.labels" . | nindent 4 }}
rules:
- apiGroups: ["xmc.dev"]
  resources: ["components"]
  resourceNames: ["vizier"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: xmc-study-controller-components-reader-binding
  namespace: {{ $ns | quote }}
  labels:
    {{- include "hpo.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: xmc-study-controller
  namespace: {{ $ns | quote }}
roleRef:
  kind: Role
  name: xmc-study-controller-components-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}

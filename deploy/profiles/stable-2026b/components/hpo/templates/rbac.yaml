{{- $ns := .Values.namespace | default (ternary .Release.Namespace "xmc" (and (ne .Release.Namespace "") (ne .Release.Namespace "default"))) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: xmc-study-controller-components-reader
  namespace: {{ $ns | quote }}
  labels:
    app: xmc-study-controller
    app.kubernetes.io/name: xmc-study-controller
    app.kubernetes.io/part-of: xmanager-cloud
    app.kubernetes.io/managed-by: {{ .Release.Service | default "Helm" | quote }}
    xmc.dev/component: hpo
rules:
- apiGroups: ["xmc.dev"]
  resources: ["components"]
  resourceNames: ["vizier"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: xmc-study-controller-components-reader-binding
  namespace: {{ $ns | quote }}
  labels:
    app: xmc-study-controller
    app.kubernetes.io/name: xmc-study-controller
    app.kubernetes.io/part-of: xmanager-cloud
    app.kubernetes.io/managed-by: {{ .Release.Service | default "Helm" | quote }}
    xmc.dev/component: hpo
subjects:
- kind: ServiceAccount
  name: xmc-study-controller
  namespace: {{ $ns | quote }}
roleRef:
  kind: Role
  name: xmc-study-controller-components-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}

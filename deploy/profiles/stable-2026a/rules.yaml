profile: "stable-2026a"

compatibilityMatrix:
  componentDependencies:
    - component: "ingestion-gateway"
      version: "1.0.0"
      requires:
        - component: "redpanda"
          versionRange: ">=1.0.0"
    - component: "clickhouse"
      version: "1.0.0"
      requiresPlatform:
        gkeVersionRange: ">=1.29.0"

staticChecks:
  enforceDeletionProtection: true
  maxDrainTimeoutSeconds: 3600
  enforceNamespaceScope: true

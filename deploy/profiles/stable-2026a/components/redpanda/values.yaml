# Whether the Redpanda 3P Wrapper Component is enabled in the cluster catalog.
# Disabled by default to preserve existing non-component deployments (enable_components: false).
enabled: false

# Target Kubernetes namespace where the Component CR and Redpanda resources reside.
# Defaults to .Release.Namespace when non-default, or "xmc".
namespace: ""

# Admission guard preventing accidental deletion of the active Component CR when enabled.
deletionProtection: true

# Action taken on underlying resources when the Component CR is deleted ("Delete" or "Orphan").
deletionPolicy: Delete

# Connection and sizing parameters projected into the Component CR for downstream XMC services and workloads.
parameters:
  # Comma-separated internal Kubernetes DNS endpoints for Redpanda Kafka API brokers.
  brokerEndpoints: "redpanda-0.redpanda.xmc.svc.cluster.local:9092"
  # Kafka protocol listener port exposed by the Redpanda broker service.
  kafkaPort: 9092
  # Default Kafka topic used by XMC metrics and event-streaming pipelines.
  defaultTopic: "xmc-metrics"
  # Persistent volume storage capacity per Redpanda broker node.
  storageSize: "10Gi"

# Optional list of upstream XMC Component names that must be Ready before Redpanda is reconciled.
dependencies: []

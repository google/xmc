{{- if not (hasPrefix "xmc-cmp-" .Release.Name) -}}
# Copyright 2026 Google LLC
# SPDX-License-Identifier: Apache-2.0
{{- $ig := .Values.ingestionGatewayDeployment | default dict }}
{{- $global := .Values.global | default dict }}
{{- $imgTag := $global.imageTag | default .Values.imageTag }}
{{- $params := .Values.parameters | default dict }}
apiVersion: xmc.dev/v1alpha1
kind: Component
metadata:
  name: "ingestion-gateway"
  namespace: {{ .Values.namespace | default (ternary .Release.Namespace "xmc" (and (ne .Release.Namespace "") (ne .Release.Namespace "default"))) | quote }}
  labels:
    xmc.dev/profile: "stable-2026a"
    xmc.dev/component-type: "custom-1p-component"
    app.kubernetes.io/name: "ingestion-gateway"
    app.kubernetes.io/managed-by: {{ .Release.Service | default "Helm" | quote }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  enabled: {{ if hasKey $ig "enabled" }}{{ $ig.enabled }}{{ else }}{{ default false .Values.enabled }}{{ end }}
  componentType: COMPONENT_TYPE_CUSTOM_1P_COMPONENT
  componentClass: "metrics-ingestion"
  version: {{ .Chart.Version | default "0.1.0" | quote }}
  chartVersion: {{ .Chart.Version | default "0.1.0" | quote }}
  {{- if $imgTag }}
  imageTag: {{ $imgTag | toString | quote }}
  {{- end }}
  deletionProtection: {{ if hasKey .Values "deletionProtection" }}{{ .Values.deletionProtection }}{{ else }}true{{ end }}
  deletionPolicy: {{ .Values.deletionPolicy | default "Delete" | quote }}
  {{- if .Values.dependencies }}
  dependencies:
    {{- range .Values.dependencies }}
    - {{ . | toString | quote }}
    {{- end }}
  {{- end }}
  parameters:
    port: {{ ($ig.port | default $params.port | default 8080) | toString | quote }}
    redpandaBrokers: {{ ($ig.redpandaBrokers | default $params.redpandaBrokers | default "redpanda-0.redpanda.xmc.svc.cluster.local:9092") | toString | quote }}
    topicName: {{ ($ig.topicName | default $params.topicName | default "xmc-metrics") | toString | quote }}
    minPartitions: {{ ($ig.minPartitions | default $params.minPartitions | default 128) | toString | quote }}
    minReplicas: {{ ($ig.minReplicas | default $params.minReplicas | default 1) | toString | quote }}
    {{- range $k, $v := $params }}
    {{- if not (has $k (list "port" "redpandaBrokers" "topicName" "minPartitions" "minReplicas")) }}
    {{ $k }}: {{ $v | toString | quote }}
    {{- end }}
    {{- end }}
{{- end }}

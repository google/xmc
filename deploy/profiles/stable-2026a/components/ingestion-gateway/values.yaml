enabled: true
componentClass: "metrics-ingestion"
deletionProtection: true
deletionPolicy: "Delete"

dependencies:
  - redpanda

lifecycleControl:
  cascade: false
  drainTimeoutSeconds: 300
  forceUpgrade: false

parameters:
  port: "8080"
  redpandaBrokers: "redpanda-0.redpanda.xmc.svc.cluster.local:9092"
  topicName: "xmc-metrics"
  minPartitions: "1"
  minReplicas: "1"

image:
  repository: "us-docker.pkg.dev/xmc-test-project-3/xmc/ingestion-gateway-vluk"
  tag: "latest"

service:
  port: 8080
  targetPort: 8080

# Whether the Vizier 3P Wrapper Component is enabled in the cluster catalog.
# Disabled by default; enable explicitly in your profile values overlay when Vizier is provisioned.
enabled: false

# Release maturity tier declared by the catalog ("EXPERIMENTAL", "PREVIEW", or "STABLE").
stability: EXPERIMENTAL

# Target Kubernetes namespace where the Component CR and Vizier service reside.
# Defaults to .Release.Namespace when non-default, or "xmc".
namespace: ""

# Admission guard preventing accidental deletion of the active Component CR when enabled.
deletionProtection: true

# Action taken on underlying resources when the Component CR is deleted ("Delete" or "Orphan").
deletionPolicy: Delete

# Connection parameters projected into the Component CR for downstream XMC services (e.g. hpo).
parameters:
  # Internal Kubernetes DNS endpoint (host:port) for the Open Source Vizier gRPC server.
  endpoint: "vizier-service.xmc.svc.cluster.local:7077"

# Optional list of upstream XMC Component names that must be Ready before Vizier is reconciled.
dependencies: []

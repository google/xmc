enabled: false
stability: EXPERIMENTAL
namespace: ""
imageTag: ""
deletionProtection: true
deletionPolicy: "Delete"
dependencies: ["vizier", "clickhouse"]
# Parameters projected into the Component CR and read by the Experiment State Server.
parameters:
  # Positive integer, at most 2147483647: the largest max_trial_budget a study may use. Larger
  # budgets are clamped to it with a WARNING when a study is created.
  maxTrialBudget: "1000"
  # Email of the Google service account of xmc-study-controller. It becomes the Workload Identity
  # annotation of its Kubernetes service account, and the Experiment State Server lets only this
  # identity create the work units (trials) of studies. Empty: no study can create trials.
  studyControllerServiceAccount: ""


# Rendered only for the xmc-cmp-hpo release that xmc-bridge installs; the stable-2026a profile
# release renders only the Component CR.
{{- $port := 8080 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmc-study-controller
  labels:
    app: xmc-study-controller
    app.kubernetes.io/name: xmc-study-controller
    app.kubernetes.io/part-of: xmanager-cloud
    app.kubernetes.io/managed-by: {{ .Release.Service | default "Helm" | quote }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: xmc-study-controller
  template:
    metadata:
      labels:
        app: xmc-study-controller
        app.kubernetes.io/name: xmc-study-controller
        # Admits the pod through the Vizier NetworkPolicy.
        xmc.google.com/vizier-client: "true"
    spec:
      serviceAccountName: xmc-study-controller
      # The Study Controller does not call the Kubernetes API.
      automountServiceAccountToken: false
      {{- with (.Values.hpoDeployment | default dict).terminationGracePeriodSeconds }}
      # Set by xmc-bridge from the Component drain timeout.
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: study-controller
        image: {{ include "hpo.image" . | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop: ["ALL"]
        args:
        - "-port={{ $port }}"
        ports:
        - containerPort: {{ $port }}
          name: http-port
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-port
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-port
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 256Mi
{{- end }}

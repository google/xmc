apiVersion: xmc.dev/v1alpha1
kind: Component
metadata:
  name: "clickhouse"
  namespace: {{ .Values.namespace | default (ternary .Release.Namespace "xmc" (and (ne .Release.Namespace "") (ne .Release.Namespace "default"))) | quote }}
  labels:
    xmc.dev/profile: "stable-2026a"
    app.kubernetes.io/name: "clickhouse"
    app.kubernetes.io/managed-by: {{ .Release.Service | default "Helm" | quote }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  enabled: {{ if hasKey .Values "enabled" }}{{ .Values.enabled }}{{ else }}false{{ end }}
  componentType: COMPONENT_TYPE_CUSTOM_3P_WRAPPER
  componentClass: "analytical-db"
  version: {{ .Chart.Version | default "0.1.0" | quote }}
  chartVersion: {{ .Chart.Version | default "0.1.0" | quote }}
  deletionProtection: {{ if hasKey .Values "deletionProtection" }}{{ .Values.deletionProtection }}{{ else }}true{{ end }}
  deletionPolicy: {{ .Values.deletionPolicy | default "Delete" | quote }}
  {{- $params := .Values.parameters | default dict }}
  {{- $host := $params.host | default "clickhouse.xmc-metrics.svc.cluster.local" }}
  {{- $nativePort := $params.nativePort | default 9000 | toString }}
  {{- $httpPort := $params.httpPort | default 8123 | toString }}
  parameters:
    host: {{ $host | quote }}
    clusterEndpoints: {{ $params.clusterEndpoints | default (printf "%s:%s" $host $nativePort) | quote }}
    nativePort: {{ $nativePort | quote }}
    httpPort: {{ $httpPort | quote }}
    defaultDatabase: {{ $params.defaultDatabase | default "default" | quote }}
    user: {{ $params.user | default "default" | quote }}
    secretName: {{ $params.secretName | default "clickhouse-secret" | quote }}
    secretPasswordKey: {{ $params.secretPasswordKey | default "clickhouse-password" | quote }}
    healthCheckEndpoint: {{ $params.healthCheckEndpoint | default (printf "http://%s:%s/ping" $host $httpPort) | quote }}
    storageSize: {{ $params.storageSize | default "10Gi" | quote }}
  {{- if .Values.dependencies }}
  dependencies: {{ .Values.dependencies | toYaml | nindent 4 }}
  {{- end }}

apiVersion: xmc.dev/v1alpha1
kind: Component
metadata:
  name: clickhouse
  namespace: {{ .Release.Namespace | default "xmc" }}
  labels:
    xmc.dev/profile: {{ if and .Values.global .Values.global.platformProfile }}{{ .Values.global.platformProfile }}{{ else }}stable-2026a{{ end }}
    app.kubernetes.io/name: clickhouse
spec:
  enabled: {{ if hasKey .Values "enabled" }}{{ .Values.enabled }}{{ else }}true{{ end }}
  componentType: COMPONENT_TYPE_CUSTOM_3P_WRAPPER
  componentClass: {{ .Values.componentClass | default "analytical-db" | quote }}
  deletionProtection: {{ if hasKey .Values "deletionProtection" }}{{ .Values.deletionProtection }}{{ else }}true{{ end }}
  deletionPolicy: {{ .Values.deletionPolicy | default "Delete" | quote }}
  lifecycleControl:
    cascade: {{ .Values.lifecycleControl.cascade | default false }}
    drainTimeoutSeconds: {{ .Values.lifecycleControl.drainTimeoutSeconds | default 3600 }}
    forceUpgrade: {{ .Values.lifecycleControl.forceUpgrade | default false }}
  {{- if .Values.wrapperRef }}
  wrapperRef:
    group: {{ .Values.wrapperRef.group | quote }}
    version: {{ .Values.wrapperRef.version | quote }}
    kind: {{ .Values.wrapperRef.kind | quote }}
    name: {{ .Values.wrapperRef.name | quote }}
    namespace: {{ .Values.wrapperRef.namespace | default .Release.Namespace | default "xmc" | quote }}
    observedGenerationPath: {{ .Values.wrapperRef.observedGenerationPath | quote }}
    readyConditionPath: {{ .Values.wrapperRef.readyConditionPath | quote }}
    expectedReadyValue: {{ .Values.wrapperRef.expectedReadyValue | default "Completed" | quote }}
  {{- end }}
  parameters:
    {{- toYaml .Values.parameters | nindent 4 }}

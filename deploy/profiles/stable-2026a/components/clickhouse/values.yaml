# Whether the ClickHouse 3P Wrapper Component is enabled in the cluster catalog.
# Disabled by default; enable explicitly in your profile values overlay when ClickHouse is provisioned.
enabled: false

# Release maturity tier declared by the catalog ("EXPERIMENTAL", "PREVIEW", or "STABLE").
stability: STABLE

# Target Kubernetes namespace where the Component CR and ClickHouse resources reside.
# Defaults to .Release.Namespace when non-default, or "xmc".
namespace: ""

# Admission guard preventing accidental deletion of the active Component CR when enabled.
deletionProtection: true

# Action taken on underlying resources when the Component CR is deleted ("Delete" or "Orphan").
deletionPolicy: Delete

# Connection, authentication, and health parameters projected into the Component CR
# for downstream XMC services (e.g. pkg/clickhouse, dashboard-service).
parameters:
  # ClickHouse server hostname or Kubernetes service FQDN (maps to CLICKHOUSE_HOST).
  host: "clickhouse.xmc-metrics.svc.cluster.local"
  # Comma-separated internal Kubernetes DNS endpoints for ClickHouse native protocol clients. If omitted, it is dynamically constructed from host and nativePort.
  clusterEndpoints: ""
  # ClickHouse native TCP protocol port exposed by the ClickHouse service (maps to CLICKHOUSE_PORT).
  nativePort: 9000
  # ClickHouse HTTP API listener port exposed by the ClickHouse service (used for HTTP queries and /ping health probes).
  httpPort: 8123
  # Default ClickHouse database used by XMC analytical and metrics workloads (maps to CLICKHOUSE_DATABASE).
  defaultDatabase: "default"
  # ClickHouse login username (maps to CLICKHOUSE_USER).
  user: "default"
  # Kubernetes Secret name containing the ClickHouse password (maps to CLICKHOUSE_PASSWORD secretKeyRef).
  secretName: "clickhouse-secret"
  # Key within secretName containing the ClickHouse password.
  secretPasswordKey: "clickhouse-password"
  # HTTP health check endpoint used to probe ClickHouse readiness. If omitted, it is dynamically constructed from host and httpPort.
  healthCheckEndpoint: ""
  # Persistent volume storage capacity per ClickHouse replica node.
  storageSize: "10Gi"

# Optional list of upstream XMC Component names that must be Ready before ClickHouse is reconciled.
dependencies: []

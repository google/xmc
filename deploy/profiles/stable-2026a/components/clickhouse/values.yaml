enabled: true
componentClass: "analytical-db"
deletionProtection: true
deletionPolicy: "Delete"

lifecycleControl:
  cascade: false
  drainTimeoutSeconds: 3600
  forceUpgrade: false

parameters:
  clusterEndpoints: "clickhouse.xmc-metrics.svc.cluster.local:9000"
  nativePort: "9000"
  httpPort: "8123"
  defaultDatabase: "default"
  storageSize: "10Gi"

wrapperRef:
  group: "clickhouse.altinity.com"
  version: "v1"
  kind: "ClickHouseInstallation"
  name: "xmc-clickhouse-dw"
  namespace: "xmc"
  observedGenerationPath: "$.status.observedGeneration"
  readyConditionPath: "$.status.status"
  expectedReadyValue: "Completed"

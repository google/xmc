# Plain (non-templated) Component CRD manifest.
#
# This file is the single source of truth for the Component schema. It is rendered into the
# cluster by templates/components/crd.yaml via .Files.Get, and loaded verbatim by the envtest
# integration suite in //test/integration so that admission behavior is asserted against the
# exact bytes that ship to production.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: components.xmc.dev
  labels:
    app.kubernetes.io/name: xmc
    app.kubernetes.io/part-of: xmanager-cloud
  annotations:
    # Retain the CRD on `helm uninstall`. Without this, removing the chart prunes the CRD and
    # cascade-deletes every Component on the cluster, including ones the bridge still manages.
    helm.sh/resource-policy: keep
spec:
  group: xmc.dev
  names:
    kind: Component
    listKind: ComponentList
    plural: components
    singular: component
    shortNames:
      - xcomp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .status.state
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Class
          type: string
          jsonPath: .spec.componentClass
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          # Only cross-field constraints belong here. Single-field constraints must be expressed in
          # the structural schema instead (enum, minimum, ...), because the API server evaluates
          # structural validation before CEL, which makes an equivalent CEL rule unreachable.
          x-kubernetes-validations:
            - rule: "!has(self.spec.componentType) || self.spec.componentType != 'COMPONENT_TYPE_CUSTOM_3P_WRAPPER' || has(self.spec.wrapperRef)"
              message: "wrapperRef must be specified when componentType is COMPONENT_TYPE_CUSTOM_3P_WRAPPER."
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                  description: "Indicates whether the component is enabled and should be active."
                componentType:
                  type: string
                  default: COMPONENT_TYPE_CUSTOM_1P_COMPONENT
                  enum:
                    - COMPONENT_TYPE_CUSTOM_1P_COMPONENT
                    - COMPONENT_TYPE_CUSTOM_3P_WRAPPER
                  description: "Distinguishes the underlying architecture and control plane model."
                componentClass:
                  type: string
                  description: "Classification identifier or category of the component."
                deletionProtection:
                  type: boolean
                  default: true
                  description: "Prevents accidental deletion of the component manifest."
                deletionPolicy:
                  type: string
                  enum:
                    - Orphan
                    - Delete
                  default: Delete
                  description: "Specifies cleanup behavior when the component is deleted."
                lifecycleControl:
                  type: object
                  description: "Lifecycle configuration including graceful drain timeouts and cascading behavior."
                  properties:
                    cascade:
                      type: boolean
                      description: "Whether deactivation cascades to dependent components."
                    drainTimeoutSeconds:
                      type: integer
                      minimum: 0
                      default: 300
                      description: "Maximum timeout allowed for the component to drain before force terminating."
                    forceUpgrade:
                      type: boolean
                      description: "Whether to bypass graceful drain checks during upgrades."
                parameters:
                  type: object
                  additionalProperties:
                    type: string
                  description: "Arbitrary key-value configuration parameters passed to the component."
                wrapperRef:
                  type: object
                  description: "Configuration and reference metadata for third-party CRDs and controllers."
                  required:
                    - group
                    - version
                    - kind
                    - name
                  properties:
                    group:
                      type: string
                      description: "API group of the target CRD."
                    version:
                      type: string
                      description: "API version of the target CRD."
                    kind:
                      type: string
                      description: "Kind of the target CRD."
                    name:
                      type: string
                      description: "Target resource name or controller identifier."
                    namespace:
                      type: string
                      description: "Target Kubernetes namespace where the wrapper/CRD operates."
                    observedGenerationPath:
                      type: string
                      description: "JSONPath or field path to observedGeneration in the underlying resource."
                    readyConditionPath:
                      type: string
                      description: "JSONPath or field path to evaluate ready condition."
                    expectedReadyValue:
                      type: string
                      description: "Expected value for the ready condition field to indicate readiness."
                    endpointJsonPath:
                      type: string
                      description: "JSONPath to extract endpoint coordinates."
                    connectionSecretJsonPath:
                      type: string
                      description: "JSONPath to extract connection secret details."
                dependencies:
                  type: array
                  items:
                    type: string
                  description: "List of component names that this component depends upon."
                version:
                  type: string
                  description: "Semantic version of the component."
                chartVersion:
                  type: string
                  description: "Helm chart version associated with the component."
                imageTag:
                  type: string
                  description: "Container image tag deployed for this component."
            status:
              type: object
              description: "Observed runtime status and health of the component."
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: "Most recent generation observed by the controller."
                state:
                  type: string
                  description: "Current lifecycle state of the component."
                access:
                  type: object
                  description: "Network and cluster access coordinates and environment variables."
                  properties:
                    envVars:
                      type: object
                      additionalProperties:
                        type: string
                      description: "Plain environment variables exposed to workloads."
                    secretEnvVars:
                      type: object
                      additionalProperties:
                        type: string
                      description: "Secret environment variable references exposed to workloads."
                    secretVolumeMounts:
                      type: object
                      additionalProperties:
                        type: string
                      description: "Secret volume mount definitions exposed to workloads."
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  description: "Conditions representing the latest observations of the component state."
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                        description: "Type of condition."
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                        description: "Status of the condition (True, False, Unknown)."
                      observedGeneration:
                        type: integer
                        format: int64
                        description: "Last observed generation when condition was set."
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: "Timestamp when condition transitioned."
                      reason:
                        type: string
                        description: "Machine-readable reason code."
                      message:
                        type: string
                        description: "Human-readable message describing condition."

# Plain (non-templated) deletion-protection ValidatingAdmissionPolicy manifest.
#
# This file is the single source of truth for the policy. It is rendered into the cluster by
# templates/components/deletion-vap.yaml via .Files.Get, and loaded verbatim by the envtest
# integration suite in //test/integration so that DELETE rejection is asserted against the
# exact bytes that ship to production.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: component-deletion-protection
  labels:
    app.kubernetes.io/name: xmc
    app.kubernetes.io/part-of: xmanager-cloud
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - xmc.dev
        apiVersions:
          - v1alpha1
        operations:
          - DELETE
        resources:
          - components
  matchConditions:
    - name: exclude-system-controllers-and-admin-breakglass
      expression: "request.userInfo.username != 'system:serviceaccount:kube-system:namespace-controller' && request.userInfo.username != 'system:serviceaccount:kube-system:generic-garbage-collector' && !('system:masters' in request.userInfo.groups) && !('xmc-platform-admins' in request.userInfo.groups)"
  validations:
    - expression: "has(oldObject.spec) && has(oldObject.spec.deletionProtection) && oldObject.spec.deletionProtection == false"
      message: "Deletion rejected: Component has deletionProtection enabled (or default true). Disable deletionProtection before deleting the manifest."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: component-deletion-protection-binding
  labels:
    app.kubernetes.io/name: xmc
    app.kubernetes.io/part-of: xmanager-cloud
spec:
  policyName: component-deletion-protection
  validationActions:
    - Deny
  matchResources: {}

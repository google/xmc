# Default values for xmanager-cloud.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

projectId: "YOUR_GCP_PROJECT_ID"
environment: "YOUR_ENVIRONMENT_NAME"
domainSuffix: "YOUR_DOMAIN_SUFFIX"
# Top-level URL for the XMC deployment. If set, this automatically configures
# gateway.uiHostname, gateway.apiHostname, gateway.grpcHostname, and ui.apiUrl.
xmcUrl: ""

taskSignatureTtlSeconds: 86400
isDevEnvironment: false
imageTag: latest
xid_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/xid-service-dev:latest"
actuator_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/actuator-dev:latest"
reconciler_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/reconciler-dev:latest"
ess_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/experiment-state-server-dev:latest"
health_service_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/health-service-dev:latest"
dashboard_service_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/dashboard-service-dev:latest"
rod_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/rod-dev:latest"
ingestion_gateway_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/ingestion-gateway-dev:latest"

essDeployment:
  enabled: true
  hpa:
    minReplicas: 3
    maxReplicas: 10

healthServiceDeployment:
  enabled: false

metrics:
  enabled: false

ingestionGatewayDeployment:
  enabled: false
  hpa:
    minReplicas: 3
    maxReplicas: 10
  redpandaBrokers: "redpanda-0.redpanda.xmc.svc.cluster.local:9092"
  topicName: "xmc-metrics"
  minPartitions: 128
  minReplicas: 3
  sasl:
    enabled: false
    mechanism: "SCRAM-SHA-256"
    secretName: ""
  tls:
    enabled: false
    secretName: ""
  serviceAccountName: "default"
  resources:
    requests:
      cpu: "10m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "256Mi"

rodDeployment:
  enabled: false
  serviceAccountName: "rod-data-provider-service-account"
  gcpServiceAccount: ""

healthService:
  gcpServiceAccount: ""

dashboardServiceDeployment:
  enabled: false

dashboardService:
  gcpServiceAccount: ""

detectInadmissibleWorkUnits: true
startupPodErrorCheckEnabled: true
statusMessageHistoryEnabled: true
redisAddr: "YOUR_REDIS_IP:6379"
redisPassword: "YOUR_REDIS_PASSWORD"
gcpServiceAccount: "YOUR_GCP_SERVICE_ACCOUNT_EMAIL"
managedXprofGcsBucket: ""

certs:
  type: "gts"
  email: "YOUR_EMAIL_FOR_CERTS"
  gts:
    keyId: "YOUR_GTS_KEY_ID"
    hmacKey: "YOUR_GTS_HMAC_KEY"

experimentStateServer:
  iap:
    httpAudience: "placeholder-http-audience"
    grpcAudience: "placeholder-grpc-audience"
  spannerDatabaseName: "projects/YOUR_GCP_PROJECT_ID/instances/YOUR_SPANNER_INSTANCE/databases/YOUR_SPANNER_DATABASE"

auth:
  iap:
    iapIssuer: "https://iap.googleapis.com"
    clientId: "YOUR_IAP_CLIENT_ID"
  allowedOrigins: ""
  mockAuth: false
  disableAuthentication: false
  # trustXForwardedProto forces the Authenticator to respect the X-Forwarded-Proto header.
  # WARNING: Only set to true if the upstream load balancer/ingress terminates TLS
  # and strips untrusted client headers to prevent header spoofing attacks.
  trustXForwardedProto: false
  allowedDomains: "YOUR_ALLOWED_DOMAINS"
  allowedEmails: "YOUR_ALLOWED_EMAILS"
  authorizedIamRole: "projects/YOUR_GCP_PROJECT_ID/roles/YOUR_ROLE"

# Overrides for the xid-service Spanner database. If empty, the conventional
# name projects/<projectId>/instances/xmc-<environment>/databases/xids-db-<environment>
# is used (mirrors experimentStateServer.spannerDatabaseName).
xidService:
  spannerDatabaseName: ""
  hpa:
    minReplicas: 3
    maxReplicas: 10

gateway:
  enabled: true
  name: "xmc-gateway"
  className: "gke-l7-global-external-managed"
  staticIp: "YOUR_GATEWAY_STATIC_IP"
  uiHostname: "YOUR_UI_HOSTNAME"
  apiHostname: "YOUR_API_HOSTNAME"
  grpcHostname: "YOUR_GRPC_HOSTNAME"
  certMap: ""
  sslCertificateName: "xmc-grpc-tls"

secrets:
  csi:
    enabled: false
    projectNumber: "YOUR_GCP_PROJECT_NUMBER"
    jwtSecretName: "backend-jwt-secret"
    oauthClientSecretName: "gcp-oauth-client-secret"
  development:
    # A placeholder for default JWT secret key for development environments.
    jwtSecret: "YOUR_JWT_SECRET"
    clientSecret: "YOUR_CLIENT_SECRET"

ui:
  enabled: true
  image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/ui-dev:latest"
  apiUrl: "https://YOUR_API_HOSTNAME/v1"
  refreshIntervalMs: "30000"



# Pass configuration to Kueue sub-chart
kueue:
  controllerManager:
    config:
      integrations:
        labelKeysToCopy:
          - "xmc.google.com/experiment-id"
          - "xmc.google.com/work-unit-id"

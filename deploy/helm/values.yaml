# Default values for xmanager-cloud.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

projectId: "YOUR_GCP_PROJECT_ID"
environment: "YOUR_ENVIRONMENT_NAME"
domainSuffix: "YOUR_DOMAIN_SUFFIX"
# Top-level URL for the XMC deployment. If set, this automatically configures
# gateway.uiHostname, gateway.apiHostname, gateway.grpcHostname, and ui.apiUrl.
xmcUrl: ""

taskSignatureTtlSeconds: 86400
isDevEnvironment: false
imageTag: latest
xid_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/xid-service-dev:latest"
actuator_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/actuator-dev:latest"
reconciler_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/reconciler-dev:latest"
ess_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/experiment-state-server-dev:latest"
health_service_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/health-service-dev:latest"
dashboard_service_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/dashboard-service-dev:latest"
rod_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/rod-dev:latest"
ingestion_gateway_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/ingestion-gateway-dev:latest"
log_monitor_custom_image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/log-monitor-dev:latest"
xmc_bridge_custom_image: ""

featureFlags:
  pause_scheduling_enabled: true

componentsDeployment:
  enabled: false
  cmsAddress: "grpc-service:50051"
  # Human-readable cluster label reported in CMS ownership fence declarations; defaults to release name when empty.
  clusterName: ""
  # Monotonic fencing epoch declared by xmc-bridge to CMS (>= 1).
  ownershipEpoch: 1
  # Default empty chartPath; dedicated per-component charts will be introduced in follow-up PRs.
  chartPath: ""
  probeInterval: "5s"
  probeTimeout: "2s"
  reconcileTimeout: "60s"
  # Number of Components xmc-bridge reconciles in parallel.
  maxConcurrentReconciles: 1
  rbac:
    # 3P wrapper custom resources that xmc-bridge may read (get, in the release namespace) through
    # spec.wrapperRef. Add an entry for every other wrapper kind a Component references.
    wrapperRules:
      - apiGroups: ["clickhouse.altinity.com"]
        resources: ["clickhouseinstallations"]
      - apiGroups: ["cluster.redpanda.com", "redpanda.vectorized.io"]
        resources: ["clusters", "redpandas"]
      - apiGroups: ["ray.io"]
        resources: ["rayclusters", "rayservices"]

essDeployment:
  enabled: true
  hpa:
    minReplicas: 3
    maxReplicas: 10

healthServiceDeployment:
  enabled: true

metrics:
  enabled: false
  # ClickHouse is Bring-Your-Own (BYO) infrastructure deployed out-of-band via
  # deploy/addons/metrics/clickhouse. The dashboard service chart data engine reads these
  # settings to serve GetChartData. Enabling metrics also makes ClickHouse a readiness
  # dependency of the dashboard service: its pods stay out of the Service endpoints while the
  # data engine cannot be built, so leave this disabled on releases without a ClickHouse.
  clickhouse:
    host: "clickhouse.xmc-metrics.svc.cluster.local"
    port: "9000"
    database: "default"
    user: "default"
    # Ignored when secrets.csi.enabled is true: the password is then read from Secret Manager
    # through the CSI mount rather than travelling through the release as a Helm value.
    password: ""

ingestionGatewayDeployment:
  # Deploys the gateway from this chart only while componentsDeployment.enabled is false. With
  # components enabled, the gateway is optional and installed via the stable-2026a
  # ingestion-gateway component chart (actuated by xmc-bridge).
  enabled: false
  hpa:
    minReplicas: 3
    maxReplicas: 10
  # Static defaults used when componentsDeployment.enabled is false or the redpanda Component CR
  # (xmc.dev/v1alpha1) is disabled/absent. When componentsDeployment.enabled is true and the
  # redpanda Component CR is enabled, ingestion-gateway resolves broker addresses and defaultTopic
  # dynamically from the Component CR.
  redpandaBrokers: "redpanda-0.redpanda.xmc.svc.cluster.local:9092"
  topicName: "xmc-metrics"
  minPartitions: 128
  minReplicas: 1
  sasl:
    enabled: false
    mechanism: "SCRAM-SHA-256"
    secretName: ""
  tls:
    enabled: false
    secretName: ""
  serviceAccountName: "default"
  resources:
    requests:
      cpu: "10m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "256Mi"

rodDeployment:
  enabled: true
  serviceAccountName: "rod-data-provider-service-account"
  gcpServiceAccount: ""

logMonitorDeployment:
  enabled: false

logMonitor:
  gcpServiceAccount: ""
  # Pub/Sub subscription ID (not the full resource path) created by the log_monitor module.
  subscriptionId: "xmc-log-monitor-subscription-YOUR_ENVIRONMENT_NAME"
  # Must match the keyword the logging sink filters on (log_monitor module logging_sink_custom_keyword).
  logKeyword: "XMC LOG:"
  maxConcurrentUpdates: 10

healthService:
  gcpServiceAccount: ""
  logMonitorResourceName: "projects/YOUR_GCP_PROJECT_ID/locations/YOUR_GCP_REGION/services/xmc-log-monitor-YOUR_ENVIRONMENT_NAME"
  observabilityUrl: ""
  cacheTTL: "15s"
  forceRefreshMaxRequests: 5
  forceRefreshWindow: "5s"
  # schedulingResumeBatchSize: Number of paused tasks replayed per batch from Spanner during resume.
  schedulingResumeBatchSize: 100
  # schedulingResumeMaxBacklog: Maximum unprocessed tasks in xmc-tasks-stream before resumption worker pauses replay.
  schedulingResumeMaxBacklog: 500

dashboardServiceDeployment:
  enabled: false

dashboardService:
  gcpServiceAccount: ""

reconciler:
  monitoring:
    # Deploy a Google Managed Prometheus PodMonitoring that scrapes the
    # reconciler's /metrics endpoint (MLRun RED metrics).
    enabled: false
    # Port on which the reconciler serves its Prometheus metrics endpoint.
    port: 8082
    # Scrape interval for the PodMonitoring endpoint.
    interval: 60s
redisAddr: "YOUR_REDIS_IP:6379"
redisPassword: "YOUR_REDIS_PASSWORD"
gcpServiceAccount: "YOUR_GCP_SERVICE_ACCOUNT_EMAIL"
managedXprofGcsBucket: ""

certs:
  type: "gts"
  email: "YOUR_EMAIL_FOR_CERTS"
  gts:
    keyId: "YOUR_GTS_KEY_ID"
    hmacKey: "YOUR_GTS_HMAC_KEY"

experimentStateServer:
  iap:
    httpAudience: "placeholder-http-audience"
    grpcAudience: "placeholder-grpc-audience"
  spannerDatabaseName: "projects/YOUR_GCP_PROJECT_ID/instances/YOUR_SPANNER_INSTANCE/databases/YOUR_SPANNER_DATABASE"

auth:
  # Absolute lifetime for the session token and cookie, in Go duration syntax.
  sessionTtl: "1h"
  # Lifetime of the session token issued by `xmc login`, in Go duration syntax (1m to 720h).
  cliSessionTtl: "12h"
  iap:
    iapIssuer: "https://iap.googleapis.com"
    clientId: "YOUR_IAP_CLIENT_ID"
  allowedOrigins: ""
  # Mock authentication is for local development only: rendering fails unless isDevEnvironment.
  mockAuth: false
  disableAuthentication: false
  # trustXForwardedProto forces the Authenticator to respect the X-Forwarded-Proto header.
  # WARNING: Only set to true if the upstream load balancer/ingress terminates TLS
  # and strips untrusted client headers to prevent header spoofing attacks.
  trustXForwardedProto: false
  allowedDomains: "YOUR_ALLOWED_DOMAINS"
  allowedEmails: "YOUR_ALLOWED_EMAILS"
  authorizedIamRole: "projects/YOUR_GCP_PROJECT_ID/roles/YOUR_ROLE"
  adminIamRole: "roles/owner"
  # Optional OAuth & authentication overrides for non-GCP, KinD, or local dev environments:
  # jwksUrl: ""      # Explicit JWKS URL for OIDC token verification (e.g. "https://auth.example.com/.well-known/jwks.json")
  # issuerUrl: ""    # OIDC issuer URL (e.g. "https://auth.example.com"); automatically derives jwksUrl if jwksUrl is not set
  # redirectUrl: ""  # Defaults to "https://{{ apiHostname }}/api/callback"
  # frontendUrl: ""  # Defaults to "https://{{ uiHostname }}"
  # authUrl: ""      # Defaults to Google OAuth2 auth URL ("https://accounts.google.com/o/oauth2/v2/auth")
  # tokenUrl: ""     # Defaults to Google OAuth2 token URL ("https://oauth2.googleapis.com/token")
  # apiUrl: ""       # Defaults to Google OIDC userinfo URL ("https://openidconnect.googleapis.com/v1/userinfo")
  # secureCookie: true # Set to false for plain HTTP local/KinD testing
  # googleApplicationCredentials: "" # Optional path to service account credentials JSON file

# Overrides for the xid-service Spanner database. If empty, the conventional
# name projects/<projectId>/instances/xmc-<environment>/databases/xids-db-<environment>
# is used (mirrors experimentStateServer.spannerDatabaseName).
xidService:
  spannerDatabaseName: ""
  hpa:
    minReplicas: 3
    maxReplicas: 10

gateway:
  enabled: true
  name: "xmc-gateway"
  className: "gke-l7-global-external-managed"
  staticIp: "YOUR_GATEWAY_STATIC_IP"
  uiHostname: "YOUR_UI_HOSTNAME"
  apiHostname: "YOUR_API_HOSTNAME"
  grpcHostname: "YOUR_GRPC_HOSTNAME"
  certMap: ""
  sslCertificateName: "xmc-grpc-tls"

secrets:
  csi:
    enabled: false
    projectNumber: "YOUR_GCP_PROJECT_NUMBER"
    jwtSecretName: "backend-jwt-secret"
    oauthClientSecretName: "gcp-oauth-client-secret"
    # Only read when metrics are enabled; the Secret Manager entry must exist in that case,
    # because a missing entry fails the CSI mount for every service sharing this provider class.
    clickhousePasswordSecretName: "clickhouse-password"
  development:
    # A placeholder for default JWT secret key for development environments.
    jwtSecret: "YOUR_JWT_SECRET"
    clientSecret: "YOUR_CLIENT_SECRET"

ui:
  enabled: true
  image: "us-docker.pkg.dev/YOUR_GCP_PROJECT_ID/xmc/ui-dev:latest"
  apiUrl: "https://YOUR_API_HOSTNAME/v1"
  refreshIntervalMs: "30000"

# Per-container defaults and ceilings for the queue namespaces, applied as a
# `LimitRange`.
#
# `ResourceSet` puts `cpu_resources` and `gpu_resources` in a `oneof`, so a job
# asking for a GPU cannot also ask for CPU or memory. Its pod arrives with no
# request for either, which makes it BestEffort, and the kubelet evicts
# BestEffort pods first. `defaultRequest` supplies what the client could not
# send. It reaches only containers naming no request of their own, and sets no
# limit, so a job may still burst above it.
#
# `max` is not a promise that a container fits. Quota is a sum over the fleet,
# so a container can be admitted against quota and still find no single node
# with room. Set it to the capacity of the largest node the queue can reach,
# which at least rejects what nothing could ever host. A deployment whose pools
# differ in size can only state the larger.
queues:
  cpu:
    limits:
      defaultRequest:
        cpu: "500m"
        memory: "2Gi"
      max:
        cpu: "4"
        memory: "16Gi"
  gpu:
    limits:
      defaultRequest:
        cpu: "2"
        memory: "12Gi"
      max:
        cpu: "384"
        memory: "1440Gi"

# Pass configuration to Kueue sub-chart
kueue:
  controllerManager:
    config:
      integrations:
        labelKeysToCopy:
          - "xmc.google.com/experiment-id"
          - "xmc.google.com/work-unit-id"

# Remote Kubernetes cluster configuration (for hybrid KinD control plane + remote GKE workload execution)
remoteK8s:
  enabled: false
  secretName: "remote-k8s-config"

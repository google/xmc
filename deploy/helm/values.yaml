# Default values for xmanager-cloud.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

projectId: ~
environment: ~
domainSuffix: ~
taskSignatureTtlSeconds: 86400
isDevEnvironment: false
imageTag: latest
xid_custom_image: ""
actuator_custom_image: ""
reconciler_custom_image: ""
ess_custom_image: ""
defaultToCursorPagination: false
detectInadmissibleWorkUnits: false
startupPodErrorCheckEnabled: false
statusMessageHistoryEnabled: false
redisAddr: ""

experimentStateServer:
  iap:
    iapIssuer: ""
    httpAudience: ""
    grpcAudience: ""
    clientId: ""
  allowedOrigins: ""

# Pass configuration to Kueue sub-chart
kueue:
  controllerManager:
    config:
      integrations:
        labelKeysToCopy:
          - "xmc.google.com/experiment-id"
          - "xmc.google.com/work-unit-id"

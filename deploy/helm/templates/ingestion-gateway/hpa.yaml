# Defines the Horizontal Pod Autoscaler for the Ingestion Gateway Deployment.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion-gateway-deployment
  minReplicas: {{ .Values.ingestionGatewayDeployment.hpa.minReplicas | default 3 }}
  maxReplicas: {{ .Values.ingestionGatewayDeployment.hpa.maxReplicas | default 10 }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
{{- end }}

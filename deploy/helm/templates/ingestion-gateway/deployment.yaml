apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-gateway-deployment
  labels:
    app: ingestion-gateway
spec:
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: ingestion-gateway
  template:
    metadata:
      labels:
        app: ingestion-gateway
    spec:
      serviceAccountName: default
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- if and .Values.ingestionGatewayDeployment.sasl (and .Values.ingestionGatewayDeployment.sasl.enabled .Values.ingestionGatewayDeployment.sasl.secretName) }}
      volumes:
      - name: kafka-sasl-credentials
        secret:
          secretName: {{ .Values.ingestionGatewayDeployment.sasl.secretName }}
      {{- end }}
      containers:
      - name: ingestion-gateway
        image: {{ .Values.ingestion_gateway_custom_image | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        {{- if and .Values.ingestionGatewayDeployment.sasl (and .Values.ingestionGatewayDeployment.sasl.enabled .Values.ingestionGatewayDeployment.sasl.secretName) }}
        volumeMounts:
        - name: kafka-sasl-credentials
          mountPath: /etc/kafka/credentials
          readOnly: true
        {{- end }}
        ports:
        - containerPort: 8080
          name: http-port
        args:
        - "-port=8080"
        - "-redpanda_brokers={{ .Values.ingestionGatewayDeployment.redpandaBrokers | default "redpanda-0.redpanda.xmc.svc.cluster.local:9092" }}"
        - "-topic_name={{ .Values.ingestionGatewayDeployment.topicName | default "xmc-metrics" }}"
        - "-min_partitions={{ .Values.ingestionGatewayDeployment.minPartitions | default 128 }}"
        - "-min_replicas={{ .Values.ingestionGatewayDeployment.minReplicas | default 3 }}"
        - "-project_id={{ .Values.projectId }}"
        {{- if .Values.ingestionGatewayDeployment.sasl }}
        - "-sasl_enabled={{ .Values.ingestionGatewayDeployment.sasl.enabled | default false }}"
        {{- if .Values.ingestionGatewayDeployment.sasl.enabled }}
        - "-sasl_mechanism={{ .Values.ingestionGatewayDeployment.sasl.mechanism | default "SCRAM-SHA-256" }}"
        - "-sasl_credentials_dir=/etc/kafka/credentials"
        {{- end }}
        {{- end }}
        {{- if .Values.ingestionGatewayDeployment.tls }}
        - "-tls_enabled={{ .Values.ingestionGatewayDeployment.tls.enabled | default false }}"
        {{- end }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
{{- end }}

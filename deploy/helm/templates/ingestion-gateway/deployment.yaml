{{- if and .Values.ingestionGatewayDeployment .Values.ingestionGatewayDeployment.enabled (not (and .Values.componentsDeployment .Values.componentsDeployment.enabled)) (not .Values.ingestionGatewayDeployment.managedByComponent) -}}
{{- $sasl := .Values.ingestionGatewayDeployment.sasl | default dict -}}
{{- $tls := .Values.ingestionGatewayDeployment.tls | default dict -}}
{{- $useSasl := and $sasl.enabled $sasl.secretName -}}
{{- $useTls := and $tls.enabled $tls.secretName -}}
{{- $port := .Values.ingestionGatewayDeployment.port | default 8080 -}}
{{- $global := .Values.global | default dict -}}
{{- $globalTag := $global.imageTag | default "" -}}
{{- $igImg := (.Values.ingestionGatewayDeployment.image | default "" | toString) -}}
{{- $baseStr := (.Values.ingestion_gateway_custom_image | default "us-docker.pkg.dev/xmc-prod/xmc/ingestion-gateway" | toString) -}}
{{- $resolvedImage := $baseStr -}}
{{- if $igImg -}}
  {{- $resolvedImage = ternary (printf "%s:%s" $igImg $globalTag) $igImg (and (ne $globalTag "") (not (regexMatch ":[^:/]+$" $igImg)) (not (contains "@sha256:" $igImg))) -}}
{{- else if and $globalTag (not (contains "@sha256:" $baseStr)) -}}
  {{- $resolvedImage = printf "%s:%s" (regexReplaceAll ":[^:/]+$" $baseStr "") $globalTag -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-gateway-deployment
  labels:
    app: ingestion-gateway
spec:
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: ingestion-gateway
  template:
    metadata:
      labels:
        app: ingestion-gateway
    spec:
      serviceAccountName: {{ .Values.ingestionGatewayDeployment.serviceAccountName | default "default" }}
      {{- if .Values.ingestionGatewayDeployment.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.ingestionGatewayDeployment.terminationGracePeriodSeconds }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- if or $useSasl $useTls }}
      volumes:
      {{- if $useSasl }}
      - name: kafka-sasl-credentials
        secret:
          secretName: {{ $sasl.secretName }}
      {{- end }}
      {{- if $useTls }}
      - name: kafka-tls-credentials
        secret:
          secretName: {{ $tls.secretName }}
      {{- end }}
      {{- end }}
      containers:
      - name: ingestion-gateway
        image: {{ $resolvedImage | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        {{- if or $useSasl $useTls }}
        volumeMounts:
        {{- if $useSasl }}
        - name: kafka-sasl-credentials
          mountPath: /etc/kafka/credentials
          readOnly: true
        {{- end }}
        {{- if $useTls }}
        - name: kafka-tls-credentials
          mountPath: /etc/kafka/tls
          readOnly: true
        {{- end }}
        {{- end }}
        ports:
        - containerPort: {{ $port }}
          name: http-port
        args:
        - "-port={{ $port }}"
        - "-enable_components={{ .Values.componentsDeployment.enabled | default false }}"
        - "-components_namespace={{ .Release.Namespace | default "xmc" }}"
        - "-redpanda_brokers={{ .Values.ingestionGatewayDeployment.redpandaBrokers | default "redpanda-0.redpanda.xmc.svc.cluster.local:9092" }}"
        - "-topic_name={{ .Values.ingestionGatewayDeployment.topicName | default "xmc-metrics" }}"
        - "-min_partitions={{ .Values.ingestionGatewayDeployment.minPartitions | default 128 }}"
        - "-min_replicas={{ .Values.ingestionGatewayDeployment.minReplicas | default 3 }}"
        - "-project_id={{ .Values.projectId }}"
        {{- if .Values.ingestionGatewayDeployment.sasl }}
        - "-sasl_enabled={{ $sasl.enabled | default false }}"
        {{- if $useSasl }}
        - "-sasl_mechanism={{ $sasl.mechanism | default "SCRAM-SHA-256" }}"
        - "-sasl_credentials_dir=/etc/kafka/credentials"
        {{- end }}
        {{- end }}
        {{- if .Values.ingestionGatewayDeployment.tls }}
        - "-tls_enabled={{ .Values.ingestionGatewayDeployment.tls.enabled | default false }}"
        {{- end }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ $port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ $port }}
          initialDelaySeconds: 10
          periodSeconds: 10
        {{- if .Values.ingestionGatewayDeployment.resources }}
        resources:
          {{- toYaml .Values.ingestionGatewayDeployment.resources | nindent 10 }}
        {{- end }}
{{- end }}

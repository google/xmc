apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingestion-gateway-components-reader
  labels:
    app: ingestion-gateway
    app.kubernetes.io/part-of: xmanager-cloud
rules:
  - apiGroups: ["xmc.dev"]
    resources: ["components"]
    resourceNames: ["redpanda"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingestion-gateway-components-reader-binding
  labels:
    app: ingestion-gateway
    app.kubernetes.io/part-of: xmanager-cloud
subjects:
  - kind: ServiceAccount
    name: {{ ((.Values.ingestionGatewayDeployment | default dict).serviceAccountName) | default "default" }}
    namespace: {{ .Release.Namespace | default "xmc" }}
roleRef:
  kind: Role
  name: ingestion-gateway-components-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciler-deployment
  labels:
    app: reconciler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reconciler
  template:
    metadata:
      labels:
        app: reconciler
    spec:
      serviceAccountName: reconciler-service-account
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: reconciler
        image: {{ .Values.reconciler_custom_image | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        ports:
        # Dedicated metrics port served by the reconciler's own metrics server,
        # which exposes the global default registry (the reconciler's promauto
        # metrics, e.g. jobset_reconciler_mlrun_*). The manager's built-in
        # server (":8081") serves only the controller-runtime registry and is
        # not scraped. Named so PodMonitoring can reference it.
        - containerPort: {{ .Values.reconciler | default dict | dig "monitoring" "port" 8082 }}
          name: metrics
        envFrom:
        - configMapRef:
            name: reconciler-config
        {{- $gac := dig "auth" "googleApplicationCredentials" .Values.googleApplicationCredentials .Values.AsMap }}
        {{- if $gac }}
        env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: {{ $gac | quote }}
        {{- end }}
        args:
        - "-alsologtostderr"
        - "--logtostderr"
        - "--enforce_kernel_ipv6_support=false"
        - "--enable_streamz_rpc_service=false"
        - "--securewrapper_dummyimpl_auth_user=$(USER)"
        - "--streamz_servers="
        - "--envelope_enabled=false"
        - "--notracelog"
        - "--remote_coredump_enabled"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        {{- if $gac }}
        volumeMounts:
        - name: gcp-secrets-fallback
          mountPath: /etc/gcp-secrets
          readOnly: true
        {{- end }}
      {{- if $gac }}
      volumes:
      - name: gcp-secrets-fallback
        secret:
          secretName: gcp-sa-key
          items:
          - key: key.json
            path: key.json
      {{- end }}

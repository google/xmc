apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciler-deployment
  labels:
    app: reconciler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reconciler
  template:
    metadata:
      labels:
        app: reconciler
    spec:
      serviceAccountName: reconciler-service-account
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: reconciler
        image: {{ .Values.reconciler_custom_image | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        ports:
        # Metrics port served by the controller-runtime manager's metrics
        # server. It exposes the controller-runtime registry, which holds both
        # the built-in controller/workqueue metrics and the reconciler's own
        # metrics (e.g. jobset_reconciler_mlrun_*). Named so PodMonitoring can
        # reference it.
        - containerPort: {{ .Values.reconciler | default dict | dig "monitoring" "port" 8082 }}
          name: metrics
        envFrom:
        - configMapRef:
            name: reconciler-config
        - configMapRef:
            name: feature-flags-config
        {{- $auth := default (dict) .Values.auth }}
        {{- $gac := default .Values.googleApplicationCredentials $auth.googleApplicationCredentials }}
        {{- $remoteK8s := default (dict) .Values.remoteK8s }}
        {{- if or $gac $remoteK8s.enabled }}
        env:
        {{- if $gac }}
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: {{ $gac | quote }}
        {{- end }}
        {{- if $remoteK8s.enabled }}
        - name: KUBECONFIG
          value: "/etc/remote-k8s/kubeconfig"
        {{- end }}
        {{- end }}
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        {{- if or $gac $remoteK8s.enabled }}
        volumeMounts:
        {{- if $gac }}
        - name: gcp-secrets-fallback
          mountPath: /etc/gcp-secrets
          readOnly: true
        {{- end }}
        {{- if $remoteK8s.enabled }}
        - name: remote-k8s-config-volume
          mountPath: /etc/remote-k8s
          readOnly: true
        {{- end }}
        {{- end }}
      {{- if or $gac $remoteK8s.enabled }}
      volumes:
      {{- if $gac }}
      - name: gcp-secrets-fallback
        secret:
          secretName: gcp-sa-key
          items:
          - key: key.json
            path: key.json
      {{- end }}
      {{- if $remoteK8s.enabled }}
      - name: remote-k8s-config-volume
        secret:
          secretName: {{ default "remote-k8s-config" $remoteK8s.secretName | quote }}
          items:
          - key: kubeconfig
            path: kubeconfig
      {{- end }}
      {{- end }}

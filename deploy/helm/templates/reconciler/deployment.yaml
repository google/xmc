apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconciler-deployment
  labels:
    app: reconciler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reconciler
  template:
    metadata:
      labels:
        app: reconciler
    spec:
      serviceAccountName: reconciler-service-account
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: reconciler
        image: {{ .Values.reconciler_custom_image | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        ports:
        # Metrics port served by controller-runtime (MetricsBindAddress ":8081").
        # Named so the PodMonitoring endpoint can reference it by name.
        - containerPort: 8081
          name: metrics
        envFrom:
        - configMapRef:
            name: reconciler-config
        args:
        - "-alsologtostderr"
        - "--logtostderr"
        - "--enforce_kernel_ipv6_support=false"
        - "--enable_streamz_rpc_service=false"
        - "--securewrapper_dummyimpl_auth_user=$(USER)"
        - "--streamz_servers="
        - "--envelope_enabled=false"
        - "--notracelog"
        - "--remote_coredump_enabled"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20

apiVersion: v1
kind: ConfigMap
metadata:
  name: reconciler-config
  labels:
    app: reconciler
data:
  spanner_database_name: {{ .Values.experimentStateServer.spannerDatabaseName | default (printf "projects/%s/instances/xmc-%s/databases/experiment-db-%s" .Values.projectId .Values.environment .Values.environment) | quote }}
  quota_project_id: {{ .Values.projectId | quote }}
  batcher_tick_duration: "250ms"
  kueue_sync_tick_duration: "60s"
  max_concurrent_kueue_sync_reconciles: "1000"
  startup_pod_error_check_time: "2m"
  kube_api_qps: "100"
  kube_api_burst: "200"
  metrics_port: {{ .Values.reconciler | default dict | dig "monitoring" "port" 8082 | quote }}
  {{- if .Values.isDevEnvironment }}
  XMC_PROJECT_ID: {{ .Values.projectId | quote }}
  XMC_CLUSTER_NAME: {{ .Values.clusterName | default (printf "xmc-%s" .Values.environment) | quote }}
  XMC_CLUSTER_LOCATION: {{ .Values.clusterLocation | default "local" | quote }}
  {{- end }}

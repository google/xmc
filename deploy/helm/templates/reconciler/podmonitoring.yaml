{{- if (.Values.reconciler | default dict).monitoring | default dict | dig "enabled" false }}
# PodMonitoring is the Google Managed Prometheus (GMP) CRD
# (monitoring.googleapis.com/v1), NOT the prometheus-operator PodMonitor. It
# tells GKE managed collection to scrape the reconciler's /metrics endpoint.
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: reconciler-monitoring
  labels:
    app: reconciler
spec:
  selector:
    matchLabels:
      app: reconciler
  endpoints:
  - port: metrics
    scheme: http
    path: /metrics
    interval: {{ (.Values.reconciler | default dict).monitoring | default dict | dig "interval" "60s" }}
{{- end }}

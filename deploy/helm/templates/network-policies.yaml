{{- $useRedpanda := ne (.Values.ingestionGatewayDeployment.messageBus | default "redpanda") "pubsub" -}}
{{- if .Values.ingestionGatewayDeployment.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ingestion-gateway-network-policy
  labels:
    {{- include "xmanager-cloud.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: ingestion-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              xmc.google.com/metrics-client: "true"
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    {{- if $useRedpanda }}
    - ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9094
        - protocol: TCP
          port: 9644
    {{- else }}
    # Pub/Sub mode authenticates through GKE Workload Identity, which fetches tokens
    # from the node-local metadata server over plain HTTP. Some dataplanes exempt
    # link-local traffic from policy enforcement and some do not, so allow it
    # explicitly rather than depending on that.
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    {{- end }}
{{- end }}

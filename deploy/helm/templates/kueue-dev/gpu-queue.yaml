{{- $queue := (.Values.queues).gpu | default dict }}
{{- $limits := $queue.limits | default dict }}
{{- $flavors := $queue.flavors | default list }}
{{- $covered := list }}
{{- range $flavors }}
{{- $declared := keys (.resources | default dict) | sortAlpha }}
{{- if not $declared }}{{ fail (printf "gpu queue flavor %q declares no resources" .name) }}{{ end }}
{{- if not $covered }}{{ $covered = $declared }}{{ end }}
{{- if ne (toJson $declared) (toJson $covered) }}{{ fail (printf "gpu queue flavor %q declares %v, but the queue covers %v" .name $declared $covered) }}{{ end }}
{{- end }}
{{- range $flavors }}
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: {{ .name }}
spec:
{{- if .nodeLabels }}
  nodeLabels:
    {{- toYaml .nodeLabels | nindent 4 }}
{{- else }}
  nodeLabels: {}
{{- end }}
{{- if .tolerations }}
  # Kueue copies these into the ProvisioningRequest's PodTemplate, which is built
  # from the podset and so never passes through the admission controller that
  # tolerates a node's accelerator taint for a real pod.
  tolerations:
    {{- toYaml .tolerations | nindent 4 }}
{{- end }}
---
{{- end }}
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gpu-cluster-queue
spec:
  namespaceSelector: {}
  preemption:
    withinClusterQueue: {{ ($queue.preemption).withinClusterQueue | default "Never" }}
{{- $checks := list }}
{{- if ($queue.multikueue).clusters }}
{{- /* Carries no `onFlavors`, so it runs for every workload, and the queue then
       runs nothing locally: the quota becomes a claim about the workers. */}}
{{- $checks = append $checks (dict "name" "multikueue-gpu") }}
{{- end }}
{{- /* Kueue keys `admissionChecks` by name, so every flavor naming the same
       check has to arrive as one entry listing them all. */}}
{{- $checkOrder := list }}
{{- $checkFlavors := dict }}
{{- range $flavors }}
{{- if .admissionCheck }}
{{- if not (hasKey $checkFlavors .admissionCheck) }}
{{- $checkOrder = append $checkOrder .admissionCheck }}
{{- $_ := set $checkFlavors .admissionCheck list }}
{{- end }}
{{- $_ := set $checkFlavors .admissionCheck (append (index $checkFlavors .admissionCheck) .name) }}
{{- end }}
{{- end }}
{{- range $checkOrder }}
{{- $checks = append $checks (dict "name" . "onFlavors" (index $checkFlavors .)) }}
{{- end }}
{{- if $checks }}
  admissionChecksStrategy:
    admissionChecks:
      {{- toYaml $checks | nindent 6 }}
{{- end }}
{{- if $flavors }}
  resourceGroups:
  - coveredResources: {{ $covered | toJson }}
    flavors:
    {{- range $flavors }}
    - name: {{ .name }}
      resources:
      {{- $resources := .resources }}
      {{- range $covered }}
      - name: {{ . | quote }}
        nominalQuota: {{ index $resources . | quote }}
      {{- end }}
    {{- end }}
{{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: "gpu-queue"
---
apiVersion: v1
kind: LimitRange
metadata:
  namespace: "gpu-queue"
  name: "gpu-queue-defaults"
spec:
  limits:
  # Supplies the request XMC's jobs cannot send, and a ceiling nothing could
  # host. See `queues` in `values.yaml`.
  - type: Container
    defaultRequest:
      cpu: {{ ($limits.defaultRequest).cpu | default "2" | quote }}
      memory: {{ ($limits.defaultRequest).memory | default "12Gi" | quote }}
    max:
      cpu: {{ ($limits.max).cpu | default "384" | quote }}
      memory: {{ ($limits.max).memory | default "1440Gi" | quote }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  namespace: "gpu-queue"
  name: "gpu-queue"
spec:
  clusterQueue: "gpu-cluster-queue"

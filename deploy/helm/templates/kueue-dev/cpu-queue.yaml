{{- $queue := (.Values.queues).cpu | default dict }}
{{- $limits := $queue.limits | default dict }}
{{- $flavors := $queue.flavors | default list }}
{{- $covered := list }}
{{- range $flavors }}
{{- $declared := keys (.resources | default dict) | sortAlpha }}
{{- if not $declared }}{{ fail (printf "cpu queue flavor %q declares no resources" .name) }}{{ end }}
{{- if not $covered }}{{ $covered = $declared }}{{ end }}
{{- if ne (toJson $declared) (toJson $covered) }}{{ fail (printf "cpu queue flavor %q declares %v, but the queue covers %v" .name $declared $covered) }}{{ end }}
{{- end }}
{{- range $flavors }}
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: {{ .name }}
spec:
{{- if .nodeLabels }}
  nodeLabels:
    {{- toYaml .nodeLabels | nindent 4 }}
{{- else }}
  nodeLabels: {}
{{- end }}
---
{{- end }}
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: "cpu-cluster-queue"
spec:
  namespaceSelector: {}
  preemption:
    withinClusterQueue: {{ ($queue.preemption).withinClusterQueue | default "Never" }}
{{- if ($queue.multikueue).clusters }}
  # Everything this queue admits runs on a worker, so the quota below describes
  # the workers' capacity rather than this cluster's.
  admissionChecksStrategy:
    admissionChecks:
    # No `onFlavors`, so the check runs for every workload in the queue.
    - name: multikueue-cpu
{{- end }}
{{- if $flavors }}
  resourceGroups:
  - coveredResources: {{ $covered | toJson }}
    flavors:
    {{- range $flavors }}
    - name: {{ .name }}
      resources:
      {{- $resources := .resources }}
      {{- range $covered }}
      - name: {{ . | quote }}
        nominalQuota: {{ index $resources . | quote }}
      {{- end }}
    {{- end }}
{{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: "cpu-queue"
---
apiVersion: v1
kind: LimitRange
metadata:
  namespace: "cpu-queue"
  name: "cpu-queue-defaults"
spec:
  limits:
  # Supplies the request XMC's jobs cannot send, and a ceiling nothing could
  # host. See `queues` in `values.yaml`.
  - type: Container
    defaultRequest:
      cpu: {{ ($limits.defaultRequest).cpu | default "500m" | quote }}
      memory: {{ ($limits.defaultRequest).memory | default "2Gi" | quote }}
    max:
      cpu: {{ ($limits.max).cpu | default "4" | quote }}
      memory: {{ ($limits.max).memory | default "16Gi" | quote }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  namespace: "cpu-queue"
  name: "cpu-queue"
spec:
  clusterQueue: "cpu-cluster-queue"

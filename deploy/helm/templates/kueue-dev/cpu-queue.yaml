{{- $limits := (((.Values.queues).cpu).limits) | default dict }}
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: cpu-flavor
spec:
  nodeLabels: {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: "cpu-cluster-queue"
spec:
  namespaceSelector: {}
  resourceGroups:
  - coveredResources: ["cpu", "memory"]
    flavors:
    - name: "cpu-flavor"
      resources:
      - name: "cpu"
        nominalQuota: 100000000
      - name: "memory"
        nominalQuota: 100000000Gi
---
apiVersion: v1
kind: Namespace
metadata:
  name: "cpu-queue"
---
apiVersion: v1
kind: LimitRange
metadata:
  namespace: "cpu-queue"
  name: "cpu-queue-defaults"
spec:
  limits:
  # Supplies the request XMC's jobs cannot send, and a ceiling nothing could
  # host. See `queues` in `values.yaml`.
  - type: Container
    defaultRequest:
      cpu: {{ ($limits.defaultRequest).cpu | default "500m" | quote }}
      memory: {{ ($limits.defaultRequest).memory | default "2Gi" | quote }}
    max:
      cpu: {{ ($limits.max).cpu | default "4" | quote }}
      memory: {{ ($limits.max).memory | default "16Gi" | quote }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  namespace: "cpu-queue"
  name: "cpu-queue"
spec:
  clusterQueue: "cpu-cluster-queue"

apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tpu-flavor
spec:
  nodeLabels: {}
  tolerations:
  - key: "google.com/tpu"
    operator: "Equal"
    value: "present"
    effect: "NoSchedule"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tpu-cluster-queue
spec:
  namespaceSelector: {}
  resourceGroups:
  - coveredResources: ["google.com/tpu", "cpu", "memory"]
    flavors:
    - name: tpu-flavor
      resources:
      - name: google.com/tpu
        nominalQuota: 100000000
      - name: "cpu"
        nominalQuota: 100000000
      - name: "memory"
        nominalQuota: 100000000Gi
---
apiVersion: v1
kind: Namespace
metadata:
  name: "tpu-queue"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  namespace: tpu-queue
  name: tpu-queue
spec:
  clusterQueue: tpu-cluster-queue
{{- if .Values.logMonitorDeployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-monitor-deployment
  labels:
    app: log-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-monitor
  template:
    metadata:
      annotations:
        checksum/db-config: {{ include (print $.Template.BasePath "/db-config.yaml") . | sha256sum }}
      labels:
        app: log-monitor
    spec:
      serviceAccountName: log-monitor-service-account
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: log-monitor
        image: {{ .Values.log_monitor_custom_image | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: {{ .Values.projectId | quote }}
        - name: PUBSUB_SUBSCRIPTION_ID
          value: {{ .Values.logMonitor.subscriptionId | quote }}
        envFrom:
        - configMapRef:
            name: db-config
        args:
        - "-log_keyword={{ .Values.logMonitor.logKeyword }}"
        - "-max_concurrent_updates={{ .Values.logMonitor.maxConcurrentUpdates }}"
        # /readyz checks Spanner and the Pub/Sub listener. /healthz checks only the listener, so a
        # Spanner outage does not restart the pod but a stopped listener does.
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
{{- end }}

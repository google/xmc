# Acts as the dedicated xmc-lm-sa Google service account, which holds only the Pub/Sub subscriber
# and Spanner access the Log Monitor needs.
{{- if .Values.logMonitorDeployment.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-monitor-service-account
  annotations:
    iam.gke.io/gcp-service-account: "{{ .Values.logMonitor.gcpServiceAccount }}"
{{- end }}

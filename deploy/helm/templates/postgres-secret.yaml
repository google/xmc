# Holds the PostgreSQL password for services in the release namespace when database.backend is
# "postgres".
{{- if eq (include "xmanager-cloud.dbBackend" .) "postgres" }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres
type: Opaque
stringData:
  postgres-password: {{ ((default (dict) .Values.database).postgres | default (dict)).password | default "" | quote }}
{{- end }}

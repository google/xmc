apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xmc-ci-inspector
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "namespaces", "endpoints", "events", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/portforward"]
  verbs: ["get", "create"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["jobset.x-k8s.io"]
  resources: ["jobsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["kueue.x-k8s.io"]
  resources: ["workloads", "localqueues", "clusterqueues", "resourceflavors"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
---
{{- if or .Values.gcpServiceAccount .Values.projectId }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xmc-ci-inspector-binding
subjects:
{{- if .Values.gcpServiceAccount }}
- kind: User
  name: {{ .Values.gcpServiceAccount | quote }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if .Values.projectId }}
- kind: User
  name: {{ printf "xmc-github-actions@%s.iam.gserviceaccount.com" .Values.projectId | quote }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
roleRef:
  kind: ClusterRole
  name: xmc-ci-inspector
  apiGroup: rbac.authorization.k8s.io
{{- end }}

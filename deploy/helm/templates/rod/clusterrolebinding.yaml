{{- if (default dict .Values.rodDeployment).enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rod-data-provider-role
rules:
- apiGroups: ["kueue.x-k8s.io"]
  resources: ["clusterqueues", "localqueues", "resourceflavors", "workloads"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rod-data-provider-binding
subjects:
- kind: ServiceAccount
  name: rod-data-provider-service-account
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: rod-data-provider-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: xid-service-deployment
  labels:
    app: xid-service
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xid-service
  template:
    metadata:
      labels:
        app: xid-service
    spec:
      serviceAccountName: xid-service
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        {{- if .Values.secrets.csi.enabled }}
        - name: gcp-secrets-volume
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "gcp-secrets-provider"
        {{- else }}
        - name: gcp-secrets-volume
          secret:
            secretName: backend-oauth-secrets
        {{- end }}
      containers:
      - name: xid-service
        image: {{ .Values.xid_custom_image | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        volumeMounts:
          - name: gcp-secrets-volume
            mountPath: /etc/gcp-secrets
            readOnly: true
        ports:
        - containerPort: 50051
          name: grpc-port
        livenessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          grpc:
            port: 50051
            service: xmc.XidService
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
        envFrom:
        - configMapRef:
            name: xid-config
        - configMapRef:
            name: db-config
        env:
        - name: IAP_EXPECTED_HTTP_AUDIENCE
          value: {{ .Values.experimentStateServer.iap.httpAudience | quote }}
        - name: IAP_EXPECTED_GRPC_AUDIENCE
          value: {{ .Values.experimentStateServer.iap.grpcAudience | quote }}
        {{- include "xmanager-cloud.oauthEnv" . | nindent 8 }}

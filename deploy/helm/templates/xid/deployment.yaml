apiVersion: apps/v1
kind: Deployment
metadata:
  name: xid-service-deployment
  labels:
    app: xid-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xid-service
  template:
    metadata:
      labels:
        app: xid-service
    spec:
      serviceAccountName: xid-service
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        {{- if .Values.secrets.csi.enabled }}
        - name: gcp-secrets-volume
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "gcp-secrets-provider"
        {{- else }}
        - name: gcp-secrets-volume
          secret:
            secretName: backend-oauth-secrets
        {{- end }}
      containers:
      - name: xid-service
        image: {{ .Values.xid_custom_image | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        volumeMounts:
          - name: gcp-secrets-volume
            mountPath: /etc/gcp-secrets
            readOnly: true
        ports:
        - containerPort: 50051
          name: grpc-port
        livenessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          grpc:
            port: 50051
            service: xmc.XidService
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: IAP_EXPECTED_ISSUER
          value: {{ .Values.experimentStateServer.iap.iapIssuer | quote }}
        - name: IAP_EXPECTED_HTTP_AUDIENCE
          value: {{ .Values.experimentStateServer.iap.httpAudience | quote }}
        - name: IAP_EXPECTED_GRPC_AUDIENCE
          value: {{ .Values.experimentStateServer.iap.grpcAudience | quote }}
        - name: CLIENT_ID
          value: {{ .Values.experimentStateServer.iap.clientId | quote }}
        - name: JWT_SECRET_FILE
          value: "/etc/gcp-secrets/jwt-secret"
        args:
        - "-xid_grpc_port=50051"
        - "-xid_quota_project_id={{ .Values.projectId }}"
        - "-xid_spanner_database_name={{ .Values.xidService.spannerDatabaseName | default (printf "projects/%s/instances/xmc-%s/databases/xids-db-%s" .Values.projectId .Values.environment .Values.environment) }}"
        - "-alsologtostderr"
        - "-xid_default_to_cursor_pagination={{ .Values.defaultToCursorPagination }}"
        # Flags to disable internalVCSdependencies.
        - "--enforce_kernel_ipv6_support=false"
        - "--enable_streamz_rpc_service=false"
        - "--logtostderr"
        - "--securewrapper_dummyimpl_auth_user=$(USER)"
        - "--streamz_servers="
        - "--envelope_enabled=false"
        - "--notracelog"
        - "--remote_coredump_enabled"

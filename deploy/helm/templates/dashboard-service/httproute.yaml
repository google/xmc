{{- if and .Values.gateway.enabled .Values.dashboardServiceDeployment.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: https
  hostnames:
    - {{ include "xmanager-cloud.uiHostname" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/dashboards
        - path:
            type: PathPrefix
            value: /v1/charts
      backendRefs:
        - name: dashboard-service
          port: 8080
{{- end }}

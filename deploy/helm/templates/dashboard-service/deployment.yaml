{{- if .Values.dashboardServiceDeployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-service-deployment
  labels:
    app: dashboard-service
spec:
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: dashboard-service
  template:
    metadata:
      labels:
        app: dashboard-service
    spec:
      serviceAccountName: dashboard-service-account
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        {{- include "xmanager-cloud.gcpSecretsVolume" . | nindent 8 }}
      containers:
      - name: dashboard-service
        image: {{ .Values.dashboard_service_custom_image | quote }}
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        volumeMounts:
          - name: gcp-secrets-volume
            mountPath: /etc/gcp-secrets
            readOnly: true
        ports:
        - containerPort: 8080
          name: http-port
        - containerPort: 50051
          name: grpc-port
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: {{ .Values.projectId | quote }}
        {{- include "xmanager-cloud.oauthEnv" . | nindent 8 }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
{{- end }}

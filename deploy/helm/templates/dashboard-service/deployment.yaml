{{- if eq (include "xmanager-cloud.dashboardServiceEnabled" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-service-deployment
  labels:
    app: dashboard-service
spec:
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: dashboard-service
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/dashboard-service/configmap.yaml") . | sha256sum }}
        checksum/db-config: {{ include (print $.Template.BasePath "/db-config.yaml") . | sha256sum }}
      labels:
        app: dashboard-service
    spec:
      serviceAccountName: dashboard-service-account
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        {{- include "xmanager-cloud.gcpSecretsVolume" . | nindent 8 }}
      containers:
      - name: dashboard-service
        image: {{ .Values.dashboard_service_custom_image | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        volumeMounts:
          - name: gcp-secrets-volume
            mountPath: /etc/gcp-secrets
            readOnly: true
        ports:
        - containerPort: 8080
          name: http-port
        - containerPort: 50051
          name: grpc-port
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: {{ .Values.projectId | quote }}
        {{- include "xmanager-cloud.oauthEnv" . | nindent 8 }}
        {{- include "xmanager-cloud.clickhouseCsiEnv" . | nindent 8 }}
        {{- include "xmanager-cloud.postgresEnv" . | nindent 8 }}
        envFrom:
        - configMapRef:
            name: dashboard-config
        - configMapRef:
            name: db-config
        # /readyz checks that the ESS database is reachable and at the expected schema version and,
        # when Component/clickhouse (or Component/bigquery) is enabled, that the chart data engine
        # has a working connection. The handler spends at most 5s on that, which the default 1s probe
        # timeout would cut short and report as an unexplained failure.
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 6
          failureThreshold: 3
        # Liveness deliberately stays on /healthz, which checks nothing beyond the process being
        # able to answer. A dependency outage must leave the pod unready, not restart it: a restart
        # cannot bring ClickHouse back and only discards the warm process.
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
{{- end }}

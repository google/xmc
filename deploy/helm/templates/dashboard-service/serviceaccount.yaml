{{- if .Values.dashboardServiceDeployment.enabled }}
# Defines the dedicated Kubernetes Service Account for the Dashboard Service.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-service-account
  annotations:
    iam.gke.io/gcp-service-account: "{{ (default (dict) .Values.dashboardService).gcpServiceAccount }}"
{{- if (default (dict) .Values.componentsDeployment).enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-service-components-reader
  labels:
    app: dashboard-service
    app.kubernetes.io/part-of: xmanager-cloud
rules:
  - apiGroups: ["xmc.dev"]
    resources: ["components"]
    resourceNames: ["clickhouse", "bigquery"]
    verbs: ["get"]
  {{- if not (default (dict) (default (dict) .Values.secrets).csi).enabled }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "xmanager-cloud.clickhouseSecretName" . | quote }}]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-service-components-reader-binding
  labels:
    app: dashboard-service
    app.kubernetes.io/part-of: xmanager-cloud
subjects:
  - kind: ServiceAccount
    name: dashboard-service-account
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: dashboard-service-components-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}

{{- define "xmanager-cloud.postgresMigratorContainer" -}}
- name: {{ .name }}
  image: {{ .root.Values.postgres_migrator_custom_image | quote }}
  imagePullPolicy: Always
  args:
  - "--migrations_dir={{ .migrationsDir }}"
  - "--command=up"
  - "--connect_timeout=90s"
  envFrom:
  - configMapRef:
      name: db-config
  env:
  {{- include "xmanager-cloud.postgresEnv" .root | nindent 2 }}
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop:
      - ALL
{{- end -}}
{{- if include "xmanager-cloud.postgresRunMigrations" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-migrations-r{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres-migrations
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: postgres-migrations
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      {{- include "xmanager-cloud.postgresMigratorContainer" (dict "root" . "name" "migrate-xid" "migrationsDir" "xid") | nindent 6 }}
      containers:
      {{- include "xmanager-cloud.postgresMigratorContainer" (dict "root" . "name" "migrate-ess" "migrationsDir" "ess") | nindent 6 }}
{{- end }}

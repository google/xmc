{{- if and .Values.metrics.enabled .Values.metrics.clickhouseSetupJob.enabled .Values.clickhouse.bootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-schema-setup-script
  labels:
    {{- include "xmanager-cloud.labels" . | nindent 4 }}
data:
  schema.sql: |
    CREATE TABLE IF NOT EXISTS xmc_metrics
    (
        xid Int64,
        work_unit_id Int64,
        execution_id Int64,
        replica_id String,
        metric_name LowCardinality(String),
        metric_value Float64,
        step Int64,
        timestamp DateTime64(6, 'UTC'),
        created_at DateTime64(6, 'UTC') DEFAULT now64(6, 'UTC')
    )
    ENGINE = MergeTree()
    PARTITION BY toYYYYMM(timestamp)
    PRIMARY KEY (xid, metric_name, timestamp)
    ORDER BY (xid, metric_name, timestamp, work_unit_id, execution_id, replica_id, step);

    CREATE TABLE IF NOT EXISTS xmc_metrics_queue
    (
        xid Int64,
        work_unit_id Int64,
        execution_id Int64,
        replica_id String,
        metric_name LowCardinality(String),
        metric_value Float64,
        step Int64,
        timestamp Int64
    )
    ENGINE = Kafka
    SETTINGS
        kafka_broker_list = '{kafka_broker_list:redpanda-0.redpanda.xmc.svc.cluster.local:9092}',
        kafka_topic_list = '{kafka_topic_list:xmc-metrics}',
        kafka_group_name = '{kafka_group_name:xmc-clickhouse-ingester}',
        kafka_format = 'ProtobufSingle',
        format_schema = 'metrics.proto:Metric',
        kafka_num_consumers = 1,
        stream_flush_interval_ms = 1000,
        kafka_skip_broken_messages = 100;

    CREATE MATERIALIZED VIEW IF NOT EXISTS xmc_metrics_mv TO xmc_metrics AS
    SELECT
        xid,
        work_unit_id,
        execution_id,
        if(replica_id = '', '0', replica_id) AS replica_id,
        metric_name,
        metric_value,
        step,
        if(timestamp < 1577836800000000 OR timestamp > 2524608000000000, now64(6, 'UTC'), fromUnixTimestamp64Micro(timestamp, 'UTC')) AS timestamp,
        now64(6, 'UTC') AS created_at
    FROM xmc_metrics_queue
    WHERE xid != 0 AND metric_name != '' AND execution_id != 0;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-schema-setup
  labels:
    {{- include "xmanager-cloud.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{- include "xmanager-cloud.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema-setup
          image: "curlimages/curl:latest"
          command:
            - /bin/sh
            - -c
            - |
              echo "Applying ClickHouse schema DDL..."
              curl -s -f "http://{{ .Values.clickhouse.endpoint }}/" --data-binary @/scripts/schema.sql
              echo "ClickHouse schema DDL migration complete."
          volumeMounts:
            - name: schema-volume
              mountPath: /scripts
      volumes:
        - name: schema-volume
          configMap:
            name: clickhouse-schema-setup-script
{{- end }}

# Rendered regardless of componentsDeployment.enabled and never deleted by Helm or Argo CD:
# deleting the CRD deletes every Component CR. Remove it only with an explicit
# `kubectl delete crd components.xmc.dev`.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: components.xmc.dev
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: xmc
    app.kubernetes.io/part-of: xmanager-cloud
spec:
  group: xmc.dev
  names:
    kind: Component
    listKind: ComponentList
    plural: components
    singular: component
    shortNames:
      - xcomp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .status.state
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Synced
          type: string
          jsonPath: .status.conditions[?(@.type=="Synced")].status
        - name: Class
          type: string
          jsonPath: .spec.componentClass
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            # The metadata.name rules are create-only (optionalOldSelf), so a Component stored before they existed
            # can still be updated, have its status written and its finalizer removed after a CRD upgrade.
            - rule: "oldSelf.hasValue() || !has(self.metadata.name) || self.metadata.name.size() <= 45"
              optionalOldSelf: true
              message: "metadata.name must be at most 45 characters so the component Helm release name (xmc-cmp-<name>) stays within Helm's 53-character limit."
            - rule: "oldSelf.hasValue() || !has(self.metadata.name) || !self.metadata.name.startsWith('xmc-cmp-')"
              optionalOldSelf: true
              message: "metadata.name must not start with 'xmc-cmp-', which is reserved for component Helm release names."
            - rule: "!has(self.spec.deletionPolicy) || self.spec.deletionPolicy in ['Orphan', 'Delete']"
              message: "deletionPolicy must be either 'Orphan' or 'Delete'."
            - rule: "!has(self.spec.lifecycleControl) || !has(self.spec.lifecycleControl.drainTimeoutSeconds) || self.spec.lifecycleControl.drainTimeoutSeconds >= 0"
              message: "lifecycleControl.drainTimeoutSeconds must be greater than or equal to zero."
            - rule: "!has(self.spec.componentType) || self.spec.componentType != 'COMPONENT_TYPE_CUSTOM_3P_WRAPPER' || has(self.spec.wrapperRef) || has(self.spec.parameters)"
              message: "either wrapperRef or parameters must be specified when componentType is COMPONENT_TYPE_CUSTOM_3P_WRAPPER."
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - enabled
              x-kubernetes-validations:
                - rule: "!self.enabled || !has(self.stability) || self.stability != 'EXPERIMENTAL' || (has(self.acknowledgeExperimental) && self.acknowledgeExperimental)"
                  message: "spec.acknowledgeExperimental must be set to true when enabling an EXPERIMENTAL component (spec.stability == 'EXPERIMENTAL')."
              properties:
                enabled:
                  type: boolean
                  description: "Indicates whether the component is enabled and should be active."
                stability:
                  type: string
                  enum:
                    - EXPERIMENTAL
                    - PREVIEW
                    - STABLE
                  description: "Catalog-owned maturity stage of the component (unset is treated as STABLE for backward compatibility)."
                acknowledgeExperimental:
                  type: boolean
                  default: false
                  description: "Explicit administrator acknowledgement required to enable a component with spec.stability == 'EXPERIMENTAL'."
                componentType:
                  type: string
                  default: COMPONENT_TYPE_CUSTOM_1P_COMPONENT
                  enum:
                    - COMPONENT_TYPE_CUSTOM_1P_COMPONENT
                    - COMPONENT_TYPE_CUSTOM_3P_WRAPPER
                  description: "Distinguishes the underlying architecture and control plane model."
                componentClass:
                  type: string
                  description: "Classification identifier or category of the component."
                deletionProtection:
                  type: boolean
                  default: true
                  description: "Prevents accidental deletion of the component manifest."
                deletionPolicy:
                  type: string
                  enum:
                    - Orphan
                    - Delete
                  default: Delete
                  description: "Specifies cleanup behavior when the component is deleted."
                lifecycleControl:
                  type: object
                  description: "Lifecycle configuration including graceful drain timeouts and cascading behavior."
                  properties:
                    cascade:
                      type: boolean
                      description: "Whether deactivation cascades to dependent components."
                    drainTimeoutSeconds:
                      type: integer
                      minimum: 0
                      default: 300
                      description: "Maximum timeout allowed for the component to drain before force terminating."
                    forceUpgrade:
                      type: boolean
                      description: "Whether to bypass graceful drain checks during upgrades."
                parameters:
                  type: object
                  additionalProperties:
                    type: string
                  description: "Arbitrary key-value configuration parameters passed to the component."
                wrapperRef:
                  type: object
                  description: "Configuration and reference metadata for third-party CRDs and controllers."
                  required:
                    - group
                    - version
                    - kind
                    - name
                  properties:
                    group:
                      type: string
                      description: "API group of the target CRD."
                    version:
                      type: string
                      description: "API version of the target CRD."
                    kind:
                      type: string
                      description: "Kind of the target CRD."
                    name:
                      type: string
                      description: "Target resource name or controller identifier."
                    namespace:
                      type: string
                      description: "Target Kubernetes namespace where the wrapper/CRD operates."
                    observedGenerationPath:
                      type: string
                      pattern: '^\$\.status\..+'
                      description: "JSONPath or field path to observedGeneration in the underlying resource."
                    readyConditionPath:
                      type: string
                      pattern: '^\$\.status\..+'
                      description: "JSONPath or field path to evaluate ready condition."
                    expectedReadyValue:
                      type: string
                      description: "Expected value for the ready condition field to indicate readiness."
                    endpointJsonPath:
                      type: string
                      description: "JSONPath to extract endpoint coordinates."
                    connectionSecretJsonPath:
                      type: string
                      description: "JSONPath to extract connection secret details."
                dependencies:
                  type: array
                  items:
                    type: string
                  description: "List of component names that this component depends upon."
                version:
                  type: string
                  description: "Semantic version of the component."
                chartVersion:
                  type: string
                  description: "Helm chart version associated with the component."
                imageTag:
                  type: string
                  description: "Container image tag deployed for this component."
            status:
              type: object
              description: "Observed runtime status and health of the component."
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: "Most recent generation observed by the controller."
                componentGeneration:
                  type: integer
                  format: int64
                  description: "CMS component generation that the status describes; independent of metadata.generation because CMS orders intents by Component object ownership."
                componentId:
                  type: string
                  description: "CMS ComponentId of the component record, in decimal (a string because it exceeds the integer precision of JSON tooling). Stays the same when a recreated Component adopts the record."
                state:
                  type: string
                  description: "Current lifecycle state of the component."
                access:
                  type: object
                  description: "Network and cluster access coordinates and environment variables."
                  properties:
                    envVars:
                      type: object
                      additionalProperties:
                        type: string
                      description: "Plain environment variables exposed to workloads."
                    secretEnvVars:
                      type: object
                      additionalProperties:
                        type: string
                      description: "Secret environment variable references exposed to workloads."
                    secretVolumeMounts:
                      type: object
                      additionalProperties:
                        type: string
                      description: "Secret volume mount definitions exposed to workloads."
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  description: "Conditions representing the latest observations of the component state."
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                        description: "Type of condition."
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                        description: "Status of the condition (True, False, Unknown)."
                      observedGeneration:
                        type: integer
                        format: int64
                        description: "Last observed generation when condition was set."
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: "Timestamp when condition transitioned."
                      reason:
                        type: string
                        description: "Machine-readable reason code."
                      message:
                        type: string
                        description: "Human-readable message describing condition."

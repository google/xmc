{{- if .Values.componentsDeployment.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.componentsDeployment.rbac.clusterScope }}
kind: ClusterRole
{{- else }}
kind: Role
{{- end }}
metadata:
  name: xmc-bridge-role
  labels:
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
rules:
  - apiGroups: ["xmc.dev"]
    resources: ["components", "components/status", "components/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: [""]
    resources: ["secrets", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 1P component releases self-provision their reader RBAC (e.g. xmc-cmp-ingestion-gateway).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    resourceNames: ["ingestion-gateway-components-reader", "ingestion-gateway-components-reader-binding"]
    verbs: ["update", "patch", "delete"]
  # ...and their NetworkPolicy, so it lives and dies with the component's workload.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    resourceNames: ["ingestion-gateway-network-policy"]
    verbs: ["update", "patch", "delete"]
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.componentsDeployment.rbac.clusterScope }}
kind: ClusterRoleBinding
{{- else }}
kind: RoleBinding
{{- end }}
metadata:
  name: xmc-bridge-rolebinding
  labels:
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
subjects:
  - kind: ServiceAccount
    name: xmc-bridge-sa
    namespace: {{ .Release.Namespace }}
roleRef:
{{- if .Values.componentsDeployment.rbac.clusterScope }}
  kind: ClusterRole
{{- else }}
  kind: Role
{{- end }}
  name: xmc-bridge-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}

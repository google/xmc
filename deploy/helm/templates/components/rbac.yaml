{{- if .Values.componentsDeployment.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xmc-bridge-role
  labels:
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
rules:
  - apiGroups: ["xmc.dev"]
    resources: ["components", "components/status", "components/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xmc-bridge-rolebinding
  labels:
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
subjects:
  - kind: ServiceAccount
    name: xmc-bridge-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: xmc-bridge-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}

{{- if .Values.componentsDeployment.enabled }}
# xmc-bridge-role is always namespaced to the release namespace, whatever rbac.clusterScope is,
# so the bridge never gains write access outside it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: xmc-bridge-role
  labels:
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
rules:
  - apiGroups: ["xmc.dev"]
    resources: ["components", "components/status", "components/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # 1P component releases self-provision their reader RBAC (e.g. xmc-cmp-ingestion-gateway).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    resourceNames: ["ingestion-gateway-components-reader", "ingestion-gateway-components-reader-binding"]
    verbs: ["update", "patch", "delete"]
  # ...and their NetworkPolicy, so it lives and dies with the component's workload.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    resourceNames: ["ingestion-gateway-network-policy"]
    verbs: ["update", "patch", "delete"]
  # Read-only access to configured 3P wrapper custom resources (spec.wrapperRef).
  {{- range .Values.componentsDeployment.rbac.wrapperRules }}
  - apiGroups: {{ toJson .apiGroups }}
    resources: {{ toJson .resources }}
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: xmc-bridge-rolebinding
  labels:
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
subjects:
  - kind: ServiceAccount
    name: xmc-bridge-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: xmc-bridge-role
  apiGroup: rbac.authorization.k8s.io
---
{{- if and .Values.componentsDeployment.rbac.clusterScope .Values.componentsDeployment.rbac.wrapperRules }}
# rbac.clusterScope only adds read access to the configured 3P wrapper resources in every
# namespace, for spec.wrapperRef targets outside the release namespace. It grants no writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xmc-bridge-wrapper-reader-{{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
rules:
  {{- range .Values.componentsDeployment.rbac.wrapperRules }}
  - apiGroups: {{ toJson .apiGroups }}
    resources: {{ toJson .resources }}
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xmc-bridge-wrapper-reader-{{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
subjects:
  - kind: ServiceAccount
    name: xmc-bridge-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: xmc-bridge-wrapper-reader-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
# Leader election: only the holder of the xmc-bridge Lease in the release namespace reconciles.
# This Role is namespaced, so the bridge can write no other namespace's Leases.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: xmc-bridge-leader-election
  labels:
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["xmc-bridge"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: xmc-bridge-leader-election
  labels:
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
subjects:
  - kind: ServiceAccount
    name: xmc-bridge-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: xmc-bridge-leader-election
  apiGroup: rbac.authorization.k8s.io
---
# Cluster identity: xmc-bridge reads the kube-system Namespace UID at startup to identify this
# cluster when declaring its ownership epoch to CMS. Cluster-scoped names are suffixed with the
# release namespace so multiple XMC installs in one cluster do not collide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xmc-bridge-cluster-identity-{{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xmc-bridge-cluster-identity-{{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
subjects:
  - kind: ServiceAccount
    name: xmc-bridge-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: xmc-bridge-cluster-identity-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}

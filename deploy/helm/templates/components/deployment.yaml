{{- if .Values.componentsDeployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmc-bridge-deployment
  labels:
    app: xmc-bridge
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xmc-bridge
  template:
    metadata:
      labels:
        app: xmc-bridge
        app.kubernetes.io/name: xmc-bridge
        app.kubernetes.io/part-of: xmanager-cloud
    spec:
      serviceAccountName: xmc-bridge-sa
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: xmc-bridge
        image: {{ .Values.xmc_bridge_custom_image | default (printf "us-docker.pkg.dev/%s/xmc/xmc-bridge-%s:%s" .Values.projectId .Values.environment (.Values.imageTag | default "latest")) | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: xmc-bridge-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
{{- end }}

{{- if (default dict .Values.componentsDeployment).enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: components-controller-deployment
  labels:
    app: components-controller
spec:
  strategy:
    type: RollingUpdate
  replicas: {{ .Values.componentsDeployment.replicas | default 1 }}
  selector:
    matchLabels:
      app: components-controller
  template:
    metadata:
      labels:
        app: components-controller
    spec:
      serviceAccountName: {{ .Values.componentsDeployment.serviceAccountName | default "components-controller-service-account" }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: components-controller
        image: {{ .Values.components_custom_image | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        {{- if .Values.componentsDeployment.resources }}
        resources:
          {{- toYaml .Values.componentsDeployment.resources | nindent 10 }}
        {{- end }}
{{- end }}

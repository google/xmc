apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmc-bridge-deployment
  labels:
    app: xmc-bridge
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
spec:
  replicas: 1
  # A rollout stops the old bridge before it starts the new one. The xmc-bridge Lease keeps a
  # single writer in the remaining overlap cases, such as a partitioned node.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xmc-bridge
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/components/configmap.yaml") . | sha256sum }}
      labels:
        app: xmc-bridge
        app.kubernetes.io/name: xmc-bridge
        app.kubernetes.io/part-of: xmanager-cloud
    spec:
      serviceAccountName: xmc-bridge-sa
      # Longer than the bridge's 25s graceful shutdown, in which a stopping leader finishes or
      # cancels its reconciles and Helm upgrades before it releases the xmc-bridge Lease.
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: xmc-bridge
        image: {{ .Values.xmc_bridge_custom_image | default (printf "us-docker.pkg.dev/%s/xmc/xmc-bridge-%s:%s" .Values.projectId .Values.environment (.Values.imageTag | default "latest")) | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: xmc-bridge-config
        env:
        - name: IAP_EXPECTED_GRPC_AUDIENCE
          value: {{ dig "experimentStateServer" "iap" "grpcAudience" "" .Values.AsMap | quote }}
{{- include "xmanager-cloud.oauthEnv" . | nindent 8 }}
        volumeMounts:
        - name: gcp-secrets-volume
          mountPath: "/etc/gcp-secrets"
          readOnly: true
        # The unauthenticated metrics endpoint listens on 127.0.0.1:8080 only and has no port here.
        ports:
        - name: health
          containerPort: 8081
        # Liveness only checks that the process serves requests; readiness waits for the
        # Component cache, which followers sync too while they wait for the Lease.
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
{{- include "xmanager-cloud.gcpSecretsVolume" . | nindent 6 }}

{{- $comp := default (dict) .Values.componentsDeployment -}}
{{- if and (hasKey $comp "enabled") (not $comp.enabled) -}}
{{- fail "componentsDeployment.enabled=false is no longer supported in XMC 1.0.0+: Components are mandatory. Migrate legacy workloads via ./tools/migrations/components/migrate.py before upgrading." -}}
{{- end -}}
{{- $igLegacy := default (dict) .Values.ingestionGatewayDeployment -}}
{{- if $igLegacy.enabled -}}
{{- fail "ingestionGatewayDeployment.enabled=true is removed in XMC 1.0.0+: deploy ingestion-gateway via the stable-2026a xmc-profile release (or migrate existing workloads via ./tools/migrations/components/migrate.py)." -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: xmc-bridge-config
  labels:
    app: xmc-bridge
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
data:
  CMS_ADDRESS: {{ $comp.cmsAddress | default "grpc-service:50051" | quote }}
  NAMESPACE: {{ .Release.Namespace | quote }}
  HELM_RELEASE_NAME: {{ .Release.Name | quote }}
  CLUSTER_NAME: {{ $comp.clusterName | default .Release.Name | quote }}
  COMPONENT_OWNERSHIP_EPOCH: {{ ternary 1 (int64 $comp.ownershipEpoch) (kindIs "invalid" $comp.ownershipEpoch) | quote }}
  HELM_CHART_PATH: {{ $comp.chartPath | default "" | quote }}
  PROJECT_ID: {{ .Values.projectId | default "" | quote }}
  DEFAULT_INGESTION_GATEWAY_IMAGE: {{ .Values.ingestion_gateway_custom_image | default "" | quote }}
  DEFAULT_HPO_IMAGE: {{ .Values.hpo_custom_image | default "" | quote }}
  PROBE_INTERVAL: {{ $comp.probeInterval | default "5s" | quote }}
  PROBE_TIMEOUT: {{ $comp.probeTimeout | default "2s" | quote }}
  RECONCILE_TIMEOUT: {{ $comp.reconcileTimeout | default "60s" | quote }}
  {{- /* Only an unset value defaults to 1; an explicit 0 reaches xmc-bridge, which rejects it at startup. */}}
  MAX_CONCURRENT_RECONCILES: {{ ternary 1 $comp.maxConcurrentReconciles (kindIs "invalid" $comp.maxConcurrentReconciles) | quote }}

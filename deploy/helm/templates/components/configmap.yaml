{{- if .Values.componentsDeployment.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: xmc-bridge-config
  labels:
    app: xmc-bridge
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
data:
  CMS_ADDRESS: {{ .Values.componentsDeployment.cmsAddress | default "grpc-service:50051" | quote }}
  NAMESPACE: {{ .Release.Namespace | quote }}
  HELM_RELEASE_NAME: {{ .Release.Name | quote }}
  HELM_CHART_PATH: {{ .Values.componentsDeployment.chartPath | default "" | quote }}
  PROJECT_ID: {{ .Values.projectId | default "" | quote }}
  DEFAULT_INGESTION_GATEWAY_IMAGE: {{ .Values.ingestion_gateway_custom_image | default "" | quote }}
  PROBE_INTERVAL: {{ .Values.componentsDeployment.probeInterval | default "5s" | quote }}
  PROBE_TIMEOUT: {{ .Values.componentsDeployment.probeTimeout | default "2s" | quote }}
  RECONCILE_TIMEOUT: {{ .Values.componentsDeployment.reconcileTimeout | default "60s" | quote }}
  {{- /* Only an unset value defaults to 1; an explicit 0 reaches xmc-bridge, which rejects it at startup. */}}
  MAX_CONCURRENT_RECONCILES: {{ ternary 1 .Values.componentsDeployment.maxConcurrentReconciles (kindIs "invalid" .Values.componentsDeployment.maxConcurrentReconciles) | quote }}
{{- end }}

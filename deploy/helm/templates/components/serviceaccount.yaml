{{- $gcpSA := or (default (dict) .Values.componentsDeployment).gcpServiceAccount .Values.gcpServiceAccount }}
{{- if (default (dict) .Values.componentsDeployment).enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.componentsDeployment.serviceAccountName | default "components-controller-service-account" }}
  {{- if $gcpSA }}
  annotations:
    iam.gke.io/gcp-service-account: {{ $gcpSA | quote }}
  {{- end }}
{{- end }}

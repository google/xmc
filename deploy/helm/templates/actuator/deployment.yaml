apiVersion: apps/v1
kind: Deployment
metadata:
  name: actuator-deployment
  labels:
    app: actuator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: actuator
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/actuator/configmap.yaml") . | sha256sum }}
        checksum/db-config: {{ include (print $.Template.BasePath "/db-config.yaml") . | sha256sum }}
      labels:
        app: actuator
    spec:
      serviceAccountName: actuator-service-account
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: actuator
        image: {{ .Values.actuator_custom_image | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: actuator-config
        - configMapRef:
            name: feature-flags-config
        - configMapRef:
            name: db-config
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-password
        {{- $auth := default (dict) .Values.auth }}
        {{- $gac := default .Values.googleApplicationCredentials $auth.googleApplicationCredentials }}
        {{- if $gac }}
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: {{ $gac | quote }}
        {{- end }}
        {{- if .Values.managedXprofGcsBucket }}
        - name: MANAGED_XPROF_GCS_PATH
          valueFrom:
            configMapKeyRef:
              name: managed-xprof-gcs-config
              key: gcs_path
        {{- end }}
        {{- $remoteK8s := default (dict) .Values.remoteK8s }}
        {{- if $remoteK8s.enabled }}
        - name: KUBECONFIG
          value: "/etc/remote-k8s/kubeconfig"
        {{- end }}
        {{- include "xmanager-cloud.postgresEnv" . | nindent 8 }}
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
        - name: validation-public-key-volume
          mountPath: /etc/verification-key
          readOnly: true
        {{- if $gac }}
        - name: gcp-secrets-fallback
          mountPath: /etc/gcp-secrets
          readOnly: true
        {{- end }}
        {{- if $remoteK8s.enabled }}
        - name: remote-k8s-config-volume
          mountPath: /etc/remote-k8s
          readOnly: true
        {{- end }}
      volumes:
      - name: validation-public-key-volume
        secret:
          secretName: validation-secret
          items:
          - key: tls.crt
            path: tls.crt
      {{- if $gac }}
      - name: gcp-secrets-fallback
        secret:
          secretName: gcp-sa-key
          items:
          - key: key.json
            path: key.json
      {{- end }}
      {{- if $remoteK8s.enabled }}
      - name: remote-k8s-config-volume
        secret:
          secretName: {{ default "remote-k8s-config" $remoteK8s.secretName | quote }}
          items:
          - key: kubeconfig
            path: kubeconfig
      {{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: actuator-deployment
  labels:
    app: actuator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: actuator
  template:
    metadata:
      labels:
        app: actuator
    spec:
      serviceAccountName: actuator-service-account
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: actuator
        image: {{ .Values.actuator_custom_image | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: actuator-config
        env:
        - name: DISABLE_AUTHENTICATION
          value: {{ .Values.auth.disableAuthentication | default "false" | quote }}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-password
        {{- if .Values.managedXprofGcsBucket }}
        - name: MANAGED_XPROF_GCS_PATH
          valueFrom:
            configMapKeyRef:
              name: managed-xprof-gcs-config
              key: gcs_path
        {{- end }}
        args:
        - "-alsologtostderr"
        - "--logtostderr"
        - "--enforce_kernel_ipv6_support=false"
        - "--enable_streamz_rpc_service=false"
        - "--securewrapper_dummyimpl_auth_user=$(USER)"
        - "--streamz_servers="
        - "--envelope_enabled=false"
        - "--notracelog"
        - "--remote_coredump_enabled"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
        - name: validation-public-key-volume
          mountPath: /etc/verification-key
          readOnly: true
      volumes:
      - name: validation-public-key-volume
        secret:
          secretName: validation-secret
          items:
          - key: tls.crt
            path: tls.crt

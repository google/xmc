apiVersion: apps/v1
kind: Deployment
metadata:
  name: actuator-deployment
  labels:
    app: actuator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: actuator
  template:
    metadata:
      labels:
        app: actuator
    spec:
      serviceAccountName: actuator-service-account
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: actuator
        image: {{ .Values.actuator_custom_image | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-password
        args:
        - "-port=8080"
        - "-spanner_database_name={{ .Values.experimentStateServer.spannerDatabaseName | default (printf "projects/%s/instances/xmc-%s/databases/experiment-db-%s" .Values.projectId .Values.environment .Values.environment) }}"
        - "-quota_project_id={{ .Values.projectId }}"
        - "-alsologtostderr"
        - "--logtostderr"
        - "--enforce_kernel_ipv6_support=false"
        - "--enable_streamz_rpc_service=false"
        - "--securewrapper_dummyimpl_auth_user=$(USER)"
        - "--streamz_servers="
        - "--envelope_enabled=false"
        - "--notracelog"
        - "--remote_coredump_enabled"
        - "-status_message_history_enabled={{ .Values.statusMessageHistoryEnabled }}"
        - "-redis_addr={{ .Values.redisAddr }}"
        {{- if .Values.redisMaxRetries }}
        - "-redis_max_retries={{ .Values.redisMaxRetries }}"
        {{- end }}
        {{- if .Values.redisProcessTimeout }}
        - "-redis_process_timeout={{ .Values.redisProcessTimeout }}"
        {{- end }}
        {{- if .Values.redisAbandonedMessageTimeout }}
        - "-redis_abandoned_message_timeout={{ .Values.redisAbandonedMessageTimeout }}"
        {{- end }}
        {{- if .Values.redisReadBatchSize }}
        - "-redis_read_batch_size={{ .Values.redisReadBatchSize }}"
        {{- end }}
        - "--xmanager_service_account={{ required "gcpServiceAccount is required" .Values.gcpServiceAccount }}"
        - "--audience=https://actuator.api.{{ .Values.environment }}.{{ .Values.domainSuffix }}/actuate"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
        - name: validation-public-key-volume
          mountPath: /etc/verification-key
          readOnly: true
      volumes:
      - name: validation-public-key-volume
        secret:
          secretName: validation-secret
          items:
          - key: tls.crt
            path: tls.crt

apiVersion: v1
kind: ConfigMap
metadata:
  name: actuator-config
  labels:
    app: actuator
data:
  port: "8080"
  redis_addr: {{ .Values.redisAddr | quote }}
  xmanager_service_account: {{ required "gcpServiceAccount is required" .Values.gcpServiceAccount | quote }}
  audience: {{ printf "https://actuator.api.%s.%s/actuate" .Values.environment .Values.domainSuffix | quote }}
  enable_components: {{ (default (dict) .Values.componentsDeployment).enabled | default false | quote }}
  jwks_url: {{ if and .Values.auth .Values.auth.jwksUrl }}{{ .Values.auth.jwksUrl | quote }}{{ else if and .Values.auth .Values.auth.issuerUrl }}{{ printf "%s/keys" (.Values.auth.issuerUrl | trimSuffix "/") | quote }}{{ else }}""{{ end }}
  oidc_issuer_url: {{ if and .Values.auth .Values.auth.issuerUrl }}{{ .Values.auth.issuerUrl | quote }}{{ else }}""{{ end }}
  {{- if .Values.redisMaxRetries }}
  redis_max_retries: {{ .Values.redisMaxRetries | quote }}
  {{- end }}
  {{- if .Values.redisProcessTimeout }}
  redis_process_timeout: {{ .Values.redisProcessTimeout | quote }}
  {{- end }}
  {{- if .Values.redisAbandonedMessageTimeout }}
  redis_abandoned_message_timeout: {{ .Values.redisAbandonedMessageTimeout | quote }}
  {{- end }}
  {{- if .Values.redisReadBatchSize }}
  redis_read_batch_size: {{ .Values.redisReadBatchSize | quote }}
  {{- end }}
  {{- if .Values.isDevEnvironment }}
  XMC_PROJECT_ID: {{ .Values.projectId | quote }}
  XMC_CLUSTER_NAME: {{ .Values.clusterName | default (printf "xmc-%s" .Values.environment) | quote }}
  XMC_CLUSTER_LOCATION: {{ .Values.clusterLocation | default "local" | quote }}
  CLIENT_ID: {{ with .Values.auth }}{{ .clientId | default "" | quote }}{{ else }}""{{ end }}
  OIDC_USERNAME: {{ with .Values.auth }}{{ .username | default "" | quote }}{{ else }}""{{ end }}
  {{- end }}

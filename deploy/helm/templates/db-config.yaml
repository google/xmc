{{- $db := default (dict) .Values.database }}
{{- $backend := include "xmanager-cloud.dbBackend" . }}
{{- if not (has $backend (list "spanner" "postgres")) }}
{{- fail (printf `database.backend must be "spanner" or "postgres", got %q` $backend) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
data:
  DB_BACKEND: {{ $backend | quote }}
{{- if eq $backend "postgres" }}
{{- $pg := default (dict) $db.postgres }}
  POSTGRES_HOST: {{ default "postgres.xmc.svc.cluster.local" $pg.host | quote }}
  POSTGRES_PORT: {{ default "5432" $pg.port | toString | quote }}
  POSTGRES_USER: {{ default "postgres" $pg.user | quote }}
  POSTGRES_ESS_DATABASE: {{ default "ess" $pg.essDatabase | quote }}
  POSTGRES_XID_DATABASE: {{ default "xid" $pg.xidDatabase | quote }}
  POSTGRES_SSLMODE: {{ default "disable" $pg.sslMode | quote }}
{{- else }}
{{- $ess := default (dict) .Values.experimentStateServer }}
{{- $xid := default (dict) .Values.xidService }}
  SPANNER_ESS_DATABASE: {{ $ess.spannerDatabaseName | default (printf "projects/%s/instances/xmc-%s/databases/experiment-db-%s" .Values.projectId .Values.environment .Values.environment) | quote }}
  SPANNER_XID_DATABASE: {{ $xid.spannerDatabaseName | default (printf "projects/%s/instances/xmc-%s/databases/xids-db-%s" .Values.projectId .Values.environment .Values.environment) | quote }}
  SPANNER_QUOTA_PROJECT_ID: {{ .Values.projectId | quote }}
{{- end }}

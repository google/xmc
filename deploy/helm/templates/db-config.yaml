{{- $db := default (dict) .Values.database }}
{{- $backend := include "xmanager-cloud.dbBackend" . }}
{{- if not (has $backend (list "spanner" "postgres")) }}
{{- fail (printf `database.backend must be "spanner" or "postgres", got %q` $backend) }}
{{- end }}
{{- if and (eq $backend "postgres") (not $db.experimentalPostgres) }}
{{- fail `database.backend "postgres" is experimental: set database.experimentalPostgres=true to use it` }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
data:
  DB_BACKEND: {{ $backend | quote }}
{{- if eq $backend "postgres" }}
{{- $pg := default (dict) $db.postgres }}
  POSTGRES_HOST: {{ required "database.postgres.host is required when database.backend is postgres" $pg.host | quote }}
  POSTGRES_PORT: {{ default 5432 $pg.port | toString | quote }}
  POSTGRES_USER: {{ required "database.postgres.user is required when database.backend is postgres" $pg.user | quote }}
  POSTGRES_ESS_DATABASE: {{ required "database.postgres.essDatabase is required when database.backend is postgres" $pg.essDatabase | quote }}
  POSTGRES_XID_DATABASE: {{ required "database.postgres.xidDatabase is required when database.backend is postgres" $pg.xidDatabase | quote }}
  POSTGRES_SSLMODE: {{ default "verify-full" $pg.sslMode | quote }}
{{- else }}
  SPANNER_ESS_DATABASE: {{ include "xmanager-cloud.essSpannerDatabase" . | quote }}
  SPANNER_XID_DATABASE: {{ include "xmanager-cloud.xidSpannerDatabase" . | quote }}
  SPANNER_QUOTA_PROJECT_ID: {{ .Values.projectId | quote }}
{{- end }}

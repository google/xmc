{{- if .Values.healthServiceDeployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-service-deployment
  labels:
    app: health-service
spec:
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: health-service
  template:
    metadata:
      labels:
        app: health-service
    spec:
      serviceAccountName: health-service-account
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: health-service
        image: {{ .Values.health_service_custom_image | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
          name: http-port
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"
{{- end }}

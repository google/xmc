{{- if .Values.healthServiceDeployment.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: health-config
  labels:
    app: health-service
data:
  health_ess_url: "http://http-service:8080"
  health_xid_addr: "xid-svc:50051"
  health_actuator_url: "http://actuator-service:8080"
  health_reconciler_url: "http://reconciler-svc:8080"
  {{- if .Values.logMonitorDeployment.enabled }}
  health_log_monitor_url: "http://log-monitor-service:8080"
  {{- else }}
  health_log_monitor_resource_name: {{ .Values.healthService.logMonitorResourceName | quote }}
  {{- end }}
  health_redis_addr: {{ .Values.redisAddr | quote }}
  health_observability_url: {{ .Values.healthService.observabilityUrl | quote }}
  health_app_version: {{ .Values.imageTag | quote }}
  health_status_cache_ttl: {{ .Values.healthService.cacheTTL | quote }}
  health_status_force_refresh_max_requests: {{ .Values.healthService.forceRefreshMaxRequests | quote }}
  health_status_force_refresh_window: {{ .Values.healthService.forceRefreshWindow | quote }}
  health_scheduling_resume_batch_size: {{ .Values.healthService.schedulingResumeBatchSize | default 100 | quote }}
  health_scheduling_resume_max_backlog: {{ .Values.healthService.schedulingResumeMaxBacklog | default 500 | quote }}
{{- end }}

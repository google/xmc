# Holds the ClickHouse password for services in the release namespace. The ClickHouse addon
# provisions its own secret in the ClickHouse namespace, which Kubernetes pods in this
# namespace cannot reference, so the credential is mirrored here.
#
# Only rendered without the CSI driver: with it enabled the password comes from Secret Manager and
# is mounted as a file, so writing the Helm value into a Secret here would be a redundant copy of
# a credential the release is no longer meant to carry.
{{- if and (default (dict) .Values.metrics).enabled (not (default (dict) (default (dict) .Values.secrets).csi).enabled) }}
{{- $clickhouse := default (dict) (default (dict) .Values.metrics).clickhouse -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xmanager-cloud.clickhouseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: clickhouse
type: Opaque
stringData:
  clickhouse-password: {{ $clickhouse.password | default "" | quote }}
{{- end }}

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: experiment-state-server-cert
  namespace: xmc
spec:
  secretName: xmc-grpc-tls
  duration: 2160h
  renewBefore: 360h
  commonName: experiment-state-server
  privateKey:
    rotationPolicy: Always
  dnsNames:
  - experiment-state-server
  - experiment-state-server.xmc
  - experiment-state-server.xmc.svc.cluster.local
  - localhost
  ipAddresses:
  - 127.0.0.1
  issuerRef:
    name: self-signed-issuer
    kind: Issuer

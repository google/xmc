{{- if and (eq .Values.certs.type "gts") (not .Values.gateway.certMap) }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: gts-prod-issuer
  namespace: {{ .Release.Namespace }}
spec:
  acme:
    server: https://dv.acme-v02.api.pki.goog/directory
    email: {{ .Values.certs.email | quote }}
    privateKeySecretRef:
      name: gts-prod-private-key
    externalAccountBinding:
      keyID: {{ .Values.certs.gts.keyId | quote }}
      keySecretRef:
        name: gts-eab-secret
        key: hmac-key
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: {{ .Values.gateway.name }}
            namespace: {{ .Release.Namespace }}
{{- end }}

# Defines the dedicated Kubernetes Service Account for the Experiment State Server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: experiment-server
---
{{- if .Values.ui.enabled }}
# Defines a restricted Kubernetes Service Account for the UI.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xmc-ui
{{- end }}

{{- if .Values.gateway.enabled }}
{{- if not (lookup "v1" "Secret" .Release.Namespace "xmc-bootstrap-tls") }}
{{- $commonName := .Values.xmcUrl -}}
{{- $altNames := list (printf "api.%s" .Values.xmcUrl) (printf "grpc.%s" .Values.xmcUrl) -}}
{{- $cert := genSelfSignedCert $commonName nil $altNames 365 -}}
apiVersion: v1
kind: Secret
metadata:
  name: xmc-bootstrap-tls
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app.kubernetes.io/managed-by: Helm
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}

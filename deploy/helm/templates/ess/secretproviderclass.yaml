{{- if .Values.secrets.csi.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gcp-secrets-provider
  namespace: {{ .Release.Namespace }}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.secrets.csi.projectNumber }}/secrets/{{ .Values.secrets.csi.jwtSecretName }}/versions/latest"
        path: "jwt-secret"
      - resourceName: "projects/{{ .Values.secrets.csi.projectNumber }}/secrets/{{ .Values.secrets.csi.oauthClientSecretName }}/versions/latest"
        path: "client-secret"
      {{- if eq (include "xmanager-cloud.clickhouseUsesCsi" .) "true" }}
      # Only mounted when secrets.csi.clickhousePasswordSecretName is configured: every service
      # mounting this class fails to start when a listed Secret Manager secret is absent.
      - resourceName: "projects/{{ .Values.secrets.csi.projectNumber }}/secrets/{{ include "xmanager-cloud.clickhouseCsiSecretName" . }}/versions/latest"
        path: "clickhouse-password"
      {{- end }}
  secretObjects:
    - secretName: backend-jwt-secrets
      type: Opaque
      data:
        - objectName: jwt-secret
          key: jwt-secret
    - secretName: gcp-oauth-credentials
      type: Opaque
      data:
        - objectName: client-secret
          key: client-secret
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: backend-oauth-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.development.jwtSecret | quote }}
  client-secret: {{ .Values.secrets.development.clientSecret | quote }}
{{- end }}

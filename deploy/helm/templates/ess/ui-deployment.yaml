{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      serviceAccountName: xmc-ui
      containers:
      - name: xmc-ui
        image: {{ .Values.ui.image | quote }}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: XMC_API_URL
          value: {{ include "xmanager-cloud.uiApiUrl" . | quote }}
        - name: XMC_REFRESH_INTERVAL_MS
          value: {{ .Values.ui.refreshIntervalMs | quote }}
        - name: XMC_DEFAULT_TO_CURSOR_PAGINATION
          value: {{ .Values.ui.enableCursorPagination | quote }}
        - name: XMC_STATUS_MESSAGE_HISTORY_ENABLED
          value: {{ .Values.statusMessageHistoryEnabled | quote }}
        - name: XMC_ADMIN_PANEL_ENABLED
          value: {{ .Values.healthServiceDeployment.enabled | quote }}
        - name: XMC_RESOURCE_DASHBOARD_ENABLED
          value: {{ if .Values.rodDeployment }}{{ .Values.rodDeployment.enabled | quote }}{{ else }}"false"{{ end }}
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
{{- end }}

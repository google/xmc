# Defines the Deployment for the Experiment State Server pods.
{{- if .Values.essDeployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: experiment-state-server-deployment
  labels:
    app: experiment-state-server
spec:
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: experiment-state-server
  template:
    metadata:
      labels:
        app: experiment-state-server
    spec:
      serviceAccountName: experiment-server
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: validation-private-key-volume
          secret:
            secretName: validation-secret
            items:
            - key: tls.key
              path: tls.key
        {{- if .Values.secrets.csi.enabled }}
        - name: gcp-secrets-volume
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "gcp-secrets-provider"
        {{- else }}
        - name: gcp-secrets-volume
          secret:
            secretName: backend-oauth-secrets
        {{- end }}
      containers:
      - name: experiment-state-server
        image: {{ .Values.ess_custom_image | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        volumeMounts:
          - name: validation-private-key-volume
            mountPath: /etc/signing-key
            readOnly: true
          - name: gcp-secrets-volume
            mountPath: /etc/gcp-secrets
            readOnly: true
        ports:
        - containerPort: 50051
          name: grpc-port
        - containerPort: 8080
          name: http-port
        readinessProbe:
          tcpSocket:
              port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
              port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"
        env:
        - name: IAP_EXPECTED_ISSUER
          value: {{ .Values.experimentStateServer.iap.iapIssuer | quote }}
        - name: IAP_EXPECTED_HTTP_AUDIENCE
          value: {{ .Values.experimentStateServer.iap.httpAudience | quote }}
        - name: IAP_EXPECTED_GRPC_AUDIENCE
          value: {{ .Values.experimentStateServer.iap.grpcAudience | quote }}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-password
        - name: MOCK_AUTH
          value: {{ .Values.experimentStateServer.mockAuth | quote }}
        - name: ALLOWED_DOMAINS
          value: {{ .Values.experimentStateServer.allowedDomains | quote }}
        - name: ALLOWED_EMAILS
          value: {{ .Values.experimentStateServer.allowedEmails | quote }}
        - name: DISABLE_AUTHENTICATION
          value: {{ .Values.experimentStateServer.disableAuthentication | default "false" | quote }}
        - name: TRUST_X_FORWARDED_PROTO
          value: {{ .Values.experimentStateServer.trustXForwardedProto | quote }}
        - name: CLIENT_ID
          value: {{ .Values.experimentStateServer.iap.clientId | quote }}
        - name: GCP_PROJECT_ID
          value: {{ .Values.projectId | quote }}
        - name: AUTHORIZED_IAM_ROLE
          value: {{ .Values.experimentStateServer.authorizedIamRole | quote }}
        - name: JWT_SECRET_FILE
          value: "/etc/gcp-secrets/jwt-secret"
        - name: CLIENT_SECRET_FILE
          value: "/etc/gcp-secrets/client-secret"
        - name: REDIRECT_URL
          value: "https://{{ include "xmanager-cloud.apiHostname" . }}/api/callback"
        - name: FRONTEND_URL
          value: "https://{{ include "xmanager-cloud.uiHostname" . }}"
        args:
        - "-ess_tls_cert_file="
        - "-ess_tls_key_file="
        - "-ess_gcp_project_id={{ .Values.projectId }}"
        - "-ess_xid_service_addr=xid-svc.xmc.svc.cluster.local:50051"
        - "-ess_spanner_database_name={{ .Values.experimentStateServer.spannerDatabaseName | default (printf "projects/%s/instances/xmc-%s/databases/experiment-db-%s" .Values.projectId .Values.environment .Values.environment) }}"
        - "-ess_actuator_url=https://actuator.api.{{ .Values.environment }}.{{ .Values.domainSuffix }}/actuate"
        - "-ess_endpoint_url=http://api.{{ .Values.environment }}.{{ .Values.domainSuffix }}"
        - "-ess_quota_project_id={{ .Values.projectId }}"
        - "-ess_service_account=xmc-ess-sa-{{ .Values.environment }}@{{ .Values.projectId }}.iam.gserviceaccount.com"
        - "-ess_signature_ttl_seconds={{ .Values.taskSignatureTtlSeconds }}"
        - "-ess_allowed_origins={{ .Values.experimentStateServer.allowedOrigins }}"
        - "-alsologtostderr"
        - "-ess_default_to_cursor_pagination={{ .Values.defaultToCursorPagination }}"
        - "-ess_status_message_history_enabled={{ .Values.statusMessageHistoryEnabled }}"
        - "-redis_addr={{ .Values.redisAddr }}"
        # Flags to disable internalVCSdependencies.
        - "--enforce_kernel_ipv6_support=false"
        - "--enable_streamz_rpc_service=false"
        - "--logtostderr"
        - "--securewrapper_dummyimpl_auth_user=$(USER)"
        - "--streamz_servers="
        - "--envelope_enabled=false"
        - "--notracelog"
        - "--remote_coredump_enabled"
{{- end }}

# Defines the Deployment for the Experiment State Server pods.
{{- if .Values.essDeployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: experiment-state-server-deployment
  labels:
    app: experiment-state-server
spec:
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: experiment-state-server
  template:
    metadata:
      annotations:
        checksum/db-config: {{ include (print $.Template.BasePath "/db-config.yaml") . | sha256sum }}
      labels:
        app: experiment-state-server
    spec:
      serviceAccountName: experiment-server
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: validation-private-key-volume
          secret:
            secretName: validation-secret
            items:
            - key: tls.key
              path: tls.key
        {{- include "xmanager-cloud.gcpSecretsVolume" . | nindent 8 }}
      containers:
      - name: experiment-state-server
        image: {{ .Values.ess_custom_image | quote }}
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
        volumeMounts:
          - name: validation-private-key-volume
            mountPath: /etc/signing-key
            readOnly: true
          - name: gcp-secrets-volume
            mountPath: /etc/gcp-secrets
            readOnly: true
        ports:
        - containerPort: 50051
          name: grpc-port
        - containerPort: 8080
          name: http-port
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"
        envFrom:
        - configMapRef:
            name: ess-config
        - configMapRef:
            name: feature-flags-config
        - configMapRef:
            name: db-config
        env:
        - name: IAP_EXPECTED_HTTP_AUDIENCE
          value: {{ .Values.experimentStateServer.iap.httpAudience | quote }}
        - name: IAP_EXPECTED_GRPC_AUDIENCE
          value: {{ .Values.experimentStateServer.iap.grpcAudience | quote }}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-password
        {{- include "xmanager-cloud.oauthEnv" . | nindent 8 }}
        args:
        - "-ess_tls_cert_file="
        - "-ess_tls_key_file="
{{- end }}

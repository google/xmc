{{- if .Values.essDeployment.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ess-config
  labels:
    app: experiment-state-server
data:
  ess_gcp_project_id: {{ .Values.projectId | quote }}
  ess_xid_service_addr: "xid-svc.xmc.svc.cluster.local:50051"
  ess_dashboard_service_addr: "dashboard-service.xmc.svc.cluster.local:50051"
  # Deprecated: retained for one-release rollout compatibility; ESS reads db-config.
  # TODO: Remove ess_spanner_database_name once all deployments run db-config images.
  ess_spanner_database_name: {{ .Values.experimentStateServer.spannerDatabaseName | default (printf "projects/%s/instances/xmc-%s/databases/experiment-db-%s" .Values.projectId .Values.environment .Values.environment) | quote }}
  ess_actuator_url: {{ printf "https://actuator.api.%s.%s/actuate" .Values.environment .Values.domainSuffix | quote }}
  ess_endpoint_url: {{ printf "http://api.%s.%s" .Values.environment .Values.domainSuffix | quote }}
  ess_quota_project_id: {{ .Values.projectId | quote }}
  ess_service_account: {{ required "gcpServiceAccount is required" .Values.gcpServiceAccount | quote }}
  ess_signature_ttl_seconds: {{ .Values.taskSignatureTtlSeconds | quote }}
  ess_allowed_origins: {{ .Values.auth.allowedOrigins | quote }}
  ess_jwks_url: {{ if and .Values.auth .Values.auth.jwksUrl }}{{ .Values.auth.jwksUrl | quote }}{{ else if and .Values.auth .Values.auth.issuerUrl }}{{ printf "%s/keys" (.Values.auth.issuerUrl | trimSuffix "/") | quote }}{{ else }}""{{ end }}
  redis_addr: {{ .Values.redisAddr | quote }}
  enable_components: {{ .Values.componentsDeployment.enabled | quote }}
  {{- $mlRun := .Values.mlRun | default dict }}
  mldiagnostics_environment: {{ $mlRun.environment | default "prod" | quote }}
  mlrun_project: {{ $mlRun.project | default .Values.projectId | quote }}
  mlrun_location: {{ $mlRun.location | default .Values.clusterLocation | default "us-central1" | quote }}
  {{- /* ESS calls ML Run with its own workload identity; mlRun.impersonateServiceAccount is Reconciler-only. */}}
{{- end }}

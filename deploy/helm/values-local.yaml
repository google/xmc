# Static local development Helm values overlay for KinD / local dev environments.
# Merged automatically with dynamically generated project/database values.

domainSuffix: "local.xmc.dev"
isDevEnvironment: true
imageTag: latest
taskSignatureTtlSeconds: 300
redisAddr: "redis-service.xmc.svc.cluster.local:6379"

# Local container image tags loaded directly into KinD nodes via ImageBuilder.
# In local KinD deployments, ChartSanitizer patches imagePullPolicy from Always to IfNotPresent.
# If an image is not built/loaded into KinD, containerd will attempt to pull the unqualified
# name from Docker Hub, failing with ImagePullBackOff and triggering automated diagnostics.
xid_custom_image: "xid_service_image:latest"
actuator_custom_image: "actuator_image:latest"
reconciler_custom_image: "reconciler_image:latest"
ess_custom_image: "experiment_state_server_image:latest"
xmc_bridge_custom_image: "xmc_bridge_image:latest"
ingestion_gateway_custom_image: "ingestion_gateway_image:latest"

xidService:
  hpa:
    minReplicas: 1
    maxReplicas: 1

essDeployment:
  enabled: true
  hpa:
    minReplicas: 1
    maxReplicas: 1

logMonitorDeployment:
  enabled: false

auth:
  disableAuthentication: false
  isNonProdAuth: true
  allowedEmails: "admin@xmc.local,viewer@xmc.local"
  clientId: "xmc-client"
  iap:
    clientId: "xmc-client"
    iapIssuer: "http://dex.dex.svc.cluster.local:5556/dex"
  googleApplicationCredentials: "/etc/gcp-secrets/key.json"
  redirectUrl: "http://localhost:8080/api/callback"
  frontendUrl: "http://localhost:8080"
  authUrl: "http://localhost:5556/dex/auth"
  tokenUrl: "http://dex.dex.svc.cluster.local:5556/dex/token"
  apiUrl: "http://dex.dex.svc.cluster.local:5556/dex/userinfo"
  secureCookie: false
  issuerUrl: "http://dex.dex.svc.cluster.local:5556/dex"

secrets:
  csi:
    enabled: false
  development:
    jwtSecret: "e2e-development-secret-must-be-at-least-32-chars-long"
    clientSecret: "xmc-client-secret"

ui:
  enabled: true
  image: "ui-image:latest"
  apiUrl: "http://localhost:8080/v1"

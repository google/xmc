apiVersion: v1
kind: ServiceAccount
metadata:
  name: xmc-bridge-sa
  namespace: {{ .Release.Namespace | default "xmc" }}
  labels:
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: xmc-bridge-role
  namespace: {{ .Release.Namespace | default "xmc" }}
  labels:
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
rules:
  - apiGroups: ["xmc.dev"]
    resources: ["components", "components/status", "components/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "secrets", "configmaps", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["clickhouse.altinity.com"]
    resources: ["clickhouseinstallations", "clickhouseinstallations/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["redpanda.vectorized.io"]
    resources: ["redpandas", "redpandas/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: xmc-bridge-rolebinding
  namespace: {{ .Release.Namespace | default "xmc" }}
  labels:
    app.kubernetes.io/name: xmc-bridge
    app.kubernetes.io/part-of: xmanager-cloud
subjects:
  - kind: ServiceAccount
    name: xmc-bridge-sa
    namespace: {{ .Release.Namespace | default "xmc" }}
roleRef:
  kind: Role
  name: xmc-bridge-role
  apiGroup: rbac.authorization.k8s.io

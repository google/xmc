# Vizier server image built from image/Dockerfile. No upstream image exists, so build it and push it
# to a registry the cluster can pull from (see README.md), then override image.repository.
image:
  repository: xmc-vizier
  # Empty uses the chart appVersion, the google-vizier release the image pins.
  tag: ""
  pullPolicy: IfNotPresent

# The Service is always named "vizier-service" and listens on port 7077, so that the default
# `vizier` component endpoint (vizier-service.<namespace>.svc.cluster.local:7077) resolves
# without overrides.
service:
  type: ClusterIP

# Serves gRPC server reflection so that grpcurl can call Vizier without its proto files. Leave it
# off outside development: it lets anyone who can reach the port list every method.
grpcReflection:
  enabled: false

# Where Vizier persists studies and trials.
database:
  # "sqlite" stores them in a SQLite file on a PersistentVolumeClaim; "postgres" stores them in an
  # existing PostgreSQL database, which this chart does not create.
  type: sqlite
  sqlite:
    storageSize: 1Gi
    # Empty uses the cluster's default StorageClass.
    storageClassName: ""
  postgres:
    # host and user are required when type is "postgres".
    host: ""
    port: 5432
    user: ""
    database: vizier
    # libpq sslmode. verify-ca and verify-full trust the image's system CA bundle.
    sslMode: verify-full
    # Secret in the release namespace holding the password. The defaults match the Secret the XMC
    # chart creates when database.backend is "postgres".
    passwordSecret:
      name: postgres-secret
      key: postgres-password

# The Vizier port is unauthenticated plaintext gRPC: production installs must enable this policy.
# It admits only the xmc-bridge health probe and pods labelled xmc.google.com/vizier-client: "true",
# and only from the release namespace: its peers have no namespaceSelector, so an xmc-bridge running
# in another namespace would be blocked.
networkPolicy:
  enabled: false

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

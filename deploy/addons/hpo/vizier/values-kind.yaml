# KinD overlay: exposes the Service on a NodePort so host-side probes can reach it, serves gRPC
# reflection for grpcurl, keeps studies in SQLite on the KinD default StorageClass, and leaves the
# NetworkPolicy off because KinD's default CNI does not enforce it. The image defaults
# (xmc-vizier:<appVersion>, IfNotPresent) already use the image loaded with
# `kind load docker-image`.
service:
  type: NodePort

grpcReflection:
  enabled: true

database:
  type: sqlite

networkPolicy:
  enabled: false

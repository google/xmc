# Single-replica Vizier server: the upstream SQL datastore serializes writes through one
# connection, and the SQLite variant needs exclusive access to its volume, so the Deployment is
# recreated rather than rolled. Port 7077 is a contract constant of the `vizier` component.
{{- $dbType := include "vizier.databaseType" . }}
{{- $pg := .Values.database.postgres }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vizier
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vizier.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vizier.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vizier.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: vizier
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vizier
          image: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          ports:
            - name: grpc
              containerPort: 7077
              protocol: TCP
          env:
            - name: VIZIER_PORT
              value: "7077"
            - name: VIZIER_ENABLE_REFLECTION
              value: {{ .Values.grpcReflection.enabled | default false | toString | quote }}
            {{- if eq $dbType "postgres" }}
            - name: VIZIER_POSTGRES_HOST
              value: {{ required "database.postgres.host is required when database.type is postgres" $pg.host | quote }}
            - name: VIZIER_POSTGRES_PORT
              value: {{ $pg.port | default 5432 | toString | quote }}
            - name: VIZIER_POSTGRES_USER
              value: {{ required "database.postgres.user is required when database.type is postgres" $pg.user | quote }}
            - name: VIZIER_POSTGRES_DATABASE
              value: {{ $pg.database | default "vizier" | quote }}
            - name: VIZIER_POSTGRES_SSLMODE
              value: {{ $pg.sslMode | default "verify-full" | quote }}
            - name: VIZIER_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.postgres.passwordSecret.name is required when database.type is postgres" $pg.passwordSecret.name | quote }}
                  key: {{ required "database.postgres.passwordSecret.key is required when database.type is postgres" $pg.passwordSecret.key | quote }}
            {{- else }}
            - name: VIZIER_DATABASE_URL
              value: "sqlite:////data/vizier.db"
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $dbType "sqlite" }}
            - name: data
              mountPath: /data
            {{- end }}
      volumes:
        - name: tmp
          # Bounded so a runaway writer cannot fill the node's disk; /tmp only holds HOME caches.
          emptyDir:
            sizeLimit: 256Mi
        {{- if eq $dbType "sqlite" }}
        - name: data
          persistentVolumeClaim:
            claimName: vizier-data
        {{- end }}

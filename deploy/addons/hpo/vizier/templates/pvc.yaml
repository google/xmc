# Volume for the SQLite database file, rendered only when database.type is "sqlite". Helm keeps
# the claim on uninstall so that studies survive a reinstall.
{{- if eq (include "vizier.databaseType" .) "sqlite" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vizier-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vizier.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.database.sqlite.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.database.sqlite.storageSize }}
{{- end }}

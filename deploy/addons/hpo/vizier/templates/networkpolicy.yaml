# Opt-in ingress restriction, required in production because the Vizier port is unauthenticated
# plaintext gRPC: only the xmc-bridge TCP health probe and pods labelled
# xmc.google.com/vizier-client: "true" may reach it. The peers have no namespaceSelector, so they
# match pods of the release namespace only.
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vizier
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vizier.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vizier.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: xmc-bridge
        - podSelector:
            matchLabels:
              xmc.google.com/vizier-client: "true"
      ports:
        - port: grpc
          protocol: TCP
{{- end }}

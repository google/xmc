apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: cpu-flavor
spec:
  nodeLabels: {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: multikueue-cpu-cluster-queue
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: cpu-flavor
          resources:
            - name: cpu
              nominalQuota: 100000000
            - name: memory
              nominalQuota: 100000000Gi
---
apiVersion: v1
kind: Namespace
metadata:
  name: multikueue-cpu-queue
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: multikueue-cpu-queue
  namespace: multikueue-cpu-queue
spec:
  clusterQueue: multikueue-cpu-cluster-queue

apiVersion: v1
kind: Namespace
metadata: {name: multikueue-cpu-queue}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: multikueue-cpu-queue, namespace: multikueue-cpu-queue}
spec: {clusterQueue: multikueue-cpu-cluster-queue}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: multikueue-cpu-cluster-queue}
spec:
  namespaceSelector: {}
  admissionChecksStrategy:
    admissionChecks: [{name: multikueue-admission-check}]
  resourceGroups:
    - coveredResources: [cpu, memory]
      flavors:
        - name: cpu-flavor
          resources:
            - {name: cpu, nominalQuota: 100000000}
            - {name: memory, nominalQuota: 100000000Gi}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata: {name: multikueue-admission-check}
spec:
  controllerName: kueue.x-k8s.io/multikueue
  parameters: {apiGroup: kueue.x-k8s.io, kind: MultiKueueConfig, name: multikueue-config}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: MultiKueueConfig
metadata: {name: multikueue-config}
spec: {clusters: [xmc-nightly-worker-1]}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: MultiKueueCluster
metadata:
  name: xmc-nightly-worker-1
  labels: {xmc.google.com/project: xmc-dev, xmc.google.com/location: us-central1, xmc.google.com/cluster-name: xmc-nightly-worker-1}
spec:
  clusterSource:
    kubeConfig: {locationType: Secret, location: multikueue-worker-kubeconfig}

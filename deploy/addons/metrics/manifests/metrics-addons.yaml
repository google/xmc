# Note: Prior to applying this manifest manually, create the format schema and init SQL ConfigMaps:
#   kubectl create configmap clickhouse-format-schemas --namespace=xmc-metrics \
#     --from-file=metrics.proto=api/protos/metrics/metrics.proto --dry-run=client -o yaml | kubectl apply -f -
#   kubectl create configmap clickhouse-init-scripts --namespace=xmc-metrics \
#     --from-file=init.sql=deploy/clickhouse/schema.sql --dry-run=client -o yaml | kubectl apply -f -

apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: xmc
  labels:
    app.kubernetes.io/name: redpanda
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: admin
      port: 9644
      targetPort: 9644
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: xmc
  labels:
    app.kubernetes.io/name: redpanda
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
    spec:
      volumes:
        - name: redpanda-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redpanda
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
          args:
            - redpanda
            - start
            - --mode
            - dev-container
            - --smp
            - "1"
            - --memory
            - 1G
            - --reserve-memory
            - 0M
            - --overprovisioned
            - --node-id
            - "0"
            - --check=false
            - --kafka-addr
            - 0.0.0.0:9092
            - --advertise-kafka-addr
            - redpanda-0.redpanda.xmc.svc.cluster.local:9092
          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9644
              name: admin
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 30); do
                      if rpk topic describe xmc-metrics >/dev/null 2>&1 || rpk topic create xmc-metrics --partitions 128 --replicas 1 >/dev/null 2>&1; then
                        exit 0
                      fi
                      sleep 1
                    done
                    exit 0
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: xmc-metrics
  labels:
    app.kubernetes.io/name: clickhouse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: tcp
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: xmc-metrics
  labels:
    app.kubernetes.io/name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.3-alpine
          env:
            - name: CLICKHOUSE_DO_NOT_CHOWN
              value: "1"
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
            - name: CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS
              value: "1"
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: tcp
          volumeMounts:
            - name: format-schemas
              mountPath: /var/lib/clickhouse/format_schemas/metrics.proto
              subPath: metrics.proto
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: format-schemas
          configMap:
            name: clickhouse-format-schemas
        - name: init-scripts
          configMap:
            name: clickhouse-init-scripts

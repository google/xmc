# DEV/TEST ONLY Vizier fixture: apply with `kubectl apply -n <namespace> -f vizier.yaml`.
# Studies live in SQLite on an emptyDir, so they survive container restarts but not pod deletion.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vizier
  labels:
    app.kubernetes.io/name: vizier
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vizier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vizier
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vizier
          image: xmc-vizier:0.1.24
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 7077
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vizier-service
  labels:
    app.kubernetes.io/name: vizier
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vizier
  ports:
    - name: grpc
      port: 7077
      targetPort: grpc

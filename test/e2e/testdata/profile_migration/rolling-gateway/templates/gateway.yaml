Zero-downtime rolling update: maxUnavailable 0 keeps every serving replica until its replacement
is Ready, and agnhost netexec keeps serving for --delay-shutdown seconds after SIGTERM while its
/readyz turns 503, which covers endpoint propagation to kube-proxy. The namespace is set explicitly
as a defensive measure: the harness's shared Helm manager initializes its Helm SDK client for the
"xmc" namespace and does not default unnamespaced objects to the release namespace.
*/}}
{{- $cfg := .Values.ingestionGatewayDeployment }}
{{- if $cfg.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-gateway
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: ingestion-gateway
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  replicas: {{ $cfg.replicas }}
  minReadySeconds: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-gateway
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: {{ required "ingestionGatewayDeployment.image is required" $cfg.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["netexec", "--http-port=8080", "--delay-shutdown=10"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 1
            failureThreshold: 1
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-gateway
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: ingestion-gateway
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ingestion-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}

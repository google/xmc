# TEST-ONLY FIXTURE: "stable-2026b" is NOT a product profile and is not shipped under
# deploy/profiles/. profile_migration_test.go simulates a profile upgrade by rendering the real
# stable-2026a chart with global.imageTag set to imageTag, then rewriting each rendered Component
# CR's xmc.dev/profile label to profile and its spec.chartVersion and spec.version to the entry in
# chartVersions. These are the fields a new profile release changes: component identity and chart
# versions are fixed by the profile catalog, so admin values cannot override them. The workload roll
# comes from imageTag: the profile renders it as spec.imageTag, which the bridge uses as the image tag
# in preference to spec.version.

profile: stable-2026b
# Container image tag of the ingestion-gateway stand-in workload; must differ from the baseline tag.
imageTag: "2.53"
# Bumped chart version per catalog component of the profile.
chartVersions:
  redpanda: "0.2.0"
  clickhouse: "0.2.0"
  ingestion-gateway: "0.2.0"

# Static admin values for rendering the real deploy/profiles/stable-2026a chart in
# profile_migration_test.go. Per-run values (namespaces, the ClickHouse host and Secret,
# global.imageTag, and the ingestion-gateway chartPath, imageRepository and replicas) are layered on
# top by the test.

global:
  platformProfile: stable-2026a

components:
  redpanda:
    enabled: false
    deletionProtection: false
  clickhouse:
    enabled: true
    deletionProtection: false
  ingestion-gateway:
    enabled: true
    deletionProtection: false
    # Redpanda stays disabled in this suite, so the gateway only depends on ClickHouse.
    dependencies: ["clickhouse"]
  vizier:
    enabled: false
    deletionProtection: false
  hpo:
    enabled: false
    deletionProtection: false

# A Kueue queue for the E2E preemption scenario. Its quota fits only one of the scenario's
# 400m work units at a time, so admitting the high-priority one requires preempting the
# low-priority one. The cpu-flavor ResourceFlavor comes from the chart's kueue-dev templates.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: preemption-cluster-queue
spec:
  namespaceSelector: {}
  preemption:
    withinClusterQueue: LowerPriority
  resourceGroups:
  - coveredResources: ["cpu", "memory"]
    flavors:
    - name: cpu-flavor
      resources:
      - name: cpu
        nominalQuota: 500m
      - name: memory
        nominalQuota: 512Mi
---
apiVersion: v1
kind: Namespace
metadata:
  name: preemption-queue
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  namespace: preemption-queue
  name: preemption-queue
spec:
  clusterQueue: preemption-cluster-queue

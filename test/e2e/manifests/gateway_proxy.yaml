apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-proxy-config
  namespace: xmc
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      resolver 10.96.0.10 valid=5s ipv6=off;
      server {
        listen 8080;
        location /api/ {
          set $ess_backend http://http-service.xmc.svc.cluster.local:8080;
          proxy_pass $ess_backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /v1/ {
          set $ess_backend http://http-service.xmc.svc.cluster.local:8080;
          proxy_pass $ess_backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /healthz {
          set $ess_backend http://http-service.xmc.svc.cluster.local:8080;
          proxy_pass $ess_backend;
        }
        location /readyz {
          set $ess_backend http://http-service.xmc.svc.cluster.local:8080;
          proxy_pass $ess_backend;
        }
        location / {
          set $ui_backend http://ui-service.xmc.svc.cluster.local:80;
          proxy_pass $ui_backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-proxy
  namespace: xmc
  labels:
    app: gateway-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-proxy
  template:
    metadata:
      labels:
        app: gateway-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: gateway-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-proxy-service
  namespace: xmc
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
  selector:
    app: gateway-proxy

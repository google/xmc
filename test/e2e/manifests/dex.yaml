apiVersion: v1
kind: ConfigMap
metadata:
  name: dex-config
  labels:
    app.kubernetes.io/name: dex
data:
  config.yaml: |
    issuer: http://localhost:5556/dex
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    telemetry:
      http: 0.0.0.0:5558
    staticClients:
      - id: xmc-client
        redirectURIs:
          - 'http://localhost:8080/api/callback'
          - 'http://127.0.0.1:8080/api/callback'
          - 'http://localhost:5556/dex/callback'
        name: 'XMC Client'
        secret: xmc-client-secret
    enablePasswordDB: true
    staticUsers:
      - email: "admin@xmc.local"
        # bcrypt hash of "password"
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: "admin"
        userID: "00000000-0000-0000-0000-000000000001"
      - email: "viewer@xmc.local"
        # bcrypt hash of "password"
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: "viewer"
        userID: "00000000-0000-0000-0000-000000000002"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.41.1
          command: ["dex", "serve", "/etc/dex/cfg/config.yaml"]
          ports:
            - name: http
              containerPort: 5556
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/dex/cfg
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: dex-config
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  labels:
    app.kubernetes.io/name: dex
spec:
  type: NodePort
  ports:
    - name: http
      port: 5556
      targetPort: 5556
      nodePort: 30556
      protocol: TCP
  selector:
    app.kubernetes.io/name: dex

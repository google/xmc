run:
  timeout: 5m
  tests: true

output:
  formats:
    - format: colored-line-number

linters:
  disable-all: true
  enable:
    # Phase 1: Go formatting enforcement
    - gofmt
    # Phase 2: Static analysis & quality enforcement
    - ineffassign
    - misspell
    - asciicheck
    - bidichk
    - nakedret
    # Phase 3: Code formatting & complexity checks
    - whitespace
    - nestif
    # Phase 4: Function result limit & duplication detection
    - dupl
    - revive

linters-settings:
  gofmt:
    simplify: true
  misspell:
    locale: US
    ignore-words:
      - commonhealth
      - cancelled
      - cancelling
      - labelled
  nestif:
    min-complexity: 4
  dupl:
    threshold: 100
  revive:
    rules:
      - name: function-result-limit
        arguments: [2]

issues:
  exclude-dirs:
    - cmd/ui/node_modules
  exclude-rules:
    - path: (_test\.go|cmd/actuator/k8s_client/client\.go)
      linters:
        - dupl
    # TODO(Phase 4.2): Refactor legacy 3rd party driver interface methods (golang-migrate), AIP-158 pagination & test setup helpers returning 3+ parameters
    - path: (internal/storage/spanner/migrations|test/metrics|internal/task_queue_redis/validator|cmd/ingestion_gateway|internal/storage/spanner/xid|kueue_sync_test\.go|jobset_test\.go|internal/validator/names\.go|internal/storage/test_utils\.go|health_test\.go|liststatement\.go|utils_test\.go|query_generator\.go|emulator\.go|key_reloader\.go|listexperiments\.go|listcharts\.go|spanner_health\.go|k8sclient_test_utils\.go|updateartifact\.go|updateexperiment\.go|queryfilter\.go|listartifacts\.go|savestatusmessagehistory_test\.go|liststatusmessages\.go|base\.go|batchstopworkunits\.go|listworkunits\.go|updateworkunit\.go|workload/converter\.go|reconciler_test\.go|internal/auth|tools/xmc-diag|internal/storage/data)
      linters:
        - revive
    # TODO(Phase 4.2): Refactor duplicate helper methods in rod_data_provider & experiment_state_server
    - path: (cmd/rod_data_provider|cmd/experiment_state_server/server)
      linters:
        - dupl

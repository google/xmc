run:
  timeout: 5m
  tests: true

output:
  formats:
    - format: colored-line-number

linters:
  disable-all: true
  enable:
    # Phase 1: Go formatting enforcement
    - gofmt
    # Phase 2: Static analysis & quality enforcement
    - ineffassign
    - misspell
    - asciicheck
    - bidichk
    - nakedret
    # Phase 3: Code formatting & complexity checks
    - whitespace
    - nestif
    # Phase 4: Function result limit & duplication detection
    - dupl
    - revive
    # Phase 5: Cyclomatic complexity enforcement
    - gocyclo

linters-settings:
  gofmt:
    simplify: true
  misspell:
    locale: US
    ignore-words:
      - commonhealth
      - cancelled
      - cancelling
      - labelled
  nestif:
    min-complexity: 4
  gocyclo:
    min-complexity: 15
  dupl:
    threshold: 100
  revive:
    rules:
      - name: function-result-limit
        arguments: [3]
      - name: error-strings
      - name: error-naming
      - name: error-return
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: superfluous-else
      - name: early-return
      - name: defer
      - name: string-format
      - name: useless-break
      - name: time-naming
      - name: unexported-return
      - name: increment-decrement
      - name: range
      - name: receiver-naming
      - name: get-return
      - name: bool-literal-in-expr
      - name: constant-logical-expr
      - name: bare-return
      - name: time-equal
      - name: waitgroup-by-value
      - name: atomic

issues:
  exclude-dirs:
    - cmd/ui/node_modules
  exclude-rules:
    - path: (_test\.go|cmd/actuator/k8s_client/client\.go)
      linters:
        - dupl
    - path: _test\.go
      linters:
        - gocyclo
    # TODO(Phase 5): Refactor legacy query filter ASTs and Spanner row decoders exceeding cyclomatic complexity 15
    - path: (api/filter/go|internal/query_generator|internal/storage/spanner)
      linters:
        - gocyclo


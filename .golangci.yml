run:
  timeout: 5m
  tests: true

output:
  formats:
    - format: colored-line-number

linters:
  disable-all: true
  enable:
    # Phase 1: Go formatting enforcement
    - gofmt
    # Phase 2: Static analysis & quality enforcement
    - ineffassign
    - misspell
    - asciicheck
    - bidichk
    - nakedret
    # Phase 3: Code formatting & complexity checks
    - whitespace
    - nestif

linters-settings:
  gofmt:
    simplify: true
  misspell:
    locale: US
    ignore-words:
      - commonhealth
      - cancelled
      - cancelling
      - labelled
  nestif:
    min-complexity: 4

issues:
  # TODO: Refactor api/filter for nestif complexity in Phase 3.4.
  exclude-dirs:
    - api/filter
  exclude-rules:
    # TODO: Refactor test files for nestif and remove exclusion incrementally.
    - path: ".*_test\\.go"
      linters:
        - nestif

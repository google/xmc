run:
  timeout: 5m
  tests: true

output:
  formats:
    - format: colored-line-number

linters:
  disable-all: true
  enable:
    # Phase 1: Go formatting enforcement
    - gofmt
    # Phase 2: Static analysis & quality enforcement
    - ineffassign
    - misspell
    - asciicheck
    - bidichk
    - nakedret
    # Phase 3: Code formatting & complexity checks
    - whitespace
    - nestif
    # Phase 4: Function result limit & duplication detection
    - dupl
    - revive
    # Phase 5: Cyclomatic complexity enforcement
    - gocyclo
    # Phase 6: Idiomatic hygiene & architectural boundary enforcement
    - depguard
    - dogsled
    - dupword
    - nolintlint
    - nosprintfhostport
    - predeclared
    - usestdlibvars

linters-settings:
  gofmt:
    simplify: true
  misspell:
    locale: US
    ignore-words:
      - commonhealth
      - cancelled
      - cancelling
      - labelled
  dupword:
    ignore:
      - READ
  nolintlint:
    allow-unused: false
    require-explanation: true
    require-specific: true
  usestdlibvars:
    http-method: true
    http-status-code: true
    time-weekday: true
    time-month: true
    time-layout: true
    crypto-hash: true
    default-rpc-path: true
  depguard:
    rules:
      postgres-no-spanner:
        files:
          - "**/internal/storage/postgres/**"
        deny:
          - pkg: "cloud.google.com/go/spanner"
            desc: "Postgres storage packages must remain isolated from Spanner (internal/storage/AGENTS.md)"
          - pkg: "xmanager_cloud/internal/storage/spanner"
            desc: "Postgres storage packages must not import Spanner packages (internal/storage/AGENTS.md)"
      spanner-no-postgres:
        files:
          - "**/internal/storage/spanner/**"
        deny:
          - pkg: "github.com/jackc/pgx"
            desc: "Spanner storage packages must remain isolated from PostgreSQL (internal/storage/AGENTS.md)"
          - pkg: "xmanager_cloud/internal/storage/postgres"
            desc: "Spanner storage packages must not import PostgreSQL packages (internal/storage/AGENTS.md)"
      pkg-and-internal-no-cmd:
        files:
          - "**/pkg/**"
          - "**/internal/**"
        deny:
          - pkg: "xmanager_cloud/cmd"
            desc: "Reusable pkg/ and internal/ libraries must not import service cmd/ packages"
  nestif:
    min-complexity: 4
  gocyclo:
    min-complexity: 15
  dupl:
    threshold: 100
  revive:
    rules:
      - name: function-result-limit
        arguments: [3]
      - name: error-strings
      - name: error-naming
      - name: error-return
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: superfluous-else
      - name: early-return
      - name: defer
      - name: string-format
      - name: useless-break
      - name: time-naming
      - name: unexported-return
      - name: increment-decrement
      - name: range
      - name: receiver-naming
      - name: get-return
      - name: bool-literal-in-expr
      - name: constant-logical-expr
      - name: bare-return
      - name: time-equal
      - name: waitgroup-by-value
      - name: atomic
      - name: duplicated-imports
      - name: deep-exit
      - name: empty-block
      - name: empty-lines
      - name: identical-branches
      - name: if-return
      - name: modifies-value-receiver
      - name: optimize-operands-order
      - name: unnecessary-stmt
      - name: unreachable-code

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - cmd/ui/node_modules
  exclude-rules:
    - path: (_test\.go|cmd/actuator/k8s_client/client\.go)
      linters:
        - dupl
    - path: _test\.go
      linters:
        - gocyclo
    # TODO(Phase 5): Refactor legacy Spanner row decoders exceeding cyclomatic complexity 15
    - path: internal/storage/spanner
      linters:
        - gocyclo


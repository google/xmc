<mat-chip
  [class.green]="status() === StatusOption.SUCCESS || status() === StatusOption.COMPLETED"
  [class.light-green]="status() === StatusOption.STARTING"
  [class.red]="status() === StatusOption.FAILED"
  [class.blue]="status() === StatusOption.RUNNING || status() === StatusOption.NOT_RUNNING"
  [class.yellow]="
    status() === StatusOption.PENDING ||
    status() === StatusOption.INITIALIZING ||
    status() === StatusOption.UNKNOWN ||
    status() === StatusOption.RESTARTING
  "
  [class.grey]="status() === StatusOption.DESCHEDULING || status() === StatusOption.SCHEDULING"
  [class.black]="status() === StatusOption.STOPPING || status() === StatusOption.STOPPED"
>
  {{ replicas() }}
  {{ status() }}
</mat-chip>

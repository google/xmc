<mat-card class="card">
  @if (dataSource && dataSource.data.length > 0) {
    <div class="container">
      <table mat-table [dataSource]="dataSource" class="table">
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let job"> {{ job.name }} </td>
        </ng-container>

        <!-- Replicas Column -->
        <ng-container matColumnDef="replicas">
          <th mat-header-cell *matHeaderCellDef> Replicas </th>
          <td mat-cell *matCellDef="let job">
            @for (display of getReplicaDisplays(job); track display.status) {
              <xmc-status-chip [status]="display.status" [replicas]="display.replicas"> </xmc-status-chip>
            }
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <mat-paginator
        [pageSizeOptions]="[5, 10, 20]"
        showFirstLastButtons
        aria-label="Select page of jobs"
      ></mat-paginator>
    </div>
  } @else {
    <div class="no-jobs-message">No jobs to display.</div>
  }
</mat-card>

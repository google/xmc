<xmc-side-panel>
  <xmc-header class="header" (menuToggle)="toggleSidenav()"></xmc-header>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav class="sidenav" [(opened)]="isSidenavOpened" mode="side">
      <mat-nav-list>
        <a mat-list-item routerLink="/experiments">
          <div class="menu-item-container">
            <span class="google-symbols"> experiment </span> Experiments
          </div>
        </a>
        <a mat-list-item href="https://google.com" target="_blank">
          <div class="menu-item-container"> <mat-icon>book_4</mat-icon> Documentation </div>
        </a>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
      <div class="page-container">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</xmc-side-panel>

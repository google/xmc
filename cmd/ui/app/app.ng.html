@if (user()?.email) {
  <xmc-side-panel>
    <xmc-header class="header" (menuToggle)="toggleSidenav()"></xmc-header>

    <mat-sidenav-container class="sidenav-container">
      <mat-sidenav class="sidenav" [(opened)]="isSidenavOpened" mode="side">
        <mat-nav-list>
          <a mat-list-item routerLink="/experiments">
            <div class="menu-item-container">
              <mat-icon>science</mat-icon> Experiments
            </div>
          </a>
          <a mat-list-item routerLink="/resources">
            <div class="menu-item-container">
              <mat-icon>dashboard</mat-icon> Resources
            </div>
          </a>
          <a mat-list-item href="https://google.com" target="_blank" rel="noopener">
            <div class="menu-item-container">
              <mat-icon>menu_book</mat-icon> Documentation
            </div>
          </a>
        </mat-nav-list>
      </mat-sidenav>
      <mat-sidenav-content>
        <div class="page-container">
          <router-outlet></router-outlet>
        </div>
      </mat-sidenav-content>
    </mat-sidenav-container>
  </xmc-side-panel>
} @else {
  <div class="guest-page-container">
    <router-outlet></router-outlet>
  </div>
}

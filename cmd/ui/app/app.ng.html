@if (isNonProdAuth()) {
  <div class="non-prod-auth-banner" role="alert">
    <span class="warning-icon" aria-hidden="true">⚠️</span>
    <span class="warning-text"
      ><strong>NON-PRODUCTION AUTHENTICATION ACTIVE:</strong> Connected to Local IdP / Dex</span
    >
  </div>
}
@if (user()?.email) {
  <xmc-side-panel>
    <xmc-header class="header" (menuToggle)="toggleSidenav()" />

    <mat-sidenav-container class="sidenav-container">
      <mat-sidenav class="sidenav" mode="side" [(opened)]="isSidenavOpened">
        <mat-nav-list>
          <a mat-list-item routerLink="/experiments">
            <div class="menu-item-container">
              <span class="google-symbols"> experiment </span> Experiments
            </div>
          </a>
          @if (isResourceDashboardEnabled) {
            <a mat-list-item routerLink="/resources">
              <div class="menu-item-container"><mat-icon>dashboard</mat-icon> Resources</div>
            </a>
          }
          @if (isAdminPanelEnabled()) {
            <a mat-list-item routerLink="/admin">
              <div class="menu-item-container">
                <mat-icon>admin_panel_settings</mat-icon> Admin Panel
              </div>
            </a>
          }
          <a mat-list-item href="https://google.com" target="_blank" rel="noopener">
            <div class="menu-item-container"><mat-icon>book_4</mat-icon> Documentation</div>
          </a>
        </mat-nav-list>
      </mat-sidenav>
      <mat-sidenav-content>
        <div class="page-container">
          <router-outlet />
        </div>
      </mat-sidenav-content>
    </mat-sidenav-container>
  </xmc-side-panel>
} @else {
  <div class="guest-page-container">
    <router-outlet />
  </div>
}

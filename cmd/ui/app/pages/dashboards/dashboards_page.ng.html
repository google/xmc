<div class="dashboards-page-container">
  <!-- Top Toolbar matching Figma -->
  <div class="dashboards-header-toolbar">
    <div class="header-left">
      <h1 class="dashboard-title">{{ dashboardTitle() }}</h1>
    </div>

    <div class="header-right">
      <button mat-button class="toolbar-button" type="button" (click)="onRefresh()">
        <mat-icon>refresh</mat-icon>
        <span>Refresh</span>
      </button>

      <button mat-button class="toolbar-button" type="button" (click)="onOpenAddExperiment()">
        <mat-icon>add</mat-icon>
        <span>Add experiment to compare</span>
      </button>

      <div class="autosave-toggle-container">
        <mat-slide-toggle
          [checked]="autosaveEnabled()"
          (change)="autosaveEnabled.set($event.checked)"
        >
          Autosave
        </mat-slide-toggle>
      </div>

      <button
        mat-flat-button
        color="primary"
        class="share-button"
        type="button"
        (click)="onShare()"
      >
        <mat-icon>share</mat-icon>
        <span>Share</span>
      </button>
    </div>
  </div>

  <!-- Main Multi-Column Grid Canvas -->
  <div class="dashboards-content-area">
    <xmc-dashboard-grid [charts]="charts()" (removeChart)="onRemoveChart($event)" />
  </div>
</div>

<div class="scheduling-pause-card" [class.is-paused]="isSchedulingPaused()">
  <div class="pause-card-info">
    <mat-icon class="pause-icon" [class.paused-icon]="isSchedulingPaused()">
      {{ isSchedulingPaused() ? 'pause_circle' : 'play_circle' }}
    </mat-icon>
    <div class="pause-text-group">
      <div class="pause-title">Pause All Scheduling</div>
      <div class="pause-subtitle">
        Temporarily stop actuator from interacting with control plane
      </div>
    </div>
  </div>
  <div class="pause-action-container">
    <mat-slide-toggle
      color="primary"
      class="pause-slide-toggle"
      aria-label="Pause all scheduling"
      [checked]="isSchedulingPaused()"
      [disabled]="disabled()"
      (toggleChange)="onToggleClick()"
    />
  </div>
</div>

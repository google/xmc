<div class="group-card" [class.group-degraded]="isDegraded()">
  <div class="group-header">
    <div class="group-title">
      <mat-icon class="group-icon">{{ icon() }}</mat-icon>
      {{ title() }}
    </div>
    <span
      class="group-status-badge"
      [class.status-healthy]="!isDegraded()"
      [class.status-degraded]="isDegraded()"
    >
      {{ groupStatusText() }}
    </span>
  </div>
  <div class="group-items-list">
    @for (item of components(); track item.name ?? $index) {
      <div class="item-row">
        <div class="item-info">
          <span
            class="item-indicator-dot"
            [class.dot-healthy]="item.healthState === HealthState.HEALTHY"
            [class.dot-degraded]="item.healthState === HealthState.UNHEALTHY"
          ></span>
          <span class="item-name">{{ item.name }}</span>
        </div>
        <div class="item-status">
          <span
            class="item-status-text"
            [class.text-healthy]="item.healthState === HealthState.HEALTHY"
            [class.text-degraded]="item.healthState === HealthState.UNHEALTHY"
          >
            {{ mapHealthState(item.healthState) }}
          </span>
        </div>
        @if (item.errorMessage) {
          <details class="item-error-details">
            <summary class="error-summary">View Error Details</summary>
            <div class="error-content">{{ item.errorMessage }}</div>
          </details>
        }
      </div>
    }
  </div>
</div>

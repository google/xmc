<div class="modal-backdrop" (click)="onBackdropClick()">
  <div
    class="modal-container"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-pause-title"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-header">
      <mat-icon class="modal-warning-icon">warning</mat-icon>
      <h3 id="confirm-pause-title" class="modal-title">Confirm Action</h3>
    </div>
    <p class="modal-message">
      Are you sure you want to
      <strong>{{ actionWord() }}</strong> all scheduling?
      {{ actionDescription() }}
    </p>
    <div class="modal-actions">
      <button type="button" class="modal-btn-cancel" (click)="onCancel()">Cancel</button>
      <button
        type="button"
        class="modal-btn-confirm"
        [class.btn-pause]="isPausing()"
        [class.btn-resume]="!isPausing()"
        (click)="onConfirm()"
      >
        {{ confirmButtonText() }}
      </button>
    </div>
  </div>
</div>

<button
  mat-icon-button
  aria-label="Filter status messages"
  matTooltip="Filter status messages"
  [matMenuTriggerFor]="filterMenu"
>
  <mat-icon>filter_list</mat-icon>
</button>
<mat-menu class="filter-menu" #filterMenu="matMenu">
  <div class="filter-menu-title">Display Status Messages</div>
  <mat-card-content class="filter-menu-content">
    <div class="filter-column">
      <div class="filter-column-title">Severity</div>
      @for (severity of allSeverities; track severity) {
      <mat-checkbox
        [checked]="(filterService.severities$ | async)?.has(severity)"
        (change)="toggleSeverity(severity, $event.checked)"
        (click)="$event.stopPropagation()"
      >
        {{ formatSeverity(severity) }}
      </mat-checkbox>
      }
    </div>
    <div class="filter-column">
      <div class="filter-column-title">Source</div>
      @for (source of allSources; track source) {
      <mat-checkbox
        [checked]="(filterService.sources$ | async)?.has(source)"
        (change)="toggleSource(source, $event.checked)"
        (click)="$event.stopPropagation()"
      >
        {{ formatSource(source) }}
      </mat-checkbox>
      }
    </div>
  </mat-card-content>
</mat-menu>

<div class="chart-artifact-container">
  <div class="chart-artifact-header">
    <div class="chart-artifact-heading">
      <h3 class="chart-artifact-title">{{ title() }}</h3>
      @if (metricNames().length) {
        <div class="metric-names">
          @for (metric of metricNames(); track metric) {
            <span class="metric-chip">{{ metric }}</span>
          }
        </div>
      }
    </div>
  </div>

  @if (isLoading()) {
    <div class="loading-container">
      <mat-spinner diameter="32" />
    </div>
  } @else {
    @if (summaryPlots().length) {
      <div class="summary-boxes-row">
        @for (plot of summaryPlots(); track plot.plotId || $index) {
          <xmc-plot-card [plotSpec]="plot" [plotData]="plot.plotId | plotData: plotDataMap()" />
        }
      </div>
    }

    <div class="curve-plots-container">
      @for (plot of curvePlots(); track plot.plotId || $index) {
        <xmc-plot-card [plotSpec]="plot" [plotData]="plot.plotId | plotData: plotDataMap()" />
      }
    </div>
  }
</div>

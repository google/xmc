<div class="plot-card-wrapper">
  @if (isSummaryBox()) {
    @if (summaryValue(); as summary) {
      <xmc-summary-box [summary]="summary" [title]="plotTitle()" />
    }
  } @else {
    <mat-card class="plot-card" appearance="outlined">
      <div class="plot-header">
        <div class="plot-title-group">
          <span class="plot-title">{{ plotTitle() }}</span>
          <button
            mat-icon-button
            class="info-button"
            type="button"
            matTooltipPosition="above"
            aria-label="Plot info"
            [matTooltip]="infoTooltip()"
          >
            <mat-icon class="info-icon">help_outline</mat-icon>
          </button>
        </div>

        <button
          mat-icon-button
          aria-label="Plot actions"
          type="button"
          [matMenuTriggerFor]="plotMenu"
        >
          <mat-icon class="menu-icon">more_vert</mat-icon>
        </button>

        <mat-menu #plotMenu="matMenu">
          <button mat-menu-item type="button" (click)="onExportPng()">
            <mat-icon>download</mat-icon>
            <span>Export PNG</span>
          </button>
        </mat-menu>
      </div>

      <div class="plot-body">
        <div #chartCanvas class="plot-canvas" data-testid="plot-canvas"></div>
      </div>
    </mat-card>
  }
</div>

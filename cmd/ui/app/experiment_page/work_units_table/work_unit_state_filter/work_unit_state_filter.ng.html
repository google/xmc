<div class="state-filter-title">Status</div>
<div class="state-filter-content">
  <div class="state-filter-grid" [style.grid-template-rows]="gridRows">
    @for (option of options; track option.value) {
      <mat-checkbox
        class="state-filter-option"
        [checked]="isStatePending(option.value)"
        (change)="toggleState(option.value, $event.checked)"
        (click)="$event.stopPropagation()"
      >
        {{ option.label }}
      </mat-checkbox>
    }
  </div>
  <div class="state-filter-hint">None selected = all</div>
</div>

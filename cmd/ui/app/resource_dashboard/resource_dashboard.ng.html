<div class="rod-container">
  <xmc-rod-subnav-tabs [activeTab]="activeTab()" (activeTabChange)="onTabChange($event)" />
  @if (activeTab() === TAB_SMART_FINDER) {
    <xmc-smart-resource-finder
      [availableResourceTypes]="availableResourceTypes()"
      (findMatchingQueues)="onFindMatchingQueues($event)"
    />
    <div class="rod-split-container" [class.is-dragging]="isDragging()">
      @if (!isJobsFullWidth()) {
        <div class="rod-main-content" [style.flex]="leftPaneFlex()">
          <xmc-rod-queue-list
            [queues]="filteredQueues()"
            [selectedQueue]="selectedQueue()"
            [isLoading]="isLoading()"
            [secondaryDataMap]="secondaryDataMap()"
            [isSecondaryLoading]="isSecondaryLoading()"
            [activeResourceFilters]="activeResourceFilters()"
            [dominantResource]="dominantResource()"
            [(velocityPeriod)]="velocityPeriod"
            (selectQueue)="onQueueSelect($event)"
          />
        </div>
        <div
          class="rod-resize-divider"
          role="separator"
          tabindex="0"
          aria-orientation="vertical"
          aria-valuemin="20"
          aria-valuemax="80"
          aria-label="Drag to resize sections (double-click to reset)"
          title="Drag to resize sections (double-click to reset)"
          [attr.aria-valuenow]="splitRatio()"
          [class.is-dragging]="isDragging()"
          (mousedown)="startResize($event)"
          (dblclick)="resetResize()"
          (keydown)="onDividerKeyDown($event)"
        ></div>
      }
      <div
        class="jobs-side-pane"
        [class.full-width]="isJobsFullWidth()"
        [style.flex]="rightPaneFlex()"
      >
        <xmc-queue-jobs-table
          [queueName]="selectedQueue()"
          [showFullWidthToggle]="true"
          [isFullWidth]="isJobsFullWidth()"
          (fullWidthChange)="onFullWidthChange($event)"
        />
      </div>
    </div>
  } @else if (activeTab() === TAB_RESOURCE_AVAILABILITY) {
    <div class="resource-availability-container">
      <xmc-wip-banner />
    </div>
  }
</div>

<div class="rod-container">
  <div class="rod-subnav-tabs" role="tablist" aria-label="Resource Dashboard Tabs">
    <button
      class="rod-tab-btn"
      role="tab"
      [attr.aria-selected]="activeTab() === 'queues'"
      [class.active-tab]="activeTab() === 'queues'"
      (click)="activeTab.set('queues')"
    >
      Smart resource finder
    </button>
    <button
      class="rod-tab-btn"
      role="tab"
      [attr.aria-selected]="activeTab() === 'predictability'"
      [class.active-tab]="activeTab() === 'predictability'"
      (click)="activeTab.set('predictability')"
    >
      Resource availability
    </button>
  </div>

  <div class="dashboard-shell-content">
    <div class="rod-split-container">
      <!-- Left Column Placeholder (Queues matching requirements) -->
      <div class="queues-side-pane">
        <div class="queues-section-header">
          <h2 class="section-heading">Queues matching requirements</h2>
        </div>
      </div>

      <!-- Right Column: Jobs in the Queue Card Component -->
      <div class="jobs-side-pane">
        <xmc-queue-jobs-side-panel [queueName]="selectedQueueName()"></xmc-queue-jobs-side-panel>
      </div>
    </div>
  </div>
</div>

<div class="availability-container">
  <div class="availability-header">
    <h2 class="availability-title">Physical GPU Availability</h2>
    <button
      mat-stroked-button
      type="button"
      data-testid="availability-refresh-btn"
      [disabled]="loading()"
      (click)="loadAvailability()"
    >
      <mat-icon aria-hidden="true">refresh</mat-icon>
      Refresh
    </button>
  </div>

  @if (loading()) {
    <div class="state-message" data-testid="availability-loading">
      Loading physical resource availability...
    </div>
  } @else if (error(); as errorMsg) {
    <xmc-error-banner [message]="errorMsg" (retry)="loadAvailability()" />
  } @else if (summaries().length === 0) {
    <div class="state-message" data-testid="availability-empty">
      No GPU nodes found in the cluster.
    </div>
  } @else {
    <div class="availability-content" data-testid="availability-content">
      <p class="availability-summary-count">{{ summaries().length }} resource group(s) available</p>
    </div>
  }
</div>

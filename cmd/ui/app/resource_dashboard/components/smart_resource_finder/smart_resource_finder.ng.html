<div class="finder-query-card">
  <span class="query-prefix">I need</span>

  @for (row of rows(); track row.id) {
    <div class="query-row">
      <div class="query-input-group">
        <label class="query-label" [for]="'amount-input-' + row.id">Amount *</label>
        <input
          type="number"
          min="1"
          class="query-input-box query-amount-input"
          placeholder="e.g. 1"
          [id]="'amount-input-' + row.id"
          [ngModel]="row.amount"
          (ngModelChange)="updateRowAmount($index, $event)"
        />
      </div>

      <div class="query-input-group">
        <label class="query-label" [for]="'resource-type-select-' + row.id">Resource type *</label>
        <div class="select-with-remove-box">
          <select
            class="query-select-box"
            [id]="'resource-type-select-' + row.id"
            [ngModel]="row.resourceType"
            (ngModelChange)="updateRowResourceType($index, $event)"
          >
            <option value="">-</option>
            @for (resType of availableResourceTypes(); track resType) {
              <option [value]="resType">{{ resType }}</option>
            }
          </select>
          @if (rows().length > 1) {
            <button
              type="button"
              mat-icon-button
              class="remove-resource-btn"
              aria-label="Remove resource filter"
              (click)="removeRow($index)"
            >
              <mat-icon class="remove-icon">close</mat-icon>
            </button>
          }
        </div>
      </div>
    </div>
  }

  <button type="button" mat-button class="add-resource-btn" (click)="addRow()">
    + Add resource type
  </button>
</div>

<div class="finder-query-card">
  <span class="query-prefix">I need</span>

  @for (row of rows(); track row.id) {
    <div class="query-row">
      <fieldset class="outlined-box amount-box">
        <legend class="box-legend">Amount *</legend>
        <input
          type="number"
          min="1"
          class="box-input query-amount-input"
          placeholder="e.g. 1"
          [id]="'amount-input-' + row.id"
          [ngModel]="row.amount"
          (ngModelChange)="updateRowAmount($index, $event)"
        />
      </fieldset>

      <div class="select-with-remove-box">
        <fieldset class="outlined-box resource-select-box">
          <legend class="box-legend">
            {{ $index === 0 ? 'Primary resource *' : 'Resource type *' }}
          </legend>
          <div class="select-inner-container">
            <mat-select
              class="query-select-box"
              panelClass="resource-type-select-panel"
              placeholder="-"
              [panelWidth]="null"
              [id]="'resource-type-select-' + row.id"
              [value]="row.resourceType"
              (selectionChange)="onResourceTypeChange($index, $event.value)"
            >
              <mat-option value="">-</mat-option>
              @for (resType of availableResourceTypes(); track resType) {
                <mat-option [value]="resType">{{ resType }}</mat-option>
              }
            </mat-select>
            @if ($index === 0) {
              <mat-icon
                class="primary-resource-help-icon"
                matTooltipClass="rod-term-tooltip"
                aria-label="Primary resource explanation"
                [matTooltip]="dominantTooltip"
                >help_outline</mat-icon
              >
            }
          </div>
        </fieldset>
        @if (rows().length > 1) {
          <button
            type="button"
            mat-icon-button
            class="remove-resource-btn"
            aria-label="Remove resource filter"
            (click)="removeRow($index)"
          >
            <mat-icon class="remove-icon">close</mat-icon>
          </button>
        }
      </div>
    </div>
  }

  <button type="button" mat-button class="add-resource-btn" (click)="addRow()">
    + Add resource type
  </button>
</div>

<h1>Experiments</h1>

@if (isSchedulingPaused()) {
  <div class="scheduling-paused-banner" role="status" data-testid="scheduling-paused-banner">
    <mat-icon class="banner-icon">pause_circle</mat-icon>
    <div class="banner-content">
      <span class="banner-title">Scheduling is paused.</span>
      <span class="banner-description">
        New experiments and work units will remain paused until an administrator resumes scheduling.
      </span>
    </div>
  </div>
}

<mat-card appearance="outlined">
  <mat-card-content>
    <xmc-experiments-table
      [pageResult]="pageResult()"
      [isFetching]="isLoading()"
      [pageSize]="pageSize()"
      (sortChange)="onSortChange($event)"
    />
  </mat-card-content>
</mat-card>

<div class="paginator">
  <div class="paginator-controls">
    <xmc-page-size-selector [pageSize]="pageSize()" (pageSizeChange)="onPageSizeChange($event)" />
    <button
      type="button"
      mat-icon-button
      data-test-id="previous-page-button"
      [disabled]="!hasPreviousPage()"
      (click)="goToPreviousPage()"
    >
      <mat-icon>chevron_left</mat-icon>
    </button>

    <span> Page {{ pageIndex() + 1 }} </span>

    <button
      type="button"
      mat-icon-button
      data-test-id="next-page-button"
      [disabled]="!hasNextPage()"
      (click)="goToNextPage()"
    >
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</div>

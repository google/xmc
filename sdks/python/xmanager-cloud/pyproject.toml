[build-system]
# Exact pins keep generated code loadable on the protobuf runtime floor: modules
# generated by protoc refuse to load on an older protobuf runtime, and
# grpcio-tools 1.70.0 bundles the protobuf 5.29 protoc. googleapis-common-protos
# 1.66.0 is the last release that ships google/longrunning/operations.proto, which
# experiment/api.proto imports. setuptools 77 is the first release that accepts
# the SPDX `license` string below.
requires = [
    "setuptools>=77.0",
    "grpcio-tools==1.70.0",
    "protobuf==5.29.6",
    "googleapis-common-protos==1.66.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "xmanager-cloud"
version = "1.0.0.dev0"
description = "XManager on Cloud (XMC) gRPC client protos and xdash dashboard SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "XMC Team" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# - grpcio>=1.70.0: generated *_pb2_grpc.py modules reject older gRPC runtimes.
# - googleapis-common-protos<1.75.4: 1.75.4 registers operations_proto.proto in a
#   way that conflicts with modules compiled against
#   google/longrunning/operations.proto (see deploy/cli/install_xmanager.py).
#   1.63.1 is the first release that allows protobuf 5.x.
# - google-auth and requests: used by the bundled xdash authentication helpers.
dependencies = [
    "google-auth>=2.28.0",
    "googleapis-common-protos>=1.63.1,<1.75.4",
    "grpcio>=1.70.0",
    "packaging>=23.0",
    "protobuf>=5.29.6,<7.0.0",
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/google/xmc"

[project.scripts]
xdash = "xdash.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["xmanager_cloud"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xmc"
version = "0.1.0"
description = "XMC Python SDK for Metrics Collection & Management"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "XMC Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
keras = [
    "keras>=3.0.0",
]
lightning = [
    "pytorch-lightning>=2.0.0",
]


[tool.setuptools]
packages = ["xmc", "xmc.integrations"]

[tool.setuptools.package-dir]
"xmc" = "."
"xmc.integrations" = "integrations"

[tool.setuptools.package-data]
"xmc" = ["py.typed"]

# Inherit the repository Ruff config but lint against this SDK's declared
# minimum (requires-python) so modernization rules never break supported users.
[tool.ruff]
extend = "../../../pyproject.toml"
target-version = "py39"


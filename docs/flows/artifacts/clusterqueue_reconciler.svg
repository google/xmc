<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 636.808 412" width="636.808" height="412" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Arial:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Arial', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<g class="block" data-type="alt" data-label="ClusterQueue not found">
  <rect x="207.32299999999998" y="198" width="282.028" height="124" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="207.32299999999998" y="198" width="159.55" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="213.32299999999998" y="207" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">alt [ClusterQueue not found]</text>
  <line x1="207.32299999999998" y1="266" x2="489.351" y2="266" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
  <text x="215.32299999999998" y="280" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">[ClusterQueue found]</text>
</g>
<line class="lifeline" data-actor="ControllerManager" x1="103.6615" y1="70" x2="103.6615" y2="382" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="CQReconciler" x1="275.794" y1="70" x2="275.794" y2="382" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="NameCache" x1="426.808" y1="70" x2="426.808" y2="382" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="K8sAPI" x1="566.808" y1="70" x2="566.808" y2="382" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="ControllerManager" data-to="CQReconciler" data-label="Reconcile(Request)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="103.6615" y1="90" x2="275.794" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="189.72775" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Reconcile(Request)</text>
</g>
<g class="message" data-from="CQReconciler" data-to="K8sAPI" data-label="Get ClusterQueue" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="275.794" y1="130" x2="566.808" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="421.301" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Get ClusterQueue</text>
</g>
<g class="message" data-from="K8sAPI" data-to="CQReconciler" data-label="ClusterQueue (or NotFound)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="566.808" y1="170" x2="275.794" y2="170" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="421.301" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">ClusterQueue (or NotFound)</text>
</g>
<g class="message" data-from="CQReconciler" data-to="NameCache" data-label="Remove(req.Name)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="275.794" y1="238" x2="426.808" y2="238" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="351.301" y="228" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Remove(req.Name)</text>
</g>
<g class="message" data-from="CQReconciler" data-to="NameCache" data-label="Add(req.Name)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="275.794" y1="302" x2="426.808" y2="302" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="351.301" y="292" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Add(req.Name)</text>
</g>
<g class="message" data-from="CQReconciler" data-to="ControllerManager" data-label="Return Result" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="275.794" y1="342" x2="103.6615" y2="342" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="189.72775" y="332" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Return Result</text>
</g>
<g class="actor" data-id="ControllerManager" data-label="ControllerManager" data-type="participant">
  <rect x="30" y="30" width="147.323" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="103.6615" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">ControllerManager</text>
</g>
<g class="actor" data-id="CQReconciler" data-label="CQReconciler" data-type="participant">
  <rect x="217.32299999999998" y="30" width="116.94200000000001" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="275.794" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">CQReconciler</text>
</g>
<g class="actor" data-id="NameCache" data-label="NameCache" data-type="participant">
  <rect x="374.265" y="30" width="105.086" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="426.808" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">NameCache</text>
</g>
<g class="actor" data-id="K8sAPI" data-label="K8sAPI" data-type="participant">
  <rect x="526.808" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="566.808" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">K8sAPI</text>
</g>
</svg>
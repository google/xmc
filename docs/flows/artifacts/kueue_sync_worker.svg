  <text x="119.80199999999999" y="540" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">createWorkUnitExecutionUpdate()</text>
</g>
<g class="message" data-from="KueueSync" data-to="Batcher" data-label="Add(WorkUnitExecutionUpdate, KueueSyncSource)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="81.80199999999999" y1="600" x2="506.147" y2="600" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="293.9745" y="590" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Add(WorkUnitExecutionUpdate, KueueSyncSource)</text>
</g>
<g class="message" data-from="Batcher" data-to="KueueSync" data-label="(Returns immediately)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="506.147" y1="640" x2="81.80199999999999" y2="640" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="293.9745" y="630" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">(Returns immediately)</text>
</g>
<g class="actor" data-id="KueueSync" data-label="KueueSync" data-type="participant">
  <rect x="29.999999999999993" y="30" width="103.604" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="81.80199999999999" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">KueueSync</text>
</g>
<g class="actor" data-id="NameCache" data-label="NameCache" data-type="participant">
  <rect x="173.60399999999998" y="30" width="105.086" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />

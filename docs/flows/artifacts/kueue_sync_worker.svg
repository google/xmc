<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576.834 710" width="576.834" height="710" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Arial:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Arial', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="KueueSync" x1="81.80199999999999" y1="70" x2="81.80199999999999" y2="680" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="NameCache" x1="226.147" y1="70" x2="226.147" y2="680" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="KueueAPI" x1="366.147" y1="70" x2="366.147" y2="680" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Batcher" x1="506.147" y1="70" x2="506.147" y2="680" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="KueueSync" data-to="KueueSync" data-label="LOOP: Every KueueSyncTickDuration (Background Thread)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="81.80199999999999,90 111.80199999999999,90 111.80199999999999,110 81.80199999999999,110" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="119.80199999999999" y="100" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">LOOP: Every KueueSyncTickDuration (Background Thread)</text>
</g>
<g class="message" data-from="KueueSync" data-to="NameCache" data-label="Names()" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="81.80199999999999" y1="160" x2="226.147" y2="160" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="153.97449999999998" y="150" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Names()</text>
</g>
<g class="message" data-from="NameCache" data-to="KueueSync" data-label="List of ClusterQueue Names" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="226.147" y1="200" x2="81.80199999999999" y2="200" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="153.97449999999998" y="190" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">List of ClusterQueue Names</text>
</g>
<g class="message" data-from="KueueSync" data-to="KueueSync" data-label="PAR: For each ClusterQueue Name" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="81.80199999999999,240 111.80199999999999,240 111.80199999999999,260 81.80199999999999,260" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="119.80199999999999" y="250" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">PAR: For each ClusterQueue Name</text>
</g>
<g class="message" data-from="KueueSync" data-to="KueueAPI" data-label="GET pendingworkloads" data-line-style="solid" data-arrow-head="filled" data-self="false">

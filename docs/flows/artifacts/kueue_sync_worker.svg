  <text x="223.97449999999998" y="300" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">GET pendingworkloads</text>
</g>
<g class="message" data-from="KueueAPI" data-to="KueueSync" data-label="PendingWorkloadList" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="366.147" y1="350" x2="81.80199999999999" y2="350" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="223.97449999999998" y="340" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">PendingWorkloadList</text>
</g>
<g class="message" data-from="KueueSync" data-to="KueueSync" data-label="PAR: For each Pending Workload" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="81.80199999999999,390 111.80199999999999,390 111.80199999999999,410 81.80199999999999,410" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="119.80199999999999" y="400" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">PAR: For each Pending Workload</text>
</g>
<g class="message" data-from="KueueSync" data-to="KueueSync" data-label="fetchJobSetByName()" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="81.80199999999999,460 111.80199999999999,460 111.80199999999999,480 81.80199999999999,480" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="119.80199999999999" y="470" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">fetchJobSetByName()</text>
</g>
<g class="message" data-from="KueueSync" data-to="KueueSync" data-label="createWorkUnitExecutionUpdate()" data-line-style="solid" data-arrow-head="filled" data-self="true">

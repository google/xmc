<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 602.545 770" width="602.545" height="770" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Arial:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Arial', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<line class="lifeline" data-actor="Reconciler" x1="79.57900000000001" y1="70" x2="79.57900000000001" y2="740" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Batcher" x1="219.579" y1="70" x2="219.579" y2="740" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Storage" x1="359.579" y1="70" x2="359.579" y2="740" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Reconciler" data-to="Batcher" data-label="Add(WorkUnitExecutionUpdate, Source)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="79.57900000000001" y1="90" x2="219.579" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="149.579" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Add(WorkUnitExecutionUpdate, Source)</text>
</g>
<g class="message" data-from="Batcher" data-to="Batcher" data-label="Stores update in memory mapped by XID -&gt; WID -&gt; Source" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="219.579,130 249.579,130 249.579,150 219.579,150" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="257.579" y="140" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Stores update in memory mapped by XID -&gt; WID -&gt; Source</text>
</g>
<g class="message" data-from="Batcher" data-to="Reconciler" data-label="(Returns immediately)" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="219.579" y1="200" x2="79.57900000000001" y2="200" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="149.579" y="190" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">(Returns immediately)</text>
</g>
<g class="message" data-from="Batcher" data-to="Batcher" data-label="LOOP: Every TickDuration (Background Thread)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="219.579,240 249.579,240 249.579,260 219.579,260" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="257.579" y="250" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">LOOP: Every TickDuration (Background Thread)</text>
</g>
<g class="message" data-from="Batcher" data-to="Batcher" data-label="processBatches()" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="219.579,310 249.579,310 249.579,330 219.579,330" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="257.579" y="320" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">processBatches()</text>
</g>
<g class="message" data-from="Batcher" data-to="Batcher" data-label="Swaps in-memory map and processes batches in parallel" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="219.579,380 249.579,380 249.579,400 219.579,400" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="257.579" y="390" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Swaps in-memory map and processes batches in parallel</text>
</g>
<g class="message" data-from="Batcher" data-to="Batcher" data-label="PAR: For each Experiment (XID)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="219.579,450 249.579,450 249.579,470 219.579,470" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="257.579" y="460" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">PAR: For each Experiment (XID)</text>
</g>
<g class="message" data-from="Batcher" data-to="Batcher" data-label="processExperimentUpdates(xid, widMap)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="219.579,520 249.579,520 249.579,540 219.579,540" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="257.579" y="530" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">processExperimentUpdates(xid, widMap)</text>
</g>
<g class="message" data-from="Batcher" data-to="Batcher" data-label="Flattens updates from all sources (Jobset, Workload, KueueSync)" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="219.579,590 249.579,590 249.579,610 219.579,610" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="257.579" y="600" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Flattens updates from all sources (Jobset, Workload, KueueSync)</text>
</g>
<g class="message" data-from="Batcher" data-to="Storage" data-label="UpdateWorkUnitExecutions(xid, updatesToSend)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="219.579" y1="660" x2="359.579" y2="660" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="289.579" y="650" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">UpdateWorkUnitExecutions(xid, updatesToSend)</text>
</g>
<g class="message" data-from="Storage" data-to="Batcher" data-label="map[WID] WorkUnitExecution" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="359.579" y1="700" x2="219.579" y2="700" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="289.579" y="690" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">map[WID] WorkUnitExecution</text>
</g>
<g class="actor" data-id="Reconciler" data-label="Reconciler" data-type="participant">
  <rect x="30.000000000000007" y="30" width="99.158" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="79.57900000000001" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Reconciler</text>
</g>
<g class="actor" data-id="Batcher" data-label="Batcher" data-type="participant">
  <rect x="178.892" y="30" width="81.374" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="219.579" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Batcher</text>
</g>
<g class="actor" data-id="Storage" data-label="Storage" data-type="participant">
  <rect x="318.892" y="30" width="81.374" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="359.579" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Storage</text>
</g>
</svg>
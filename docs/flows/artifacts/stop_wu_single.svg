</g>
<g class="message" data-from="Actuator" data-to="Kubernetes" data-label="10. Delete JobSet" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="868.257" y1="520" x2="1018.9005" y2="520" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />

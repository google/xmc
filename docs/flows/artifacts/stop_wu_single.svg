</g>
<g class="message" data-from="Kubernetes" data-to="Actuator" data-label="11. Success" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="1018.9005" y1="560" x2="868.257" y2="560" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />

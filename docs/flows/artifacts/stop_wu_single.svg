<line class="lifeline" data-actor="Kubernetes" x1="1018.9005" y1="70" x2="1018.9005" y2="640" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Client" data-to="ESS" data-label="1. StopWorkUnit(req)" data-line-style="solid" data-arrow-head="filled" data-self="false">

# Gitleaks configuration file for secret scanning

[allowlist]
description = "Allowlist for dummy test secrets and false positives"
paths = [
    '''pkg/auth/oauth2/oauth2_test\.go''',
    '''internal/toollibs/execution_environments/gke_test\.go''',
]
stopwords = [
    "test-jwt-secret-key-123456789-abcd",
    "tpu-v4-podslice"
]

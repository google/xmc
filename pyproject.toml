[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
# Lowest runtime in the repo: the Bazel hermetic rules_python toolchain (3.11),
# which is also the published SDKs' requires-python minimum. Venv/CI tooling
# uses 3.13.
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # Pyflakes
    "I",       # isort (import sorting)
    "D417",    # Missing argument description in docstrings
    "B",       # flake8-bugbear (bug prevention & exception handling)
    "PERF",    # perflint (performance anti-patterns & loop allocations)
    "RET",     # flake8-return (early returns & linear control flow)
    "UP",      # pyupgrade (syntax modernization up to target-version)
    "SIM",     # flake8-simplify (code simplification)
    "C4",      # flake8-comprehensions (better list/dict comprehensions)
    "PLW1510", # Pylint: Subprocess run without check=True
    "PIE800",  # flake8-pie: Unnecessary dict kwargs spread
    "PIE804",  # flake8-pie: Unnecessary dict unpack in function call
    "PIE810",  # flake8-pie: Single starts/endswith with tuple
    "TID251",  # flake8-tidy-imports: Ban non-monotonic time.time in favor of time.monotonic
    "TID252",  # flake8-tidy-imports: Ban relative imports from parent modules
    "A001",    # flake8-builtins: Variable shadowing built-in
    "A002",    # flake8-builtins: Argument shadowing built-in
    "A003",    # flake8-builtins: Class attribute shadowing built-in
    "N801",    # pep8-naming: Class name should use CapWords
    "N803",    # pep8-naming: Argument name should be lowercase
    "N806",    # pep8-naming: Variable in function should be lowercase
    "N818",    # pep8-naming: Exception name should end with Error
    "G001",    # flake8-logging-format: Logging format with str.format
    "G002",    # flake8-logging-format: Logging format with %
    "G003",    # flake8-logging-format: Logging format with +
    "G004",    # flake8-logging-format: Logging format with f-string
    "RUF008",  # Ruff: Do not use mutable default values in dataclasses
    "RUF009",  # Ruff: Do not call function in dataclass default
    "RUF013",  # Ruff: Implicit Optional in type annotations
    "RUF015",  # Ruff: Prefer next(iter()) over list()[0]
    "RUF019",  # Ruff: Unnecessary key check before dictionary access
    "LOG015",  # flake8-logging: Forbid calls on root logger
    "RUF012",  # Ruff: Mutable class default values
    "RUF100",  # Ruff: Unused noqa directives
    "S110",    # Bandit: try-except-pass without logging
    "S506",    # Bandit: Probable use of unsafe yaml.load
    "S602",    # Bandit: subprocess call with shell=True
    "C901",    # mccabe: Cyclomatic complexity enforcement
]
ignore = ["SIM117", "E501", "PERF203"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# 'compare' module is provided by regression test framework runners
"test/regression/*" = ["F821"]
# Buffer and E2E require wall-clock unix epoch timestamps for telemetry and naming
"sdks/python/xmc/buffer.py" = ["TID251"]
"sdks/python/xmc/buffer_test.py" = ["TID251"]
"test/e2e/*" = ["TID251"]
# TODO: migrate to StrEnum
"test/e2e/lib/config.py" = ["UP042"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.time".msg = "Use time.monotonic() for measuring intervals, deadlines, and elapsed time."

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
# Single source of truth for mypy's scope: CI and .githooks/pre-commit run bare
# `mypy` with no file arguments. Every Python file is checked by default, so new
# directories are covered automatically. Two lists deny files: .gitignore
# (exclude_gitignore, mypy >= 1.16) skips local-only directories such as venvs,
# Bazel output and the cluster-toolkit clone, and `exclude` skips tracked files.
files = ["."]
exclude_gitignore = true
disallow_subclassing_any = true
ignore_missing_imports = true
explicit_package_bases = true
warn_unused_configs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    '(^|/)node_modules/',
    '(^|/)test/regression/',
    '(^|/)dev_env\.py$',
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "D417", # Missing argument description in docstrings
    "B",    # flake8-bugbear (bug prevention & exception handling)
    "RET",  # flake8-return (early returns & linear control flow)
    "UP",   # pyupgrade (Python 3.10+ syntax modernization)
    "SIM",  # flake8-simplify (code simplification)
    "C4",   # flake8-comprehensions (better list/dict comprehensions)
]
ignore = ["B904", "SIM102", "SIM105", "SIM117", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# 'compare' module is provided by regression test framework runners
"test/regression/*" = ["F821"]

[tool.ruff.lint.isort]
combine-as-imports = true


# Kueue queues for the XMC Lite example. Applied by `setup.sh
# --provision-cluster` with `kubectl apply -n "${K8S_NAMESPACE}"`, which
# places the LocalQueue in the workload namespace. The ClusterQueue quota is
# sized to the blueprint's 2x n2-standard-4 node pool, leaving headroom for
# system pods.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default-flavor
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cluster-queue
spec:
  namespaceSelector: {}
  resourceGroups:
  - coveredResources: ["cpu", "memory"]
    flavors:
    - name: default-flavor
      resources:
      - name: cpu
        nominalQuota: 6
      - name: memory
        nominalQuota: 24Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: default-queue
spec:
  clusterQueue: cluster-queue

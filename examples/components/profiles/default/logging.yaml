apiVersion: components.xmc.dev/v1alpha1
kind: Component
metadata:
  name: logging
spec:
  enabled: true
  componentType: CUSTOM_1P_COMPONENT
  version: "1.0.0"
  description: Centralized logging and telemetry exporter component.
  deletionPolicy: DELETE
  deletionProtection: false
  dependencies:
    - name: storage
      version: ">=1.0.0 <2.0.0"
  lifecycleControl:
    drainTimeoutSeconds: 30
    gracePeriodSeconds: 15
